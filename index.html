                    {cats.has('הודו') && <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-green-100 text-green-800 border border-green-300">🦃 הודו</span>}
                    {cats.has('בשר')  && <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-red-100 text-red-800 border border-red-300">🥩 בשר</span>}
                    {cats.has('דגים') && <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-blue-100 text-blue-800 border border-blue-300">🐟 דגים</span>}
                    {!dimmed && <span className="text-gray-300 text-xs mr-auto">{isExpanded ? '▲' : '▼'}</span>}
                  </div>
                </div>

                {/* כפתורי פעולה — תמיד גלויים */}
                {!dimmed && (
                  <div className="px-3 pb-3 flex gap-1 flex-nowrap items-center" onClick={e => e.stopPropagation()}>
                    <button onClick={() => openPrint(order, 'general')}
                      className="py-1 px-1.5 rounded-md text-[11px] font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-200 transition-colors shrink-0 leading-tight">
                      🖨️ כללי
                    </button>
                    {cats.has('דגים') && (
                      <button onClick={() => openPrint(order, 'fish')}
                        className="py-1 px-1.5 rounded-md text-[11px] font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-200 transition-colors shrink-0 leading-tight">
                        🖨️ דגים
                      </button>
                    )}
                    <button onClick={() => openEditModal(order)}
                      className="py-1 px-1.5 rounded-md text-[11px] bg-purple-100 hover:bg-purple-200 text-purple-700 border border-purple-200 transition-colors shrink-0 leading-tight">
                      ✏️
                    </button>
                    <button onClick={() => deleteOrder(order)}
                      className="py-1 px-1.5 rounded-md text-[11px] bg-red-100 hover:bg-red-200 text-red-700 border border-red-200 transition-colors shrink-0 leading-tight">
                      🗑️
                    </button>
                    {order.status === 'packing' && (
                      <button onClick={() => { setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: 'new' } : o)); collapseOrder(order.id); }}
                        className="py-1 px-1.5 rounded-md text-[11px] font-bold bg-gray-100 hover:bg-gray-200 text-gray-500 border border-gray-200 shrink-0 leading-tight">↩</button>
                    )}
                    {order.status === 'new' && order.assignedButcher && (
                      <button onClick={() => { setOrders(prev => prev.map(o => o.id === order.id ? { ...o, assignedButcher: '' } : o)); collapseOrder(order.id); }}
                        className="py-1 px-1.5 rounded-md text-[11px] font-bold bg-gray-100 hover:bg-gray-200 text-gray-500 border border-gray-200 shrink-0 leading-tight">↩</button>
                    )}
                    {order.status === 'new' && !order.assignedButcher && (
                      <button onClick={() => setButcherModal(order.id)}
                        className="me-auto py-1 px-2 rounded-md text-[11px] font-bold bg-orange-500 hover:bg-orange-600 text-white border border-orange-600 transition-colors shrink-0 leading-tight">
                        🔪 לעבודה
                      </button>
                    )}
                    {order.status === 'new' && order.assignedButcher && (
                      <button onClick={() => moveToPacking(order.id)}
                        className="me-auto py-1 px-2 rounded-md text-[11px] font-bold bg-yellow-500 hover:bg-yellow-600 text-white border border-yellow-600 transition-colors shrink-0 leading-tight">
                        📦 לאריזה
                      </button>
                    )}
                    {order.status === 'packing' && (
                      <button onClick={() => requestComplete(order.id)}

                        ✅ מוכן
                      </button>
                    )}
                  </div>
                )}

                {/* פירוט — נפתח בלחיצה */}
                {isExpanded && (
                  <div className="px-4 pb-4 border-t border-gray-100 pt-3">
                    {(() => {
                      const seen = new Set(); const groups = [];
                      regularItems.forEach(item => {
                        const key = item.cleanName || item.name;
                        if (!seen.has(key)) {
                          seen.add(key);
                          const grp = regularItems.filter(i => (i.cleanName || i.name) === key);
                          groups.push({ key, items: grp, total: grp.reduce((s, i) => s + (parseFloat(i.qty) || 0), 0) });
                        }
                      });
                      return (
                        <ul className="bg-gray-50 rounded-lg border border-gray-100 divide-y divide-gray-100 mb-3">
                          {groups.map((group, gIdx) => {
                            const tmpl = ORDER_FORM_TEMPLATE.find(t => t.name === group.key);
                            const cc = getCatColors(tmpl?.category);
                            return (
                              <li key={gIdx} className="px-2 py-2 text-xs">
                                <div className="flex items-center gap-2">
                                  <span className={`font-black px-1.5 py-0.5 rounded min-w-[28px] text-center border shrink-0 ${cc.qtyBg} ${cc.qtyText} ${cc.qtyBorder}`}>
                                    {group.items.length > 1 ? group.total : group.items[0].qty}
                                  </span>
                                  <span className="font-bold text-gray-800">{group.key}</span>
                                </div>
                                {(group.items.length > 1 || (group.items.length === 1 && group.items[0].name !== group.key)) && (
                                  <div className={`mr-6 mt-1.5 space-y-1 border-r-2 pr-2 ${cc.subBorder}`}>
                                    {group.items.map((item, iIdx) => {
                                      const opt = item.name.match(/\((.+)\)$/)?.[1] || item.name;
                                      return (
                                        <div key={iIdx} className="flex items-center gap-1.5 text-[11px] text-gray-500">
                                          <span className={`font-extrabold min-w-[20px] text-center ${cc.subQty}`}>{item.qty}</span>
                                          <span>{opt}</span>
                                        </div>
                                      );
                                    })}
                                  </div>
                                )}
                                {group.items.length === 1 && group.items[0].notes && (
                                  <div className="text-red-500 font-medium mr-7 mt-0.5">✂️ {group.items[0].notes}</div>
                                )}
                                {group.items[0]?.checks?.length > 0 && (
                                  <div className="flex flex-wrap gap-1 mr-6 mt-1">
                                    {group.items[0].checks.map(c => (
                                      <span key={c} className={`text-[10px] px-1.5 py-0.5 rounded font-bold border ${cc.qtyBg} ${cc.qtyText} ${cc.qtyBorder}`}>✓ {c}</span>
                                    ))}
                                  </div>
                                )}
                              </li>
                            );
                          })}
                          {packingItem && (
                            <li className="px-2 py-1.5 flex items-center gap-2 text-xs">
                              <span className="font-black px-1.5 py-0.5 rounded border bg-gray-100 text-gray-500 border-gray-200 text-center shrink-0">📦</span>
                              <span className="text-gray-600 font-medium">{packingItem.notes}</span>
                            </li>
                          )}
                        </ul>
                      );
                    })()}

                    {dimmed && order.packaging && (order.packaging.cartons || order.packaging.bags || order.packaging.fishBags) && (
                      <div className="mb-3 bg-green-50 border border-green-200 rounded-lg px-3 py-2 flex flex-wrap gap-3 text-xs font-bold text-green-800">

                        {order.packaging.bags > 0 && <span>🛍️ {order.packaging.bags} שקיות</span>}
                        {order.packaging.fishBags > 0 && <span>🐟 {order.packaging.fishBags} שקיות דגים</span>}
                      </div>
                    )}

                  </div>
                )}
              </div>

            const renderKashrutGroups = (arr, dimmed = false, draggable = false) => {
              if (arr.length === 0) return (
                <div className="text-center text-gray-400 text-sm py-6 border-2 border-dashed border-gray-200 rounded-xl">אין הזמנות</div>
              );
              const groups = {};
              sortByKashrut(arr).forEach(o => {
                const k = o.kashrut || 'ללא כשרות';
                if (!groups[k]) groups[k] = [];
                groups[k].push(o);
              });
              return Object.entries(groups).map(([kashrut, list]) => (
                <div key={kashrut} className="mb-3">
                  <div className="text-[11px] font-black text-gray-500 uppercase tracking-widest mb-1.5 px-1 flex items-center gap-1">
                    <span className="w-2 h-2 rounded-full bg-purple-400 inline-block"></span> {kashrut} ({list.length})
                  </div>
                  <div className="space-y-2">
                    {list.map(o => renderOrderCard(o, dimmed, draggable))}
                  </div>
                </div>

                <div>

                      if (idx !== -1 && idx < focusable.length - 1) focusable[idx + 1].focus();
                    }

                  {formErrorMessage && (

                      <select onChange={e => {
                        const c = contactsList.find(x => x.id === e.target.value);
                        if (!c) return;
                        setCustomerName(c.name);
                        setCustomerPhone(c.phone || '');
                        setCustomerMobile(c.mobile || '');
                        setStreet(c.address || '');
                        setNeighborhood(c.neighborhood || '');

                          <option key={c.id} value={c.id}>{c.name}{c.phone ? ` | ${c.phone}` : ''}{c.neighborhood ? ` | ${c.neighborhood}` : ''}</option>

                      </select>
                    </div>

                  {/* פרטי לקוח */}
                  <div className="bg-white p-4 rounded-lg border border-gray-200 space-y-3 shadow-sm">

                        <input type="tel" value={customerMobile} onChange={e => setCustomerMobile(e.target.value)} placeholder="נייד" className="w-1/2 p-2.5 border border-gray-300 rounded-md text-sm outline-none" />
                      </div>
                    </div>

                    {orderType === 'delivery' ? (
                      <div className="space-y-2 pt-2 border-t border-gray-100">
                        <div className="flex gap-2">
                          <input type="text" required={orderType === 'delivery'} value={neighborhood} onChange={e => setNeighborhood(e.target.value)} placeholder="עיר / שכונה *" className="w-1/2 p-2.5 border border-gray-300 rounded-md text-sm outline-none focus:ring-2 focus:ring-purple-400" />
                          <input type="text" value={street} onChange={e => setStreet(e.target.value)} placeholder="רחוב" className="w-1/2 p-2.5 border border-gray-300 rounded-md text-sm outline-none focus:ring-2 focus:ring-purple-400" />
                        </div>
                        <div className="flex gap-2">
                          <input type="text" value={entrance} onChange={e => setEntrance(e.target.value)} placeholder="כניסה" className="w-1/3 p-2.5 border border-gray-300 rounded-md text-sm text-center" />
                          <input type="text" value={floor} onChange={e => setFloor(e.target.value)} placeholder="קומה" className="w-1/3 p-2.5 border border-gray-300 rounded-md text-sm text-center" />
                          <input type="text" value={apt} onChange={e => setApt(e.target.value)} placeholder="דירה" className="w-1/3 p-2.5 border border-gray-300 rounded-md text-sm text-center" />
                        </div>
                        <div className="flex items-center gap-2 pt-1">
                          <span className="text-sm text-gray-500 font-bold whitespace-nowrap">תאריך משלוח:</span>
                          <input type="date" value={deliveryDate} onChange={e => setDeliveryDate(e.target.value)} className="flex-1 p-2.5 border border-gray-300 rounded-md text-sm" />
                        </div>
                      </div>
                    ) : (
                      <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-gray-100">

                          <option value="">-- שעה --</option>
                          {Array.from({ length: 48 }, (_, i) => {

                            return <option key={i} value={`${h}:${m}`}>{`${h}:${m}`}</option>;
                          })}
                        </select>
                      </div>
                    )}

                      <select value={kashrut} onChange={e => setKashrut(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-purple-50 focus:ring-2 focus:ring-purple-400 outline-none font-bold text-purple-900">
                        <option value="" disabled>-- בחר כשרות --</option>

                      </select>
                    </div>

                       <label className="block text-xs font-bold text-gray-400 uppercase mb-2">סימונים למוכר</label>

                       </div>

                    {renderItemCategory('עוף', '🐔 עוף מפורק', 'מפורק')}
                    {renderCategoryDynamic('עוף')}
                    {renderCategoryDynamic('הודו')}
                    {renderCategoryDynamic('בשר')}
                    {renderCategoryDynamic('דגים')}
                  </div>

                    <Button type="button" variant="outline" className="flex-1" onClick={closeModal}>ביטול</Button>
                    <Button type="submit" variant="purple" icon={Icons.Send} className="flex-1 py-3 text-base shadow-lg font-bold">שגר הזמנה לקצביה</Button>
                  </div>
                </form>
              </div>
            </div>

          {/* מודאל בחירת קצב */}
          {butcherModal && (

              <div className="bg-white rounded-2xl shadow-xl border border-orange-100 w-full max-w-xs animate-in zoom-in-95 duration-200">

                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>
                <div className="p-4 space-y-2">

                        <input type="number" min="0" step="1" placeholder="0"

                      </div>

                                    {group.items.map((item, iIdx) => {

                            </div>

                  <Button variant="purple" icon={Icons.Printer} className="flex-1 font-bold py-2"
                    onClick={() => triggerPhysicalPrint(printMode === 'fish' ? 'physical-print-slip-area-fish' : 'physical-print-slip-area-general')}>

                </div>

            </div>

        </div>

    // --- Shortages View ---
    const ShortagesView = ({ shortages }) => {
      return (

            <h1 className="text-3xl font-extrabold text-gray-900">חוסרים והזמנת רכש ספק</h1>
            <p className="text-gray-500 mt-1">חישוב אוטומטי של החוסר בקצביה מול מלאי המחסן הקיים</p>
          </div>

                <h3 className="font-bold text-orange-900">דוח פערים ומלאי קריטי</h3>

              </div>
            </div>

            {Object.keys(shortages).length === 0 ? (
              <div className="p-8 text-center text-gray-500">
                <Icons.CheckCircle className="w-12 h-12 text-green-500 mx-auto mb-3" />

                <p className="text-sm text-gray-500">יש מספיק סחורה במלאי המחסן לכלל ההזמנות הנוכחיות.</p>

              <table className="w-full text-right">

                    <th className="p-4 font-bold">שם פריט</th>
                    <th className="p-4 font-bold text-center">מלאי קיים במחסן</th>

                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100 text-sm">
                  {Object.entries(shortages).map(([name, data]) => (
                    <tr key={name} className="hover:bg-red-50/10 transition-colors">
                      <td className="p-4 font-extrabold text-gray-900">{name}</td>
                      <td className="p-4 text-center font-bold text-gray-600">{data.available} ק"ג</td>
                      <td className="p-4 text-center font-bold text-purple-700">{data.required}  ק"ג</td>
                      <td className="p-4 text-center font-black text-red-600 bg-red-50/20">{data.shortage} ק"ג</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>

          <div className="flex justify-end gap-3">
            <Button 
              variant="purple" 
              icon={Icons.Send} 
              disabled={Object.keys(shortages).length === 0}
              onClick={() => alert('הזמנת הרכש שוגרה בהצלחה למשחטה!')}
              className={`${Object.keys(shortages).length === 0 ? 'opacity-50 cursor-not-allowed' : ''}`}
            >
              צור הזמנת רכש מרוכזת לספק לקראת מחר
            </Button>
          </div>
        </div>
      );

    // --- Deliveries View ---
    const DeliveriesView = ({ orders, setOrders, couriersList, kashrutList, butchersList }) => {
      const [activeTab, setActiveTab] = useState('delivery');
      const [routeMode, setRouteMode] = useState(false);
      const [routeStops, setRouteStops] = useState([]); // [{orderId, address, customer}]
      const [origin, setOrigin] = useState(''); // נקודת מוצא
      const [returnModal, setReturnModal] = useState(null);
      const [returnStep, setReturnStep] = useState('destination');
      const [returnPackaging, setReturnPackaging] = useState({ cartons: '', bags: '', fishBags: '' });

      const openReturnModal = (order) => {
        setReturnModal(order);
        setReturnStep('destination');
        setReturnPackaging({
          cartons: order.packaging?.cartons ?? '',
          bags: order.packaging?.bags ?? '',
          fishBags: order.packaging?.fishBags ?? ''
        });
      };

      const confirmReturnToPacking = () => {
        setOrders(prev => prev.map(o => o.id === returnModal.id
          ? { ...o, status: 'packing', packaging: {
              cartons: Number(returnPackaging.cartons) || 0,
              bags: Number(returnPackaging.bags) || 0,
              fishBags: Number(returnPackaging.fishBags) || 0
            }}
          : o
        ));
        setReturnModal(null);
      };

      const confirmReturnToWork = (butcherName) => {
        setOrders(prev => prev.map(o => o.id === returnModal.id
          ? { ...o, status: 'new', assignedButcher: butcherName, packaging: undefined }
          : o
        ));
        setReturnModal(null);
      };

      const deliveryOrders = orders.filter(o => o.type === 'delivery' && o.status === 'completed');
      const pickupOrders   = orders.filter(o => o.type === 'pickup'   && o.status === 'completed');

      const buildAddress = (order) => {
        const parts = [order.street, order.neighborhood].filter(Boolean);
        if (order.floor) parts.push(`קומה ${order.floor}`);
        return parts.join(', ') + ', ישראל';
      };

      const toggleStop = (order) => {
        const exists = routeStops.find(s => s.orderId === order.id);
        if (exists) {
          setRouteStops(prev => prev.filter(s => s.orderId !== order.id));
        } else {
          setRouteStops(prev => [...prev, {
            orderId: order.id,
            customer: order.customer,
            address: buildAddress(order),
            neighborhood: order.neighborhood
          }]);
        }
      };

      const moveStop = (idx, dir) => {
        setRouteStops(prev => {
          const arr = [...prev];
          const target = idx + dir;
          if (target < 0 || target >= arr.length) return arr;
          [arr[idx], arr[target]] = [arr[target], arr[idx]];
          return arr;
        });
      };

      const openGoogleMaps = () => {
        const stops = origin ? [origin, ...routeStops.map(s => s.address)] : routeStops.map(s => s.address);
        if (stops.length < 1) return;
        const encoded = stops.map(s => encodeURIComponent(s)).join('/');
        const url = `https://www.google.com/maps/dir/${encoded}`;
        window.open(url, '_blank');
      };

      const markAsDone = (orderId) => {
        setOrders(orders.map(o => o.id === orderId ? { ...o, status: 'delivered' } : o));
      };

      const assignCourier = (orderId, courierId) => {
        setOrders(orders.map(o => o.id === orderId ? { ...o, courier: courierId } : o));
      };

      const renderCard = (order, isDelivery) => (
        <div key={order.id} className="bg-white rounded-xl border border-gray-200 shadow-sm flex flex-col hover:shadow-md transition-shadow overflow-hidden">
          {/* שם */}
          <div className="px-4 pt-4 pb-2">
            <div className="font-extrabold text-lg text-gray-900">{order.customer}</div>
            <div className="text-xs text-gray-400 flex items-center gap-2 mt-0.5">
              <span>#{order.id}</span>
              {order.phone && <span><Icons.Phone className="w-3 h-3 inline ml-0.5 text-gray-400" />{order.phone}</span>}
              {order.mobile && <span><Icons.Phone className="w-3 h-3 inline ml-0.5 text-gray-400" />{order.mobile}</span>}
            </div>
          </div>

          {/* כתובת — משלוח בלבד */}
          {isDelivery && (
            <div className="px-4 py-2 bg-blue-50/60 border-y border-blue-100 text-sm text-blue-900 font-medium">
              <Icons.MapPin className="w-3.5 h-3.5 inline ml-1 text-blue-500" />
              {order.neighborhood && <strong>{order.neighborhood} — </strong>}
              {order.street}{order.entrance ? ` כניסה ${order.entrance}` : ''}{order.floor ? ` קומה ${order.floor}` : ''}{order.apt ? ` דירה ${order.apt}` : ''}
            </div>
          )}

          {/* אריזה */}
          <div className="px-4 py-3 flex gap-3 flex-wrap">
            {order.packaging?.cartons > 0 && (
              <div className="flex flex-col items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 min-w-[64px]">
                <span className="text-xl">📦</span>
                <span className="font-black text-lg text-gray-900">{order.packaging.cartons}</span>
                <span className="text-[10px] text-gray-400 font-bold">קרטונים</span>
              </div>
            )}
            {order.packaging?.bags > 0 && (
              <div className="flex flex-col items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 min-w-[64px]">
                <span className="text-xl">🛍️</span>
                <span className="font-black text-lg text-gray-900">{order.packaging.bags}</span>
                <span className="text-[10px] text-gray-400 font-bold">שקיות</span>
              </div>
            )}
            {order.packaging?.fishBags > 0 && (
              <div className="flex flex-col items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 min-w-[64px]">
                <span className="text-xl">🐟</span>
                <span className="font-black text-lg text-gray-900">{order.packaging.fishBags}</span>
                <span className="text-[10px] text-gray-400 font-bold">שקיות דגים</span>
              </div>
            )}
            {!order.packaging?.cartons && !order.packaging?.bags && !order.packaging?.fishBags && (
              <span className="text-xs text-gray-400 italic">לא הוזנו פרטי אריזה</span>
            )}
          </div>

          {/* שיוך שליח + כפתורים */}
          <div className="p-3 border-t border-gray-100 space-y-2 mt-auto">
            {isDelivery && (
              <select value={order.courier || ''} onChange={e => assignCourier(order.id, e.target.value)}
                className="w-full p-2 border border-gray-200 rounded-lg text-sm font-bold bg-gray-50 outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- שיוך לשליח --</option>
                {couriersList.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            )}
            <button
              onClick={() => openReturnModal(order)}
              className="w-full py-2 rounded-xl text-xs font-bold bg-orange-50 hover:bg-orange-100 text-orange-800 border border-orange-200 transition-colors">
              ↩ החזר הזמנה

            <Button variant="success" icon={Icons.CheckCircle}
              className="w-full bg-green-600 hover:bg-green-700 py-2.5 font-bold justify-center"
              onClick={() => markAsDone(order.id)}>
              {isDelivery ? 'נמסר ללקוח ✓' : 'נאסף בחנות ✓'}

          </div>
        </div>

      const isDelivery = activeTab === 'delivery';

              <p className="text-gray-500 mt-1">הזמנות מוכנות הממתינות למסירה או לאיסוף</p>

            {activeTab === 'delivery' && deliveryOrders.length > 0 && (
              <button onClick={() => { setRouteMode(!routeMode); setRouteStops([]); }}
                className={`flex items-center gap-2 px-4 py-2.5 font-bold text-sm rounded-xl shadow-sm transition-colors border-2 ${routeMode ? 'bg-green-600 text-white border-green-600' : 'bg-white text-green-700 border-green-300 hover:bg-green-50'}`}>
                🗺️ {routeMode ? 'סגור בניית מסלול' : 'בנה מסלול משלוחים'}
              </button>
            )}
          </div>

          {/* בניית מסלול */}
          {routeMode && activeTab === 'delivery' && (
            <div className="mb-6 bg-white rounded-2xl border-2 border-green-200 shadow-sm overflow-hidden">
              <div className="p-4 bg-green-50 border-b border-green-100 flex items-center gap-3">
                <span className="text-2xl">🗺️</span>
                <div>
                  <h3 className="font-extrabold text-green-900">בניית מסלול משלוחים</h3>
                  <p className="text-xs text-green-700">בחר הזמנות, סדר את העצירות, ופתח בגוגל מפות</p>
                </div>
              </div>

              <div className="p-4 grid grid-cols-1 md:grid-cols-2 gap-5">
                {/* בחירת עצירות */}
                <div>
                  <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">בחר הזמנות למסלול</div>
                  <div className="space-y-2 max-h-64 overflow-y-auto custom-scrollbar">
                    {deliveryOrders.map(order => {
                      const selected = !!routeStops.find(s => s.orderId === order.id);
                      return (
                        <label key={order.id} className={`flex items-center gap-3 p-3 rounded-xl border-2 cursor-pointer transition-all ${selected ? 'border-green-400 bg-green-50' : 'border-gray-200 hover:border-gray-300'}`}>
                          <input type="checkbox" checked={selected} onChange={() => toggleStop(order)} className="accent-green-600 w-4 h-4" />
                          <div className="flex-1 min-w-0">
                            <div className="font-bold text-sm text-gray-900">{order.customer}</div>
                            <div className="text-xs text-gray-500 truncate">
                              <Icons.MapPin className="w-3 h-3 inline ml-0.5" />
                              {order.neighborhood}{order.street ? ` — ${order.street}` : ''}
                            </div>
                          </div>
                        </label>
                      );
                    })}
                  </div>
                </div>

                {/* סדר המסלול */}
                <div>
                  <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">סדר עצירות ({routeStops.length} נבחרו)</div>

                  {/* נקודת מוצא */}
                  <div className="mb-3">
                    <label className="block text-xs font-bold text-gray-500 mb-1">📍 נקודת מוצא (אופציונלי)</label>
                    <input type="text" value={origin} onChange={e => setOrigin(e.target.value)}
                      placeholder="למשל: סופר עוף, ירושלים"
                      className="w-full p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-green-400" />
                  </div>

                  {routeStops.length === 0 ? (
                    <div className="text-center py-8 text-gray-400 text-sm border-2 border-dashed border-gray-200 rounded-xl">בחר הזמנות מהרשימה</div>
                  ) : (
                    <div className="space-y-2 max-h-48 overflow-y-auto custom-scrollbar">
                      {routeStops.map((stop, idx) => (
                        <div key={stop.orderId} className="flex items-center gap-2 bg-gray-50 rounded-xl p-2.5 border border-gray-200">
                          <span className="w-6 h-6 rounded-full bg-green-600 text-white text-xs font-black flex items-center justify-center shrink-0">{idx + 1}</span>
                          <div className="flex-1 min-w-0">
                            <div className="font-bold text-sm text-gray-900 truncate">{stop.customer}</div>
                            <div className="text-[10px] text-gray-500 truncate">{stop.neighborhood}</div>
                          </div>
                          <div className="flex flex-col gap-0.5">
                            <button onClick={() => moveStop(idx, -1)} disabled={idx === 0}
                              className="text-gray-400 hover:text-gray-700 disabled:opacity-30 text-xs leading-none px-1">▲</button>
                            <button onClick={() => moveStop(idx, 1)} disabled={idx === routeStops.length - 1}
                              className="text-gray-400 hover:text-gray-700 disabled:opacity-30 text-xs leading-none px-1">▼</button>
                          </div>
                          <button onClick={() => toggleStop({ id: stop.orderId })} className="text-gray-300 hover:text-red-400 transition-colors">
                            <Icons.X className="w-4 h-4" />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}

                  <button
                    onClick={openGoogleMaps}
                    disabled={routeStops.length === 0}
                    className="mt-4 w-full py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all disabled:opacity-40 disabled:cursor-not-allowed bg-green-600 hover:bg-green-700 text-white shadow-md">
                    <span>🗺️</span> פתח מסלול בגוגל מפות ({routeStops.length} עצירות)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* טאבים */}
          <div className="flex gap-2 mb-6">
            <button onClick={() => setActiveTab('delivery')}
              className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all border-2 flex items-center justify-center gap-2 ${activeTab === 'delivery' ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-blue-700 border-blue-200 hover:bg-blue-50'}`}>
              🚚 משלוחים
              {deliveryOrders.length > 0 && <span className={`text-xs px-1.5 py-0.5 rounded-full font-black ${activeTab === 'delivery' ? 'bg-white/30' : 'bg-blue-100'}`}>{deliveryOrders.length}</span>}
            </button>
            <button onClick={() => setActiveTab('pickup')}
              className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all border-2 flex items-center justify-center gap-2 ${activeTab === 'pickup' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-indigo-700 border-indigo-200 hover:bg-indigo-50'}`}>
              🏪 איסוף בחנות
              {pickupOrders.length > 0 && <span className={`text-xs px-1.5 py-0.5 rounded-full font-black ${activeTab === 'pickup' ? 'bg-white/30' : 'bg-indigo-100'}`}>{pickupOrders.length}</span>}
            </button>
          </div>

          {activeOrders.length === 0 ? (
            <div className="flex flex-col items-center justify-center p-12 bg-white rounded-xl border border-dashed border-gray-300 text-gray-400">
              <span className="text-4xl mb-3 opacity-30">{isDelivery ? '🚚' : '🏪'}</span>
              <h2 className="text-xl font-bold text-gray-500">אין {isDelivery ? 'משלוחים' : 'איסופים'} ממתינים</h2>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              {activeOrders.map(order => renderCard(order, isDelivery))}
            </div>
          )}
          {/* מודאל החזרת הזמנה */}
          {returnModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white rounded-2xl shadow-xl border border-orange-100 w-full max-w-sm animate-in zoom-in-95 duration-200">
                <div className="p-4 bg-orange-50 border-b border-orange-100 flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-orange-900">↩ החזרת הזמנה</h3>
                    <p className="text-xs text-orange-700 mt-0.5">#{returnModal.id} — {returnModal.customer}</p>
                  </div>
                  <button onClick={() => setReturnModal(null)} className="p-1 rounded-lg text-gray-400 hover:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
                </div>

                {returnStep === 'destination' && (
                  <div className="p-5 space-y-3">
                    <p className="text-sm font-bold text-gray-700 text-center mb-2">להיכן להחזיר את ההזמנה?</p>
                    <button onClick={() => setReturnStep('butcher')}
                      className="w-full py-4 rounded-xl border-2 border-orange-200 bg-orange-50 hover:bg-orange-100 hover:border-orange-400 font-bold text-orange-900 text-base transition-all">
                      🔪 החזר לעבודה (קצב)
                    </button>
                    <button onClick={() => setReturnStep('packing')}
                      className="w-full py-4 rounded-xl border-2 border-yellow-200 bg-yellow-50 hover:bg-yellow-100 hover:border-yellow-400 font-bold text-yellow-900 text-base transition-all">
                      📦 החזר לאריזה
                    </button>
                  </div>
                )}

                {returnStep === 'butcher' && (
                  <div className="p-4 space-y-2">
                    <button type="button" onClick={() => setReturnStep('destination')} className="text-xs text-gray-400 hover:text-gray-600 flex items-center gap-1 mb-1">← חזור</button>
                    <p className="text-sm font-bold text-gray-700 mb-3">שייך לקצב:</p>
                    {butchersList.length === 0 && (
                      <p className="text-sm text-gray-400 text-center py-4">אין קצבים מוגדרים — הוסף בניהול רשימות</p>
                    )}
                    {butchersList.map(b => (
                      <button key={b.id} onClick={() => confirmReturnToWork(b.name)}
                        className="w-full py-3 px-4 rounded-xl border-2 border-orange-200 bg-orange-50 hover:bg-orange-100 hover:border-orange-400 font-bold text-orange-900 text-base transition-all text-right">
                        🔪 {b.name}
                      </button>
                    ))}
                    <button onClick={() => confirmReturnToWork('')}
                      className="w-full py-2.5 px-4 rounded-xl border-2 border-gray-200 bg-gray-50 hover:bg-gray-100 font-bold text-gray-600 text-sm transition-all text-center">
                      ללא שיוך לקצב
                    </button>
                  </div>
                )}

                {returnStep === 'packing' && (
                  <div className="p-5 space-y-4">
                    <button type="button" onClick={() => setReturnStep('destination')} className="text-xs text-gray-400 hover:text-gray-600 flex items-center gap-1">← חזור</button>
                    <p className="text-sm font-bold text-gray-700">עדכן פרטי אריזה (אם השתנה):</p>
                    <div className="grid grid-cols-3 gap-3">
                      <div className="text-center">
                        <div className="text-2xl mb-1">📦</div>
                        <label className="block text-xs font-bold text-gray-500 mb-1.5">קרטונים</label>
                        <input type="number" min="0" step="1" placeholder="0"
                          value={returnPackaging.cartons}
                          onChange={e => setReturnPackaging(p => ({ ...p, cartons: e.target.value }))}
                          className="w-full p-2 text-center text-lg font-black border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 outline-none" />
                      </div>
                      <div className="text-center">
                        <div className="text-2xl mb-1">🛍️</div>
                        <label className="block text-xs font-bold text-gray-500 mb-1.5">שקיות</label>
                        <input type="number" min="0" step="1" placeholder="0"
                          value={returnPackaging.bags}
                          onChange={e => setReturnPackaging(p => ({ ...p, bags: e.target.value }))}
                          className="w-full p-2 text-center text-lg font-black border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 outline-none" />
                      </div>
                      <div className="text-center">
                        <div className="text-2xl mb-1">🐟</div>
                        <label className="block text-xs font-bold text-gray-500 mb-1.5">שקיות דגים</label>
                        <input type="number" min="0" step="1" placeholder="0"
                          value={returnPackaging.fishBags}
                          onChange={e => setReturnPackaging(p => ({ ...p, fishBags: e.target.value }))}
                          className="w-full p-2 text-center text-lg font-black border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 outline-none" />
                      </div>
                    </div>
                    <div className="flex gap-3 pt-1">
                      <button onClick={() => setReturnModal(null)}
                        className="flex-1 py-2.5 rounded-xl border border-gray-200 text-gray-600 font-bold text-sm hover:bg-gray-50 transition-colors">
                        ביטול
                      </button>
                      <button onClick={confirmReturnToPacking}
                        className="flex-1 py-2.5 rounded-xl bg-yellow-500 hover:bg-yellow-600 text-white font-bold text-sm border border-yellow-600 transition-colors">
                        ✅ אשר החזרה לאריזה
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- ListEditor Helpers ---
    const ListEditor = ({ title, items, setItems, placeholder, showColor = false }) => {
      const [newItemName, setNewItemName] = useState('');
      const [newItemColor, setNewItemColor] = useState('#6366f1');

      const handleAdd = (e) => {
        e.preventDefault();
        if (!newItemName.trim()) return;
        const newItem = { id: Date.now().toString(), name: newItemName };
        if (showColor) newItem.color = newItemColor;
        setItems([...items, newItem]);
        setNewItemName('');
        setNewItemColor('#6366f1');
      };

      const handleRemove = (id) => setItems(items.filter(p => p.id !== id));

      const handleColorChange = (id, color) => {
        setItems(items.map(item => item.id === id ? { ...item, color } : item));
      };

      return (
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <div className="p-4 border-b border-gray-200 bg-gray-50">
            <h3 className="font-bold text-lg text-gray-800">{title}</h3>
          </div>

          <div className="p-5 border-b border-gray-100 bg-white">
            <form onSubmit={handleAdd} className="flex gap-3 max-w-md items-center">
              {showColor && (
                <input type="color" value={newItemColor} onChange={e => setNewItemColor(e.target.value)}
                  className="w-10 h-10 rounded-lg border border-gray-300 cursor-pointer p-0.5" title="בחר צבע" />
              )}
              <input type="text" value={newItemName} onChange={e => setNewItemName(e.target.value)}
                placeholder={placeholder}
                className="flex-1 p-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
              <Button type="submit" variant="primary" icon={Icons.Plus}>הוסף</Button>
            </form>
          </div>

          <div className="overflow-x-auto max-h-60 custom-scrollbar">
            <table className="w-full text-right relative">
              <thead className="bg-gray-50/50 text-gray-500 text-sm border-b border-gray-100 sticky top-0 backdrop-blur-md">
                <tr>
                  {showColor && <th className="p-4 font-medium w-20 text-center">צבע</th>}
                  <th className="p-4 font-medium">שם</th>
                  <th className="p-4 font-medium w-16">מחק</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-100">
                {items.map(item => (
                  <tr key={item.id} className="hover:bg-gray-50 transition-colors">
                    {showColor && (
                      <td className="p-3 text-center">
                        <input type="color" value={item.color || '#6366f1'}
                          onChange={e => handleColorChange(item.id, e.target.value)}
                          className="w-9 h-9 rounded-lg border border-gray-200 cursor-pointer p-0.5" />
                      </td>
                    )}
                    <td className="p-4 font-medium text-gray-900 flex items-center gap-2">
                      {showColor && item.color && (
                        <span className="inline-block w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: item.color }} />
                      )}
                      {item.name}
                    </td>
                    <td className="p-4">
                      <button onClick={() => handleRemove(item.id)} className="text-gray-400 hover:text-red-500 transition-colors">
                        <Icons.Trash2 className="w-4 h-4" />
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // --- Contacts View ---
    const ContactsView = ({ contactsList, setContactsList }) => {
      const [editingContact, setEditingContact] = useState(null); // contact object being edited
      const [importStep, setImportStep] = useState('idle'); // idle | mapping | preview | done
      const [excelRows, setExcelRows] = useState([]);
      const [excelHeaders, setExcelHeaders] = useState([]);
      const [mapping, setMapping] = useState({ name: '', phone: '', mobile: '', address: '', neighborhood: '', notes: '' });
      const [previewContacts, setPreviewContacts] = useState([]);
      const [search, setSearch] = useState('');

      const FIELDS = [
        { key: 'name', label: 'שם לקוח *', required: true },
        { key: 'phone', label: 'טלפון', required: false },
        { key: 'mobile', label: 'נייד', required: false },
        { key: 'address', label: 'כתובת / רחוב', required: false },
        { key: 'neighborhood', label: 'שכונה / עיר', required: false },
        { key: 'notes', label: 'הערות', required: false },
      ];

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const wb = window.XLSX.read(evt.target.result, { type: 'binary' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1 });
          if (rows.length < 2) return;
          const headers = rows[0].map(h => String(h || ''));
          setExcelHeaders(headers);
          setExcelRows(rows.slice(1));

          // ניסיון זיהוי אוטומטי של עמודות
          const autoMap = { name: '', phone: '', mobile: '', address: '', neighborhood: '', notes: '' };
          headers.forEach(h => {
            const lower = h.toLowerCase();
            if (!autoMap.name && (lower.includes('שם') || lower.includes('name'))) autoMap.name = h;
            if (!autoMap.phone && (lower.includes('טלפון') || lower.includes('phone') || lower.includes('נייד'))) autoMap.phone = h;
            if (!autoMap.mobile && (lower.includes('נייד') || lower.includes('mobile') || lower.includes('סלולר'))) autoMap.mobile = h;
            if (!autoMap.address && (lower.includes('רחוב') || lower.includes('כתובת') || lower.includes('address'))) autoMap.address = h;
            if (!autoMap.neighborhood && (lower.includes('עיר') || lower.includes('שכונה') || lower.includes('city'))) autoMap.neighborhood = h;
            if (!autoMap.notes && (lower.includes('הערה') || lower.includes('note'))) autoMap.notes = h;
          });
          setMapping(autoMap);
          setImportStep('mapping');
        };
        reader.readAsBinaryString(file);
      };

      const buildPreview = () => {
        if (!mapping.name) return;
        const colIdx = (col) => col ? excelHeaders.indexOf(col) : -1;
        const preview = excelRows
          .map(row => ({
            id: Date.now().toString() + Math.random(),
            name: String(row[colIdx(mapping.name)] || '').trim(),
            phone: String(row[colIdx(mapping.phone)] || '').trim(),
            mobile: String(row[colIdx(mapping.mobile)] || '').trim(),
            address: String(row[colIdx(mapping.address)] || '').trim(),
            neighborhood: String(row[colIdx(mapping.neighborhood)] || '').trim(),
            notes: String(row[colIdx(mapping.notes)] || '').trim(),
          }))
          .filter(c => c.name);

        // סינון כפולים לפי שם + טלפון
        const existingKeys = new Set(contactsList.map(c => `${c.name}|${c.phone}`));
        const newContacts = preview.filter(c => !existingKeys.has(`${c.name}|${c.phone}`));
        setPreviewContacts(newContacts);
        setImportStep('preview');
      };

      const confirmImport = () => {
        setContactsList(prev => [...prev, ...previewContacts.map(c => ({ ...c, id: Date.now().toString() + Math.random() }))]);
        setImportStep('done');
        setExcelRows([]); setExcelHeaders([]);
      };

      const filteredContacts = contactsList.filter(c =>
        !search || c.name.includes(search) || c.phone.includes(search) || c.mobile.includes(search)
      );

      return (
        <div className="animate-in fade-in duration-300 space-y-6">
          <div className="flex flex-wrap items-start justify-between gap-3">
            <div>
              <h1 className="text-3xl font-extrabold text-gray-900">אנשי קשר</h1>
              <p className="text-gray-500 mt-1">ייבוא מאקסל ובחירה מהירה בפתיחת הזמנה</p>
            </div>
            <label className="flex items-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl cursor-pointer shadow-sm transition-colors">
              📥 ייבוא מאקסל
              <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFileUpload} onClick={e => e.target.value = ''} />
            </label>
          </div>

          {/* שלב מיפוי עמודות */}
          {importStep === 'mapping' && (
            <div className="bg-white rounded-2xl border-2 border-blue-200 shadow-sm overflow-hidden">
              <div className="p-4 bg-blue-50 border-b border-blue-100">
                <h3 className="font-bold text-blue-900">שלב 1 — מפה עמודות</h3>
                <p className="text-xs text-blue-700 mt-0.5">בחר איזו עמודה באקסל מתאימה לכל שדה. זוהו {excelHeaders.length} עמודות.</p>
              </div>
              <div className="p-5 grid grid-cols-1 md:grid-cols-2 gap-4">
                {FIELDS.map(f => (
                  <div key={f.key}>
                    <label className="block text-xs font-bold text-gray-500 mb-1">{f.label}</label>
                    <select value={mapping[f.key]} onChange={e => setMapping(m => ({ ...m, [f.key]: e.target.value }))}
                      className="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-blue-400">
                      <option value="">-- לא לייבא --</option>
                      {excelHeaders.map(h => <option key={h} value={h}>{h}</option>)}
                    </select>
                  </div>
                ))}
              </div>
              <div className="p-4 border-t border-gray-100 flex gap-3 justify-end">
                <button onClick={() => setImportStep('idle')} className="px-4 py-2 rounded-xl border border-gray-200 text-gray-500 font-bold text-sm hover:bg-gray-50">ביטול</button>
                <button onClick={buildPreview} disabled={!mapping.name}
                  className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm disabled:opacity-40">
                  המשך לתצוגה מקדימה ←
                </button>
              </div>
            </div>
          )}

          {/* שלב תצוגה מקדימה */}
          {importStep === 'preview' && (
            <div className="bg-white rounded-2xl border-2 border-green-200 shadow-sm overflow-hidden">
              <div className="p-4 bg-green-50 border-b border-green-100 flex items-center justify-between">
                <div>
                  <h3 className="font-bold text-green-900">שלב 2 — תצוגה מקדימה</h3>
                  <p className="text-xs text-green-700 mt-0.5">
                    {previewContacts.length > 0
                      ? `נמצאו ${previewContacts.length} אנשי קשר חדשים לייבוא`
                      : 'לא נמצאו אנשי קשר חדשים — כולם כבר קיימים במערכת'}
                  </p>
                </div>
                <button onClick={() => setImportStep('mapping')} className="text-xs text-green-700 underline">חזור למיפוי</button>
              </div>
              {previewContacts.length > 0 && (
                <div className="max-h-64 overflow-y-auto custom-scrollbar">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-gray-50 text-gray-500 border-b sticky top-0">
                      <tr>
                        <th className="p-2 font-bold">שם</th>
                        <th className="p-2 font-bold">טלפון</th>
                        <th className="p-2 font-bold">כתובת</th>
                        <th className="p-2 font-bold">שכונה</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100">
                      {previewContacts.map((c, i) => (
                        <tr key={i} className="hover:bg-gray-50">
                          <td className="p-2 font-bold text-gray-900">{c.name}</td>
                          <td className="p-2 text-gray-600">{c.phone || c.mobile}</td>
                          <td className="p-2 text-gray-600">{c.address}</td>
                          <td className="p-2 text-gray-600">{c.neighborhood}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
              <div className="p-4 border-t border-gray-100 flex gap-3 justify-end">
                <button onClick={() => setImportStep('idle')} className="px-4 py-2 rounded-xl border border-gray-200 text-gray-500 font-bold text-sm hover:bg-gray-50">ביטול</button>
                {previewContacts.length > 0 && (
                  <button onClick={confirmImport}
                    className="px-4 py-2 rounded-xl bg-green-600 hover:bg-green-700 text-white font-bold text-sm">
                    ✅ ייבא {previewContacts.length} אנשי קשר
                  </button>
                )}
              </div>
            </div>
          )}

          {importStep === 'done' && (
            <div className="bg-green-50 border border-green-200 rounded-xl p-4 text-green-800 font-bold text-center">
              ✅ הייבוא הושלם! — {contactsList.length} אנשי קשר במערכת
              <button onClick={() => setImportStep('idle')} className="mr-3 text-xs underline font-normal">סגור</button>
            </div>
          )}

          {editingContact && (
            <EditContactModal
              contact={editingContact}
              onSave={(updated) => {
                setContactsList(prev => prev.map(c => c.id === updated.id ? updated : c));
                setEditingContact(null);
              }}
              onClose={() => setEditingContact(null)}
            />
          )}

          {/* חיפוש ורשימה */}
          <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div className="p-3 border-b border-gray-100 flex items-center gap-3">
              <input type="text" placeholder="🔍 חיפוש לפי שם או טלפון..."
                value={search} onChange={e => setSearch(e.target.value)}
                className="flex-1 p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" />
              <span className="text-xs text-gray-400 font-bold shrink-0">{filteredContacts.length} איש קשר</span>
            </div>
            {filteredContacts.length === 0 ? (
              <div className="p-10 text-center text-gray-400">
                <div className="text-3xl mb-2">👥</div>
                <div className="font-bold text-gray-500">אין אנשי קשר עדיין</div>
                <div className="text-sm mt-1">ייבא מאקסל כדי להתחיל</div>
              </div>
            ) : (
              <div className="overflow-x-auto max-h-96 custom-scrollbar">
                <table className="w-full text-right text-sm">
                  <thead className="bg-gray-50 text-gray-500 text-xs border-b sticky top-0">
                    <tr>
                      <th className="p-3 font-bold">שם</th>
                      <th className="p-3 font-bold">טלפון</th>
                      <th className="p-3 font-bold">כתובת</th>
                      <th className="p-3 font-bold">שכונה</th>
                      <th className="p-3 w-20"></th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {filteredContacts.map(c => (
                      <tr key={c.id} className="hover:bg-gray-50">
                        <td className="p-3 font-bold text-gray-900">{c.name}</td>
                        <td className="p-3 text-gray-600">{c.phone}{c.mobile && c.mobile !== c.phone ? ` / ${c.mobile}` : ''}</td>
                        <td className="p-3 text-gray-600">{c.address}</td>
                        <td className="p-3 text-gray-600">{c.neighborhood}</td>
                        <td className="p-3">
                          <div className="flex gap-2">
                            <button onClick={() => setEditingContact({ ...c })}
                              className="text-gray-400 hover:text-blue-500 transition-colors">
                              <Icons.Edit className="w-4 h-4" />
                            </button>
                            <button onClick={() => setContactsList(prev => prev.filter(x => x.id !== c.id))}
                              className="text-gray-300 hover:text-red-500 transition-colors">
                              <Icons.Trash2 className="w-4 h-4" />
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- Edit Contact Modal ---
    const EditContactModal = ({ contact, onSave, onClose }) => {
      const [form, setForm] = useState({ ...contact });
      const set = (field, val) => setForm(f => ({ ...f, [field]: val }));

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-in fade-in duration-200">
          <div className="bg-white rounded-2xl shadow-xl border border-blue-100 w-full max-w-md animate-in zoom-in-95 duration-200">
            <div className="p-4 bg-blue-50 border-b border-blue-100 flex items-center justify-between">
              <h3 className="font-bold text-blue-900 flex items-center gap-2"><Icons.Edit className="w-5 h-5" /> עריכת איש קשר</h3>
              <button onClick={onClose} className="p-1 rounded-lg text-gray-400 hover:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
            </div>
            <div className="p-5 space-y-3">
              {[
                { key: 'name',         label: 'שם לקוח *', type: 'text' },
                { key: 'phone',        label: 'טלפון',      type: 'tel' },
                { key: 'mobile',       label: 'נייד',       type: 'tel' },
                { key: 'address',      label: 'כתובת / רחוב', type: 'text' },
                { key: 'neighborhood', label: 'שכונה / עיר',  type: 'text' },
                { key: 'notes',        label: 'הערות',      type: 'text' },
              ].map(f => (
                <div key={f.key}>
                  <label className="block text-xs font-bold text-gray-500 mb-1">{f.label}</label>
                  <input type={f.type} value={form[f.key] || ''} onChange={e => set(f.key, e.target.value)}
                    className="w-full p-2.5 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" />
                </div>
              ))}
            </div>
            <div className="p-4 border-t border-gray-100 flex gap-3">
              <Button variant="outline" className="flex-1" onClick={onClose}>ביטול</Button>
              <Button variant="primary" icon={Icons.Save} className="flex-1" onClick={() => onSave(form)}>שמור שינויים</Button>
            </div>
          </div>
        </div>
      );
    };

    const NeighborhoodEditor = ({ neighborhoodData, setNeighborhoodData }) => {
      const [selectedId, setSelectedId]   = useState('');
      const [newNeighborhood, setNewNeighborhood] = useState('');
      const [newStreet, setNewStreet]     = useState('');

      const selectedN = neighborhoodData.find(n => n.id === selectedId);

      const addNeighborhood = (e) => {
        e.preventDefault();
        if (!newNeighborhood.trim()) return;
        setNeighborhoodData(prev => [...prev, { id: Date.now().toString(), name: newNeighborhood.trim(), streets: [] }]);
        setNewNeighborhood('');
      };

      const removeNeighborhood = (id) => {
        setNeighborhoodData(prev => prev.filter(n => n.id !== id));
        if (selectedId === id) setSelectedId('');
      };

      const addStreet = (e) => {
        e.preventDefault();
        if (!newStreet.trim() || !selectedId) return;
        setNeighborhoodData(prev => prev.map(n => n.id === selectedId ? { ...n, streets: [...n.streets, newStreet.trim()] } : n));
        setNewStreet('');
      };

      const removeStreet = (street) => {
        setNeighborhoodData(prev => prev.map(n => n.id === selectedId ? { ...n, streets: n.streets.filter(s => s !== street) } : n));
      };

      return (
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <div className="p-4 border-b border-gray-200 bg-gray-50">
            <h3 className="font-bold text-lg text-gray-800">שכונות ורחובות (ירושלים)</h3>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100">
            {/* עמודת שכונות */}
            <div className="p-4">
              <form onSubmit={addNeighborhood} className="flex gap-2 mb-3">
                <input type="text" value={newNeighborhood} onChange={e => setNewNeighborhood(e.target.value)}
                  placeholder="הוסף שכונה חדשה..."
                  className="flex-1 p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" />
                <Button type="submit" variant="primary" icon={Icons.Plus}>הוסף</Button>
              </form>
              <div className="space-y-1 max-h-64 overflow-y-auto custom-scrollbar">
                {neighborhoodData.map(n => (
                  <div key={n.id}
                    onClick={() => setSelectedId(n.id)}
                    className={`flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer transition-colors ${selectedId === n.id ? 'bg-blue-50 border border-blue-200' : 'hover:bg-gray-50 border border-transparent'}`}>
                    <span className="font-medium text-sm text-gray-900">{n.name}
                      <span className="text-xs text-gray-400 mr-1.5">({n.streets.length} רחובות)</span>
                    </span>
                    <button onClick={e => { e.stopPropagation(); removeNeighborhood(n.id); }}
                      className="text-gray-300 hover:text-red-500 transition-colors shrink-0">
                      <Icons.Trash2 className="w-4 h-4" />
                    </button>
                  </div>
                ))}
              </div>
            </div>

            {/* עמודת רחובות */}
            <div className="p-4">
              {!selectedN ? (
                <div className="text-center py-10 text-gray-400 text-sm">
                  <Icons.MapPin className="w-8 h-8 mx-auto mb-2 opacity-20" />
                  לחץ על שכונה לניהול רחובותיה
                </div>
              ) : (
                <>
                  <div className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                    <Icons.MapPin className="w-4 h-4 text-blue-500" /> רחובות — {selectedN.name}
                  </div>
                  <form onSubmit={addStreet} className="flex gap-2 mb-3">
                    <input type="text" value={newStreet} onChange={e => setNewStreet(e.target.value)}
                      placeholder="הוסף רחוב..."
                      className="flex-1 p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" />
                    <Button type="submit" variant="primary" icon={Icons.Plus}>הוסף</Button>
                  </form>
                  <div className="space-y-1 max-h-52 overflow-y-auto custom-scrollbar">
                    {selectedN.streets.map(street => (
                      <div key={street} className="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-gray-50 border border-transparent">
                        <span className="text-sm text-gray-800">{street}</span>
                        <button onClick={() => removeStreet(street)} className="text-gray-300 hover:text-red-500 transition-colors">
                          <Icons.Trash2 className="w-4 h-4" />
                        </button>
                      </div>
                    ))}
                    {selectedN.streets.length === 0 && (
                      <div className="text-xs text-gray-400 text-center py-4">אין רחובות — הוסף למעלה</div>
                    )}
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    };

    const ProductListEditor = ({ items, setItems, kashrutList }) => {
      const [openFilter, setOpenFilter] = useState(null);
      const [searchName, setSearchName] = useState('');
      const [activeCats, setActiveCats] = useState(new Set());
      const [activeKashrut, setActiveKashrut] = useState(new Set());
      const [activeStorage, setActiveStorage] = useState(new Set());
      const [sortBy, setSortBy] = useState('');
      const [sortDir, setSortDir] = useState('asc');
      const [showAddModal, setShowAddModal] = useState(false);
      const [newProduct, setNewProduct] = useState({ name: '', category: 'עוף', sku: '', storageTypes: ['frozen'] });
      const tableRef = useRef(null);

      useEffect(() => {
        if (!openFilter) return;
        const handler = (e) => { if (tableRef.current && !tableRef.current.contains(e.target)) setOpenFilter(null); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [openFilter]);

      const [editingName, setEditingName] = useState({ id: null, value: '' });

      const commitRename = (originalName) => {
        const trimmed = editingName.value.trim();
        if (trimmed && trimmed !== originalName) updateByName(originalName, 'name', trimmed);
        setEditingName({ id: null, value: '' });
      };

      const openAddModal = () => {
        const cat = activeCats.size === 1 ? [...activeCats][0] : 'עוף';
        setNewProduct({ name: '', category: cat, sku: '', storageTypes: ['frozen'] });
        setShowAddModal(true);
      };

      const confirmAddProduct = () => {
        if (!newProduct.name.trim()) return;
        const newId = `p_${Date.now()}`;
        const isFish = newProduct.category === 'דגים';
        setItems(prev => [...prev, ...(isFish
          ? [{ id: `${newId}_0`, name: newProduct.name.trim(), sku: newProduct.sku, storageTypes: newProduct.storageTypes, kashrut: 'כללי', category: 'דגים' }]
          : kashrutList.map((k, j) => ({ id: `${newId}_${j}`, name: newProduct.name.trim(), sku: newProduct.sku, storageTypes: newProduct.storageTypes, kashrut: k.name, category: newProduct.category }))
        )]);
        setShowAddModal(false);
      };

      const toggleNewStorage = (key) => setNewProduct(p => {
        const has = p.storageTypes.includes(key);
        return { ...p, storageTypes: has ? p.storageTypes.filter(k => k !== key) : [...p.storageTypes, key] };
      });
      const updateProduct = (id, field, value) => setItems(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
      const updateByName  = (name, field, value) => setItems(prev => prev.map(p => p.name === name ? { ...p, [field]: value } : p));
      const removeGroup   = (name) => setItems(prev => prev.filter(p => p.name !== name));
      const toggleStorage = (id, key) => setItems(prev => prev.map(p => {
        if (p.id !== id) return p;
        const has = (p.storageTypes || []).includes(key);
        return { ...p, storageTypes: has ? p.storageTypes.filter(k => k !== key) : [...(p.storageTypes || []), key] };
      }));
      const toggleSet = (setter, value) => setter(prev => { const n = new Set(prev); n.has(value) ? n.delete(value) : n.add(value); return n; });
      const setSort   = (field, dir)  => { setSortBy(field); setSortDir(dir); setOpenFilter(null); };
      const clearSort = ()            => { setSortBy('');    setOpenFilter(null); };

      const orderedKashrutList = [
        ...kashrutList.filter(k => k.name === 'קהילות'),
        ...kashrutList.filter(k => k.name === 'לנדא'),
        ...kashrutList.filter(k => k.name !== 'קהילות' && k.name !== 'לנדא'),
      ];

      const enriched = items.map(p => ({ ...p, _cat: p.category || getProductCategory(p.name) }));
      let filtered = enriched;
      if (searchName)         filtered = filtered.filter(p => p.name.includes(searchName));
      if (activeCats.size)    filtered = filtered.filter(p => activeCats.has(p._cat));
      if (activeKashrut.size) filtered = filtered.filter(p => activeKashrut.has(p.kashrut));
      if (activeStorage.size) filtered = filtered.filter(p => (p.storageTypes || []).some(s => activeStorage.has(s)));
      if (sortBy) filtered = [...filtered].sort((a, b) => {
        const va = sortBy === 'name' ? (a.name || '') : (a.sku || '');
        const vb = sortBy === 'name' ? (b.name || '') : (b.sku || '');
        return sortDir === 'asc' ? va.localeCompare(vb, 'he') : vb.localeCompare(va, 'he');
      });

      const visibleCats = PRODUCT_CATEGORIES.filter(c => filtered.some(p => p._cat === c));
      const isActive = {
        name:     !!searchName || sortBy === 'name',
        category: activeCats.size > 0,
        sku:      sortBy === 'sku',
        kashrut:  activeKashrut.size > 0,
        storage:  activeStorage.size > 0,
      };

      // helper renderers (functions, not components, to avoid remount issues)
      const sortRow = (field, dir, label) => (
        <button onClick={() => setSort(field, dir)}
          className={`w-full text-right px-2 py-1.5 rounded-lg hover:bg-gray-50 text-sm flex items-center gap-2 ${sortBy === field && sortDir === dir ? 'text-blue-600 font-bold' : 'text-gray-700'}`}>
          {dir === 'asc' ? '↑' : '↓'} {label}
        </button>
      );
      const checkRow = (label, checked, onChange) => (
        <label className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-gray-50 cursor-pointer text-sm text-gray-700">
          <input type="checkbox" checked={checked} onChange={onChange} className="rounded accent-blue-500" />
          {label}
        </label>
      );
      const clearBtn = (onClick, label = 'נקה סינון') => (
        <button onClick={onClick} className="w-full text-right px-2 py-1.5 text-xs text-red-500 hover:bg-red-50 rounded-lg border-t border-gray-100 mt-1 pt-2">
          ✕ {label}
        </button>
      );

      const colHeader = (field, label) => {
        const active = isActive[field];
        const isOpen = openFilter === field;
        return (
          <th className="text-right px-4 py-2.5 text-xs relative">
            <button onClick={() => setOpenFilter(isOpen ? null : field)}
              className={`flex items-center gap-1 font-bold transition-colors whitespace-nowrap ${active ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>
              {label}
              <span className={`text-[9px] ml-0.5 ${active ? 'text-blue-400' : 'text-gray-300'}`}>{active ? '▼' : '▾'}</span>
            </button>
            {isOpen && (
              <div className="absolute top-full right-0 z-50 mt-1 bg-white border border-gray-200 rounded-xl shadow-xl min-w-[190px] p-1.5 text-right"
                onClick={e => e.stopPropagation()}>
                {field === 'name' && <>
                  <input autoFocus type="text" placeholder="חיפוש שם מוצר..." value={searchName}
                    onChange={e => setSearchName(e.target.value)}
                    className="w-full p-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400 mb-1" />
                  <div className="border-t border-gray-100 pt-1">
                    {sortRow('name', 'asc',  'מיון א → ת')}
                    {sortRow('name', 'desc', 'מיון ת → א')}
                    {sortBy === 'name' && clearBtn(clearSort, 'נקה מיון')}
                    {searchName       && clearBtn(() => { setSearchName(''); }, 'נקה חיפוש')}
                  </div>
                </>}
                {field === 'category' && <>
                  {PRODUCT_CATEGORIES.map(cat => checkRow(`${CAT_EMOJI[cat]} ${cat}`, activeCats.has(cat), () => { toggleSet(setActiveCats, cat); setOpenFilter(null); }))}
                  {activeCats.size > 0 && clearBtn(() => { setActiveCats(new Set()); setOpenFilter(null); })}
                </>}
                {field === 'sku' && <>
                  {sortRow('sku', 'asc',  'מיון עולה')}
                  {sortRow('sku', 'desc', 'מיון יורד')}
                  {sortBy === 'sku' && clearBtn(clearSort, 'נקה מיון')}
                </>}
                {field === 'kashrut' && <>
                  {orderedKashrutList.map(k => checkRow(k.name, activeKashrut.has(k.name), () => { toggleSet(setActiveKashrut, k.name); setOpenFilter(null); }))}
                  {activeKashrut.size > 0 && clearBtn(() => { setActiveKashrut(new Set()); setOpenFilter(null); })}
                </>}
                {field === 'storage' && <>
                  {checkRow('🧊 קפוא', activeStorage.has('frozen'), () => { toggleSet(setActiveStorage, 'frozen'); setOpenFilter(null); })}
                  {checkRow('🥩 טרי',   activeStorage.has('fresh'),  () => { toggleSet(setActiveStorage, 'fresh');  setOpenFilter(null); })}
                  {activeStorage.size > 0 && clearBtn(() => { setActiveStorage(new Set()); setOpenFilter(null); })}
                </>}
              </div>
            )}
          </th>
        );
      };

      return (
        <div className="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden" ref={tableRef}>
          <div className="px-5 py-4 border-b border-gray-100 flex items-center justify-between gap-3">
            <div>
              <h3 className="font-bold text-gray-800 text-lg">מוצרי מלאי</h3>
              <p className="text-xs text-gray-400 mt-0.5">לחץ על כותרת עמודה לסינון ומיון</p>
            </div>
            <button onClick={openAddModal} className="flex items-center gap-1.5 text-sm font-bold text-white bg-purple-600 hover:bg-purple-700 px-3 py-1.5 rounded-lg border border-purple-700 transition-colors shrink-0">
              <Icons.Plus className="w-4 h-4" /> הוסף מוצר
            </button>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-gray-50 border-b border-gray-200">
                <tr>
                  {colHeader('name',     'שם מוצר')}
                  {colHeader('category', 'קטגוריה')}
                  {colHeader('sku',      'מק"ט')}
                  {colHeader('kashrut',  'כשרות')}
                  {colHeader('storage',  'סוג מלאי')}
                  <th className="px-4 py-2.5 w-10"></th>
                </tr>
              </thead>
              <tbody>
                {visibleCats.length === 0 && (
                  <tr><td colSpan={6} className="p-8 text-center text-gray-400 text-sm">אין מוצרים התואמים לסינון הנבחר</td></tr>
                )}
                {visibleCats.map(cat => {
                  const catItems = filtered.filter(p => p._cat === cat);
                  if (!catItems.length) return null;
                  const s = CAT_STYLES[cat] || CAT_STYLES['עוף'];
                  return (
                    <React.Fragment key={cat}>
                      <tr className={`border-y ${s.header}`}>
                        <td colSpan={6} className={`px-4 py-2 font-bold text-sm ${s.text}`}>
                          <div className="flex items-center gap-2">
                            <span className={`w-2.5 h-2.5 rounded-full ${s.dot} shrink-0`}></span>
                            {CAT_EMOJI[cat]} {cat}
                            <span className="font-normal text-xs opacity-50">({catItems.length} פריטים)</span>
                          </div>
                        </td>
                      </tr>
                      {catItems.map(p => (
                        <tr key={p.id} className="hover:bg-gray-50/60 border-b border-gray-50">
                          <td className="px-4 py-2">
                            {editingName.id === p.id
                              ? <input autoFocus type="text" value={editingName.value}
                                  onChange={e => setEditingName(s => ({ ...s, value: e.target.value }))}
                                  onBlur={() => commitRename(p.name)}
                                  onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') setEditingName({ id: null, value: '' }); }}
                                  className="w-full p-1 border border-blue-400 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-300" />

    const SettingsView = ({ logoImage, setLogoImage }) => {

        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => setLogoImage(ev.target.result);

        <div className="animate-in fade-in duration-300 max-w-xl">
