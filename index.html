    const BeitShemeshView = ({ frozenProductsList = [] }) => {
      const [shipments, setShipments] = useState(() => {
        try { return JSON.parse(localStorage.getItem('bsShipments') || '[]'); }
        catch { return []; }
      });
      const [reportDate, setReportDate] = useState(new Date().toISOString().split('T')[0]);
      const [showForm, setShowForm] = useState(false);
      const [entryDate, setEntryDate] = useState(new Date().toISOString().split('T')[0]);
      const [pallets, setPallets] = useState([{ id: Date.now(), number: '', products: [] }]);
      const [activePalletId, setActivePalletId] = useState(null);
      const [productForm, setProductForm] = useState({ sku: '', name: '', kashrut: '', cartons: '', expiryDate: '', weight: '' });

      const save = (data) => { setShipments(data); localStorage.setItem('bsShipments', JSON.stringify(data)); };

      const handleSkuChange = (sku) => {
        setProductForm(p => ({ ...p, sku, name: '', kashrut: '' }));
        if (sku.length >= 1) {
          const found = frozenProductsList.find(p => p.sku && p.sku.toString() === sku.toString());
          if (found) setProductForm(p => ({ ...p, sku, name: found.name, kashrut: found.kashrut || '' }));
        }
      };

      const addPallet = () => setPallets(prev => [...prev, { id: Date.now(), number: '', products: [] }]);
      const removePallet = (id) => setPallets(prev => prev.filter(p => p.id !== id));
      const updatePalletNumber = (id, number) => setPallets(prev => prev.map(p => p.id === id ? { ...p, number } : p));

      const addProductToPallet = (palletId) => {
        if (!productForm.name || !productForm.cartons) return;
        const currentPallet = pallets.find(p => p.id === palletId);
        const currentTotal = currentPallet.products.reduce((s, p) => s + Number(p.cartons || 0), 0);
        if (currentTotal + Number(productForm.cartons) > 50) {
          alert('לא ניתן להוסיף - משטח מוגבל ל-50 קרטון (כרגע: ' + currentTotal + ' קרטונים)');
          return;
        }
        setPallets(prev => prev.map(p => p.id === palletId ? { ...p, products: [...p.products, { ...productForm, id: Date.now() }] } : p));
        setProductForm({ sku: '', name: '', kashrut: '', cartons: '', expiryDate: '', weight: '' });
      };

      const removeProductFromPallet = (palletId, productId) => {
        setPallets(prev => prev.map(p => p.id === palletId ? { ...p, products: p.products.filter(pr => pr.id !== productId) } : p));
      };

      const saveShipment = () => {
        if (!entryDate || pallets.some(p => !p.number)) { alert('נא למלא תאריך ומספרי משטחים'); return; }
        save([{ id: Date.now(), date: entryDate, pallets }, ...shipments]);
        setEntryDate(new Date().toISOString().split('T')[0]);
        setPallets([{ id: Date.now(), number: '', products: [] }]);
        setShowForm(false);
      };

      const deleteShipment = (id) => { if (window.confirm('למחוק יציאה זו?')) save(shipments.filter(s => s.id !== id)); };

      const reportShipments = shipments.filter(s => s.date === reportDate);
      const allProducts = reportShipments.flatMap(s => s.pallets.flatMap(p => p.products));
      const totalCartons = allProducts.reduce((sum, p) => sum + Number(p.cartons || 0), 0);
      const totalWeight = allProducts.reduce((sum, p) => sum + Number(p.weight || 0), 0);
      const totalPallets = reportShipments.reduce((sum, s) => sum + s.pallets.length, 0);

      const exportPDF = () => {
        const { jsPDF } = window.jspdf;
        const container = document.createElement('div');
        container.style.cssText = 'position:fixed;top:-9999px;right:-9999px;width:794px;background:white;padding:32px;font-family:Arial,sans-serif;direction:rtl;';
        let html = `<h2 style="text-align:center;margin-bottom:6px;font-size:20px;">דוח יציאה - מלאי בית שמש</h2>
          <p style="text-align:right;margin-bottom:20px;color:#555;font-size:13px;">תאריך: ${reportDate}</p>`;
        reportShipments.forEach(shipment => {
          shipment.pallets.forEach(pallet => {
            const pC = pallet.products.reduce((s,p)=>s+Number(p.cartons||0),0);
            const pW = pallet.products.reduce((s,p)=>s+Number(p.weight||0),0);
            html += `<div style="margin-bottom:18px;border:1px solid #ddd;border-radius:8px;overflow:hidden;">
              <div style="background:#1d4ed8;color:white;padding:8px 12px;font-weight:bold;font-size:14px;">משטח ${pallet.number}</div>
              <table style="width:100%;border-collapse:collapse;font-size:12px;">
                <thead><tr style="background:#f3f4f6;">
                  <th style="padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;">מוצר</th>
                  <th style="padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;">כשרות</th>
                  <th style="padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;">מקט</th>
                  <th style="padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;">קרטונים</th>
                  <th style="padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;">תאריך אחרון לשימוש</th>
                  <th style="padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;">משקל</th>
                </tr></thead>
                <tbody>`;
            pallet.products.forEach(p => {
              html += `<tr style="border-bottom:1px solid #f3f4f6;">
                <td style="padding:5px 10px;">${p.name||''}</td>
                <td style="padding:5px 10px;color:#6b7280;">${p.kashrut||'-'}</td>
                <td style="padding:5px 10px;color:#6b7280;">${p.sku||''}</td>
                <td style="padding:5px 10px;font-weight:bold;">${p.cartons||''}</td>
                <td style="padding:5px 10px;">${p.expiryDate||'-'}</td>
                <td style="padding:5px 10px;">${p.weight ? p.weight+' ק"ג' : '-'}</td>
              </tr>`;
            });
            html += `</tbody>
                <tfoot><tr style="background:#eff6ff;font-weight:bold;">
                  <td colspan="3" style="padding:6px 10px;">סה"כ משטח</td>
                  <td style="padding:6px 10px;">${pC} קרטונים</td>
                  <td></td>
                  <td style="padding:6px 10px;">${pW.toFixed(1)} ק"ג</td>
                </tr></tfoot>
              </table></div>`;
          });
        });
        html += `<div style="margin-top:12px;padding:12px 16px;background:#f3f4f6;border-radius:8px;font-weight:bold;font-size:14px;">
          סה"כ כולל: ${totalPallets} משטחים | ${totalCartons} קרטונים | ${totalWeight.toFixed(1)} ק"ג</div>`;
        container.innerHTML = html;
        document.body.appendChild(container);
        window.html2canvas(container, { scale: 2, useCORS: true }).then(canvas => {
          document.body.removeChild(container);
          const imgData = canvas.toDataURL('image/png');
          const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
          const pageW = doc.internal.pageSize.getWidth();
          const pageH = doc.internal.pageSize.getHeight();
          const imgW = pageW;
          const imgH = (canvas.height * imgW) / canvas.width;
          let posY = 0;
          while (posY < imgH) {
            doc.addImage(imgData, 'PNG', 0, -posY, imgW, imgH);
            posY += pageH;
            if (posY < imgH) doc.addPage();
          }
          doc.save('דוח-יציאה-' + reportDate + '.pdf');
        });
      };

      const exportExcel = () => {
        const rows = [['תאריך יציאה','מספר משטח','מקט','שם מוצר','כשרות','כמות קרטונים','תאריך אחרון לשימוש','משקל (ק"ג)']];
        reportShipments.forEach(s => {
          s.pallets.forEach(p => {
            p.products.forEach(pr => {
              rows.push([s.date, p.number, pr.sku||'', pr.name||'', pr.kashrut||'', Number(pr.cartons)||0, pr.expiryDate||'', Number(pr.weight)||0]);
            });
            const pC = p.products.reduce((sum,pr)=>sum+Number(pr.cartons||0),0);
            const pW = p.products.reduce((sum,pr)=>sum+Number(pr.weight||0),0);
            rows.push(['','סה"כ משטח '+p.number,'','','',pC,'',pW.toFixed(1)]);
            rows.push([]);
          });
        });
        rows.push(['','סה"כ כולל','','','',totalCartons,'',totalWeight.toFixed(1)]);
        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws['!cols'] = [{wch:12},{wch:12},{wch:8},{wch:22},{wch:10},{wch:14},{wch:18},{wch:10}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'מלאי בית שמש');
        XLSX.writeFile(wb, 'דוח-יציאה-' + reportDate + '.xlsx');
      };

      return (
        <div className="animate-in fade-in duration-300 pb-10">
          <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
            <div>
              <h1 className="text-3xl font-extrabold text-gray-800">מלאי בית שמש</h1>
              <p className="text-gray-500 mt-1">מעקב סחורה באחסון קירור חיצוני</p>
            </div>
            <button onClick={() => setShowForm(!showForm)} className="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold shadow-md hover:bg-blue-700 transition-all">
              + יציאה חדשה
            </button>
          </div>

          {showForm && (
            <div className="bg-white rounded-2xl shadow-lg p-5 mb-6 border border-blue-100">
              <h2 className="font-bold text-xl mb-4 text-blue-800">הזנת יציאה חדשה</h2>
              <div className="mb-4">
                <label className="text-sm font-semibold text-gray-600 block mb-1">תאריך יציאה</label>
                <input type="date" value={entryDate} onChange={e => setEntryDate(e.target.value)} className="border-2 border-gray-200 rounded-xl p-2.5 focus:border-blue-400 outline-none" />
              </div>
              {pallets.map((pallet) => (
                <div key={pallet.id} className="bg-gray-50 rounded-xl p-4 mb-4 border border-gray-200">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-3">
                      <span className="font-bold text-gray-700">משטח מספר</span>
                      <input type="text" value={pallet.number} onChange={e => updatePalletNumber(pallet.id, e.target.value)} placeholder="מס'" className="border-2 border-gray-200 rounded-lg p-2 w-24 text-center font-bold focus:border-blue-400 outline-none" />
                    </div>
                    {pallets.length > 1 && <button onClick={() => removePallet(pallet.id)} className="text-red-400 text-sm font-semibold hover:text-red-600">הסר משטח</button>}
                  </div>
                  <div className="bg-blue-50 rounded-lg p-2 border border-blue-200 mb-3">
                    <div className="flex gap-1 items-end flex-wrap">
                      <div>
                        <label className="text-xs text-gray-400 block mb-0.5">מקט</label>
                        <input type="text" value={productForm.sku} onChange={e => handleSkuChange(e.target.value)} placeholder="מקט" className="border rounded p-1.5 w-16 text-xs focus:border-blue-400 outline-none bg-white" />
                      </div>
                      <div style={{minWidth:'100px',maxWidth:'160px'}}>
                        <label className="text-xs text-gray-400 block mb-0.5">שם מוצר</label>
                        <input type="text" value={productForm.name} onChange={e => setProductForm(p=>({...p,name:e.target.value}))} placeholder="אוטומטי" className="border rounded p-1.5 w-full text-xs focus:border-blue-400 outline-none bg-gray-50" />
                      </div>
                      <div style={{minWidth:'70px',maxWidth:'90px'}}>
                        <label className="text-xs text-gray-400 block mb-0.5">כשרות</label>
                        <input type="text" value={productForm.kashrut} onChange={e => setProductForm(p=>({...p,kashrut:e.target.value}))} placeholder="אוטומטי" className="border rounded p-1.5 w-full text-xs focus:border-blue-400 outline-none bg-gray-50" />
                      </div>
                      <div>
                        <label className="text-xs text-gray-400 block mb-0.5">קרטונים</label>
                        <input type="number" value={productForm.cartons} onChange={e => setProductForm(p=>({...p,cartons:e.target.value}))} placeholder="כמות" min="1" max="50" className="border rounded p-1.5 w-16 text-xs focus:border-blue-400 outline-none bg-white" />
                      </div>
                      <div>
                        <label className="text-xs text-gray-400 block mb-0.5">תאריך אחרון לשימוש</label>
                        <input type="date" value={productForm.expiryDate} onChange={e => setProductForm(p=>({...p,expiryDate:e.target.value}))} className="border rounded p-1.5 text-xs focus:border-blue-400 outline-none bg-white" />
                      </div>
                      <div>
                        <label className="text-xs text-gray-400 block mb-0.5">משקל ק"ג</label>
                        <input type="number" value={productForm.weight} onChange={e => setProductForm(p=>({...p,weight:e.target.value}))} placeholder="משקל" className="border rounded p-1.5 w-20 text-xs focus:border-blue-400 outline-none bg-white" />
                      </div>
                      <button onClick={() => addProductToPallet(pallet.id)} className="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-blue-700">הוסף</button>
                      <button onClick={() => setProductForm({sku:'',name:'',kashrut:'',cartons:'',expiryDate:'',weight:''})} className="bg-gray-200 text-gray-600 px-3 py-1.5 rounded text-xs font-bold">נקה</button>
                    </div>
                  </div>
                  {pallet.products.length > 0 && (
                    <table className="w-full text-sm">
                      <thead><tr className="text-xs text-gray-500">
                        <th className="text-right pb-1">מקט</th><th className="text-right pb-1">מוצר</th><th className="text-right pb-1">כשרות</th><th className="text-right pb-1">קרטונים</th><th className="text-right pb-1">תאריך אחרון לשימוש</th><th className="text-right pb-1">משקל</th><th></th>

          .filter(p => (p.kashrut || '') === k.name)
          .reduce((sum, p) => sum + (frozenStock[`${p.name}|${k.name}`] || 0), 0);
        return { ...k, trays, cartons: Math.floor(trays / TRAYS_PER_CARTON), remainder: trays % TRAYS_PER_CARTON };
      });

          frozenSummary: frozenTotalByKashrut.map(k => ({ name: k.name, color: k.color, trays: k.trays, cartons: k.cartons })),

                  <div className="py-1.5 text-center text-white text-xs font-bold" style={{ backgroundColor: k.color || '#888' }}>{k.name}</div>
                  <div className="p-3 text-center">
                    <div className="text-xl font-black text-gray-900">{k.trays} מגשים</div>
                    <div className="text-sm font-bold mt-1" style={{ color: k.color || '#888' }}>
                      {k.cartons} קרטונים{k.remainder > 0 ? ` +${k.remainder}` : ''}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* מלאי טרי לפי כשרות */}
          <div>
            <h2 className="text-lg font-extrabold text-gray-700 mb-3 flex items-center gap-2">🥩 מלאי טרי לפי כשרות</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {freshByKashrut.map(k => (
                <div key={k.id} className="bg-white rounded-xl border shadow-sm overflow-hidden" style={{ borderColor: (k.color || '#888') + '50' }}>
                  <div className="py-2 px-3 text-white text-sm font-bold flex justify-between items-center" style={{ backgroundColor: k.color || '#888' }}>
                    <span>{k.name}</span>
                    <span className="text-xs opacity-80">סה"כ {k.total.toFixed(1)} ק"ג</span>
                  </div>
                  {k.items.length === 0 ? (
                    <div className="p-4 text-center text-gray-400 text-sm">אין מלאי</div>
                  ) : (
                    <table className="w-full text-right text-xs">
                      <tbody className="divide-y divide-gray-100">
                        {k.items.map(item => (
                          <tr key={item.name} className="hover:bg-gray-50">
                            <td className="p-2.5 font-bold text-gray-900">{item.name}</td>
                            <td className="p-2.5 text-center font-black" style={{ color: k.color || '#888' }}>{item.qty} ק"ג</td>
                            <td className="p-2.5 text-center">
                              <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${item.qty < 10 ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-700 border border-green-100'}`}>
                                {item.qty < 10 ? 'נמוך' : 'תקין'}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              ))}
            </div>
          </div>

          {/* ארכיון בדיקות מלאי */}
          {inventoryLog.length > 0 && (
            <div>
              <h2 className="text-lg font-extrabold text-gray-700 mb-3 flex items-center gap-2">🗄️ ארכיון בדיקות מלאי ({inventoryLog.length})</h2>
              <div className="space-y-3">
                {inventoryLog.map(entry => (
                  <div key={entry.id} className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div className="p-4 flex items-center justify-between">
                      <div>
                        <div className="font-extrabold text-gray-900">📅 בדיקת מלאי — {entry.date}</div>
                        <div className="text-xs text-gray-400 mt-0.5">נשמר ב-{entry.savedAt} | {entry.ordersCount} הזמנות במערכת</div>
                        {entry.note && <div className="text-xs text-blue-600 mt-0.5 font-medium">📝 {entry.note}</div>}
                      </div>
                      <button
                        onClick={() => setViewArchive(viewArchive?.id === entry.id ? null : entry)}
                        className="text-xs font-bold text-blue-600 hover:text-blue-800 border border-blue-200 px-3 py-1.5 rounded-lg hover:bg-blue-50 transition-colors">
                        {viewArchive?.id === entry.id ? 'סגור' : 'הצג פירוט'}
                      </button>
                    </div>

                    {viewArchive?.id === entry.id && (
                      <div className="border-t border-gray-100 p-4 bg-gray-50/50 space-y-4">
                        {/* סיכום קפוא בארכיון */}
                        <div>
                          <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">מלאי קפוא לפי כשרות</div>
                          <div className="flex flex-wrap gap-3">
                            {entry.frozenSummary.map(k => (
                              <div key={k.name} className="bg-white rounded-lg border px-3 py-2 text-center min-w-[90px]" style={{ borderColor: (k.color || '#888') + '50' }}>
                                <div className="text-xs font-bold mb-1" style={{ color: k.color || '#888' }}>{k.name}</div>
                                <div className="font-black text-gray-900">{k.trays} מגשים</div>
                                <div className="text-xs text-gray-500">{k.cartons} קרטונים</div>
                              </div>
                            ))}
                          </div>
                        </div>
                        {/* מלאי טרי בארכיון */}
                        {entry.freshSummary?.some(k => k.total > 0) && (
                          <div>
                            <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">מלאי טרי לפי כשרות</div>
                            <div className="flex flex-wrap gap-2">
                              {entry.freshSummary.filter(k => k.total > 0).map(k => (
                                <div key={k.name} className="bg-white rounded-lg border px-3 py-1.5 text-center min-w-[80px]" style={{ borderColor: (k.color||'#888')+'50' }}>
                                  <div className="text-xs font-bold" style={{ color: k.color||'#888' }}>{k.name}</div>
                                  <div className="font-black text-gray-900 text-sm">{k.total.toFixed(1)} ק"ג</div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- Login Screen ---
    const LoginScreen = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true); setError('');
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) { setError('אימייל או סיסמה שגויים'); setLoading(false); }
      };

      return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4" dir="rtl">
          <div className="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-sm overflow-hidden">
            <div className="bg-red-600 p-6 text-center">
              <div className="text-white text-4xl font-black tracking-widest">סופר עוף</div>
              <div className="text-red-200 text-sm mt-1">מערכת ניהול קצביה</div>
            </div>
            <div className="p-6">
              <h2 className="font-bold text-lg text-gray-800 mb-5 text-center">כניסה למערכת</h2>
              {error && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm font-bold text-center">{error}</div>}
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1">אימייל</label>
                  <input type="email" required value={email} onChange={e => setEmail(e.target.value)}
                    placeholder="your@email.com"
                    className="w-full p-3 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-400 text-left" dir="ltr" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1">סיסמה</label>
                  <input type="password" required value={password} onChange={e => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full p-3 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-400 text-left" dir="ltr" />
                </div>
                <button type="submit" disabled={loading}
                  className="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                  {loading ? '...כניסה' : 'כניסה'}
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    // --- Main App Component ---
    function App() {
      const [activeTab, setActiveTab] = useState('orders');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [authUser, setAuthUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [appLoading, setAppLoading] = useState(false);
      const dataLoadedRef = useRef(false);
      const skipSaveRef = useRef(false);
      const initialLoadDoneRef = useRef(false);

      // 1. מלאי טרי — מפתח: 'מוצר|כשרות'
      const [stock, setStock] = useState({
        'עוף שלם|לנדא': 50, 'כרעיים|לנדא': 45,
        'שניצל|קהילות': 5, 'בשר טחון|קהילות': 8
      });
      const [frozenProductsList, setFrozenProductsList] = useState(() => [
        ...FROZEN_PRODUCTS.flatMap((name, i) =>
          FROZEN_KASHRUT.map((kashrut, j) => ({ id: `${i + 1}_${j + 1}`, name, sku: '', storageTypes: ['frozen'], kashrut }))
        ),
        ...NEW_PRODUCTS_TEMPLATE.flatMap((p, i) =>
          p.category === 'דגים'
            ? [{ id: `new_${i + 1}_1`, name: p.name, sku: '', storageTypes: p.storageTypes, kashrut: 'כללי', category: 'דגים' }]
            : FROZEN_KASHRUT.map((kashrut, j) => ({ id: `new_${i + 1}_${j + 1}`, name: p.name, sku: '', storageTypes: p.storageTypes, kashrut }))
        ),
      ]);
      const [frozenStock, setFrozenStock] = useState(initFrozenStock);

      // 2. הזמנות לקוחות
      const [orders, setOrders] = useState([
        {
          id: 1044, createdAt: new Date().toLocaleDateString('he-IL'), customer: 'משפחת ישראלי', phone: '050-1234567', type: 'delivery', neighborhood: 'רמות',
          items: [
            { name: 'עוף שלם', cleanName: 'עוף שלם', qty: 10, checks: ['להוריד עור'], kashrut: 'לנדא' },
            { name: 'עוף מפורק (שניצל)', cleanName: 'עוף מפורק', qty: 5, checks: ['כל עוף במגש'], kashrut: 'לנדא' },
            { name: 'סלמון (מנות)', cleanName: 'סלמון', qty: 15, checks: ['6 במגש'], kashrut: 'קהילות' }
          ],
          status: 'new', courier: '', kashrut: 'לנדא',
          street: 'רחוב הרצל 12', entrance: 'ב', floor: '3', apt: '10', mobile: '052-9876543',
          flags: { mustCoordinate: true, notifyReady: true, chargeStatus: 'charge' }
        }
      ]);

      // 3. רשימות מערכת קבועות
      const [couriersList, setCouriersList] = useState([
        { id: '1', name: 'אבי (קטנוע)' }, { id: '2', name: 'יוסי (רכב)' }
      ]);

      const [kashrutList, setKashrutList] = useState([
        { id: '3', name: 'קהילות', color: '#ea580c' },
        { id: '1', name: 'לנדא',    color: '#9333ea' },
        { id: '2', name: 'בד"ץ',   color: '#059669' },
        { id: '4', name: 'רובין',   color: '#e11d48' }
      ]);

      const [neighborhoodData, setNeighborhoodData] = useState(INITIAL_NEIGHBORHOODS);
      const [contactsList, setContactsList] = useState([]);
      const [orderFormSkuMap, setOrderFormSkuMap] = useState({});
      const [logoImage, setLogoImage] = useState('');

      const [butchersList, setButchersList] = useState([
        { id: '1', name: 'משה' },
        { id: '2', name: 'דוד' },
        { id: '3', name: 'יעקב' }
      ]);

      // 4. חישוב דינמי אמיתי של חוסרים
      // נחשב את סך הדרישות בהזמנות שממתינות להכנה (סטטוס new) ונשווה למלאי הקיים
      const shortages = useMemo(() => {
        const requiredMap = {};
        
        // נסכום את הפריטים בהזמנות פתוחות
        orders
          .filter(o => o.status === 'new')
          .forEach(order => {
            order.items.forEach(item => {
              // נדלג על הערות אריזה
              if (item.qty === '-') return;
              const name = item.cleanName || item.name;
              requiredMap[name] = (requiredMap[name] || 0) + item.qty;
            });
          });

        const diff = {};
        Object.entries(requiredMap).forEach(([name, reqQty]) => {
          const availQty = stock[name] || 0;
          if (reqQty > availQty) {
            diff[name] = {
              required: reqQty,
              available: availQty,
              shortage: reqQty - availQty
            };
          }
        });

        return diff;
      }, [orders, stock]);

      const [inventoryLog, setInventoryLog] = useState([]);

      // --- Supabase: Auth ---
      useEffect(() => {
        db.auth.getSession().then(({ data: { session } }) => {
          setAuthUser(session?.user ?? null);
          setAuthLoading(false);
        });
        const { data: { subscription } } = db.auth.onAuthStateChange((_e, session) => {
          setAuthUser(session?.user ?? null);
          if (!session?.user) { dataLoadedRef.current = false; }
        });
        return () => subscription.unsubscribe();
      }, []);

      // --- Supabase: טעינת נתונים ---
      useEffect(() => {
        if (!authUser || initialLoadDoneRef.current) return;
        initialLoadDoneRef.current = true;
        const load = async () => {
          setAppLoading(true);
          try {
            skipSaveRef.current = true;

            const [ordersRes, freshRes, frozenRes, settingsRes, logRes] = await Promise.all([
              db.from('orders').select('data').order('created_at', { ascending: false }),
              db.from('fresh_stock').select('data').eq('id', 'main').maybeSingle(),
              db.from('frozen_stock').select('data').eq('id', 'main').maybeSingle(),
              db.from('settings').select('*'),
              db.from('inventory_log').select('data').order('created_at', { ascending: false })
            ]);

            if (ordersRes.data?.length) setOrders(ordersRes.data.map(r => r.data));
            if (freshRes.data) setStock(freshRes.data.data);
            if (frozenRes.data) setFrozenStock(frozenRes.data.data);
            if (settingsRes.data) {
              settingsRes.data.forEach(row => {
                if (row.id === 'kashrutList') setKashrutList(row.data);
                if (row.id === 'butchersList') setButchersList(row.data);
                if (row.id === 'couriersList') setCouriersList(row.data);
                if (row.id === 'frozenProductsList') {
                  const raw = row.data.map(p => ({ sku: '', storageTypes: ['frozen'], ...p }));
                  const needsMigration = raw.every(p => !p.kashrut);
                  let loaded = needsMigration
                    ? raw.flatMap((p, i) => FROZEN_KASHRUT.map((k, j) => ({ ...p, id: `${p.id}_${j + 1}`, kashrut: k })))
                    : raw;
                  // מיגרציה לדגים: מחיקת כפולות לפי כשרות, שמירה כ-'כללי'
                  const fishNames = new Set(NEW_PRODUCTS_TEMPLATE.filter(p => p.category === 'דגים').map(p => p.name));
                  const seenFish = new Set();
                  loaded = loaded.filter(p => {
                    if (!fishNames.has(p.name)) return true;
                    if (seenFish.has(p.name)) return false;
                    seenFish.add(p.name);
                    p.kashrut = 'כללי';
                    p.category = 'דגים';
                    return true;
                  });

                  const existingNames = new Set(loaded.map(p => p.name));
                  const missing = NEW_PRODUCTS_TEMPLATE.filter(p => !existingNames.has(p.name));
                  if (missing.length > 0) {
                    const kNames = (settingsRes.data.find(r => r.id === 'kashrutList')?.data || []).map(k => k.name);
                    const kList = kNames.length ? kNames : FROZEN_KASHRUT;
                    const base = Date.now();
                    missing.forEach((p, i) => {
                      if (p.category === 'דגים') {
                        loaded.push({ id: `np_${base + i * 100}`, name: p.name, sku: '', storageTypes: p.storageTypes, kashrut: 'כללי', category: 'דגים' });
                      } else {
                        kList.forEach((kashrut, j) => {
                          loaded.push({ id: `np_${base + i * 100 + j}`, name: p.name, sku: '', storageTypes: p.storageTypes, kashrut });
                        });
                      }
                    });
                  }
                  setFrozenProductsList(loaded);
                }
                if (row.id === 'neighborhoodData') setNeighborhoodData(row.data);
                if (row.id === 'contactsList') setContactsList(row.data);
                if (row.id === 'orderFormSkuMap') setOrderFormSkuMap(row.data);
                if (row.id === 'appSettings' && row.data?.logoImage) setLogoImage(row.data.logoImage);
              });
            }
            if (logRes.data?.length) setInventoryLog(logRes.data.map(r => r.data));

            // אין real-time — רענון ידני בלבד

          } finally {
            skipSaveRef.current = false;
            dataLoadedRef.current = true;
            setAppLoading(false);
          }
        };
        load();
      }, [authUser]);

      // --- Supabase: שמירה ---
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        orders.forEach(o => db.from('orders').upsert({ id: o.id, data: o }).then());
        // מחיקת הזמנות שנמחקו
        db.from('orders').select('id').then(({ data }) => {
          if (!data) return;
          const ids = orders.map(o => o.id);
          data.forEach(row => { if (!ids.includes(row.id)) db.from('orders').delete().eq('id', row.id).then(); });
        });
      }, [orders]);

      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('fresh_stock').upsert({ id: 'main', data: stock, updated_at: new Date().toISOString() }).then();
      }, [stock]);

      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('frozen_stock').upsert({ id: 'main', data: frozenStock, updated_at: new Date().toISOString() }).then();
      }, [frozenStock]);

      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'kashrutList', data: kashrutList }).then();
      }, [kashrutList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'butchersList', data: butchersList }).then();
      }, [butchersList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'couriersList', data: couriersList }).then();
      }, [couriersList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'frozenProductsList', data: frozenProductsList }).then();
      }, [frozenProductsList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'neighborhoodData', data: neighborhoodData }).then();
      }, [neighborhoodData]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'contactsList', data: contactsList }).then();
      }, [contactsList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'orderFormSkuMap', data: orderFormSkuMap }).then();
      }, [orderFormSkuMap]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'appSettings', data: { logoImage } }).then();
      }, [logoImage]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        inventoryLog.forEach(entry => db.from('inventory_log').upsert({ id: entry.id, data: entry }).then());
      }, [inventoryLog]);

      const handleSignOut = () => db.auth.signOut();

      const menuItems = [
        { id: 'inventory', label: 'מלאי סחורה - כללי', icon: Icons.Package },
        { id: 'beit-shemesh', label: 'מלאי בית שמש', icon: Icons.Package },
        { id: 'orders', label: 'ניהול הזמנות', icon: Icons.ShoppingCart, badge: orders.filter(o => o.status === 'new').length.toString(), badgeColor: 'bg-red-500' },
        { id: 'deliveries', label: 'מערך משלוחים', icon: Icons.Truck, badge: orders.filter(o => o.status === 'completed').length > 0 ? orders.filter(o => o.status === 'completed').length.toString() : null, badgeColor: 'bg-blue-500' },
        { id: 'contacts', label: 'אנשי קשר', icon: Icons.User, badge: contactsList.length > 0 ? contactsList.length.toString() : null, badgeColor: 'bg-blue-500' },
        { id: 'lists', label: 'ניהול רשימות', icon: Icons.List },
        { id: 'archive', label: 'ארכיון הזמנות', icon: Icons.List, badge: orders.filter(o => o.status === 'completed' || o.status === 'delivered').length > 0 ? orders.filter(o => o.status === 'completed' || o.status === 'delivered').length.toString() : null, badgeColor: 'bg-gray-400' },
        { id: 'stats', label: 'דוחות ובקרה', icon: Icons.ClipboardList },
        { id: 'dashboard', label: 'לוח בקרה', icon: Icons.Home },
        { id: 'settings', label: 'הגדרות', icon: Icons.Settings },
      ];

      const renderContent = () => {
        switch (activeTab) {
          case 'dashboard': 
            return <DashboardView orders={orders} stock={stock} shortages={shortages} setActiveTab={setActiveTab} />;
          case 'inventory':
            return <InventoryView stock={stock} setStock={setStock} frozenStock={frozenStock} setFrozenStock={setFrozenStock} kashrutList={kashrutList} frozenProductsList={frozenProductsList} />;
          case 'orders':
            return <OrdersView kashrutList={kashrutList} butchersList={butchersList} orders={orders} setOrders={setOrders} stock={stock} neighborhoodData={neighborhoodData} contactsList={contactsList} frozenProductsList={frozenProductsList} orderFormSkuMap={orderFormSkuMap} setOrderFormSkuMap={setOrderFormSkuMap} logoImage={logoImage} />;
          case 'shortages': 
            return <ShortagesView shortages={shortages} />;
          case 'deliveries':
            return <DeliveriesView orders={orders} setOrders={setOrders} couriersList={couriersList} kashrutList={kashrutList} butchersList={butchersList} />;
          case 'contacts':
            return <ContactsView contactsList={contactsList} setContactsList={setContactsList} />;
          case 'lists':
            return <ListsManagementView productsList={[]} setProductsList={()=>{}} couriersList={couriersList} setCouriersList={setCouriersList} kashrutList={kashrutList} setKashrutList={setKashrutList} butchersList={butchersList} setButchersList={setButchersList} frozenProductsList={frozenProductsList} setFrozenProductsList={setFrozenProductsList} neighborhoodData={neighborhoodData} setNeighborhoodData={setNeighborhoodData} orderFormSkuMap={orderFormSkuMap} setOrderFormSkuMap={setOrderFormSkuMap} />;
          case 'archive':
            return <ArchiveView orders={orders} setOrders={setOrders} kashrutList={kashrutList} />;
          case 'stats':
            return <StatsView orders={orders} stock={stock} frozenStock={frozenStock} frozenProductsList={frozenProductsList} kashrutList={kashrutList} butchersList={butchersList} couriersList={couriersList} inventoryLog={inventoryLog} setInventoryLog={setInventoryLog} />;
          case 'beit-shemesh':
            return <BeitShemeshView frozenProductsList={frozenProductsList} />;
          case 'settings':
            return <SettingsView logoImage={logoImage} setLogoImage={setLogoImage} />;
          default:
            return <DashboardView orders={orders} stock={stock} shortages={shortages} setActiveTab={setActiveTab} />;
        }
      };

      if (authLoading) return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center">
          <div className="text-center">
            <div className="text-4xl font-black text-red-600 mb-3">סופר עוף</div>
            <div className="text-gray-500 text-sm">טוען...</div>
          </div>
        </div>
      );

      if (!authUser) return <LoginScreen />;

      if (appLoading) return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center">
          <div className="text-center">
            <div className="text-4xl font-black text-red-600 mb-3">סופר עוף</div>
            <div className="text-gray-500 text-sm animate-pulse">טוען נתונים מהשרת...</div>
          </div>
        </div>
      );

      return (
        <div className="flex h-screen bg-gray-100 font-sans text-gray-800 overflow-hidden">
          {/* Mobile Header */}
          <div className="md:hidden fixed top-0 right-0 w-full bg-white border-b border-gray-200 p-4 z-50 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="bg-red-600 p-1.5 rounded-lg text-white">
                <Icons.Truck className="w-5 h-5" />
              </div>
              <span className="font-extrabold text-xl">סופר עוף</span>
            </div>
            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 bg-gray-100 rounded-lg text-gray-700">
              {isMobileMenuOpen ? <Icons.X className="w-6 h-6" /> : <Icons.Menu className="w-6 h-6" />}
            </button>
          </div>

          {/* Sidebar */}
          <aside className={`fixed md:relative top-0 right-0 z-40 h-full w-64 bg-white border-l border-gray-200 flex flex-col transition-transform duration-300 ${isMobileMenuOpen ? 'translate-x-0' : 'translate-x-full md:translate-x-0'}`}>
            <div className="p-6 hidden md:flex items-center gap-3 border-b border-gray-100">
              <div className="bg-red-600 p-2 rounded-xl text-white shadow-md">
                <Icons.Truck className="w-6 h-6" />
              </div>
              <div>
                <h1 className="font-extrabold text-2xl text-gray-900">סופר עוף</h1>
                <p className="text-xs text-gray-500 font-medium">ניהול קצביה חכמה</p>
              </div>
            </div>
            
            <div className="flex-1 overflow-y-auto p-4 space-y-1 mt-16 md:mt-0 custom-scrollbar">
              {menuItems.map(item => {
                const isActive = activeTab === item.id;
                return (
                  <button 
                    key={item.id}
                    onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }} 
                    className={`w-full flex items-center justify-between p-3 rounded-xl transition-all duration-200 group ${isActive ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}
                  >
                    <div className="flex items-center gap-3">
                      <item.icon className={`w-5 h-5 ${isActive ? 'text-blue-600' : 'text-gray-400 group-hover:text-gray-600'}`} />
                      <span className={`font-medium ${isActive ? 'font-bold' : ''}`}>{item.label}</span>
                    </div>
                    {item.badge && (
                      <span className={`flex items-center justify-center min-w-[20px] h-[20px] px-1 text-[10px] font-bold text-white rounded-full ${item.badgeColor}`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
            
            <div className="p-4 border-t border-gray-100 bg-gray-50/50 space-y-2">
              <div className="text-xs text-gray-400 text-center truncate">{authUser?.email}</div>
              <button onClick={handleSignOut}
                className="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-sm font-bold text-gray-500 hover:bg-red-50 hover:text-red-600 transition-colors border border-gray-200">
                <Icons.LogOut className="w-4 h-4" /> יציאה
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col h-screen overflow-hidden bg-gray-50/30 w-full pt-16 md:pt-0">
            <div className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
              <div className="max-w-5xl mx-auto">
                {renderContent()}
              </div>
            </div>
          </main>

          {isMobileMenuOpen && (
            <div className="fixed inset-0 bg-black/20 z-30 md:hidden" onClick={() => setIsMobileMenuOpen(false)}></div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
