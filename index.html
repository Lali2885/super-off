                {logoImage && (
                  <button onClick={() => setLogoImage('')}
                    className="px-5 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors text-sm">
                    הסר לוגו
                  </button>
                )}
              </div>
              <p className="text-xs text-gray-400">מומלץ: תמונה מרובעת, PNG עם רקע שקוף</p>
            </div>
          </div>
        </div>
      );
    };

    // ===[BEIT-SHEMESH]===
    const BeitShemeshView = ({ frozenProductsList = [], companyVat = '', scrollToTop = () => {}, kashrutList = [] }) => {
      const today = new Date().toISOString().split('T')[0];
      const getKashrutColor = (name) => (kashrutList || []).find(k => k.name === name)?.color || '#6366f1';
      const [bsTab, setBsTab] = useState('exits');
      const [shipments, setShipments] = useState([]);
      const [withdrawals, setWithdrawals] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);

      // Exit form state
      const [showExitForm, setShowExitForm] = useState(false);
      const [editingShipmentId, setEditingShipmentId] = useState(null);
      const [exitDate, setExitDate] = useState(today);
      const [exitPallets, setExitPallets] = useState([{ id: Date.now(), number: '', products: [] }]);
      const [exitProductForm, setExitProductForm] = useState({ sku: '', name: '', kashrut: '', cartons: '', expiryDate: '', dateType: '', weight: '' });
      const [editingExitProduct, setEditingExitProduct] = useState(null);
      const exitSkuRef = useRef(null);
      const [showExitNameDropdown, setShowExitNameDropdown] = useState(false);
      const [reportDate, setReportDate] = useState(today);
      const [showAllExits, setShowAllExits] = useState(true);

      // Withdrawal form state
      const [showWdForm, setShowWdForm] = useState(false);
      const [wdDate, setWdDate] = useState(today);
      const [wdProducts, setWdProducts] = useState([]);
      const [wdForm, setWdForm] = useState({ sku: '', name: '', kashrut: '', cartons: '' });
      const [wdReportDate, setWdReportDate] = useState(today);
      const [showAllWithdrawals, setShowAllWithdrawals] = useState(false);

      const loadData = useCallback(async (silent = false) => {
        if (!silent) setLoading(true);
        const [exRes, wdRes] = await Promise.all([
          db.from('beit_shemesh_shipments').select('*').order('date', { ascending: false }),
          db.from('beit_shemesh_withdrawals').select('*').order('date', { ascending: false })
        ]);
        if (!exRes.error && exRes.data) setShipments(exRes.data);
        if (!wdRes.error && wdRes.data) setWithdrawals(wdRes.data);
        setLoading(false);
      }, []);

      useEffect(() => {
        loadData();
        const onFocus = () => loadData(true);
        window.addEventListener('focus', onFocus);
        return () => window.removeEventListener('focus', onFocus);
      }, []);

      const skuLookup = (sku, setForm) => {
        setForm(p => ({ ...p, sku, name: '', kashrut: '' }));
        if (sku.length >= 1) {
          const found = frozenProductsList.find(p => p.sku && p.sku.toString() === sku.toString());
          if (found) setForm(p => ({ ...p, sku, name: found.name, kashrut: found.kashrut || '' }));
        }
      };

      // ── Exit functions ──
      const addExitPallet = () => setExitPallets(prev => [...prev, { id: Date.now(), number: '', products: [] }]);
      const removeExitPallet = (id) => setExitPallets(prev => prev.filter(p => p.id !== id));
      const updateExitPalletNum = (id, number) => setExitPallets(prev => prev.map(p => p.id === id ? { ...p, number } : p));

      const addProductToExitPallet = (palletId) => {
        if (!exitProductForm.name || !exitProductForm.cartons) return;
        if (editingExitProduct) {
          setExitPallets(prev => prev.map(p => p.id === editingExitProduct.palletId
            ? { ...p, products: p.products.map(pr => pr.id === editingExitProduct.productId ? { ...exitProductForm, id: pr.id } : pr) }
            : p));
          setEditingExitProduct(null);
        } else {
          const pallet = exitPallets.find(p => p.id === palletId);
          const total = pallet.products.reduce((s,p) => s + Number(p.cartons||0), 0);
          if (total + Number(exitProductForm.cartons) > 50) { alert('לא ניתן להוסיף - משטח מוגבל ל-50 קרטון (כרגע: ' + total + ' קרטונים)'); return; }
          setExitPallets(prev => prev.map(p => p.id === palletId ? { ...p, products: [...p.products, { ...exitProductForm, id: Date.now() }] } : p));
        }
        setExitProductForm({ sku: '', name: '', kashrut: '', cartons: '', expiryDate: '', dateType: '', weight: '' });
        setShowExitNameDropdown(false);
        setTimeout(() => exitSkuRef.current?.focus(), 30);
      };

      const startEditExitProduct = (palletId, product) => {
        setEditingExitProduct({ palletId, productId: product.id });
        setExitProductForm({ sku: product.sku||'', name: product.name||'', kashrut: product.kashrut||'', cartons: product.cartons||'', expiryDate: product.expiryDate||'', dateType: product.dateType||'', weight: product.weight||'' });
        setShowExitNameDropdown(false);
        setTimeout(() => exitSkuRef.current?.focus(), 30);
      };

      const removeExitProduct = (palletId, productId) => {
        setExitPallets(prev => prev.map(p => p.id === palletId ? { ...p, products: p.products.filter(pr => pr.id !== productId) } : p));
      };

      const resetExitForm = () => {
        setShowExitForm(false); setEditingShipmentId(null);
        setExitDate(today); setExitPallets([{ id: Date.now(), number: '', products: [] }]);
      };

      const startEditShipment = (shipment) => {
        setEditingShipmentId(shipment.id);
        setExitDate(shipment.date);
        setExitPallets(shipment.pallets && shipment.pallets.length ? shipment.pallets : [{ id: Date.now(), number: '', products: [] }]);
        setShowExitForm(true);
        setTimeout(() => scrollToTop(), 50);
      };

      const saveExit = async () => {
        if (!exitDate) { alert('נא למלא תאריך'); return; }
        setSaving(true);
        const payload = { date: exitDate, pallet_count: exitPallets.length, pallets: exitPallets };
        if (editingShipmentId) {
          const { data, error } = await db.from('beit_shemesh_shipments').update(payload).eq('id', editingShipmentId).select();
          if (error) { alert('שגיאה בשמירה: ' + error.message); setSaving(false); return; }
          if (data) setShipments(prev => prev.map(s => s.id === editingShipmentId ? data[0] : s));
        } else {
          const newItem = { id: Date.now(), ...payload };
          const { data, error } = await db.from('beit_shemesh_shipments').insert([newItem]).select();
          if (error) { alert('שגיאה בשמירה: ' + error.message); setSaving(false); return; }
          if (data) setShipments(prev => [data[0], ...prev].sort((a,b) => b.date.localeCompare(a.date)));
        }
        resetExitForm(); setSaving(false);
      };

      const deleteExit = async (id) => {
        if (!window.confirm('למחוק יציאה זו?')) return;
        const { error } = await db.from('beit_shemesh_shipments').delete().eq('id', id);
        if (!error) setShipments(prev => prev.filter(s => s.id !== id));
      };

      // ── Withdrawal functions ──
      const addWdProduct = () => {
        if (!wdForm.name || !wdForm.cartons) return;
        setWdProducts(prev => [...prev, { ...wdForm, id: Date.now() }]);
        setWdForm({ sku: '', name: '', kashrut: '', cartons: '' });
      };

      const removeWdProduct = (id) => setWdProducts(prev => prev.filter(p => p.id !== id));

      const saveWithdrawal = async () => {
        if (!wdDate || wdProducts.length === 0) { alert('נא למלא תאריך ולהוסיף לפחות מוצר אחד'); return; }
        setSaving(true);
        const newItem = { id: Date.now(), date: wdDate, products: wdProducts };
        const { data, error } = await db.from('beit_shemesh_withdrawals').insert([newItem]).select();
        if (error) { alert('שגיאה בשמירה: ' + error.message); setSaving(false); return; }
        if (data) setWithdrawals(prev => [data[0], ...prev].sort((a,b) => b.date.localeCompare(a.date)));
        setWdDate(today); setWdProducts([]); setShowWdForm(false); setSaving(false);
      };

      const deleteWithdrawal = async (id) => {
        if (!window.confirm('למחוק משיכה זו?')) return;
        const { error } = await db.from('beit_shemesh_withdrawals').delete().eq('id', id);
        if (!error) setWithdrawals(prev => prev.filter(w => w.id !== id));
      };

      // ── Report data ──
      const reportShipments = showAllExits ? shipments : shipments.filter(s => s.date === reportDate);
      const allProducts = reportShipments.flatMap(s => s.pallets.flatMap(p => p.products));
      const totalCartons = allProducts.reduce((sum, p) => sum + Number(p.cartons || 0), 0);
      const totalWeight = allProducts.reduce((sum, p) => sum + Number(p.weight || 0), 0);
      const totalPallets = reportShipments.reduce((sum, s) => sum + s.pallets.length, 0);

      const wdReportItems = showAllWithdrawals ? withdrawals : withdrawals.filter(w => w.date === wdReportDate);
      const wdTotalCartons = wdReportItems.flatMap(w => w.products).reduce((sum,p) => sum + Number(p.cartons||0), 0);

      // ── Inventory calc ──
      const inventoryMap = useMemo(() => {
        const map = {};
        shipments.forEach(s => s.pallets.forEach(p => p.products.forEach(pr => {
          const key = (pr.sku || pr.name) + '|' + (pr.kashrut || '');
          if (!map[key]) map[key] = { sku: pr.sku||'', name: pr.name||'', kashrut: pr.kashrut||'', totalIn: 0, totalOut: 0 };
          map[key].totalIn += Number(pr.cartons||0);
        })));
        withdrawals.forEach(w => w.products.forEach(pr => {
          const key = (pr.sku || pr.name) + '|' + (pr.kashrut || '');
          if (!map[key]) map[key] = { sku: pr.sku||'', name: pr.name||'', kashrut: pr.kashrut||'', totalIn: 0, totalOut: 0 };
          map[key].totalOut += Number(pr.cartons||0);
        }));
        return Object.values(map).sort((a,b) => (b.totalIn-b.totalOut) - (a.totalIn-a.totalOut));
      }, [shipments, withdrawals]);

      const fmtDate = d => d ? d.split('-').reverse().join('/') : '';

      const exportShipmentPDF = (shipment, pallet) => {
        if (!pallet) pallet = shipment.pallets[0] || { number: '', products: [] };
        const { jsPDF } = window.jspdf;
        const container = document.createElement('div');
        container.style.cssText = 'position:fixed;top:-9999px;right:-9999px;width:794px;background:white;padding:24px 32px;font-family:Arial,sans-serif;direction:rtl;';
        const pC = pallet.products.reduce((s,p)=>s+Number(p.cartons||0),0);
        const pW = pallet.products.reduce((s,p)=>s+Number(p.weight||0),0);
        let html = `
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
            <div style="text-align:right;">
              ${pallet.number ? `<div style="font-size:40px;font-weight:bold;color:#000;line-height:1.1;">משטח מספר: ${pallet.number}</div>` : ''}
            </div>
            <div style="text-align:left;font-size:13px;color:#555;">
              ${companyVat ? `<div style="font-weight:bold;margin-bottom:4px;">ח.פ. ${companyVat}</div>` : ''}
              <div>תאריך: ${fmtDate(shipment.date)}</div>
            </div>
          </div>
          <h2 style="text-align:center;margin-bottom:14px;font-size:18px;font-weight:bold;">תעודת יציאה - קירור לירוי</h2>
          <div style="margin-bottom:18px;border:1px solid #ddd;border-radius:8px;overflow:hidden;">
          <table style="width:100%;border-collapse:collapse;font-size:12px;">
            <thead><tr style="background:#f3f4f6;">
              <th style="padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;">מקט</th>
              <th style="padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;">מוצר</th>
              <th style="padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;">קרטונים</th>
              <th style="padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;">משקל</th>
              <th style="padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;">תאריך אחרון לשימוש</th>
              <th style="padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;">כשרות</th>
            </tr></thead><tbody>`;
        pallet.products.forEach(p => {
          html += `<tr style="border-bottom:1px solid #f3f4f6;">
            <td style="padding:5px 10px;color:#6b7280;">${p.sku||''}</td>
            <td style="padding:5px 10px;">${p.name||''}</td>
            <td style="padding:5px 10px;font-weight:bold;">${p.cartons||''}</td>
            <td style="padding:5px 10px;">${p.weight ? p.weight+' ק"ג' : '-'}</td>
            <td style="padding:5px 10px;">${p.expiryDate ? fmtDate(p.expiryDate) : '-'}${p.dateType ? ' ('+p.dateType+')' : ''}</td>
            <td style="padding:5px 10px;color:#6b7280;">${p.kashrut||'-'}</td>
          </tr>`;
        });
        html += `</tbody><tfoot><tr style="background:#eff6ff;font-weight:bold;">
          <td colspan="2" style="padding:6px 10px;">סה"כ במשטח</td>
          <td style="padding:6px 10px;">${pC} קרטונים</td>
          <td style="padding:6px 10px;">${pW.toFixed(2)} ק"ג</td>
          <td colspan="2"></td>
        </tr></tfoot></table></div>`;
        container.innerHTML = html;
        document.body.appendChild(container);
        window.html2canvas(container, { scale: 2, useCORS: true }).then(canvas => {
          document.body.removeChild(container);
          const imgData = canvas.toDataURL('image/png');
          const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
          const pageW = doc.internal.pageSize.getWidth();
          const pageH = doc.internal.pageSize.getHeight();
          const topMargin = 45, bottomMargin = 50;
          const contentH = pageH - topMargin - bottomMargin;
          const imgW = pageW;
          const imgH = (canvas.height * imgW) / canvas.width;
          let posY = 0;
          while (posY < imgH) {
            doc.addImage(imgData, 'PNG', 0, topMargin - posY, imgW, imgH);
            posY += contentH;
            if (posY < imgH) doc.addPage();
          }
          doc.save(`תעודת-יציאה-${shipment.date}${pallet.number ? '-משטח'+pallet.number : ''}.pdf`);
        });
      };

      const exportPalletLabel = (shipment, pallet) => {
        if (!pallet) pallet = shipment.pallets[0] || { number: '', products: [] };
        const { jsPDF } = window.jspdf;
        const labelContainer = document.createElement('div');
        labelContainer.style.cssText = 'position:fixed;top:-9999px;right:-9999px;width:794px;background:white;padding:40px 50px;font-family:Arial,sans-serif;direction:rtl;';
        let labelHtml = `<div style="border:4px solid #000;border-radius:16px;padding:40px;">`;
        if (pallet.number) {
          labelHtml += `<div style="font-size:72px;font-weight:bold;text-align:center;margin-bottom:28px;line-height:1.1;border-bottom:3px solid #000;padding-bottom:24px;">משטח מספר ${pallet.number}</div>`;
        }
        pallet.products.forEach(p => {
          labelHtml += `<div style="display:flex;font-size:36px;font-weight:bold;padding:16px 0;border-bottom:1px solid #e5e7eb;align-items:baseline;gap:24px;">
            <span style="white-space:nowrap;">${p.sku||''}</span>
            <span style="flex:1;">${p.name||''}</span>
          </div>`;
        });
        labelHtml += `</div>`;
        // דף מספר משטח בלבד
        const numberContainer = document.createElement('div');
        numberContainer.style.cssText = 'position:fixed;top:-9999px;right:-9999px;width:794px;height:1123px;background:white;font-family:Arial,sans-serif;direction:rtl;display:flex;flex-direction:column;align-items:center;justify-content:center;';
        numberContainer.innerHTML = `<svg width="794" height="1123" xmlns="http://www.w3.org/2000/svg">
          <text x="397" y="620" text-anchor="middle" dominant-baseline="middle"
            font-size="900" font-weight="bold" font-family="Arial"
            textLength="740" lengthAdjust="spacingAndGlyphs">${pallet.number||''}</text>
        </svg>`;

        labelContainer.innerHTML = labelHtml;
        document.body.appendChild(labelContainer);
        window.html2canvas(labelContainer, { scale: 2, useCORS: true }).then(canvas1 => {
          document.body.removeChild(labelContainer);
          document.body.appendChild(numberContainer);
          window.html2canvas(numberContainer, { scale: 2, useCORS: true }).then(canvas2 => {
            document.body.removeChild(numberContainer);
            const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
            const pageW = doc.internal.pageSize.getWidth();
            const pageH = doc.internal.pageSize.getHeight();
            const imgW = pageW;
            const imgH1 = (canvas1.height * imgW) / canvas1.width;
            doc.addImage(canvas1.toDataURL('image/png'), 'PNG', 0, 10, imgW, imgH1);
            doc.addPage();
            doc.addImage(canvas2.toDataURL('image/png'), 'PNG', 0, 0, pageW, pageH);
            doc.save(`תווית-משטח-${shipment.date}${pallet.number ? '-משטח'+pallet.number : ''}.pdf`);
          });
        });
      };

      const exportShipmentExcel = (shipment) => {
        const pallet = shipment.pallets[0] || { number: '', products: [] };
        const pC = pallet.products.reduce((s,p)=>s+Number(p.cartons||0),0);
        const pW = pallet.products.reduce((s,p)=>s+Number(p.weight||0),0);
        const rows = [
          ['תעודת יציאה - קירור לירוי'],
          [`תאריך: ${fmtDate(shipment.date)}${pallet.number ? '        משטח מספר: ' + pallet.number : ''}`],
          [],
          ['מקט','מוצר','קרטונים','משקל (ק"ג)','תאריך אחרון לשימוש','כשרות'],
        ];
        pallet.products.forEach(pr => {
          rows.push([pr.sku||'', pr.name||'', Number(pr.cartons)||0, Number(pr.weight)||0, (pr.expiryDate ? fmtDate(pr.expiryDate) : '')+(pr.dateType ? ' ('+pr.dateType+')' : ''), pr.kashrut||'']);
        });
        rows.push(['', 'סה"כ', pC, pW.toFixed(2), '', '']);
        const ws = XLSX.utils.aoa_to_sheet(rows);

              <p className="text-sm mt-1">הזמנות שיסומנו כהושלמו יופיעו כאן</p>

          ) : (
            <div className="space-y-3">
              {doneOrders.map(order => (
                <div key={order.id} className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                  {/* שורה ראשית */}
                  <div
                    className="p-4 flex items-center justify-between cursor-pointer hover:bg-gray-50 transition-colors"

    // ===[STATS]===
    // --- Stats View ---
    const StatsView = ({ orders, frozenStock, frozenProductsList, kashrutList, inventoryLog, setInventoryLog }) => {
      const [checkDate, setCheckDate] = useState(new Date().toISOString().split('T')[0]);
      const [checkNote, setCheckNote] = useState('');
      const [viewArchive, setViewArchive] = useState(null);
      const [bsBalance, setBsBalance] = useState({});

      useEffect(() => {
        Promise.all([
          db.from('beit_shemesh_shipments').select('*'),
          db.from('beit_shemesh_withdrawals').select('*')
        ]).then(([shRes, wdRes]) => {
          const map = {};
          (shRes.data || []).forEach(s => s.pallets.forEach(p => p.products.forEach(pr => {
            const key = (pr.name || '') + '|' + (pr.kashrut || '');
            map[key] = (map[key] || 0) + Number(pr.cartons || 0);
          })));
          (wdRes.data || []).forEach(w => w.products.forEach(pr => {
            const key = (pr.name || '') + '|' + (pr.kashrut || '');
            map[key] = (map[key] || 0) - Number(pr.cartons || 0);
          }));
          Object.keys(map).forEach(k => { if (map[k] < 0) map[k] = 0; });
          setBsBalance(map);
        });
      }, []);

      const allKashrutForSnap = [
        ...kashrutList,
        { name: 'כללי', color: '#3b82f6' }
      ];

      const saveInventoryCheck = () => {
        const frozenSummary = allKashrutForSnap.map(k => {
          const trays = (frozenProductsList || [])
            .filter(p => (p.kashrut || '') === k.name && p.storageTypes?.includes('frozen'))
            .reduce((sum, p) => sum + (frozenStock[`${p.name}|${k.name}`] || 0), 0);
          return { name: k.name, color: k.color, trays, cartons: Math.floor(trays / TRAYS_PER_CARTON) };
        }).filter(k => k.trays > 0);

        const snapshot = {
          id: Date.now(),
          date: checkDate,
          note: checkNote,
          savedAt: new Date().toLocaleString('he-IL'),
          frozenStock: { ...frozenStock },
          bsBalance: { ...bsBalance },
          frozenSummary
        };
        setInventoryLog(prev => [snapshot, ...prev]);
        setCheckNote('');
      };

      return (
        <div className="animate-in fade-in duration-300 space-y-8">
          <div>
            <h1 className="text-3xl font-extrabold text-gray-900">דוחות ובקרה</h1>
          </div>

          {/* בדיקת מלאי */}
          <div className="bg-white rounded-xl border border-blue-100 shadow-sm overflow-hidden">
            <div className="p-4 bg-blue-50 border-b border-blue-100 flex items-center gap-3">
              <span className="text-xl">📋</span>
              <div>
                <h2 className="font-extrabold text-blue-900">עדכון בדיקת מלאי</h2>
                <p className="text-xs text-blue-600">שמירת סנאפשוט של מלאי סחורה עם תאריך — יישמר בארכיון</p>
              </div>
            </div>
            <div className="p-5 flex flex-wrap gap-4 items-end">
              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1">תאריך בדיקה</label>
                <input type="date" value={checkDate} onChange={e => setCheckDate(e.target.value)}
                  className="p-2.5 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" />
              </div>
              <div className="flex-1 min-w-[200px]">
                <label className="block text-xs font-bold text-gray-500 mb-1">הערה (אופציונלי)</label>
                <input type="text" value={checkNote} onChange={e => setCheckNote(e.target.value)}
                  placeholder="למשל: בדיקה לפני שישי..."
                  className="w-full p-2.5 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" />
              </div>
              <Button variant="primary" icon={Icons.Save} onClick={saveInventoryCheck}>
                שמור בדיקת מלאי לארכיון
              </Button>
            </div>
            {inventoryLog.length > 0 && (
              <div className="px-5 pb-2 text-xs text-gray-400">
                בדיקה אחרונה: <strong className="text-gray-600">{inventoryLog[0].date}</strong> — נשמרה ב-{inventoryLog[0].savedAt}
                {inventoryLog[0].note && <span> | {inventoryLog[0].note}</span>}
              </div>
            )}
          </div>

          {/* ארכיון בדיקות מלאי */}
          {inventoryLog.length > 0 && (
            <div>
              <h2 className="text-lg font-extrabold text-gray-700 mb-3 flex items-center gap-2">🗄️ ארכיון בדיקות מלאי ({inventoryLog.length})</h2>
              <div className="space-y-3">
                {inventoryLog.map(entry => (
                  <div key={entry.id} className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div className="p-4 flex items-center justify-between">
                      <div>
                        <div className="font-extrabold text-gray-900">📅 בדיקת מלאי — {entry.date}</div>
                        <div className="text-xs text-gray-400 mt-0.5">נשמר ב-{entry.savedAt} | {entry.ordersCount} הזמנות במערכת</div>
                        {entry.note && <div className="text-xs text-blue-600 mt-0.5 font-medium">📝 {entry.note}</div>}
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => setViewArchive(viewArchive?.id === entry.id ? null : entry)}
                          className="text-xs font-bold text-blue-600 hover:text-blue-800 border border-blue-200 px-3 py-1.5 rounded-lg hover:bg-blue-50 transition-colors">
                          {viewArchive?.id === entry.id ? 'סגור' : 'הצג פירוט'}
                        </button>
                        <button
                          onClick={() => {
                            if (viewArchive?.id === entry.id) setViewArchive(null);
                            setInventoryLog(prev => prev.filter(e => e.id !== entry.id));
                            db.from('inventory_log').delete().eq('id', entry.id).then();
                          }}
                          className="text-xs font-bold text-red-500 hover:text-red-700 border border-red-200 px-3 py-1.5 rounded-lg hover:bg-red-50 transition-colors">
                          מחק
                        </button>
                      </div>
                    </div>

                    {viewArchive?.id === entry.id && (
                      <div className="border-t border-gray-100 p-4 bg-gray-50/50 space-y-4">
                        {/* סיכום לפי קטגוריה */}
                        {(() => {
                          const snap = entry.frozenStock || {};
                          const catTotals = {};
                          Object.entries(snap).forEach(([key, trays]) => {
                            if (!trays) return;
                            const [name, kashrut] = key.split('|');
                            const prod = (frozenProductsList || []).find(p => p.name === name && (p.kashrut || '') === kashrut);
                            const cat = prod?.category || getProductCategory(name);
                            if (!catTotals[cat]) catTotals[cat] = 0;
                            catTotals[cat] += trays;
                          });
                          const cats = PRODUCT_CATEGORIES.filter(c => catTotals[c]);
                          if (!cats.length) return <div className="text-sm text-gray-400">אין מלאי בסנאפשוט זה</div>;
                          return (
                            <div className="flex flex-wrap gap-3">
                              {cats.map(cat => {
                                const cs = CAT_STYLES[cat] || {};
                                const trays = catTotals[cat];
                                const cartons = Math.floor(trays / TRAYS_PER_CARTON);
                                const remainder = trays % TRAYS_PER_CARTON;
                                return (
                                  <div key={cat} className={`bg-white rounded-xl border-2 px-4 py-3 text-center min-w-[110px] ${cs.border || 'border-gray-200'}`}>
                                    <div className={`text-sm font-extrabold mb-1 ${cs.text || 'text-gray-700'}`}>{CAT_EMOJI[cat]} {cat}</div>
                                    <div className="font-black text-gray-900 text-lg">{cartons}{remainder > 0 ? <span className="text-sm font-bold text-gray-400">+{remainder}</span> : ''} קרטונים</div>
                                    <div className="text-xs text-gray-400 mt-0.5">{trays} מגשים</div>
                                  </div>
                                );
                              })}
                            </div>
                          );
                        })()}
                        {/* פירוט מוצרים לפי כשרות וקטגוריה — ישירות ממפתחות הסנאפשוט */}
                        {(() => {
                          const snap = entry.frozenStock || {};
                          const snapBs = entry.bsBalance || {};
                          // איחוד מפתחות מ-frozenStock ומ-bsBalance
                          const allKeys = new Set([
                            ...Object.keys(snap).filter(k => (snap[k] || 0) > 0),
                            ...Object.keys(snapBs).filter(k => (snapBs[k] || 0) > 0)
                          ]);
                          const items = Array.from(allKeys).map(key => {
                              const [name, kashrut] = key.split('|');
                              const trays = snap[key] || 0;
                              const prod = (frozenProductsList || []).find(p => p.name === name && (p.kashrut || '') === kashrut);
                              return { name, kashrut, sku: prod?.sku || '', category: prod?.category || getProductCategory(name), trays };
                            });
                          if (!items.length) return null;
                          // קבץ לפי כשרות
                          const byKashrut = {};
                          items.forEach(item => {
                            if (!byKashrut[item.kashrut]) byKashrut[item.kashrut] = [];
                            byKashrut[item.kashrut].push(item);
                          });
                          const kashrutOrder = [...kashrutList.map(k => k.name), 'כללי'];
                          return kashrutOrder.filter(kName => byKashrut[kName]).map(kName => {
                            const kObj = kashrutList.find(k => k.name === kName) || { name: 'כללי', color: '#3b82f6' };
                            const grouped = {};
                            byKashrut[kName].forEach(item => {
                              if (!grouped[item.category]) grouped[item.category] = [];
                              grouped[item.category].push(item);
                            });
                            const cats = PRODUCT_CATEGORIES.filter(c => grouped[c]?.length);
                            return (
                              <div key={kName} className="rounded-xl overflow-hidden border-2" style={{ borderColor: (kObj.color || '#888') + '60' }}>
                                <div className="px-4 py-2 text-white text-sm font-bold" style={{ backgroundColor: kObj.color || '#888' }}>{kName}</div>
                                {cats.map(cat => {
                                  const cs = CAT_STYLES[cat] || {};
                                  return (
                                    <div key={cat}>
                                      <div className={`px-3 py-1.5 text-xs font-extrabold flex items-center gap-1 border-b border-gray-100 ${cs.header || 'bg-gray-50'} ${cs.text || 'text-gray-600'}`}>
                                        <span>{CAT_EMOJI[cat]}</span><span>{cat}</span>
                                      </div>
                                      <table className="w-full text-right text-xs">
                                        <thead>
                                          <tr className="bg-gray-100 text-gray-500">
                                            <th className="p-2 text-right font-bold">מוצר</th>
                                            <th className="p-2 text-center font-bold">🧊 מצב נתון</th>
                                            <th className="p-2 text-center font-bold">🏭 כולל אחסנה</th>
                                          </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100 bg-white">
                                          {grouped[cat].map((item, idx) => {
                                            const cartons = Math.floor(item.trays / TRAYS_PER_CARTON);
                                            const remainder = item.trays % TRAYS_PER_CARTON;
                                            const key = `${item.name}|${item.kashrut}`;
                                            const bsCar = snapBs[key] || 0;
                                            const totalCar = cartons + bsCar;
                                            return (
                                              <tr key={item.name} style={{ backgroundColor: idx % 2 === 0 ? '#ffffff' : '#f9fafb' }}>
                                                <td className="p-2 font-bold text-gray-900">
                                                  {item.name}
                                                  {item.sku && <span className="block text-gray-400 font-normal">{item.sku}</span>}
                                                </td>
                                                <td className="p-2 text-center text-blue-700 font-black">{cartons}{remainder > 0 ? <span className="text-gray-400 font-normal">+{remainder}</span> : ''} <span className="text-gray-400 font-normal text-[10px]">קרט'</span></td>
                                                <td className="p-2 text-center font-black text-emerald-700">{totalCar} <span className="text-gray-400 font-normal text-[10px]">קרט'</span></td>
                                              </tr>
                                            );
                                          })}
                                        </tbody>
                                      </table>
                                    </div>
                                  );
                                })}
                              </div>
                            );
                          });
                        })()}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ===[AUTH]===
    // --- User Management Helpers ---
    const hashPassword = async (pw) => {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    const ALL_PAGES = [
      { id: 'inventory',    label: 'מלאי סחורה כללי' },
      { id: 'beit-shemesh', label: 'קירור לירוי' },
      { id: 'orders',       label: 'ניהול הזמנות' },
      { id: 'deliveries',   label: 'מערך משלוחים' },
      { id: 'contacts',     label: 'אנשי קשר' },
      { id: 'lists',        label: 'ניהול רשימות' },
      { id: 'archive',      label: 'ארכיון הזמנות' },
      { id: 'stats',        label: 'דוחות ובקרה' },
      { id: 'dashboard',    label: 'לוח בקרה' },
      { id: 'settings',     label: 'הגדרות' },
    ];

    const PAGE_FEATURES = {
      'inventory': [
        { id: 'inventory.entry',      label: 'כניסה למלאי' },
        { id: 'inventory.withdrawal', label: 'משיכה ממלאי' },
        { id: 'inventory.export',     label: 'ייצוא מלאי' },
        { id: 'inventory.log',        label: 'יומן פעולות' },
        { id: 'inventory.reset',      label: 'איפוס מלאי' },
      ],
    };

    // --- Users Management View ---
    const UsersManagementView = () => {
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [editingUser, setEditingUser] = useState(null);
      const [form, setForm] = useState({ username: '', password: '', is_admin: false, permissions: { pages: [], canEdit: [], hiddenFeatures: [] } });
      const [saving, setSaving] = useState(false);
      const [formError, setFormError] = useState('');

      const loadUsers = async () => {
        const { data } = await db.from('app_users').select('id,username,is_admin,active,permissions,created_at').order('created_at');
        setUsers(data || []);
        setLoading(false);
      };
      useEffect(() => { loadUsers(); }, []);

      const openAdd = () => {
        setEditingUser(null);
        setForm({ username: '', password: '', is_admin: false, permissions: { pages: [], canEdit: [], hiddenFeatures: [] } });
        setFormError('');
        setShowModal(true);
      };
      const openEdit = (user) => {
        setEditingUser(user);
        setForm({
          username: user.username, password: '', is_admin: user.is_admin,
          permissions: {
            pages: user.permissions?.pages || [],
            canEdit: user.permissions?.canEdit || [],
            hiddenFeatures: user.permissions?.hiddenFeatures || [],
          }
        });
        setFormError('');
        setShowModal(true);
      };

      const togglePage = (pageId) => {
        setForm(f => {
          const pages = f.permissions.pages.includes(pageId)
            ? f.permissions.pages.filter(p => p !== pageId)
            : [...f.permissions.pages, pageId];
          const canEdit = f.permissions.canEdit.filter(p => pages.includes(p));
          const hiddenFeatures = pages.includes(pageId)
            ? (f.permissions.hiddenFeatures || [])
            : (f.permissions.hiddenFeatures || []).filter(fid => !fid.startsWith(pageId + '.'));
          return { ...f, permissions: { pages, canEdit, hiddenFeatures } };
        });
      };
      const toggleEdit = (pageId) => {
        setForm(f => {
          if (!f.permissions.pages.includes(pageId)) return f;
          const canEdit = f.permissions.canEdit.includes(pageId)
            ? f.permissions.canEdit.filter(p => p !== pageId)
            : [...f.permissions.canEdit, pageId];
          return { ...f, permissions: { ...f.permissions, canEdit } };
        });
      };
      const toggleFeature = (featureId) => {
        setForm(f => {
          const hf = f.permissions.hiddenFeatures || [];
          const hiddenFeatures = hf.includes(featureId)
            ? hf.filter(id => id !== featureId)
            : [...hf, featureId];
          return { ...f, permissions: { ...f.permissions, hiddenFeatures } };
        });
      };
      const selectAllPages = () => {
        setForm(f => ({ ...f, permissions: { pages: ALL_PAGES.map(p => p.id), canEdit: ALL_PAGES.map(p => p.id), hiddenFeatures: f.permissions.hiddenFeatures || [] } }));
      };
      const clearAllPages = () => {
        setForm(f => ({ ...f, permissions: { pages: [], canEdit: [], hiddenFeatures: [] } }));
      };

      const handleSave = async () => {
        setSaving(true); setFormError('');
        try {
          if (editingUser) {
            const update = { username: form.username, is_admin: form.is_admin, permissions: form.permissions };
            if (form.password) update.password_hash = await hashPassword(form.password);
            const { error: err } = await db.from('app_users').update(update).eq('id', editingUser.id);
            if (err) throw err;
          } else {
            if (!form.password) { setFormError('סיסמה נדרשת'); setSaving(false); return; }
            if (!form.username.trim()) { setFormError('שם משתמש נדרש'); setSaving(false); return; }
            const hash = await hashPassword(form.password);
            const { error: err } = await db.from('app_users').insert({
              username: form.username, password_hash: hash, is_admin: form.is_admin,
              active: true, permissions: form.permissions
            });
            if (err) throw err;
          }
          await loadUsers();
          setShowModal(false);
        } catch (e) {
          setFormError(e.message || 'שגיאה בשמירה');
        }
        setSaving(false);
      };

      const toggleActive = async (user) => {
        await db.from('app_users').update({ active: !user.active }).eq('id', user.id);
        await loadUsers();
      };

      if (loading) return <div className="text-center p-12 text-gray-400">טוען משתמשים...</div>;

      return (
        <div dir="rtl">
          <div className="flex items-center justify-between mb-6">
            <h2 className="text-2xl font-extrabold text-gray-800">ניהול משתמשים</h2>
            <button onClick={openAdd} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-xl font-bold text-sm hover:bg-blue-700">
              <Icons.Plus className="w-4 h-4" /> הוסף משתמש
            </button>
          </div>
          <div className="bg-white rounded-2xl border border-gray-200 overflow-hidden">
            <table className="w-full text-sm">
              <thead>
                <tr className="bg-gray-50 border-b border-gray-200">
                  <th className="p-3 text-right font-bold text-gray-600">שם משתמש</th>
                  <th className="p-3 text-center font-bold text-gray-600">תפקיד</th>
                  <th className="p-3 text-center font-bold text-gray-600">עמודים</th>
                  <th className="p-3 text-center font-bold text-gray-600">סטטוס</th>
                  <th className="p-3 text-center font-bold text-gray-600">פעולות</th>
                </tr>
              </thead>
              <tbody>
                {users.map(user => (
                  <tr key={user.id} className={`border-b border-gray-100 ${!user.active ? 'opacity-50' : ''}`}>
                    <td className="p-3 font-bold text-gray-800">{user.username}</td>
                    <td className="p-3 text-center">
                      {user.is_admin
                        ? <span className="px-2 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-bold">מנהל</span>
                        : <span className="px-2 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-bold">משתמש</span>}
                    </td>
                    <td className="p-3 text-center text-gray-500 text-xs">
                      {user.is_admin ? 'הכל' : `${(user.permissions?.pages || []).length} / ${ALL_PAGES.length}`}
                    </td>
                    <td className="p-3 text-center">
                      {user.active
                        ? <span className="text-green-600 font-bold text-xs">פעיל</span>
                        : <span className="text-gray-400 font-bold text-xs">מושבת</span>}
                    </td>
                    <td className="p-3 text-center">
                      <div className="flex items-center justify-center gap-2">
                        <button onClick={() => openEdit(user)} className="px-3 py-1 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold hover:bg-blue-100">עריכה</button>
                        <button onClick={() => toggleActive(user)}
                          className={`px-3 py-1 rounded-lg text-xs font-bold ${user.active ? 'bg-red-50 text-red-600 hover:bg-red-100' : 'bg-green-50 text-green-600 hover:bg-green-100'}`}>
                          {user.active ? 'השבת' : 'הפעל'}
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {showModal && (
            <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" dir="rtl">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
                <div className="p-5 border-b border-gray-100 flex items-center justify-between">
                  <h3 className="text-lg font-extrabold">{editingUser ? 'עריכת משתמש' : 'הוספת משתמש'}</h3>
                  <button onClick={() => setShowModal(false)} className="text-gray-400 hover:text-gray-600"><Icons.X className="w-5 h-5" /></button>
                </div>
                <div className="p-5 space-y-4">
                  {formError && <div className="p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">{formError}</div>}
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">שם משתמש</label>
                    <input type="text" value={form.username} onChange={e => setForm(f => ({ ...f, username: e.target.value }))}
                      className="w-full p-3 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-400" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">
                      {editingUser ? 'סיסמה חדשה (השאר ריק לאי-שינוי)' : 'סיסמה'}
                    </label>
                    <input type="password" value={form.password} onChange={e => setForm(f => ({ ...f, password: e.target.value }))}
                      className="w-full p-3 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-400 text-left" dir="ltr" />
                  </div>
                  <div className="flex items-center gap-3">
                    <input type="checkbox" id="isAdminCb" checked={form.is_admin} onChange={e => setForm(f => ({ ...f, is_admin: e.target.checked }))} className="w-4 h-4 accent-purple-600" />
                    <label htmlFor="isAdminCb" className="font-bold text-sm text-gray-700">מנהל — גישה לכל העמודים</label>
                  </div>
                  {!form.is_admin && (
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-bold text-gray-500">הרשאות עמודים</span>
                        <div className="flex gap-2">
                          <button onClick={selectAllPages} className="text-xs text-blue-600 hover:underline">בחר הכל</button>
                          <span className="text-gray-300">|</span>
                          <button onClick={clearAllPages} className="text-xs text-gray-500 hover:underline">נקה הכל</button>
                        </div>
                      </div>
                      <div className="border border-gray-200 rounded-xl overflow-hidden">
                        <table className="w-full text-sm">
                          <thead>
                            <tr className="bg-gray-50">
                              <th className="p-2 text-right text-xs font-bold text-gray-500">עמוד</th>
                              <th className="p-2 text-center text-xs font-bold text-gray-500">צפייה</th>
                              <th className="p-2 text-center text-xs font-bold text-gray-500">עריכה</th>
                            </tr>
                          </thead>
                          <tbody>
                            {ALL_PAGES.map(page => (
                              <React.Fragment key={page.id}>
                                <tr className="border-t border-gray-100">
                                  <td className="p-2 text-gray-700 font-medium">{page.label}</td>
                                  <td className="p-2 text-center">
                                    <input type="checkbox" checked={form.permissions.pages.includes(page.id)} onChange={() => togglePage(page.id)} className="w-4 h-4 accent-blue-600" />
                                  </td>
                                  <td className="p-2 text-center">
                                    <input type="checkbox" checked={form.permissions.canEdit.includes(page.id)} onChange={() => toggleEdit(page.id)}
                                      disabled={!form.permissions.pages.includes(page.id)} className="w-4 h-4 accent-green-600 disabled:opacity-30" />
                                  </td>
                                </tr>
                                {PAGE_FEATURES[page.id] && form.permissions.pages.includes(page.id) && PAGE_FEATURES[page.id].map(feat => (
                                  <tr key={feat.id} className="bg-gray-50/70 border-t border-gray-100/50">
                                    <td className="p-1.5 pr-6 text-gray-400 text-xs">↳ {feat.label}</td>
                                    <td className="p-1.5 text-center" colSpan={2}>
                                      <input type="checkbox"
                                        checked={!(form.permissions.hiddenFeatures || []).includes(feat.id)}
                                        onChange={() => toggleFeature(feat.id)}
                                        className="w-3.5 h-3.5 accent-blue-500" />
                                    </td>
                                  </tr>
                                ))}
                              </React.Fragment>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </div>
                <div className="p-5 border-t border-gray-100 flex gap-3">
                  <button onClick={handleSave} disabled={saving}
                    className="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl disabled:opacity-50">
                    {saving ? 'שומר...' : 'שמור'}
                  </button>
                  <button onClick={() => setShowModal(false)} className="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl">
                    ביטול
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- Login Screen ---
    const LoginScreen = ({ onLogin }) => {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [isFirstSetup, setIsFirstSetup] = useState(false);

      useEffect(() => {
        db.from('app_users').select('id', { count: 'exact', head: true }).then(({ count }) => {
          if (count === 0) setIsFirstSetup(true);
        });
      }, []);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true); setError('');
        const hash = await hashPassword(password);
        if (isFirstSetup) {
          const allIds = ALL_PAGES.map(p => p.id);
          const { error: err } = await db.from('app_users').insert({
            username, password_hash: hash, is_admin: true, active: true,
            permissions: { pages: allIds, canEdit: allIds }
          });
          if (err) { setError('שגיאה ביצירת משתמש: ' + err.message); setLoading(false); return; }
          const user = { username, is_admin: true, permissions: { pages: allIds, canEdit: allIds } };
          localStorage.setItem('appUser', JSON.stringify(user));
          onLogin(user);
        } else {
          const { data, error: err } = await db.from('app_users').select('*').eq('username', username).eq('password_hash', hash).eq('active', true).maybeSingle();
          if (err) { setError('שגיאה: ' + err.message); setLoading(false); return; }
          if (!data) { setError('שם משתמש או סיסמה שגויים'); setLoading(false); return; }
          const user = { id: data.id, username: data.username, is_admin: data.is_admin, permissions: data.permissions };
          localStorage.setItem('appUser', JSON.stringify(user));
          onLogin(user);
        }
      };

      return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4" dir="rtl">
          <div className="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-sm overflow-hidden">
            <div className="bg-red-600 p-6 text-center">
              <div className="text-white text-4xl font-black tracking-widest">סופר עוף</div>
              <div className="text-red-200 text-sm mt-1">מערכת ניהול קצביה</div>
            </div>
            <div className="p-6">
              <h2 className="font-bold text-lg text-gray-800 mb-5 text-center">{isFirstSetup ? 'הגדרת מנהל ראשוני' : 'כניסה למערכת'}</h2>
              {isFirstSetup && <div className="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg text-blue-700 text-sm text-center">כניסה ראשונה — צור שם משתמש וסיסמה</div>}
              {error && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm font-bold text-center">{error}</div>}
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1">שם משתמש</label>
                  <input type="text" required value={username} onChange={e => setUsername(e.target.value)}
                    placeholder="שם משתמש"
                    className="w-full p-3 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-400" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1">סיסמה</label>
                  <input type="password" required value={password} onChange={e => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full p-3 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-400 text-left" dir="ltr" />
                </div>
                <button type="submit" disabled={loading}
                  className="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                  {loading ? '...אנא המתן' : (isFirstSetup ? 'צור מנהל וכנס' : 'כניסה')}
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    // ===[APP]===
    // --- Main App Component ---
    function App() {
      const [activeTab, setActiveTab] = useState(() => {
        const stored = localStorage.getItem('activeTab') || 'orders';
        try {
          const u = JSON.parse(localStorage.getItem('appUser'));
          if (!u || u.is_admin) return stored;
          const allowed = u.permissions?.pages || [];
          return allowed.includes(stored) ? stored : (allowed[0] || 'orders');
        } catch { return stored; }
      });
      const navigateTo = useCallback((tabId) => { setActiveTab(tabId); localStorage.setItem('activeTab', tabId); }, []);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [appUser, setAppUser] = useState(() => { try { return JSON.parse(localStorage.getItem('appUser')); } catch { return null; } });

      useEffect(() => {
        if (!appUser || appUser.is_admin) return;
        const allowed = appUser.permissions?.pages || [];
        if (allowed.length > 0 && !allowed.includes(activeTab)) {
          navigateTo(allowed[0]);
        }
      }, [appUser]);
      const [appLoading, setAppLoading] = useState(false);
      const dataLoadedRef = useRef(false);
      const skipSaveRef = useRef(false);
      const initialLoadDoneRef = useRef(false);
      const mainScrollRef = useRef(null);
      const scrollToTop = useCallback(() => { if (mainScrollRef.current) mainScrollRef.current.scrollTo({ top: 0, behavior: 'smooth' }); }, []);

      // 1. מלאי טרי — מפתח: 'מוצר|כשרות'
      const [stock, setStock] = useState({
        'עוף שלם|לנדא': 50, 'כרעיים|לנדא': 45,
        'שניצל|קהילות': 5, 'בשר טחון|קהילות': 8
      });
      const [frozenProductsList, setFrozenProductsList] = useState(() => [
        ...FROZEN_PRODUCTS.flatMap((name, i) =>
          FROZEN_KASHRUT.map((kashrut, j) => ({ id: `${i + 1}_${j + 1}`, name, sku: '', storageTypes: ['frozen'], kashrut }))
        ),
        ...NEW_PRODUCTS_TEMPLATE.flatMap((p, i) =>
          p.category === 'דגים'
            ? [{ id: `new_${i + 1}_1`, name: p.name, sku: '', storageTypes: p.storageTypes, kashrut: 'כללי', category: 'דגים' }]
            : FROZEN_KASHRUT.map((kashrut, j) => ({ id: `new_${i + 1}_${j + 1}`, name: p.name, sku: '', storageTypes: p.storageTypes, kashrut }))
        ),
      ]);
      const [frozenStock, setFrozenStock] = useState(initFrozenStock);

      // 2. הזמנות לקוחות
      const [orders, setOrders] = useState([
        {
          id: 1044, createdAt: new Date().toLocaleDateString('he-IL'), customer: 'משפחת ישראלי', phone: '050-1234567', type: 'delivery', neighborhood: 'רמות',
          items: [
            { name: 'עוף שלם', cleanName: 'עוף שלם', qty: 10, checks: ['להוריד עור'], kashrut: 'לנדא' },
            { name: 'עוף מפורק (שניצל)', cleanName: 'עוף מפורק', qty: 5, checks: ['כל עוף במגש'], kashrut: 'לנדא' },
            { name: 'סלמון (מנות)', cleanName: 'סלמון', qty: 15, checks: ['6 במגש'], kashrut: 'קהילות' }
          ],
          status: 'new', courier: '', kashrut: 'לנדא',
          street: 'רחוב הרצל 12', entrance: 'ב', floor: '3', apt: '10', mobile: '052-9876543',
          flags: { mustCoordinate: true, notifyReady: true, chargeStatus: 'charge' }
        }
      ]);

      // 3. רשימות מערכת קבועות
      const [couriersList, setCouriersList] = useState([
        { id: '1', name: 'אבי (קטנוע)' }, { id: '2', name: 'יוסי (רכב)' }
      ]);

      const [kashrutList, setKashrutList] = useState([
        { id: '3', name: 'קהילות', color: '#ea580c' },
        { id: '1', name: 'לנדא',    color: '#9333ea' },
        { id: '2', name: 'בד"ץ',   color: '#059669' },
        { id: '4', name: 'רובין',   color: '#e11d48' }
      ]);

      const [neighborhoodData, setNeighborhoodData] = useState(INITIAL_NEIGHBORHOODS);
      const [contactsList, setContactsList] = useState([]);
      const [orderFormSkuMap, setOrderFormSkuMap] = useState({});
      const [logoImage, setLogoImage] = useState('');
      const [companyVat, setCompanyVat] = useState('');

      const [butchersList, setButchersList] = useState([
        { id: '1', name: 'משה' },
        { id: '2', name: 'דוד' },
        { id: '3', name: 'יעקב' }
      ]);

      // 4. חישוב דינמי אמיתי של חוסרים
      // נחשב את סך הדרישות בהזמנות שממתינות להכנה (סטטוס new) ונשווה למלאי הקיים
      const shortages = useMemo(() => {
        const requiredMap = {};
        
        // נסכום את הפריטים בהזמנות פתוחות
        orders
          .filter(o => o.status === 'new')
          .forEach(order => {
            order.items.forEach(item => {
              // נדלג על הערות אריזה
              if (item.qty === '-') return;
              const name = item.cleanName || item.name;
              requiredMap[name] = (requiredMap[name] || 0) + item.qty;
            });
          });

        const diff = {};
        Object.entries(requiredMap).forEach(([name, reqQty]) => {
          const availQty = stock[name] || 0;
          if (reqQty > availQty) {
            diff[name] = {
              required: reqQty,
              available: availQty,
              shortage: reqQty - availQty
            };
          }
        });

        return diff;
      }, [orders, stock]);

      const [inventoryLog, setInventoryLog] = useState([]);

      // --- Supabase: טעינת נתונים ---
      useEffect(() => {
        if (!appUser || initialLoadDoneRef.current) return;
        initialLoadDoneRef.current = true;
        const load = async () => {
          setAppLoading(true);
          try {
            skipSaveRef.current = true;

            const [ordersRes, freshRes, frozenRes, settingsRes, logRes] = await Promise.all([
              db.from('orders').select('data').order('created_at', { ascending: false }),
              db.from('fresh_stock').select('data').eq('id', 'main').maybeSingle(),
              db.from('frozen_stock').select('data').eq('id', 'main').maybeSingle(),
              db.from('settings').select('*'),
              db.from('inventory_log').select('data').order('created_at', { ascending: false })
            ]);

            if (ordersRes.data?.length) setOrders(ordersRes.data.map(r => r.data));
            if (freshRes.data) setStock(freshRes.data.data);
            if (frozenRes.data) setFrozenStock(frozenRes.data.data);
            if (settingsRes.data) {
              settingsRes.data.forEach(row => {
                if (row.id === 'kashrutList') setKashrutList(row.data);
                if (row.id === 'butchersList') setButchersList(row.data);
                if (row.id === 'couriersList') setCouriersList(row.data);
                if (row.id === 'frozenProductsList') {
                  const raw = row.data.map(p => ({ sku: '', storageTypes: ['frozen'], ...p }));
                  const needsMigration = raw.every(p => !p.kashrut);
                  let loaded = needsMigration
                    ? raw.flatMap((p, i) => FROZEN_KASHRUT.map((k, j) => ({ ...p, id: `${p.id}_${j + 1}`, kashrut: k })))
                    : raw;
                  // מיגרציה לדגים: מחיקת כפולות לפי כשרות, שמירה כ-'כללי'
                  const fishNames = new Set(NEW_PRODUCTS_TEMPLATE.filter(p => p.category === 'דגים').map(p => p.name));
                  const seenFish = new Set();
                  loaded = loaded.filter(p => {
                    if (!fishNames.has(p.name)) return true;
                    if (seenFish.has(p.name)) return false;
                    seenFish.add(p.name);
                    p.kashrut = 'כללי';
                    p.category = 'דגים';
                    return true;
                  });

                  setFrozenProductsList(loaded);
                }
                if (row.id === 'neighborhoodData') setNeighborhoodData(row.data);
                if (row.id === 'contactsList') setContactsList(row.data);
                if (row.id === 'orderFormSkuMap') setOrderFormSkuMap(row.data);
                if (row.id === 'appSettings') {
                  if (row.data?.logoImage) setLogoImage(row.data.logoImage);
                  if (row.data?.companyVat) setCompanyVat(row.data.companyVat);
                }
              });
            }
            if (logRes.data?.length) setInventoryLog(logRes.data.map(r => r.data));

            // אין real-time — רענון ידני בלבד

          } finally {
            skipSaveRef.current = false;
            dataLoadedRef.current = true;
            setAppLoading(false);
          }
        };
        load();
      }, [appUser]);

      // --- Supabase: שמירה ---
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        orders.forEach(o => db.from('orders').upsert({ id: o.id, data: o }).then());
        // מחיקת הזמנות שנמחקו
        db.from('orders').select('id').then(({ data }) => {
          if (!data) return;
          const ids = orders.map(o => o.id);
          data.forEach(row => { if (!ids.includes(row.id)) db.from('orders').delete().eq('id', row.id).then(); });
        });
      }, [orders]);

      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('fresh_stock').upsert({ id: 'main', data: stock, updated_at: new Date().toISOString() }).then();
      }, [stock]);

      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('frozen_stock').upsert({ id: 'main', data: frozenStock, updated_at: new Date().toISOString() }).then();
      }, [frozenStock]);

      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'kashrutList', data: kashrutList }).then();
      }, [kashrutList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'butchersList', data: butchersList }).then();
      }, [butchersList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'couriersList', data: couriersList }).then();
      }, [couriersList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'frozenProductsList', data: frozenProductsList }).then();
      }, [frozenProductsList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'neighborhoodData', data: neighborhoodData }).then();
      }, [neighborhoodData]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'contactsList', data: contactsList }).then();
      }, [contactsList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'orderFormSkuMap', data: orderFormSkuMap }).then();
      }, [orderFormSkuMap]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'appSettings', data: { logoImage, companyVat } }).then();
      }, [logoImage, companyVat]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        inventoryLog.forEach(entry => db.from('inventory_log').upsert({ id: entry.id, data: entry }).then());
      }, [inventoryLog]);

      // --- Supabase Realtime ---
      useEffect(() => {
        if (!appUser) return;
        const pause = () => { skipSaveRef.current = true; setTimeout(() => { skipSaveRef.current = false; }, 300); };

        const channel = db.channel('realtime-sync')
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'frozen_stock', filter: 'id=eq.main' }, (payload) => {
            if (payload.new?.data) { pause(); setFrozenStock(payload.new.data); }
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'fresh_stock', filter: 'id=eq.main' }, (payload) => {
            if (payload.new?.data) { pause(); setStock(payload.new.data); }
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, async () => {
            const res = await db.from('orders').select('data').order('created_at', { ascending: false });
            if (res.data?.length) { pause(); setOrders(res.data.map(r => r.data)); }
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'settings' }, async (payload) => {
            if (!payload.new?.id || !payload.new?.data) return;
            pause();
            const { id, data } = payload.new;
            if (id === 'kashrutList') setKashrutList(data);
            if (id === 'frozenProductsList') setFrozenProductsList(data);
            if (id === 'couriersList') setCouriersList(data);
            if (id === 'butchersList') setButchersList(data);
            if (id === 'neighborhoodData') setNeighborhoodData(data);
            if (id === 'contactsList') setContactsList(data);
          })
          .subscribe();

        return () => { db.removeChannel(channel); };
      }, [appUser]);

      const handleSignOut = () => {
        localStorage.removeItem('appUser');
        setAppUser(null);
        dataLoadedRef.current = false;
        initialLoadDoneRef.current = false;
      };

      const menuItems = [
        { id: 'inventory', label: 'מלאי סחורה - כללי', icon: Icons.Package },
        { id: 'beit-shemesh', label: 'קירור לירוי', icon: Icons.Package },
        { id: 'orders', label: 'ניהול הזמנות', icon: Icons.ShoppingCart, badge: orders.filter(o => o.status === 'new').length.toString(), badgeColor: 'bg-red-500' },
        { id: 'deliveries', label: 'מערך משלוחים', icon: Icons.Truck, badge: orders.filter(o => o.status === 'completed').length > 0 ? orders.filter(o => o.status === 'completed').length.toString() : null, badgeColor: 'bg-blue-500' },
        { id: 'contacts', label: 'אנשי קשר', icon: Icons.User },
        { id: 'lists', label: 'ניהול רשימות', icon: Icons.List },
        { id: 'archive', label: 'ארכיון הזמנות', icon: Icons.List, badge: orders.filter(o => o.status === 'delivered').length > 0 ? orders.filter(o => o.status === 'delivered').length.toString() : null, badgeColor: 'bg-gray-400' },
        { id: 'stats', label: 'דוחות ובקרה', icon: Icons.ClipboardList },
        { id: 'settings', label: 'הגדרות', icon: Icons.Settings },
        ...(appUser?.is_admin ? [{ id: 'users', label: 'ניהול משתמשים', icon: Icons.User }] : []),
      ];
      const visibleMenuItems = appUser?.is_admin
        ? menuItems
        : menuItems.filter(item => (appUser?.permissions?.pages || []).includes(item.id));

      const renderContent = () => {
        switch (activeTab) {
          case 'inventory':
            return <InventoryView stock={stock} setStock={setStock} frozenStock={frozenStock} setFrozenStock={setFrozenStock} kashrutList={kashrutList} frozenProductsList={frozenProductsList} appUser={appUser} />;
          case 'orders':
            return <OrdersView kashrutList={kashrutList} butchersList={butchersList} orders={orders} setOrders={setOrders} stock={stock} neighborhoodData={neighborhoodData} contactsList={contactsList} frozenProductsList={frozenProductsList} orderFormSkuMap={orderFormSkuMap} setOrderFormSkuMap={setOrderFormSkuMap} logoImage={logoImage} />;
          case 'shortages': 
            return <ShortagesView shortages={shortages} />;
          case 'deliveries':
            return <DeliveriesView orders={orders} setOrders={setOrders} couriersList={couriersList} kashrutList={kashrutList} butchersList={butchersList} />;
          case 'contacts':
            return <ContactsView contactsList={contactsList} setContactsList={setContactsList} />;
          case 'lists':
            return <ListsManagementView productsList={[]} setProductsList={()=>{}} couriersList={couriersList} setCouriersList={setCouriersList} kashrutList={kashrutList} setKashrutList={setKashrutList} butchersList={butchersList} setButchersList={setButchersList} frozenProductsList={frozenProductsList} setFrozenProductsList={setFrozenProductsList} neighborhoodData={neighborhoodData} setNeighborhoodData={setNeighborhoodData} orderFormSkuMap={orderFormSkuMap} setOrderFormSkuMap={setOrderFormSkuMap} />;
          case 'archive':
            return <ArchiveView orders={orders} setOrders={setOrders} kashrutList={kashrutList} />;
          case 'stats':
            return <StatsView orders={orders} frozenStock={frozenStock} frozenProductsList={frozenProductsList} kashrutList={kashrutList} inventoryLog={inventoryLog} setInventoryLog={setInventoryLog} />;
          case 'beit-shemesh':
            return <BeitShemeshView frozenProductsList={frozenProductsList} companyVat={companyVat} scrollToTop={scrollToTop} kashrutList={kashrutList} />;
          case 'settings':
            return <SettingsView logoImage={logoImage} setLogoImage={setLogoImage} companyVat={companyVat} setCompanyVat={setCompanyVat} />;
          case 'users':
            return <UsersManagementView />;
          default:
            return <OrdersView kashrutList={kashrutList} butchersList={butchersList} orders={orders} setOrders={setOrders} stock={stock} neighborhoodData={neighborhoodData} contactsList={contactsList} frozenProductsList={frozenProductsList} orderFormSkuMap={orderFormSkuMap} setOrderFormSkuMap={setOrderFormSkuMap} logoImage={logoImage} />;
        }
      };

      if (!appUser) return <LoginScreen onLogin={user => { setAppUser(user); }} />;

      if (appLoading) return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center">
          <div className="text-center">
            <div className="text-4xl font-black text-red-600 mb-3">סופר עוף</div>
            <div className="text-gray-500 text-sm animate-pulse">טוען נתונים מהשרת...</div>
          </div>
        </div>
      );

      return (
        <div className="flex h-screen bg-gray-100 font-sans text-gray-800 overflow-hidden">
          {/* Mobile Header */}
          <div className="md:hidden fixed top-0 right-0 w-full bg-white border-b border-gray-200 p-4 z-50 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="bg-red-600 p-1.5 rounded-lg text-white">
                <Icons.Truck className="w-5 h-5" />
              </div>
              <span className="font-extrabold text-xl">סופר עוף</span>
            </div>
            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 bg-gray-100 rounded-lg text-gray-700">
              {isMobileMenuOpen ? <Icons.X className="w-6 h-6" /> : <Icons.Menu className="w-6 h-6" />}
            </button>
          </div>

          {/* Sidebar */}
          <aside className={`fixed md:relative top-0 right-0 z-40 h-full w-64 bg-white border-l border-gray-200 flex flex-col transition-transform duration-300 ${isMobileMenuOpen ? 'translate-x-0' : 'translate-x-full md:translate-x-0'}`}>
            <div className="p-6 hidden md:flex items-center gap-3 border-b border-gray-100">
              <div className="bg-red-600 p-2 rounded-xl text-white shadow-md">
                <Icons.Truck className="w-6 h-6" />
              </div>
              <div>
                <h1 className="font-extrabold text-2xl text-gray-900">סופר עוף</h1>
                <p className="text-xs text-gray-500 font-medium">ניהול קצביה חכמה</p>
              </div>
            </div>
            
            <div className="flex-1 overflow-y-auto p-4 space-y-1 mt-16 md:mt-0 custom-scrollbar">
              {visibleMenuItems.map(item => {
                const isActive = activeTab === item.id;
                return (
                  <button 
                    key={item.id}
                    onClick={() => { navigateTo(item.id); setIsMobileMenuOpen(false); }} 
                    className={`w-full flex items-center justify-between p-3 rounded-xl transition-all duration-200 group ${isActive ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}
                  >
                    <div className="flex items-center gap-3">
                      <item.icon className={`w-5 h-5 ${isActive ? 'text-blue-600' : 'text-gray-400 group-hover:text-gray-600'}`} />
                      <span className={`font-medium ${isActive ? 'font-bold' : ''}`}>{item.label}</span>
                    </div>
                    {item.badge && (
                      <span className={`flex items-center justify-center min-w-[20px] h-[20px] px-1 text-[10px] font-bold text-white rounded-full ${item.badgeColor}`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
            
            <div className="p-4 border-t border-gray-100 bg-gray-50/50 space-y-2">
              <div className="text-xs text-gray-500 text-center font-bold truncate">{appUser?.username}</div>
              {appUser?.is_admin && <div className="text-xs text-purple-400 text-center">מנהל</div>}
              <button onClick={handleSignOut}
                className="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-sm font-bold text-gray-500 hover:bg-red-50 hover:text-red-600 transition-colors border border-gray-200">
                <Icons.LogOut className="w-4 h-4" /> יציאה
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col h-screen overflow-hidden bg-gray-50/30 w-full pt-16 md:pt-0">
            <div ref={mainScrollRef} className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
              <div className="max-w-5xl mx-auto">
                {renderContent()}
              </div>
            </div>
          </main>

          {isMobileMenuOpen && (
            <div className="fixed inset-0 bg-black/20 z-30 md:hidden" onClick={() => setIsMobileMenuOpen(false)}></div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
