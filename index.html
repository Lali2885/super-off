    const NeighborhoodEditor = ({ neighborhoodData, setNeighborhoodData }) => {
      const [selectedId, setSelectedId]   = useState('');
      const [newNeighborhood, setNewNeighborhood] = useState('');
      const [newStreet, setNewStreet]     = useState('');

      const selectedN = neighborhoodData.find(n => n.id === selectedId);

      const addNeighborhood = (e) => {
        e.preventDefault();
        if (!newNeighborhood.trim()) return;
        setNeighborhoodData(prev => [...prev, { id: Date.now().toString(), name: newNeighborhood.trim(), streets: [] }]);
        setNewNeighborhood('');
      };

      const removeNeighborhood = (id) => {
        setNeighborhoodData(prev => prev.filter(n => n.id !== id));
        if (selectedId === id) setSelectedId('');
      };

      const addStreet = (e) => {
        e.preventDefault();
        if (!newStreet.trim() || !selectedId) return;
        setNeighborhoodData(prev => prev.map(n => n.id === selectedId ? { ...n, streets: [...n.streets, newStreet.trim()] } : n));
        setNewStreet('');
      };

      const removeStreet = (street) => {
        setNeighborhoodData(prev => prev.map(n => n.id === selectedId ? { ...n, streets: n.streets.filter(s => s !== street) } : n));
      };

      return (
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <div className="p-4 border-b border-gray-200 bg-gray-50">
            <h3 className="font-bold text-lg text-gray-800">שכונות ורחובות (ירושלים)</h3>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100">
            {/* עמודת שכונות */}
            <div className="p-4">
              <form onSubmit={addNeighborhood} className="flex gap-2 mb-3">
                <input type="text" value={newNeighborhood} onChange={e => setNewNeighborhood(e.target.value)}
                  placeholder="הוסף שכונה חדשה..."
                  className="flex-1 p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" />
                <Button type="submit" variant="primary" icon={Icons.Plus}>הוסף</Button>
              </form>
              <div className="space-y-1 max-h-64 overflow-y-auto custom-scrollbar">
                {neighborhoodData.map(n => (
                  <div key={n.id}
                    onClick={() => setSelectedId(n.id)}
                    className={`flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer transition-colors ${selectedId === n.id ? 'bg-blue-50 border border-blue-200' : 'hover:bg-gray-50 border border-transparent'}`}>
                    <span className="font-medium text-sm text-gray-900">{n.name}
                      <span className="text-xs text-gray-400 mr-1.5">({n.streets.length} רחובות)</span>
                    </span>
                    <button onClick={e => { e.stopPropagation(); removeNeighborhood(n.id); }}
                      className="text-gray-300 hover:text-red-500 transition-colors shrink-0">
                      <Icons.Trash2 className="w-4 h-4" />
                    </button>
                  </div>
                ))}
              </div>
            </div>

            {/* עמודת רחובות */}
            <div className="p-4">
              {!selectedN ? (
                <div className="text-center py-10 text-gray-400 text-sm">
                  <Icons.MapPin className="w-8 h-8 mx-auto mb-2 opacity-20" />
                  לחץ על שכונה לניהול רחובותיה
                </div>
              ) : (
                <>
                  <div className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                    <Icons.MapPin className="w-4 h-4 text-blue-500" /> רחובות — {selectedN.name}
                  </div>
                  <form onSubmit={addStreet} className="flex gap-2 mb-3">
                    <input type="text" value={newStreet} onChange={e => setNewStreet(e.target.value)}
                      placeholder="הוסף רחוב..."
                      className="flex-1 p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" />
                    <Button type="submit" variant="primary" icon={Icons.Plus}>הוסף</Button>
                  </form>
                  <div className="space-y-1 max-h-52 overflow-y-auto custom-scrollbar">
                    {selectedN.streets.map(street => (
                      <div key={street} className="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-gray-50 border border-transparent">
                        <span className="text-sm text-gray-800">{street}</span>
                        <button onClick={() => removeStreet(street)} className="text-gray-300 hover:text-red-500 transition-colors">
                          <Icons.Trash2 className="w-4 h-4" />
                        </button>
                      </div>
                    ))}
                    {selectedN.streets.length === 0 && (
                      <div className="text-xs text-gray-400 text-center py-4">אין רחובות — הוסף למעלה</div>
                    )}
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    };

    const ListsManagementView = ({ productsList, setProductsList, couriersList, setCouriersList, kashrutList, setKashrutList, butchersList, setButchersList, frozenProductsList, setFrozenProductsList, neighborhoodData, setNeighborhoodData }) => {
      return (
        <div className="animate-in fade-in duration-300 space-y-6">
          <div className="mb-6">
            <h1 className="text-3xl font-extrabold text-gray-900">ניהול רשימות מערכת</h1>
            <p className="text-gray-500 mt-1">עדכון שליחים, סוגי כשרות ופריטים הזמינים לקצביה</p>
          </div>

          <div className="flex flex-col gap-6">
            <NeighborhoodEditor neighborhoodData={neighborhoodData} setNeighborhoodData={setNeighborhoodData} />
            <ListEditor title="מוצרי מלאי קפוא" items={frozenProductsList} setItems={setFrozenProductsList} placeholder="הזן שם מוצר חדש..." />
            <ListEditor title="קצבים" items={butchersList} setItems={setButchersList} placeholder="הזן שם קצב חדש..." />
            <ListEditor title="סוגי כשרות פעילים" items={kashrutList} setItems={setKashrutList} placeholder="הזן סוג כשרות חדש..." showColor={true} />
            <ListEditor title="צי רכב ושליחים" items={couriersList} setItems={setCouriersList} placeholder="הזן שם שליח חדש..." />
          </div>
        </div>
      );
    };

    // --- Archive View ---
    const ArchiveView = ({ orders, setOrders, kashrutList }) => {
      const [search, setSearch] = useState('');
      const [filterKashrut, setFilterKashrut] = useState('');
      const [expandedId, setExpandedId] = useState(null);

      const doneOrders = orders
        .filter(o => o.status === 'delivered')
        .filter(o => !search || o.customer.includes(search) || String(o.id).includes(search) || o.phone?.includes(search))
        .filter(o => !filterKashrut || o.kashrut === filterKashrut)
        .sort((a, b) => b.id - a.id);

      const reopenOrder = (orderId) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: 'new', packaging: undefined } : o));
      };

      return (
        <div className="animate-in fade-in duration-300">
          <div className="mb-5">
            <h1 className="text-3xl font-extrabold text-gray-900">ארכיון הזמנות</h1>
            <p className="text-gray-500 mt-1">כל ההזמנות שהושלמו — {doneOrders.length} רשומות</p>
          </div>

          {/* סרגל סינון */}
          <div className="flex flex-wrap gap-3 mb-5">
            <input
              type="text" placeholder="🔍 חיפוש לפי שם, מספר או טלפון..."
              value={search} onChange={e => setSearch(e.target.value)}
              className="flex-1 min-w-[200px] p-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-gray-400 bg-white"
            />
            <select value={filterKashrut} onChange={e => setFilterKashrut(e.target.value)}
              className="p-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-gray-400 bg-white">
              <option value="">כל הכשרויות</option>
              {kashrutList.map(k => <option key={k.id} value={k.name}>{k.name}</option>)}
            </select>
          </div>

          {doneOrders.length === 0 ? (
            <div className="flex flex-col items-center justify-center p-16 bg-white rounded-xl border border-dashed border-gray-300 text-gray-400">
              <Icons.ClipboardList className="w-12 h-12 mb-3 opacity-20" />
              <h2 className="text-xl font-bold text-gray-500">אין הזמנות בארכיון</h2>
              <p className="text-sm mt-1">הזמנות שיסומנו כהושלמו יופיעו כאן</p>
            </div>
          ) : (
            <div className="space-y-3">
              {doneOrders.map(order => (
                <div key={order.id} className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                  {/* שורה ראשית */}
                  <div
                    className="p-4 flex items-center justify-between cursor-pointer hover:bg-gray-50 transition-colors"
                    onClick={() => setExpandedId(expandedId === order.id ? null : order.id)}
                  >
                    <div className="flex items-center gap-4 flex-1 min-w-0">
                      <div className="text-xs font-black text-gray-400 w-12 shrink-0">#{order.id}</div>
                      <div className="flex-1 min-w-0">
                        <div className="font-extrabold text-gray-900 truncate">{order.customer}</div>
                        <div className="text-xs text-gray-400 flex items-center gap-2 flex-wrap mt-0.5">
                          {order.createdAt && <span>📅 {order.createdAt}</span>}
                          <span>{order.type === 'delivery' ? '🚚 משלוח' : '🏪 איסוף'}</span>
                          {order.neighborhood && <span>📍 {order.neighborhood}</span>}
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center gap-2 shrink-0 mr-2 flex-wrap justify-end">
                      {/* כשרות */}
                      {(() => {
                        const k = kashrutList.find(k => k.name === order.kashrut);
                        return (
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded-full border"
                            style={{ color: k?.color || '#888', borderColor: (k?.color || '#888') + '60', backgroundColor: (k?.color || '#888') + '15' }}>
                            {order.kashrut}
                          </span>
                        );
                      })()}
                      {/* אריזה */}
                      {order.packaging && (
                        <div className="flex gap-1.5 text-xs font-bold text-green-700 bg-green-50 border border-green-200 rounded-lg px-2 py-0.5">
                          {order.packaging.cartons > 0 && <span>📦{order.packaging.cartons}</span>}
                          {order.packaging.bags > 0 && <span>🛍️{order.packaging.bags}</span>}
                          {order.packaging.fishBags > 0 && <span>🐟{order.packaging.fishBags}</span>}
                        </div>
                      )}
                      <Icons.ChevronDown className={`w-4 h-4 text-gray-400 transition-transform duration-200 ${expandedId === order.id ? 'rotate-180' : ''}`} />
                    </div>
                  </div>

                  {/* פירוט מורחב */}
                  {expandedId === order.id && (
                    <div className="border-t border-gray-100 p-4 bg-gray-50/50 space-y-3">
                      {/* כתובת */}
                      {order.type === 'delivery' && order.street && (
                        <p className="text-sm text-gray-600 bg-blue-50 rounded-lg p-2 border border-blue-100">
                          <Icons.MapPin className="w-3.5 h-3.5 inline ml-1 text-blue-500" />
                          {order.street}{order.entrance ? ` כניסה ${order.entrance}` : ''}{order.floor ? ` קומה ${order.floor}` : ''}{order.apt ? ` דירה ${order.apt}` : ''}
                        </p>
                      )}

                      {/* פריטים */}
                      <div className="bg-white rounded-lg border border-gray-200 overflow-hidden">
                        <ul className="divide-y divide-gray-100">
                          {order.items.map((item, idx) => (
                            <li key={idx} className="px-3 py-2 flex items-start gap-2 text-xs">
                              <span className="font-black px-1.5 py-0.5 rounded bg-gray-100 text-gray-600 border border-gray-200 min-w-[28px] text-center shrink-0">{item.qty}</span>
                              <div>
                                <span className="font-bold text-gray-800">{item.name}</span>
                                {item.notes && <div className="text-red-500">✂️ {item.notes}</div>}
                              </div>
                            </li>
                          ))}
                        </ul>
                      </div>

                      {/* כפתורים */}
                      <div className="flex gap-2 justify-end pt-1">
                        <Button variant="secondary" icon={Icons.Printer} className="text-xs" onClick={() => {}}>הדפס בון</Button>
                        <Button variant="outline" icon={Icons.Edit} className="text-xs" onClick={() => reopenOrder(order.id)}>
                          החזר לתור
                        </Button>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // --- Stats View ---
    const StatsView = ({ orders, stock, frozenStock, frozenProductsList, kashrutList, butchersList, couriersList, inventoryLog, setInventoryLog }) => {
      const [checkDate, setCheckDate] = useState(new Date().toISOString().split('T')[0]);
      const [checkNote, setCheckNote] = useState('');
      const [viewArchive, setViewArchive] = useState(null);

      // --- חישובים ---
      const totalOrders = orders.length;
      const newOrders = orders.filter(o => o.status === 'new' && !o.assignedButcher).length;
      const assignedOrders = orders.filter(o => o.status === 'new' && o.assignedButcher).length;
      const completedOrders = orders.filter(o => o.status === 'completed' || o.status === 'delivered').length;
      const deliveryOrders = orders.filter(o => o.type === 'delivery').length;
      const pickupOrders = orders.filter(o => o.type === 'pickup').length;

      const ordersByKashrut = kashrutList.map(k => ({
        ...k,
        count: orders.filter(o => o.kashrut === k.name).length
      }));

      const ordersByButcher = butchersList.map(b => ({
        ...b,
        count: orders.filter(o => o.assignedButcher === b.name).length
      }));

      const frozenTotalByKashrut = kashrutList.map(k => {
        const trays = frozenProductsList.reduce((sum, p) => sum + (frozenStock[`${p.name}|${k.name}`] || 0), 0);
        return { ...k, trays, cartons: Math.floor(trays / TRAYS_PER_CARTON), remainder: trays % TRAYS_PER_CARTON };
      });

      const freshByKashrut = kashrutList.map(k => {
        const items = ORDER_FORM_TEMPLATE
          .filter(i => i.storageType === 'fresh')
          .map(i => ({ name: i.name, qty: stock[`${i.name}|${k.name}`] || 0 }))
          .filter(i => i.qty > 0);
        const total = items.reduce((s, i) => s + i.qty, 0);
        return { ...k, items, total };
      });

      const saveInventoryCheck = () => {
        const snapshot = {
          id: Date.now(),
          date: checkDate,
          note: checkNote,
          savedAt: new Date().toLocaleString('he-IL'),
          frozenStock: { ...frozenStock },
          freshStock: { ...stock },
          ordersCount: totalOrders,
          frozenSummary: frozenTotalByKashrut.map(k => ({ name: k.name, color: k.color, trays: k.trays, cartons: k.cartons })),
          freshSummary: freshByKashrut.map(k => ({ name: k.name, color: k.color, total: k.total, items: k.items }))
        };
        setInventoryLog(prev => [snapshot, ...prev]);
        setCheckNote('');
      };

      const StatCard = ({ label, value, sub, color = '#6366f1', icon }) => (
        <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-4">
          <div className="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" style={{ backgroundColor: color + '20' }}>
            <span className="text-2xl">{icon}</span>
          </div>
          <div>
            <div className="text-2xl font-black text-gray-900">{value}</div>
            <div className="text-sm font-bold text-gray-500">{label}</div>
            {sub && <div className="text-xs text-gray-400 mt-0.5">{sub}</div>}
          </div>
        </div>
      );

      return (
        <div className="animate-in fade-in duration-300 space-y-8">
          <div>
            <h1 className="text-3xl font-extrabold text-gray-900">דוחות ובקרה</h1>
            <p className="text-gray-500 mt-1">מבט כולל על פעילות המערכת — הזמנות, מלאי, עובדים</p>
          </div>

          {/* בדיקת מלאי */}
          <div className="bg-white rounded-xl border border-blue-100 shadow-sm overflow-hidden">
            <div className="p-4 bg-blue-50 border-b border-blue-100 flex items-center gap-3">
              <span className="text-xl">📋</span>
              <div>
                <h2 className="font-extrabold text-blue-900">עדכון בדיקת מלאי</h2>
                <p className="text-xs text-blue-600">שמירת סנאפשוט של המלאי הנוכחי עם תאריך — יישמר בארכיון</p>
              </div>
            </div>
            <div className="p-5 flex flex-wrap gap-4 items-end">
              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1">תאריך בדיקה</label>
                <input type="date" value={checkDate} onChange={e => setCheckDate(e.target.value)}
                  className="p-2.5 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" />
              </div>
              <div className="flex-1 min-w-[200px]">
                <label className="block text-xs font-bold text-gray-500 mb-1">הערה (אופציונלי)</label>
                <input type="text" value={checkNote} onChange={e => setCheckNote(e.target.value)}
                  placeholder="למשל: בדיקה לפני שישי..."
                  className="w-full p-2.5 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" />
              </div>
              <Button variant="primary" icon={Icons.Save} onClick={saveInventoryCheck}>
                שמור בדיקת מלאי לארכיון

            </div>
            {inventoryLog.length > 0 && (
              <div className="px-5 pb-2 text-xs text-gray-400">
                בדיקה אחרונה: <strong className="text-gray-600">{inventoryLog[0].date}</strong> — נשמרה ב-{inventoryLog[0].savedAt}
                {inventoryLog[0].note && <span> | {inventoryLog[0].note}</span>}
              </div>
            )}
          </div>

          {/* הזמנות */}
          <div>
            <h2 className="text-lg font-extrabold text-gray-700 mb-3 flex items-center gap-2">🛒 הזמנות</h2>
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
              <StatCard label="סה״כ הזמנות" value={totalOrders} icon="📦" color="#8b5cf6" />
              <StatCard label="ממתינות לטיפול" value={newOrders} icon="🆕" color="#ef4444" />
              <StatCard label="משויכות לקצב" value={assignedOrders} icon="🔪" color="#f97316" />
              <StatCard label="הושלמו" value={completedOrders} icon="✅" color="#22c55e" />
              <StatCard label="משלוחים" value={deliveryOrders} icon="🚚" color="#3b82f6" />
              <StatCard label="איסוף עצמי" value={pickupOrders} icon="🏪" color="#6366f1" />
            </div>
          </div>

          {/* הזמנות לפי כשרות */}
          <div>
            <h2 className="text-lg font-extrabold text-gray-700 mb-3 flex items-center gap-2">✡️ הזמנות לפי כשרות</h2>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              {ordersByKashrut.map(k => (
                <div key={k.id} className="bg-white rounded-xl border shadow-sm p-4 text-center" style={{ borderColor: (k.color || '#888') + '50' }}>
                  <div className="w-3 h-3 rounded-full mx-auto mb-2" style={{ backgroundColor: k.color || '#888' }} />
                  <div className="text-2xl font-black text-gray-900">{k.count}</div>
                  <div className="text-sm font-bold mt-1" style={{ color: k.color || '#888' }}>{k.name}</div>
                </div>
              ))}
            </div>
          </div>

          {/* הזמנות לפי קצב */}
          {butchersList.length > 0 && (
            <div>
              <h2 className="text-lg font-extrabold text-gray-700 mb-3 flex items-center gap-2">🔪 עומס עבודה לפי קצב</h2>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {ordersByButcher.map(b => (
                  <StatCard key={b.id} label={b.name} value={b.count} sub="הזמנות משויכות" icon="👨‍🍳" color="#f97316" />
                ))}
              </div>
            </div>
          )}

          {/* מלאי קפוא */}
          <div>
            <h2 className="text-lg font-extrabold text-gray-700 mb-3 flex items-center gap-2">🧊 מלאי קפוא לפי כשרות</h2>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              {frozenTotalByKashrut.map(k => (
                <div key={k.id} className="bg-white rounded-xl border shadow-sm overflow-hidden" style={{ borderColor: (k.color || '#888') + '50' }}>
                  <div className="py-1.5 text-center text-white text-xs font-bold" style={{ backgroundColor: k.color || '#888' }}>{k.name}</div>
                  <div className="p-3 text-center">
                    <div className="text-xl font-black text-gray-900">{k.trays} מגשים</div>
                    <div className="text-sm font-bold mt-1" style={{ color: k.color || '#888' }}>
                      {k.cartons} קרטונים{k.remainder > 0 ? ` +${k.remainder}` : ''}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* מלאי טרי לפי כשרות */}
          <div>
            <h2 className="text-lg font-extrabold text-gray-700 mb-3 flex items-center gap-2">🥩 מלאי טרי לפי כשרות</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {freshByKashrut.map(k => (
                <div key={k.id} className="bg-white rounded-xl border shadow-sm overflow-hidden" style={{ borderColor: (k.color || '#888') + '50' }}>
                  <div className="py-2 px-3 text-white text-sm font-bold flex justify-between items-center" style={{ backgroundColor: k.color || '#888' }}>
                    <span>{k.name}</span>
                    <span className="text-xs opacity-80">סה"כ {k.total.toFixed(1)} ק"ג</span>
                  </div>
                  {k.items.length === 0 ? (
                    <div className="p-4 text-center text-gray-400 text-sm">אין מלאי</div>
                  ) : (
                    <table className="w-full text-right text-xs">
                      <tbody className="divide-y divide-gray-100">
                        {k.items.map(item => (
                          <tr key={item.name} className="hover:bg-gray-50">
                            <td className="p-2.5 font-bold text-gray-900">{item.name}</td>
                            <td className="p-2.5 text-center font-black" style={{ color: k.color || '#888' }}>{item.qty} ק"ג</td>
                            <td className="p-2.5 text-center">
                              <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${item.qty < 10 ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-700 border border-green-100'}`}>
                                {item.qty < 10 ? 'נמוך' : 'תקין'}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              ))}
            </div>
          </div>

          {/* ארכיון בדיקות מלאי */}
          {inventoryLog.length > 0 && (
            <div>
              <h2 className="text-lg font-extrabold text-gray-700 mb-3 flex items-center gap-2">🗄️ ארכיון בדיקות מלאי ({inventoryLog.length})</h2>
              <div className="space-y-3">
                {inventoryLog.map(entry => (
                  <div key={entry.id} className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div className="p-4 flex items-center justify-between">
                      <div>
                        <div className="font-extrabold text-gray-900">📅 בדיקת מלאי — {entry.date}</div>
                        <div className="text-xs text-gray-400 mt-0.5">נשמר ב-{entry.savedAt} | {entry.ordersCount} הזמנות במערכת</div>
                        {entry.note && <div className="text-xs text-blue-600 mt-0.5 font-medium">📝 {entry.note}</div>}
                      </div>
                      <button
                        onClick={() => setViewArchive(viewArchive?.id === entry.id ? null : entry)}
                        className="text-xs font-bold text-blue-600 hover:text-blue-800 border border-blue-200 px-3 py-1.5 rounded-lg hover:bg-blue-50 transition-colors">
                        {viewArchive?.id === entry.id ? 'סגור' : 'הצג פירוט'}
                      </button>
                    </div>

                    {viewArchive?.id === entry.id && (
                      <div className="border-t border-gray-100 p-4 bg-gray-50/50 space-y-4">
                        {/* סיכום קפוא בארכיון */}
                        <div>
                          <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">מלאי קפוא לפי כשרות</div>
                          <div className="flex flex-wrap gap-3">
                            {entry.frozenSummary.map(k => (
                              <div key={k.name} className="bg-white rounded-lg border px-3 py-2 text-center min-w-[90px]" style={{ borderColor: (k.color || '#888') + '50' }}>
                                <div className="text-xs font-bold mb-1" style={{ color: k.color || '#888' }}>{k.name}</div>
                                <div className="font-black text-gray-900">{k.trays} מגשים</div>
                                <div className="text-xs text-gray-500">{k.cartons} קרטונים</div>
                              </div>
                            ))}
                          </div>
                        </div>
                        {/* מלאי טרי בארכיון */}
                        {entry.freshSummary?.some(k => k.total > 0) && (
                          <div>
                            <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">מלאי טרי לפי כשרות</div>
                            <div className="flex flex-wrap gap-2">
                              {entry.freshSummary.filter(k => k.total > 0).map(k => (
                                <div key={k.name} className="bg-white rounded-lg border px-3 py-1.5 text-center min-w-[80px]" style={{ borderColor: (k.color||'#888')+'50' }}>
                                  <div className="text-xs font-bold" style={{ color: k.color||'#888' }}>{k.name}</div>
                                  <div className="font-black text-gray-900 text-sm">{k.total.toFixed(1)} ק"ג</div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- Login Screen ---
    const LoginScreen = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true); setError('');
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) { setError('אימייל או סיסמה שגויים'); setLoading(false); }
      };

      return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4" dir="rtl">
          <div className="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-sm overflow-hidden">
            <div className="bg-red-600 p-6 text-center">
              <div className="text-white text-4xl font-black tracking-widest">סופר עוף</div>
              <div className="text-red-200 text-sm mt-1">מערכת ניהול קצביה</div>
            </div>
            <div className="p-6">
              <h2 className="font-bold text-lg text-gray-800 mb-5 text-center">כניסה למערכת</h2>
              {error && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm font-bold text-center">{error}</div>}
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1">אימייל</label>
                  <input type="email" required value={email} onChange={e => setEmail(e.target.value)}
                    placeholder="your@email.com"
                    className="w-full p-3 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-400 text-left" dir="ltr" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1">סיסמה</label>
                  <input type="password" required value={password} onChange={e => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full p-3 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-400 text-left" dir="ltr" />
                </div>
                <button type="submit" disabled={loading}
                  className="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                  {loading ? '...כניסה' : 'כניסה'}
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    // --- Main App Component ---
    function App() {
      const [activeTab, setActiveTab] = useState('orders');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [authUser, setAuthUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [appLoading, setAppLoading] = useState(false);
      const dataLoadedRef = useRef(false);
      const skipSaveRef = useRef(false);
      const initialLoadDoneRef = useRef(false);

      // 1. מלאי טרי — מפתח: 'מוצר|כשרות'
      const [stock, setStock] = useState({
        'עוף שלם|לנדא': 50, 'כרעיים|לנדא': 45,
        'שניצל|קהילות': 5, 'בשר טחון|קהילות': 8
      });
      const [frozenProductsList, setFrozenProductsList] = useState(
        FROZEN_PRODUCTS.map((name, i) => ({ id: String(i + 1), name }))
      );
      const [frozenStock, setFrozenStock] = useState(initFrozenStock);

      // 2. הזמנות לקוחות
      const [orders, setOrders] = useState([
        {
          id: 1044, createdAt: new Date().toLocaleDateString('he-IL'), customer: 'משפחת ישראלי', phone: '050-1234567', type: 'delivery', neighborhood: 'רמות',
          items: [
            { name: 'עוף שלם (להוריד עור)', cleanName: 'עוף שלם', qty: 10, kashrut: 'לנדא' }, 
            { name: 'סלמון (חבילות קפוא)', cleanName: 'סלמון', qty: 15, kashrut: 'קהילות' }
          ], 
          status: 'new', courier: '', kashrut: 'לנדא',
          street: 'רחוב הרצל 12', entrance: 'ב', floor: '3', apt: '10', mobile: '052-9876543',
          flags: { mustCoordinate: true, notifyReady: true, chargeStatus: 'charge' }
        }
      ]);

      // 3. רשימות מערכת קבועות
      const [couriersList, setCouriersList] = useState([
        { id: '1', name: 'אבי (קטנוע)' }, { id: '2', name: 'יוסי (רכב)' }
      ]);

      const [kashrutList, setKashrutList] = useState([
        { id: '3', name: 'קהילות', color: '#ea580c' },
        { id: '1', name: 'לנדא',    color: '#9333ea' },
        { id: '2', name: 'בד"ץ',   color: '#059669' },
        { id: '4', name: 'רובין',   color: '#e11d48' }
      ]);

      const [neighborhoodData, setNeighborhoodData] = useState(INITIAL_NEIGHBORHOODS);

      const [butchersList, setButchersList] = useState([
        { id: '1', name: 'משה' },
        { id: '2', name: 'דוד' },
        { id: '3', name: 'יעקב' }
      ]);

      // 4. חישוב דינמי אמיתי של חוסרים
      // נחשב את סך הדרישות בהזמנות שממתינות להכנה (סטטוס new) ונשווה למלאי הקיים
      const shortages = useMemo(() => {
        const requiredMap = {};
        
        // נסכום את הפריטים בהזמנות פתוחות
        orders
          .filter(o => o.status === 'new')
          .forEach(order => {
            order.items.forEach(item => {
              // נדלג על הערות אריזה
              if (item.qty === '-') return;
              const name = item.cleanName || item.name;
              requiredMap[name] = (requiredMap[name] || 0) + item.qty;
            });
          });

        const diff = {};
        Object.entries(requiredMap).forEach(([name, reqQty]) => {
          const availQty = stock[name] || 0;
          if (reqQty > availQty) {
            diff[name] = {
              required: reqQty,
              available: availQty,
              shortage: reqQty - availQty
            };
          }
        });

        return diff;
      }, [orders, stock]);

      const [inventoryLog, setInventoryLog] = useState([]);

      // --- Supabase: Auth ---
      useEffect(() => {
        db.auth.getSession().then(({ data: { session } }) => {
          setAuthUser(session?.user ?? null);
          setAuthLoading(false);
        });
        const { data: { subscription } } = db.auth.onAuthStateChange((_e, session) => {
          setAuthUser(session?.user ?? null);
          if (!session?.user) { dataLoadedRef.current = false; }
        });
        return () => subscription.unsubscribe();
      }, []);

      // --- Supabase: טעינת נתונים ---
      useEffect(() => {
        if (!authUser || initialLoadDoneRef.current) return;
        initialLoadDoneRef.current = true;
        const load = async () => {
          setAppLoading(true);
          try {
            skipSaveRef.current = true;

            const [ordersRes, freshRes, frozenRes, settingsRes, logRes] = await Promise.all([
              db.from('orders').select('data').order('created_at', { ascending: false }),
              db.from('fresh_stock').select('data').eq('id', 'main').maybeSingle(),
              db.from('frozen_stock').select('data').eq('id', 'main').maybeSingle(),
              db.from('settings').select('*'),
              db.from('inventory_log').select('data').order('created_at', { ascending: false })
            ]);

            if (ordersRes.data?.length) setOrders(ordersRes.data.map(r => r.data));
            if (freshRes.data) setStock(freshRes.data.data);
            if (frozenRes.data) setFrozenStock(frozenRes.data.data);
            if (settingsRes.data) {
              settingsRes.data.forEach(row => {
                if (row.id === 'kashrutList') setKashrutList(row.data);
                if (row.id === 'butchersList') setButchersList(row.data);
                if (row.id === 'couriersList') setCouriersList(row.data);
                if (row.id === 'frozenProductsList') setFrozenProductsList(row.data);
                if (row.id === 'neighborhoodData') setNeighborhoodData(row.data);
              });
            }
            if (logRes.data?.length) setInventoryLog(logRes.data.map(r => r.data));

            // אין real-time — רענון ידני בלבד

          } finally {
            skipSaveRef.current = false;
            dataLoadedRef.current = true;
            setAppLoading(false);
          }
        };
        load();
      }, [authUser]);

      // --- Supabase: שמירה ---
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        orders.forEach(o => db.from('orders').upsert({ id: o.id, data: o }).then());
        // מחיקת הזמנות שנמחקו
        db.from('orders').select('id').then(({ data }) => {
          if (!data) return;
          const ids = orders.map(o => o.id);
          data.forEach(row => { if (!ids.includes(row.id)) db.from('orders').delete().eq('id', row.id).then(); });
        });
      }, [orders]);

      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('fresh_stock').upsert({ id: 'main', data: stock, updated_at: new Date().toISOString() }).then();
      }, [stock]);

      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('frozen_stock').upsert({ id: 'main', data: frozenStock, updated_at: new Date().toISOString() }).then();
      }, [frozenStock]);

      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'kashrutList', data: kashrutList }).then();
      }, [kashrutList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'butchersList', data: butchersList }).then();
      }, [butchersList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'couriersList', data: couriersList }).then();
      }, [couriersList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'frozenProductsList', data: frozenProductsList }).then();
      }, [frozenProductsList]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        db.from('settings').upsert({ id: 'neighborhoodData', data: neighborhoodData }).then();
      }, [neighborhoodData]);
      useEffect(() => {
        if (!dataLoadedRef.current || skipSaveRef.current) return;
        inventoryLog.forEach(entry => db.from('inventory_log').upsert({ id: entry.id, data: entry }).then());
      }, [inventoryLog]);

      const handleSignOut = () => db.auth.signOut();

      const menuItems = [
        { id: 'inventory', label: 'מלאי וסחורה', icon: Icons.Package },
        { id: 'orders', label: 'ניהול הזמנות', icon: Icons.ShoppingCart, badge: orders.filter(o => o.status === 'new').length.toString(), badgeColor: 'bg-red-500' },
        { id: 'deliveries', label: 'מערך משלוחים', icon: Icons.Truck, badge: orders.filter(o => o.status === 'completed').length > 0 ? orders.filter(o => o.status === 'completed').length.toString() : null, badgeColor: 'bg-blue-500' },
        { id: 'lists', label: 'ניהול רשימות', icon: Icons.List },
        { id: 'archive', label: 'ארכיון הזמנות', icon: Icons.List, badge: orders.filter(o => o.status === 'completed' || o.status === 'delivered').length > 0 ? orders.filter(o => o.status === 'completed' || o.status === 'delivered').length.toString() : null, badgeColor: 'bg-gray-400' },
        { id: 'stats', label: 'דוחות ובקרה', icon: Icons.ClipboardList },
        { id: 'dashboard', label: 'לוח בקרה', icon: Icons.Home },
      ];

      const renderContent = () => {
        switch (activeTab) {
          case 'dashboard': 
            return <DashboardView orders={orders} stock={stock} shortages={shortages} setActiveTab={setActiveTab} />;
          case 'inventory':
            return <InventoryView stock={stock} setStock={setStock} frozenStock={frozenStock} setFrozenStock={setFrozenStock} kashrutList={kashrutList} frozenProductsList={frozenProductsList} />;
          case 'orders':
            return <OrdersView kashrutList={kashrutList} butchersList={butchersList} orders={orders} setOrders={setOrders} stock={stock} neighborhoodData={neighborhoodData} />;
          case 'shortages': 
            return <ShortagesView shortages={shortages} />;
          case 'deliveries':
            return <DeliveriesView orders={orders} setOrders={setOrders} couriersList={couriersList} kashrutList={kashrutList} />;
          case 'lists':
            return <ListsManagementView productsList={[]} setProductsList={()=>{}} couriersList={couriersList} setCouriersList={setCouriersList} kashrutList={kashrutList} setKashrutList={setKashrutList} butchersList={butchersList} setButchersList={setButchersList} frozenProductsList={frozenProductsList} setFrozenProductsList={setFrozenProductsList} neighborhoodData={neighborhoodData} setNeighborhoodData={setNeighborhoodData} />;
          case 'archive':
            return <ArchiveView orders={orders} setOrders={setOrders} kashrutList={kashrutList} />;
          case 'stats':
            return <StatsView orders={orders} stock={stock} frozenStock={frozenStock} frozenProductsList={frozenProductsList} kashrutList={kashrutList} butchersList={butchersList} couriersList={couriersList} inventoryLog={inventoryLog} setInventoryLog={setInventoryLog} />;
          default:
            return <DashboardView orders={orders} stock={stock} shortages={shortages} setActiveTab={setActiveTab} />;
        }
      };

      if (authLoading) return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center">
          <div className="text-center">
            <div className="text-4xl font-black text-red-600 mb-3">סופר עוף</div>
            <div className="text-gray-500 text-sm">טוען...</div>
          </div>
        </div>
      );

      if (!authUser) return <LoginScreen />;

      if (appLoading) return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center">
          <div className="text-center">
            <div className="text-4xl font-black text-red-600 mb-3">סופר עוף</div>
            <div className="text-gray-500 text-sm animate-pulse">טוען נתונים מהשרת...</div>
          </div>
        </div>
      );

      return (
        <div className="flex h-screen bg-gray-100 font-sans text-gray-800 overflow-hidden">
          {/* Mobile Header */}
          <div className="md:hidden fixed top-0 right-0 w-full bg-white border-b border-gray-200 p-4 z-50 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="bg-red-600 p-1.5 rounded-lg text-white">
                <Icons.Truck className="w-5 h-5" />
              </div>
              <span className="font-extrabold text-xl">סופר עוף</span>
            </div>
            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 bg-gray-100 rounded-lg text-gray-700">
              {isMobileMenuOpen ? <Icons.X className="w-6 h-6" /> : <Icons.Menu className="w-6 h-6" />}
            </button>
          </div>

          {/* Sidebar */}
          <aside className={`fixed md:relative top-0 right-0 z-40 h-full w-64 bg-white border-l border-gray-200 flex flex-col transition-transform duration-300 ${isMobileMenuOpen ? 'translate-x-0' : 'translate-x-full md:translate-x-0'}`}>
            <div className="p-6 hidden md:flex items-center gap-3 border-b border-gray-100">
              <div className="bg-red-600 p-2 rounded-xl text-white shadow-md">
                <Icons.Truck className="w-6 h-6" />
              </div>
              <div>
                <h1 className="font-extrabold text-2xl text-gray-900">סופר עוף</h1>
                <p className="text-xs text-gray-500 font-medium">ניהול קצביה חכמה</p>
              </div>
            </div>
            
            <div className="flex-1 overflow-y-auto p-4 space-y-1 mt-16 md:mt-0 custom-scrollbar">
              {menuItems.map(item => {
                const isActive = activeTab === item.id;
                return (
                  <button 
                    key={item.id}
                    onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }} 
                    className={`w-full flex items-center justify-between p-3 rounded-xl transition-all duration-200 group ${isActive ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}
                  >
                    <div className="flex items-center gap-3">
                      <item.icon className={`w-5 h-5 ${isActive ? 'text-blue-600' : 'text-gray-400 group-hover:text-gray-600'}`} />
                      <span className={`font-medium ${isActive ? 'font-bold' : ''}`}>{item.label}</span>
                    </div>
                    {item.badge && (
                      <span className={`flex items-center justify-center min-w-[20px] h-[20px] px-1 text-[10px] font-bold text-white rounded-full ${item.badgeColor}`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
            
            <div className="p-4 border-t border-gray-100 bg-gray-50/50 space-y-2">
              <div className="text-xs text-gray-400 text-center truncate">{authUser?.email}</div>
              <button onClick={handleSignOut}
                className="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-sm font-bold text-gray-500 hover:bg-red-50 hover:text-red-600 transition-colors border border-gray-200">
                <Icons.LogOut className="w-4 h-4" /> יציאה
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col h-screen overflow-hidden bg-gray-50/30 w-full pt-16 md:pt-0">
            <div className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
              <div className="max-w-5xl mx-auto">
                {renderContent()}
              </div>
            </div>
          </main>

          {isMobileMenuOpen && (
            <div className="fixed inset-0 bg-black/20 z-30 md:hidden" onClick={() => setIsMobileMenuOpen(false)}></div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
