    // --- Address Autocomplete (data.gov.il) ---

    let _cityListCache = null;
    const loadCityList = async () => {
      if (_cityListCache) return _cityListCache;
      const res = await fetch('https://data.gov.il/api/3/action/datastore_search?resource_id=5c78e9fa-c2e2-4771-93ff-7f400a12f7ba&limit=3000&fields=%D7%A9%D7%9D_%D7%99%D7%A9%D7%95%D7%91');
      const data = await res.json();
      _cityListCache = [...new Set((data.result?.records || []).map(r => r['שם_ישוב']).filter(Boolean))].sort();
      return _cityListCache;
    };

    let _streetCache = {};
    const loadStreetList = async (city) => {
      if (_streetCache[city]) return _streetCache[city];
      const res = await fetch(`https://data.gov.il/api/3/action/datastore_search?resource_id=a7296d1a-f8c9-4b70-96c2-6ebb4352f8e3&q=${encodeURIComponent(city)}&limit=5000`);
      const data = await res.json();
      // מסנן לפי שם ישוב מדויק (עם trim לרווחים מיותרים) ומחלץ רחובות
      const streets = [...new Set(
        (data.result?.records || [])
          .filter(r => r['שם_ישוב']?.trim() === city)
          .map(r => r['שם_רחוב']?.trim())
          .filter(Boolean)
      )].sort();
      _streetCache[city] = streets;
      return streets;
    };

    const AddressAutocomplete = ({ value, onChange, placeholder, getSuggestions, className = '', disabled = false }) => {
      const [suggestions, setSuggestions] = useState([]);
      const [isOpen, setIsOpen] = useState(false);
      const [loading, setLoading] = useState(false);
      const timerRef = useRef(null);

      const handleInput = (val) => {
        onChange(val);
        if (val.length < 2) { setSuggestions([]); setIsOpen(false); return; }
        clearTimeout(timerRef.current);
        timerRef.current = setTimeout(async () => {
          setLoading(true);
          try {
            const results = await getSuggestions(val);
            setSuggestions(results);
            setIsOpen(results.length > 0);
          } catch { } finally { setLoading(false); }
        }, 200);
      };

      return (
        <div className="relative">
          <input type="text" value={value} disabled={disabled}
            onChange={e => handleInput(e.target.value)}
            onBlur={() => setTimeout(() => setIsOpen(false), 200)}
            placeholder={placeholder}
            className={`${className} ${disabled ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : ''}`}
          />
          {loading && <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs animate-pulse">טוען...</span>}

            <div className="absolute z-[100] w-full bg-white border border-blue-200 rounded-xl shadow-xl max-h-52 overflow-y-auto mt-1 custom-scrollbar">
              {suggestions.map(s => (
                <button key={s} type="button"
                  onMouseDown={() => { onChange(s); setSuggestions([]); setIsOpen(false); }}
                  className="w-full text-right px-3 py-2.5 text-sm hover:bg-blue-50 hover:text-blue-800 font-medium border-b border-gray-100 last:border-0 transition-colors">
                  {s}
                </button>

          )}

      const [successMsg, setSuccessMsg] = useState('');

      const handleAddStock = (e) => {
        e.preventDefault();
        if (!selectedProduct || !addWeight || isNaN(addWeight)) return;
        setStockData(prev => ({ ...prev, [selectedProduct]: (prev[selectedProduct] || 0) + parseFloat(addWeight) }));
        setSuccessMsg(`התווספו ${addWeight} ק"ג של ${selectedProduct}!`);
        setSelectedProduct('');
        setAddWeight('');
        setTimeout(() => setSuccessMsg(''), 3500);
      };

      return (
        <div className="flex flex-col gap-5">
          {/* טופס קליטה */}
          <div className={`bg-white p-5 rounded-xl shadow-sm border ${color} h-fit`}>
            <h3 className={`font-bold text-base mb-4 flex items-center gap-2 ${accentClass}`}>
              <Icons.Plus className="w-4 h-4" /> קליטת {title}
            </h3>
            {successMsg && (
              <div className="mb-3 bg-green-50 border-r-4 border-green-500 p-2.5 rounded-lg text-green-800 text-xs font-bold">✓ {successMsg}</div>
            )}
            <form onSubmit={handleAddStock} className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1">מוצר:</label>
                <select required value={selectedProduct} onChange={e => setSelectedProduct(e.target.value)}
                  className="w-full p-2 border border-gray-300 rounded-lg text-sm bg-gray-50 focus:ring-2 outline-none">
                  <option value="">-- בחר מוצר --</option>
                  {items.map(item => (
                    <option key={item.id} value={item.name}>{item.name} [{item.category}]</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1">משקל (ק"ג):</label>
                <input type="number" required min="0.5" step="0.5" placeholder="35.5"
                  value={addWeight} onChange={e => setAddWeight(e.target.value)}
                  className="w-full p-2 border border-gray-300 rounded-lg text-sm bg-gray-50 focus:ring-2 outline-none" />
              </div>
              <Button type="submit" variant="primary" icon={Icons.Save} className="w-full justify-center">הוסף למלאי</Button>
            </form>
          </div>

          {/* טבלת מלאי */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div className="p-3 border-b border-gray-100 bg-gray-50/50">
              <h3 className="font-bold text-sm text-gray-700">מצב מלאי — {title}</h3>
            </div>
            <div className="overflow-x-auto max-h-[420px] overflow-y-auto custom-scrollbar">
              <table className="w-full text-right">
                <thead className="bg-gray-50 text-gray-400 text-xs border-b border-gray-100 sticky top-0">
                  <tr>
                    <th className="p-2.5 font-bold">פריט</th>
                    <th className="p-2.5 font-bold">קטגוריה</th>
                    <th className="p-2.5 font-bold text-center">כמות</th>
                    <th className="p-2.5 font-bold text-center">מצב</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100 text-sm">
                  {items.map(item => {
                    const qty = stockData[item.name] || 0;
                    const isLow = qty < 10;
                    return (
                      <tr key={item.id} className="hover:bg-gray-50/50 transition-colors">
                        <td className="p-2.5 font-bold text-gray-900">{item.name}</td>
                        <td className="p-2.5 text-gray-400 text-xs">{item.category}</td>
                        <td className="p-2.5 font-black text-center text-blue-600">{qty} ק"ג</td>
                        <td className="p-2.5 text-center">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${isLow ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-700 border border-green-100'}`}>
                            {isLow ? 'נמוך' : 'תקין'}
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // --- Fresh Stock Panel ---
    const FreshStockPanel = ({ stock, setStock, kashrutList, frozenProductsList }) => {
      const [activeKashrut, setActiveKashrut] = useState(kashrutList[0]?.name || '');
      const [collapsedCats, setCollapsedCats] = useState(() => Object.fromEntries(PRODUCT_CATEGORIES.map(c => [c, true])));
      const seen = new Set();
      const freshItems = (frozenProductsList || [])
        .filter(p => p.storageTypes?.includes('fresh'))
        .filter(p => { if (seen.has(p.name)) return false; seen.add(p.name); return true; })
        .map(p => ({ name: p.name, category: p.category || getProductCategory(p.name) }))
        .sort((a, b) => {
          const order = { 'עוף': 0, 'הודו': 1, 'בשר': 2, 'דגים': 3, 'מתובלים': 4, 'קפואים': 5, 'טחונים': 6 };
          return (order[a.category] ?? 99) - (order[b.category] ?? 99);
        });

      const updateQty = (product, kashrut, value) => {
        const num = parseFloat(value) || 0;
        setStock(prev => ({ ...prev, [`${product}|${kashrut}`]: Math.max(0, num) }));
      };

      const getFreshSku = (name) => {
        const _fp = frozenProductsList || [];
        return _fp.find(fp => fp.name === name && fp.kashrut === activeKashrut)?.sku
            || _fp.find(fp => fp.name === name && fp.sku)?.sku
            || '';
      };

      const activeKashrutObj = kashrutList.find(k => k.name === activeKashrut) || {};
      const activeColor = activeKashrutObj.color || '#6366f1';

      const kashrutTotal = freshItems.reduce((sum, item) => sum + (stock[`${item.name}|${activeKashrut}`] || 0), 0);

      return (
        <div className="flex flex-col gap-4">
          {/* טאבי כשרות */}
          <div className="flex gap-2 flex-wrap">
            {kashrutList.map(k => {
              const isActive = k.name === activeKashrut;
              const color = k.color || '#6366f1';
              return (
                <button key={k.id} onClick={() => setActiveKashrut(k.name)}
                  style={isActive ? { backgroundColor: color, borderColor: color, color: 'white' } : { borderColor: color, color }}
                  className={`flex-1 min-w-[80px] py-2.5 rounded-xl font-bold text-sm transition-all border-2 bg-white ${isActive ? 'shadow-md' : 'hover:opacity-80'}`}>
                  {k.name}
                </button>
              );
            })}
          </div>

          {/* סיכום */}
          <div className="rounded-xl overflow-hidden border" style={{ borderColor: activeColor + '40' }}>
            <div className="py-1.5 px-3 text-center text-white text-xs font-bold" style={{ backgroundColor: activeColor }}>
              {activeKashrut} — סה"כ מלאי
            </div>
            <div className="p-3 text-center" style={{ backgroundColor: activeColor + '15' }}>
              <div className="text-2xl font-black" style={{ color: activeColor }}>{kashrutTotal.toFixed(2)} ק"ג</div>
            </div>
          </div>

          {/* טבלה לפי קטגוריות */}
          {(() => {
            const grouped = {};
            freshItems.forEach(item => {
              const cat = item.category || 'אחר';
              if (!grouped[cat]) grouped[cat] = [];
              grouped[cat].push(item);
            });
            const cats = PRODUCT_CATEGORIES.filter(c => grouped[c]?.length);
            return cats.map(cat => {
              const cs = CAT_STYLES[cat] || {};
              return (
                <div key={cat} className={`rounded-xl overflow-hidden border ${cs.header || 'border-gray-200'}`}>
                  <div onClick={() => setCollapsedCats(prev => ({ ...prev, [cat]: !prev[cat] }))}
                    className={`px-4 py-2.5 flex items-center gap-2 font-extrabold text-sm cursor-pointer select-none ${cs.header || 'bg-gray-50 border-gray-200'} ${cs.text || 'text-gray-700'} border-b`}>
                    <span>{CAT_EMOJI[cat]}</span>
                    <span>{cat}</span>
                    <span className={`mr-auto text-xs font-bold px-2 py-0.5 rounded-full border ${cs.badge || 'bg-gray-100 text-gray-500 border-gray-200'}`}>{grouped[cat].length} מוצרים</span>
                    <Icons.ChevronDown className={`w-4 h-4 transition-transform duration-200 ${collapsedCats[cat] ? '-rotate-90' : ''}`} />
                  </div>
                  {!collapsedCats[cat] && <div className="bg-white">
                    <table className="w-full text-right text-sm">
                      <thead className="text-xs text-gray-500 bg-gray-50 border-b border-gray-100">
                        <tr>
                          <th className="p-3 font-bold text-right">מוצר</th>
                          <th className="p-3 font-bold text-center">כמות (ק"ג)</th>
                          <th className="p-3 font-bold text-center">מצב</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {grouped[cat].map((item, idx) => {
                          const qty = stock[`${item.name}|${activeKashrut}`] || 0;
                          const isLow = qty < 10;
                          return (
                            <tr key={item.name} style={{ backgroundColor: idx % 2 === 0 ? '#ffffff' : '#f9fafb' }}>
                              <td className="p-2.5 font-bold text-gray-900">
                                {item.name}
                                {getFreshSku(item.name) && <span className="block text-xs text-gray-400 font-normal">{getFreshSku(item.name)}</span>}
                              </td>
                              <td className="p-1.5 text-center">
                                <input type="number" min="0" step="0.5"
                                  value={qty || ''}
                                  placeholder="0"
                                  onChange={e => updateQty(item.name, activeKashrut, e.target.value)}
                                  style={{ borderColor: activeColor + '60' }}
                                  className="w-20 p-1.5 text-center text-sm font-bold border rounded-lg bg-white focus:ring-2 outline-none"
                                />
                              </td>
                              <td className="p-2.5 text-center">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${isLow ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-700 border border-green-100'}`}>
                                  {isLow ? 'נמוך' : 'תקין'}
                                </span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>}
                </div>
              );
            });
          })()}
        </div>
      );
    };

    // ===[INVENTORY-FROZEN]===
    // --- Frozen Stock Panel ---
    const FrozenStockPanel = ({ frozenStock, setFrozenStock, kashrutList, frozenProductsList, bsBalance = {}, showEntry = true, showWithdrawal = true }) => {
      const [activeKashrut, setActiveKashrut] = useState(kashrutList[0]?.name || '');
      const [collapsedCats, setCollapsedCats] = useState(() => Object.fromEntries(PRODUCT_CATEGORIES.map(c => [c, true])));
      const [entryTrays, setEntryTrays] = useState({});
      const [withdrawTrays, setWithdrawTrays] = useState({});

      const getETrays = (key) => entryTrays[key] || 0;
      const getWTrays = (key) => withdrawTrays[key] || 0;
      const setEFromTrays = (key, val) => setEntryTrays(prev => ({ ...prev, [key]: Math.max(0, parseInt(val) || 0) }));
      const setEFromCartons = (key, val) => setEntryTrays(prev => ({ ...prev, [key]: Math.max(0, (parseInt(val) || 0) * TRAYS_PER_CARTON) }));
      const setWFromTrays = (key, val) => setWithdrawTrays(prev => ({ ...prev, [key]: Math.max(0, parseInt(val) || 0) }));
      const setWFromCartons = (key, val) => setWithdrawTrays(prev => ({ ...prev, [key]: Math.max(0, (parseInt(val) || 0) * TRAYS_PER_CARTON) }));

      const logAction = (action, key, trays) => {
        const [product, kashrut] = key.split('|');
        const entry = {
          action,
          product,
          kashrut,
          trays,
          cartons: Math.floor(trays / TRAYS_PER_CARTON),
          date: new Date().toISOString().split('T')[0],
          timestamp: new Date().toISOString()
        };
        db.from('frozen_stock_log').insert([{ data: entry }]).then();
      };

      const applyEntry = (key) => {
        const delta = entryTrays[key] || 0;
        if (!delta) return;
        setFrozenStock(prev => ({ ...prev, [key]: (prev[key] || 0) + delta }));
        setEntryTrays(prev => ({ ...prev, [key]: 0 }));
        logAction('כניסה', key, delta);
      };
      const applyWithdraw = (key) => {
        const delta = withdrawTrays[key] || 0;
        if (!delta) return;
        setFrozenStock(prev => ({ ...prev, [key]: Math.max(0, (prev[key] || 0) - delta) }));
        setWithdrawTrays(prev => ({ ...prev, [key]: 0 }));
        logAction('משיכה', key, delta);
      };

      const fishProducts = frozenProductsList.filter(p => p.kashrut === 'כללי' && p.storageTypes?.includes('frozen'));
      const activeProducts = frozenProductsList.filter(p => (p.kashrut || '') === activeKashrut && p.kashrut !== 'כללי' && p.storageTypes?.includes('frozen'));
      const kashrutTrays = activeProducts.reduce((sum, p) => sum + (frozenStock[`${p.name}|${activeKashrut}`] || 0), 0);
      const kashrutCartons = Math.floor(kashrutTrays / TRAYS_PER_CARTON);
      const kashrutRemainder = kashrutTrays % TRAYS_PER_CARTON;
      const activeKashrutObj = kashrutList.find(k => k.name === activeKashrut) || {};
      const activeColor = activeKashrutObj.color || '#6366f1';

      const renderTableHeader = (simple = false) => (
        <thead className="text-sm">
          <tr>
            <th className="p-2.5 font-bold text-right bg-gray-50" rowSpan={2} style={{ borderBottom: '2px solid #6b7280' }}>מוצר</th>
            {showEntry && <th className="p-2.5 font-bold text-center bg-green-100 text-green-800" style={{ borderRight: '2px solid #22c55e', borderBottom: '1px solid #bbf7d0' }} colSpan={simple ? 1 : 2}>כניסה למלאי</th>}
            {showWithdrawal && <th className="p-2.5 font-bold text-center bg-red-100 text-red-800" style={{ borderRight: '2px solid #ef4444', borderBottom: '1px solid #fecaca' }} colSpan={simple ? 1 : 2}>משיכה ממלאי</th>}
            <th className="p-2.5 font-bold text-center bg-blue-100 text-blue-800" style={{ borderRight: '2px solid #3b82f6', borderBottom: '1px solid #bfdbfe' }} colSpan={simple ? 1 : 2}>מצב נתון</th>
            {!simple && <th className="p-2.5 font-bold text-center bg-indigo-100 text-indigo-800" style={{ borderBottom: '1px solid #c7d2fe' }} colSpan={1}>כולל אחסנה</th>}
          </tr>
          <tr>
            {showEntry && <th className="p-2.5 font-bold text-center bg-green-50 text-green-700" style={{ borderRight: '2px solid #22c55e', borderBottom: '2px solid #6b7280' }}>מגשים</th>}
            {showEntry && !simple && <th className="p-2.5 font-bold text-center bg-green-50 text-green-700" style={{ borderRight: '1px solid #d1d5db', borderBottom: '2px solid #6b7280' }}>קרטונים</th>}
            {showWithdrawal && <th className="p-2.5 font-bold text-center bg-red-50 text-red-700" style={{ borderRight: '2px solid #ef4444', borderBottom: '2px solid #6b7280' }}>מגשים</th>}
            {showWithdrawal && !simple && <th className="p-2.5 font-bold text-center bg-red-50 text-red-700" style={{ borderRight: '1px solid #d1d5db', borderBottom: '2px solid #6b7280' }}>קרטונים</th>}
            <th className="p-2.5 font-bold text-center bg-gray-100 text-gray-400" style={{ borderRight: '2px solid #3b82f6', borderBottom: '2px solid #6b7280' }}>מגשים</th>
            {!simple && <th className="p-2.5 font-bold text-center bg-blue-50 text-blue-700" style={{ borderRight: '1px solid #d1d5db', borderBottom: '2px solid #6b7280' }}>קרטונים</th>}
            {!simple && <th className="p-2.5 font-bold text-center bg-indigo-50 text-indigo-700" style={{ borderBottom: '2px solid #6b7280' }}>קרטונים</th>}
          </tr>
        </thead>
      );

      const renderRow = (p, kashrut, idx, rowEven, rowOdd, simple = false) => {
        const key = `${p.name}|${kashrut}`;
        const trays = frozenStock[key] || 0;
        const cartons = Math.floor(trays / TRAYS_PER_CARTON);
        const remainder = trays % TRAYS_PER_CARTON;
        const eT = getETrays(key); const eC = Math.floor(eT / TRAYS_PER_CARTON); const eR = eT % TRAYS_PER_CARTON;
        const wT = getWTrays(key); const wC = Math.floor(wT / TRAYS_PER_CARTON); const wR = wT % TRAYS_PER_CARTON;
        return (
          <tr key={p.name} style={{ backgroundColor: idx % 2 === 0 ? rowEven : rowOdd }}>
            <td className="p-2.5 font-bold text-gray-900 text-sm">
              {p.name}
              {p.sku && <span className="block text-xs text-gray-400 font-normal">{p.sku}</span>}
            </td>
            {showEntry && (
              <td className="p-1 text-center bg-green-50/30 border-r-2 border-green-400">
                <input type="number" min="0" step="1" value={eT||''} placeholder="0"
                  onChange={e => setEFromTrays(key, e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && applyEntry(key)}
                  className="w-16 p-1.5 text-center text-base font-bold border border-green-200 rounded-lg bg-white focus:ring-1 focus:ring-green-400 outline-none" />
              </td>
            )}
            {showEntry && !simple && (
              <td className="p-1 text-center bg-green-50/30 border-r border-gray-300">
                <div className="flex flex-col items-center">
                  <input type="number" min="0" step="1" value={eC||''} placeholder="0"
                    onChange={e => setEFromCartons(key, e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && applyEntry(key)}
                    className="w-16 p-1.5 text-center text-base font-bold border border-green-200 text-green-700 rounded-lg bg-white focus:ring-1 focus:ring-green-400 outline-none" />
                  {eR > 0 && <div className="text-xs text-gray-900 font-bold">+{eR}</div>}
                </div>
              </td>
            )}
            {showWithdrawal && (
              <td className="p-1 text-center bg-red-50/30 border-r-2 border-red-400">
                <input type="number" min="0" step="1" value={wT||''} placeholder="0"
                  onChange={e => setWFromTrays(key, e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && applyWithdraw(key)}
                  className="w-16 p-1.5 text-center text-base font-bold border border-red-200 rounded-lg bg-white focus:ring-1 focus:ring-red-400 outline-none" />
              </td>
            )}
            {showWithdrawal && !simple && (
              <td className="p-1 text-center bg-red-50/30 border-r border-gray-300">
                <div className="flex flex-col items-center">
                  <input type="number" min="0" step="1" value={wC||''} placeholder="0"
                    onChange={e => setWFromCartons(key, e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && applyWithdraw(key)}
                    className="w-16 p-1.5 text-center text-base font-bold border border-red-200 text-red-700 rounded-lg bg-white focus:ring-1 focus:ring-red-400 outline-none" />
                  {wR > 0 && <div className="text-xs text-gray-900 font-bold">+{wR}</div>}
                </div>
              </td>
            )}
            <td className="p-2.5 text-center bg-gray-50/60 border-r-2 border-blue-400">
              <span className="font-bold text-gray-400 text-lg">{trays}</span>
            </td>
            {!simple && (
              <td className="p-2.5 text-center bg-blue-50/40 border-r border-gray-300">
                <span className="font-black text-blue-700 text-lg">{cartons}</span>
                {remainder > 0 && <div className="text-xs text-gray-900 font-bold">+{remainder}</div>}
              </td>
            )}
            {!simple && (
              <td className="p-2.5 text-center bg-indigo-50/40">
                <span className="font-black text-indigo-700 text-lg">{cartons + (bsBalance[`${p.name}|${kashrut}`] || 0)}</span>
              </td>
            )}
          </tr>
        );
      };

      return (
        <div className="flex flex-col gap-4">
          {/* טאבי כשרות */}
          <div className="flex gap-2 flex-wrap">
            {kashrutList.map((k) => {
              const isActive = k.name === activeKashrut;
              const color = k.color || '#6366f1';
              return (
                <button key={k.id} onClick={() => setActiveKashrut(k.name)}
                  style={isActive ? { backgroundColor: color, borderColor: color, color: 'white' } : { borderColor: color, color }}
                  className={`flex-1 min-w-[80px] py-2.5 rounded-xl font-bold text-sm transition-all border-2 bg-white ${isActive ? 'shadow-md' : 'hover:opacity-80'}`}>
                  {k.name}
                </button>
              );
            })}
          </div>

          {/* טבלת מוצרים לפי קטגוריות */}
          {(() => {
            const grouped = {};
            activeProducts.forEach(p => {
              const cat = p.category || getProductCategory(p.name);
              if (!grouped[cat]) grouped[cat] = [];
              grouped[cat].push(p);
            });
            return PRODUCT_CATEGORIES.filter(c => grouped[c]?.length).map(cat => {
              const cs = CAT_STYLES[cat] || {};
              return (
                <div key={cat} className={`rounded-xl overflow-hidden border-2 ${cs.border || 'border-gray-300'}`}>
                  <div onClick={() => setCollapsedCats(prev => ({ ...prev, [cat]: !prev[cat] }))}
                    className={`px-4 py-2.5 flex items-center gap-2 font-extrabold text-sm cursor-pointer select-none ${cs.header || 'bg-gray-50'} ${cs.text || 'text-gray-700'} border-b-2 ${cs.border || 'border-gray-200'}`}>
                    <span>{CAT_EMOJI[cat]}</span><span>{cat}</span>
                    <span className={`mr-auto text-xs font-bold px-2 py-0.5 rounded-full border ${cs.badge || 'bg-gray-100 text-gray-500 border-gray-200'}`}>{grouped[cat].length} מוצרים</span>
                    <Icons.ChevronDown className={`w-4 h-4 transition-transform duration-200 ${collapsedCats[cat] ? '-rotate-90' : ''}`} />
                  </div>
                  {!collapsedCats[cat] && <div className="bg-white overflow-x-auto">
                    <table className="w-full text-right text-sm min-w-max border-collapse">
                      {renderTableHeader()}
                      <tbody className="divide-y divide-gray-100">
                        {[...grouped[cat]].sort((a, b) => {
                          const sa = a.sku || '', sb = b.sku || '';
                          if (!sa && !sb) return 0;
                          if (!sa) return 1;
                          if (!sb) return -1;
                          return sa.localeCompare(sb, undefined, { numeric: true, sensitivity: 'base' });
                        }).map((p, idx) => renderRow(p, activeKashrut, idx, '#ffffff', '#f9fafb'))}
                      </tbody>
                    </table>
                  </div>}
                </div>
              );
            });
          })()}
          <p className="text-xs text-gray-400 text-center">* קרטון = {TRAYS_PER_CARTON} מגשים | הקלד וּלחץ Enter לביצוע</p>

          {/* סקשן דגים */}
          {fishProducts.length > 0 && (
            <div className="bg-white rounded-xl shadow-sm border-2 border-blue-400 overflow-hidden mt-2">
              <div onClick={() => setCollapsedCats(prev => ({ ...prev, 'דגים': !prev['דגים'] }))}
                className="py-2 px-4 bg-blue-50 border-b border-blue-200 flex items-center cursor-pointer select-none">
                <span className="text-blue-600 font-extrabold text-sm">🐟 דגים — כללי</span>
                <Icons.ChevronDown className={`w-4 h-4 mr-auto text-blue-400 transition-transform duration-200 ${collapsedCats['דגים'] ? '-rotate-90' : ''}`} />
              </div>
              {!collapsedCats['דגים'] && <div className="overflow-x-auto">
                <table className="w-full text-right text-sm min-w-max border-collapse">
                  {renderTableHeader(true)}
                  <tbody className="divide-y divide-gray-100">
                    {[...fishProducts].sort((a, b) => {
                      const sa = a.sku || '', sb = b.sku || '';
                      if (!sa && !sb) return 0;
                      if (!sa) return 1;
                      if (!sb) return -1;
                      return sa.localeCompare(sb, undefined, { numeric: true, sensitivity: 'base' });
                    }).map((p, idx) => renderRow(p, 'כללי', idx, '#ffffff', '#eff6ff', true))}
                  </tbody>
                </table>
              </div>}
            </div>
          )}
        </div>
      );
    };

    const InventoryView = ({ stock, setStock, frozenStock, setFrozenStock, kashrutList, frozenProductsList, appUser }) => {
      const [activeTab, setActiveTab] = useState('frozen');
      const [exportModal, setExportModal] = useState(false);
      const [exportFormat, setExportFormat] = useState('');
      const [exportSections, setExportSections] = useState({ frozen: false, fresh: false });
      const [exportKashrut, setExportKashrut] = useState(() => {
        const obj = {};
        kashrutList.forEach(k => { obj[k.name] = false; });
        return obj;
      });
      const [resetModal, setResetModal] = useState(false);
      const [resetPassword, setResetPassword] = useState('');
      const [resetError, setResetError] = useState('');
      const [exportMode, setExportMode] = useState('current');
      const [bsBalance, setBsBalance] = useState({});
      const [logEntries, setLogEntries] = useState([]);
      const [logDate, setLogDate] = useState(new Date().toISOString().split('T')[0]);
      const [logLoaded, setLogLoaded] = useState(false);

      const hiddenFeatures = (!appUser || appUser.is_admin) ? [] : (appUser.permissions?.hiddenFeatures || []);
      const showEntry      = !hiddenFeatures.includes('inventory.entry');
      const showWithdrawal = !hiddenFeatures.includes('inventory.withdrawal');
      const showExport     = !hiddenFeatures.includes('inventory.export');
      const showLog        = !hiddenFeatures.includes('inventory.log');
      const showReset      = !hiddenFeatures.includes('inventory.reset');

      useEffect(() => {
        Promise.all([
          db.from('beit_shemesh_shipments').select('*'),
          db.from('beit_shemesh_withdrawals').select('*')
        ]).then(([shRes, wdRes]) => {
          const map = {};
          (shRes.data || []).forEach(s => s.pallets.forEach(p => p.products.forEach(pr => {
            const key = (pr.name || '') + '|' + (pr.kashrut || '');
            map[key] = (map[key] || 0) + Number(pr.cartons || 0);
          })));
          (wdRes.data || []).forEach(w => w.products.forEach(pr => {
            const key = (pr.name || '') + '|' + (pr.kashrut || '');
            map[key] = (map[key] || 0) - Number(pr.cartons || 0);
          }));
          Object.keys(map).forEach(k => { if (map[k] < 0) map[k] = 0; });
          setBsBalance(map);
        });
      }, []);

      const loadLog = () => {
        db.from('frozen_stock_log').select('*').order('created_at', { ascending: false }).limit(500).then(({ data }) => {
          if (data) setLogEntries(data.map(r => r.data));
          setLogLoaded(true);
        });
      };

      const filteredLog = logEntries.filter(e => e.date === logDate);

      const downloadLogExcel = () => {
        const rows = [['תאריך', 'שעה', 'פעולה', 'מוצר', 'כשרות', 'קרטונים', 'מגשים']];
        filteredLog.forEach(e => {
          const time = e.timestamp ? new Date(e.timestamp).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : '';
          rows.push([e.date, time, e.action, e.product, e.kashrut || '', e.cartons || 0, e.trays || 0]);
        });
        const ws = window.XLSX.utils.aoa_to_sheet(rows);
        ws['!cols'] = [{wch:12},{wch:8},{wch:8},{wch:22},{wch:10},{wch:10},{wch:10}];
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, 'יומן פעולות');
        wb.Sheets['יומן פעולות']['!sheetViews'] = [{ rightToLeft: true }];
        window.XLSX.writeFile(wb, `יומן-מלאי-${logDate}.xlsx`);
      };

      const handleReset = async () => {
        if (resetPassword !== '1234') { setResetError('סיסמא שגויה'); return; }
        const today = new Date().toISOString().split('T')[0];
        setFrozenStock({});
        setLogEntries(prev => prev.filter(e => e.date !== today));
        await Promise.all([
          db.from('frozen_stock').upsert({ id: 'main', data: {}, updated_at: new Date().toISOString() }),
          db.from('frozen_stock_log').delete().filter('data->>date', 'eq', today)
        ]);
        setResetModal(false);
        setResetPassword('');
        setResetError('');
      };

      const seenFresh = new Set();
      const freshItems = (frozenProductsList || [])
        .filter(p => p.storageTypes?.includes('fresh'))
        .filter(p => { if (seenFresh.has(p.name)) return false; seenFresh.add(p.name); return true; });
      const frozenItems = frozenProductsList || [];

      const selectedKashrut = kashrutList.filter(k => exportKashrut[k.name]);

      const runExport = () => {
        const date = new Date().toLocaleDateString('he-IL').replace(/\//g, '-');
        if (exportFormat === 'excel') doExcelExport(date);
        else doPdfExport(date);
        setExportModal(false);
      };

      const doExcelExport = (date) => {
        const withStorage = exportMode === 'withStorage';
        const selectedNames = new Set(selectedKashrut.map(k => k.name));
        const numCols = withStorage ? 5 : 4;
        const colHeaders = withStorage
          ? ['מוצר', 'מקט', 'מגשים', 'קרטונים', 'כולל אחסנה']
          : ['מוצר', 'מקט', 'מגשים', 'קרטונים'];

        const grouped = {};
        frozenProductsList.filter(p => p.storageTypes?.includes('frozen') && selectedNames.has(p.kashrut) && ((frozenStock[`${p.name}|${p.kashrut}`] || 0) > 0 || (bsBalance[`${p.name}|${p.kashrut}`] || 0) > 0)).forEach(p => {
          const cat = p.category || getProductCategory(p.name);
          if (!grouped[cat]) grouped[cat] = [];
          grouped[cat].push(p);
        });
        const cats = PRODUCT_CATEGORIES.filter(c => grouped[c]?.length);

        const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const cs = numCols;

        let htmlRows = '';
        htmlRows += `<tr><td colspan="${cs}" style="font-size:14pt;font-weight:bold;background:#1e293b;color:#fff;padding:8px;">${esc(`דוח מלאי סופר עוף — נכון לתאריך ${date}`)}</td></tr>`;
        htmlRows += `<tr><td colspan="${cs}" style="font-size:10pt;color:#64748b;padding:4px 8px;">${esc(`${withStorage ? 'כולל אחסנה' : 'מצב נתון'} | ${selectedKashrut.map(k => k.name).join(', ')}`)}</td></tr>`;
        htmlRows += `<tr><td colspan="${cs}">&nbsp;</td></tr>`;

        const sortBySku = (a, b) => {
          const sa = a.sku || '', sb = b.sku || '';
          if (!sa && !sb) return 0;
          if (!sa) return 1;
          if (!sb) return -1;
          return sa.localeCompare(sb, undefined, { numeric: true, sensitivity: 'base' });
        };

        cats.forEach(cat => {
          const products = [...grouped[cat]].sort(sortBySku);
          const emoji = CAT_EMOJI[cat] || '';

          htmlRows += `<tr><td colspan="${cs}" style="font-size:13pt;font-weight:bold;background:#334155;color:#fff;padding:6px 8px;">${esc(`${emoji} ${cat}`)}</td></tr>`;
          htmlRows += `<tr>${colHeaders.map(h => `<th style="background:#475569;color:#fff;font-weight:bold;padding:5px 8px;text-align:center;border:1px solid #334155;">${esc(h)}</th>`).join('')}</tr>`;

          products.forEach((p, i) => {
            const key = `${p.name}|${p.kashrut}`;
            const t = frozenStock[key] || 0;
            const c = Math.floor(t / TRAYS_PER_CARTON);
            const cells = [p.name, p.sku || '', t, c];
            if (withStorage) cells.push(c + (bsBalance[key] || 0));
            const bg = i % 2 === 0 ? '#ffffff' : '#f8fafc';
            htmlRows += `<tr style="background:${bg};">${cells.map((v, ci) =>
              `<td style="padding:4px 8px;border:1px solid #e2e8f0;${ci > 1 ? 'text-align:center;' : ''}">${esc(v)}</td>`
            ).join('')}</tr>`;
          });

          const totalT = products.reduce((s, p) => s + (frozenStock[`${p.name}|${p.kashrut}`] || 0), 0);
          const totalC = products.reduce((s, p) => s + Math.floor((frozenStock[`${p.name}|${p.kashrut}`] || 0) / TRAYS_PER_CARTON), 0);
          const totCells = ['סה"כ', '', totalT, totalC];
          if (withStorage) totCells.push(products.reduce((s, p) => { const key = `${p.name}|${p.kashrut}`; return s + Math.floor((frozenStock[key]||0)/TRAYS_PER_CARTON) + (bsBalance[key]||0); }, 0));
          htmlRows += `<tr style="background:#f1f5f9;font-weight:bold;">${totCells.map((v, ci) =>
            `<td style="padding:5px 8px;border-top:2px solid #94a3b8;border:1px solid #cbd5e1;${ci > 1 ? 'text-align:center;' : ''}">${esc(v)}</td>`
          ).join('')}</tr>`;

          htmlRows += `<tr><td colspan="${cs}">&nbsp;</td></tr>`;
        });

        const sheetName = withStorage ? 'מלאי כולל אחסנה' : 'מצב נתון';
        const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8">
<!--[if gte mso 9]><xml>
<x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
<x:Name>${esc(sheetName)}</x:Name>
<x:WorksheetOptions><x:DisplayRightToLeft/></x:WorksheetOptions>
</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook>
</xml><![endif]-->
</head>
<body><table dir="rtl" style="border-collapse:collapse;font-family:Arial,sans-serif;direction:rtl;">
${htmlRows}
</table></body></html>`;

        const blob = new Blob(['﻿' + html], { type: 'application/vnd.ms-excel' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `מלאי סופר עוף ${date}.xls`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const doPdfExport = async (date) => {
        const { jsPDF } = window.jspdf;
        const withStorage = exportMode === 'withStorage';
        const selectedNames = new Set(selectedKashrut.map(k => k.name));
        const colHeaders = withStorage ? ['מגשים', 'קרטונים', 'כולל אחסנה'] : ['מגשים', 'קרטונים'];

        const grouped = {};
        frozenProductsList.filter(p => p.storageTypes?.includes('frozen') && selectedNames.has(p.kashrut) && ((frozenStock[`${p.name}|${p.kashrut}`] || 0) > 0 || (bsBalance[`${p.name}|${p.kashrut}`] || 0) > 0)).forEach(p => {
          const cat = p.category || getProductCategory(p.name);
          if (!grouped[cat]) grouped[cat] = [];
          grouped[cat].push(p);
        });
        const cats = PRODUCT_CATEGORIES.filter(c => grouped[c]?.length);

        const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
        let first = true;

        const sortBySku = (a, b) => {
          const sa = a.sku || '', sb = b.sku || '';
          if (!sa && !sb) return 0;
          if (!sa) return 1;
          if (!sb) return -1;
          return sa.localeCompare(sb, undefined, { numeric: true, sensitivity: 'base' });
        };

        for (const cat of cats) {
          const products = [...grouped[cat]].sort(sortBySku);
          const emoji = CAT_EMOJI[cat] || '';
          const rows = products.map((p, i) => {
            const key = `${p.name}|${p.kashrut}`;
            const t = frozenStock[key] || 0;
            const c = Math.floor(t / TRAYS_PER_CARTON);
            const cells = withStorage
              ? `<td style="padding:6px 10px;text-align:center;">${t}</td><td style="padding:6px 10px;text-align:center;font-weight:bold;">${c}</td><td style="padding:6px 10px;text-align:center;font-weight:bold;color:#4338ca;">${c + (bsBalance[key] || 0)}</td>`
              : `<td style="padding:6px 10px;text-align:center;">${t}</td><td style="padding:6px 10px;text-align:center;font-weight:bold;">${c}</td>`;
            return `<tr style="background:${i%2===0?'#ffffff':'#f8fafc'};border-bottom:1px solid #e5e7eb;">
              <td style="padding:6px 10px;font-weight:bold;">${p.name}</td>
              <td style="padding:6px 10px;text-align:center;color:#64748b;font-size:11px;">${p.sku || ''}</td>
              ${cells}
            </tr>`;
          }).join('');

          const html = `
            <div style="font-family:Arial,sans-serif;direction:rtl;padding:28px;width:560px;">
              <div style="margin-bottom:16px;padding-bottom:10px;border-bottom:3px solid #1e293b;">
                <div style="font-size:13px;color:#64748b;font-weight:normal;margin-bottom:4px;">דוח מלאי — נכון לתאריך ${date}</div>
                <div style="font-size:22px;font-weight:bold;">${emoji} ${cat}</div>
                <div style="font-size:12px;color:#64748b;margin-top:4px;">${withStorage ? 'כולל אחסנה' : 'מצב נתון'} | ${selectedKashrut.map(k=>k.name).join(', ')}</div>
              </div>
              <table style="width:100%;border-collapse:collapse;font-size:13px;">
                <thead>
                  <tr style="background:#1e293b;color:#ffffff;">
                    <th style="padding:7px 10px;text-align:right;">מוצר</th>
                    <th style="padding:7px 10px;text-align:center;">מקט</th>
                    ${colHeaders.map(h=>`<th style="padding:7px 10px;text-align:center;">${h}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
                <tfoot>
                  <tr style="background:#f1f5f9;font-weight:bold;border-top:2px solid #cbd5e1;">
                    <td style="padding:6px 10px;" colspan="2">סה"כ</td>
                    <td style="padding:6px 10px;text-align:center;">${products.reduce((s,p)=>s+(frozenStock[`${p.name}|${p.kashrut}`]||0),0)}</td>
                    <td style="padding:6px 10px;text-align:center;">${products.reduce((s,p)=>s+Math.floor((frozenStock[`${p.name}|${p.kashrut}`]||0)/TRAYS_PER_CARTON),0)}</td>
                    ${withStorage?`<td style="padding:6px 10px;text-align:center;color:#4338ca;">${products.reduce((s,p)=>{const key=`${p.name}|${p.kashrut}`;return s+Math.floor((frozenStock[key]||0)/TRAYS_PER_CARTON)+(bsBalance[key]||0);},0)}</td>`:''}
                  </tr>
                </tfoot>
              </table>
            </div>`;

          const container = document.createElement('div');
          container.style.cssText = 'position:fixed;top:-9999px;right:-9999px;';
          container.innerHTML = html;
          document.body.appendChild(container);
          const canvas = await window.html2canvas(container, { scale: 2, useCORS: true });
          document.body.removeChild(container);

          if (!first) doc.addPage();
          first = false;
          const imgData = canvas.toDataURL('image/png');
          const pageW = doc.internal.pageSize.getWidth();
          const imgH = (canvas.height * pageW) / canvas.width;
          doc.addImage(imgData, 'PNG', 0, 0, pageW, imgH);
        }

        doc.save(`מלאי-סופר-עוף-${date}.pdf`);
      };

      return (
        <div className="animate-in fade-in duration-300">
          <div className="mb-5 flex flex-wrap items-start justify-between gap-3">
            <div>
              <h1 className="text-3xl font-extrabold text-gray-900">מלאי סחורה - כללי</h1>
              <p className="text-gray-500 mt-1">ניהול מלאי טרי וקפוא — קליטת בוקר ועדכון כמויות</p>
            </div>
            <div className="flex gap-2">
              {showExport && (
                <button onClick={() => setExportModal(true)}
                  className="flex items-center gap-2 px-4 py-2.5 bg-gray-800 hover:bg-gray-900 text-white font-bold text-sm rounded-xl shadow-sm transition-colors">
                  <span>⬇️</span> ייצוא מלאי
                </button>
              )}
              {showLog && (
                <button onClick={() => { setActiveTab(activeTab === 'log' ? 'frozen' : 'log'); if (!logLoaded) loadLog(); }}
                  className={`flex items-center gap-2 px-4 py-2.5 font-bold text-sm rounded-xl shadow-sm transition-colors ${activeTab === 'log' ? 'bg-amber-500 hover:bg-amber-600 text-white' : 'bg-amber-100 hover:bg-amber-200 text-amber-700'}`}>
                  <span>📋</span> יומן פעולות
                </button>
              )}
              {showReset && (
                <button onClick={() => { setResetModal(true); setResetPassword(''); setResetError(''); }}
                  className="flex items-center gap-2 px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold text-sm rounded-xl shadow-sm transition-colors">
                  <span>🗑️</span> איפוס מלאי
                </button>
              )}
            </div>
          </div>

          {/* מודאל איפוס */}
          {resetModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-sm">
                <div className="p-4 bg-red-50 border-b border-red-100 flex items-center justify-between rounded-t-2xl">
                  <h3 className="font-bold text-lg text-red-800">איפוס מלאי קפוא</h3>
                  <button onClick={() => setResetModal(false)} className="p-1 rounded-lg text-gray-400 hover:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
                </div>
                <div className="p-5 space-y-4">
                  <p className="text-sm text-gray-600">פעולה זו תאפס את כל המלאי הקפוא ל-0. <span className="font-bold text-red-600">לא ניתן לבטל.</span></p>
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">סיסמא לאישור:</label>
                    <input
                      type="password"
                      value={resetPassword}
                      onChange={e => { setResetPassword(e.target.value); setResetError(''); }}
                      onKeyDown={e => e.key === 'Enter' && handleReset()}
                      placeholder="הכניסי סיסמא"
                      className="w-full p-2.5 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-red-400"
                      autoFocus
                    />
                    {resetError && <p className="text-red-600 text-xs font-bold mt-1">{resetError}</p>}
                  </div>
                </div>
                <div className="p-4 border-t border-gray-100 flex gap-3">
                  <button onClick={() => setResetModal(false)} className="flex-1 py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 font-bold text-sm hover:bg-gray-50">ביטול</button>
                  <button onClick={handleReset} className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm">אפס מלאי</button>
                </div>
              </div>
            </div>
          )}

          {/* טאבים */}
          <div className="flex gap-2 mb-6">
            <button
              onClick={() => setActiveTab('frozen')}
              className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all border-2 ${activeTab === 'frozen' ? 'bg-cyan-600 text-white border-cyan-600 shadow-md' : 'bg-white text-cyan-700 border-cyan-200 hover:bg-cyan-50'}`}>
              🧊 מלאי קפוא ({new Set(frozenItems.filter(p => p.storageTypes?.includes('frozen')).map(p => p.name)).size} פריטים)
            </button>
          </div>

          {/* מודאל ייצוא */}
          {exportModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-md animate-in zoom-in-95 duration-200">
                <div className="p-4 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
                  <h3 className="font-bold text-lg text-gray-900 flex items-center gap-2">⬇️ ייצוא מלאי</h3>
                  <button onClick={() => setExportModal(false)} className="p-1 rounded-lg text-gray-400 hover:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
                </div>

                <div className="p-5 space-y-5">
                  {/* פורמט */}
                  <div>
                    <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">פורמט קובץ</div>
                    <div className="flex gap-3">
                      {[['excel','📊 Excel (.xlsx)','emerald'],['pdf','📄 PDF','red']].map(([val, label, color]) => (
                        <label key={val} className={`flex-1 cursor-pointer border-2 rounded-xl p-3 text-center font-bold text-sm transition-all ${exportFormat === val ? `border-${color}-500 bg-${color}-50 text-${color}-700` : 'border-gray-200 text-gray-500 hover:border-gray-300'}`}>
                          <input type="radio" className="hidden" value={val} checked={exportFormat === val} onChange={() => setExportFormat(val)} />
                          {label}
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* תצוגת ייצוא */}
                  <div>
                    <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">תצוגת ייצוא</div>
                    <div className="flex gap-3">
                      {[['current','🧊 מצב נתון'],['withStorage','🏭 כולל אחסנה']].map(([val, label]) => (
                        <label key={val} className={`flex-1 cursor-pointer border-2 rounded-xl p-3 text-center font-bold text-sm transition-all flex items-center justify-center gap-2 ${exportMode === val ? 'border-gray-800 bg-gray-800 text-white' : 'border-gray-200 text-gray-500 hover:border-gray-300'}`}>
                          <input type="radio" className="hidden" checked={exportMode === val} onChange={() => setExportMode(val)} />
                          {label}
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* כשרויות */}
                  <div>
                    <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">כשרויות לכלול</div>
                    <div className="flex flex-wrap gap-2">
                      {kashrutList.map(k => (
                        <label key={k.id} className="cursor-pointer">
                          <input type="checkbox" className="hidden" checked={!!exportKashrut[k.name]}
                            onChange={e => setExportKashrut(p => ({ ...p, [k.name]: e.target.checked }))} />

      const orderSkuLookup = (sku) => {
        setOrderSkuRow(prev => ({ ...prev, sku, name: '', category: '', kashrut: '', storageType: '', needsStorageToggle: false }));
        setShowComplex(false);
        if (!sku) return;
        const fpBySku = (frozenProductsList || []).find(p => p.sku && p.sku.toString() === sku.toString());
        const getStorageInfo = (name) => {

          const needsStorageToggle = st.includes('fresh') && st.includes('frozen');

        };
        for (const template of ORDER_FORM_TEMPLATE) {
          const sk = getSku(template.id, kashrut) || getSku(template.id, 'כללי') || getSku(template.id, '');
          if (sk && String(sk) === String(sku)) {

        for (const [itemId, kashrutMap] of Object.entries(orderFormSkuMap || {})) {
          for (const [kName, v] of Object.entries(kashrutMap || {})) {

                setShowComplex(true);

        }
        if (fpBySku) {

            setShowComplex(true);
            setComplexState({ totalQty: '', rows: [], checks: [], notes: '' }); setQuickMarkOn(false);
            return;
          }
          setOrderSkuRow(prev => ({ ...prev, sku, name: fpBySku.name, category: fpBySku.category || getProductCategory(fpBySku.name), kashrut: fpBySku.kashrut || '', ...getStorageInfo(fpBySku.name) }));
        }
      };

      const addOrderItem = () => {
        if (!orderSkuRow.name) return;
        if (showComplex) {
          const template = ORDER_FORM_TEMPLATE.find(t => t.name === orderSkuRow.name);
          if (!template) return;
          const rows = complexState.rows.filter(r => parseFloat(r.qty) > 0);
          const skuQty = parseFloat(orderSkuRow.qty) || 0;
          if (rows.length === 0 && skuQty === 0 && complexState.checks.length === 0) return;
          if (template.showTotalQty && template.options.length > 0 && skuQty > 0 && rows.length > 0) {
            const rowsSum = rows.reduce((s, r) => s + (parseFloat(r.qty) || 0), 0);
            if (rowsSum < skuQty - 0.001) {
              setComplexAddError(`נותר להקצות עוד ${skuQty - rowsSum} — יש לחלק את כל הכמות (${skuQty})`);
              return;
            }
          }
          const savedTotal = skuQty > 0 ? orderSkuRow.qty : rows.reduce((s, r) => s + (parseFloat(r.qty) || 0), 0).toString();
          setOrderAddedItems(prev => [...prev, {
            id: Date.now(), sku: orderSkuRow.sku, name: orderSkuRow.name, category: orderSkuRow.category,
            type: 'complex', template, kashrut: orderSkuRow.kashrut || kashrut,
            storageType: orderSkuRow.storageType || 'fresh',
            totalQty: savedTotal,
            rows: complexState.rows.filter(r => parseFloat(r.qty) > 0),
            checks: complexState.checks, notes: complexState.notes
          }]);
          setShowComplex(false);
          setComplexState({ totalQty: '', rows: [], checks: [], notes: '' }); setQuickMarkOn(false);
          setComplexAddError('');
        } else {
          if (!parseFloat(orderSkuRow.qty)) return;
          setOrderAddedItems(prev => [...prev, {
            id: Date.now(), sku: orderSkuRow.sku, name: orderSkuRow.name, category: orderSkuRow.category,
            type: 'simple', qty: orderSkuRow.qty, notes: orderSkuRow.notes,
            kashrut: orderSkuRow.kashrut || kashrut,
            storageType: orderSkuRow.storageType || 'fresh'
          }]);
        }
        setOrderSkuRow({ sku: '', name: '', category: '', qty: '', notes: '', kashrut: '', storageType: '', needsStorageToggle: false });
        setTimeout(() => {
          orderSkuRef.current?.focus();
          if (modalFormRef.current) modalFormRef.current.scrollTop = modalFormRef.current.scrollHeight;
        }, 80);
      };

      // פריטים ללא אופציות — עדכון שורה רגילה
      const updateItemState = (id, field, value, rowIndex = 0) => {
        setFormItemsState(prev => {
          const rows = Array.isArray(prev[id]) ? prev[id] : [{ qty: '', notes: '', kashrut: '' }];

      // פריטים עם אופציות — קריאה ועדכון state
      const getOptState = (id) => {
        const s = formItemsState[id];
        return (s && !Array.isArray(s)) ? s : { totalQty: '', rows: [], checks: [], kashrut: '', notes: '' };

        order.items.forEach(item => {

      const closeModal = () => {

                @page { size: A5 portrait; margin: 5mm; }
                @media print {

      // רינדור קטגוריה דינמי — נגזר ישירות מ-frozenProductsList
      const renderCategoryDynamic = (categoryName) => {
        const templateNames = new Set(ORDER_FORM_TEMPLATE.map(t => t.name));

          .filter(p => !templateNames.has(p.name))
          .filter(p => { if (seen.has(p.name)) return false; seen.add(p.name); return true; })

        const cc = getCatColors(categoryName);

                    <div key={p.name} className="p-3 flex items-start gap-3 hover:bg-gray-50">
                      <div className="w-28 md:w-36 font-bold text-gray-800 shrink-0 pt-2 text-sm">

                        {sku && <span className="block text-[10px] text-gray-400 font-normal">{sku}</span>}

            const _completedOrders = orders.filter(o => o.status === 'completed' || o.status === 'delivered').length;
            const _deliveryOrders = orders.filter(o => o.type === 'delivery').length;
            const _pickupOrders = orders.filter(o => o.type === 'pickup').length;

                    { icon: '🔪', value: _assignedOrders,  label: 'משויכות',   color: '#f97316' },
                    { icon: '✅', value: _completedOrders, label: 'הושלמו',    color: '#22c55e' },
                    { icon: '🚚', value: _deliveryOrders,  label: 'משלוחים',   color: '#3b82f6' },
                    { icon: '🏪', value: _pickupOrders,    label: 'איסוף',     color: '#6366f1' },

                    <div key={s.label} className="flex items-center gap-1.5">
                      <span className="text-base">{s.icon}</span>

                  <div className="flex flex-wrap gap-x-4 gap-y-1.5 items-center mt-2 pt-2 border-t border-gray-100">

                    {_ordersByButcher.map(b => (
                      <div key={b.id} className="flex items-center gap-1">

                        <span className="text-xs text-gray-500">{b.name}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })()}

          {(() => {

            const assignedOrders = orders.filter(o => o.status === 'new' && o.assignedButcher);
            const packingOrders  = orders.filter(o => o.status === 'packing');

              const regularItems = (order.items || []).filter(i => i.qty !== '-');
              const packingItem = (order.items || []).find(i => i.qty === '-');
              const cats = new Set(regularItems.map(i => {
                const name = i.cleanName || i.name;
                const p = (frozenProductsList || []).find(fp => fp.name === name);
                return p?.category || getProductCategory(name) || ORDER_FORM_TEMPLATE.find(t => t.name === name)?.category;
              }).filter(Boolean));
              const hasFish = regularItems.some(i => {
                const name = i.cleanName || i.name;
                const p = (frozenProductsList || []).find(fp => fp.name === name);
                return (p?.category || getProductCategory(name)) === 'דגים';
              });
              const hasFrozen = regularItems.some(i => {
                const name = i.cleanName || i.name;
                const p = (frozenProductsList || []).find(fp => fp.name === name);
                if ((p?.category || getProductCategory(name)) === 'דגים') return false;
                return i.storageType === 'frozen';
              });
              const hasFresh = regularItems.some(i => {
                const name = i.cleanName || i.name;
                const p = (frozenProductsList || []).find(fp => fp.name === name);
                if ((p?.category || getProductCategory(name)) === 'דגים') return false;
                return !i.storageType || i.storageType === 'fresh';

                        {order.type === 'delivery' ? <Icons.Truck className="w-3 h-3" /> : <Icons.Package className="w-3 h-3" />}

                    {cats.has('בשר')  && <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-red-100 text-red-800 border border-red-300">🥩 בשר</span>}

                        className="py-1 px-1.5 rounded-md text-[11px] font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-200 transition-colors leading-tight">
                        🖨️
                      </button>

                        <>
                          <div className="fixed inset-0 z-40" onClick={() => setPrintMenuOrderId(null)} />

                            {hasFresh && (
                              <button type="button" onClick={() => openPrint(order, 'fresh')}
                                className="w-full text-right px-3 py-2 text-sm font-bold hover:bg-green-50 text-green-700 flex items-center gap-2 whitespace-nowrap">

                            {hasFrozen && (

                                className="w-full text-right px-3 py-2 text-sm font-bold hover:bg-blue-50 text-blue-700 flex items-center gap-2 whitespace-nowrap">
                                🧊 בון קפוא
                              </button>

                            {hasFish && (
                              <button type="button" onClick={() => openPrint(order, 'fish')}
                                className="w-full text-right px-3 py-2 text-sm font-bold hover:bg-blue-50 text-blue-800 flex items-center gap-2 whitespace-nowrap">
                                🐟 בון דגים
                              </button>

                            {[hasFresh, hasFrozen, hasFish].filter(Boolean).length > 1 && (
                              <div className="border-t border-gray-100 mt-1 pt-1">
                                <button type="button" onClick={() => openPrint(order, 'all')}
                                  className="w-full text-right px-3 py-2 text-sm font-bold hover:bg-gray-50 text-gray-700 flex items-center gap-2 whitespace-nowrap">
                                  📋 כל הבונים
                                </button>
                              </div>
                            )}
                          </div>
                        </>

                      ✏️
                    </button>
                    <button onClick={() => deleteOrder(order)}
                      className="py-1 px-1.5 rounded-md text-[11px] bg-red-100 hover:bg-red-200 text-red-700 border border-red-200 transition-colors shrink-0 leading-tight">

                    </button>
                    {order.status === 'packing' && (
                      <button onClick={() => { setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: 'new' } : o)); collapseOrder(order.id); }}
                        className="py-1 px-1.5 rounded-md text-[11px] font-bold bg-gray-100 hover:bg-gray-200 text-gray-500 border border-gray-200 shrink-0 leading-tight">↩</button>

                    {order.status === 'new' && order.assignedButcher && (
                      <button onClick={() => { setOrders(prev => prev.map(o => o.id === order.id ? { ...o, assignedButcher: '' } : o)); collapseOrder(order.id); }}
                        className="py-1 px-1.5 rounded-md text-[11px] font-bold bg-gray-100 hover:bg-gray-200 text-gray-500 border border-gray-200 shrink-0 leading-tight">↩</button>
                    )}
                    {order.status === 'new' && !order.assignedButcher && (
                      <button onClick={() => setButcherModal(order.id)}
                        className="me-auto py-1 px-2 rounded-md text-[11px] font-bold bg-orange-500 hover:bg-orange-600 text-white border border-orange-600 transition-colors shrink-0 leading-tight">

                      </button>
                    )}
                    {order.status === 'new' && order.assignedButcher && (
                      <button onClick={() => moveToPacking(order.id)}
                        className="me-auto py-1 px-2 rounded-md text-[11px] font-bold bg-yellow-500 hover:bg-yellow-600 text-white border border-yellow-600 transition-colors shrink-0 leading-tight">
                        📦 לאריזה
                      </button>
                    )}
                    {order.status === 'packing' && (
                      <button onClick={() => requestComplete(order.id)}
                        className="me-auto py-1 px-2 rounded-md text-[11px] font-bold bg-green-500 hover:bg-green-600 text-white border border-green-600 transition-colors shrink-0 leading-tight">
                        ✅ מוכן
                      </button>
                    )}
                  </div>
                )}

                {/* פירוט — נפתח בלחיצה */}
                {isExpanded && (
                  <div className="px-4 pb-4 border-t border-gray-100 pt-3">
                    {(() => {
                      const seen = new Set(); const groups = [];
                      regularItems.forEach(item => {
                        const key = item.cleanName || item.name;
                        if (!seen.has(key)) {
                          seen.add(key);
                          const grp = regularItems.filter(i => (i.cleanName || i.name) === key);
                          groups.push({ key, items: grp, total: grp.reduce((s, i) => s + (parseFloat(i.qty) || 0), 0) });
                        }
                      });
                      return (
                        <ul className="bg-gray-50 rounded-lg border border-gray-100 divide-y divide-gray-100 mb-3">
                          {groups.map((group, gIdx) => {
                            const tmpl = ORDER_FORM_TEMPLATE.find(t => t.name === group.key);
                            const itemCat = (frozenProductsList || []).find(p => p.name === group.key)?.category || getProductCategory(group.key) || tmpl?.category;
                            const cc = getCatColors(itemCat);
                            const kc = group.items[0].kashrut ? getKashrutColor(group.items[0].kashrut) : null;
                            return (
                              <li key={gIdx} className="px-2 py-2 text-xs">
                                <div className="flex items-center gap-2 flex-wrap">
                                  <span className={`font-black px-1.5 py-0.5 rounded min-w-[28px] text-center border shrink-0 ${cc.qtyBg} ${cc.qtyText} ${cc.qtyBorder}`}>
                                    {group.items.length > 1 ? group.total : group.items[0].qty}
                                  </span>
                                  <span className="font-bold text-gray-800">{group.key}</span>
                                  {kc && <span className="text-[10px] px-1.5 py-0.5 rounded font-bold border" style={{ borderColor: kc+'80', backgroundColor: kc+'15', color: kc }}>{group.items[0].kashrut}</span>}
                                  {group.items[0].sku && <span className="text-[10px] px-1.5 py-0.5 rounded font-bold bg-gray-100 text-gray-500 border border-gray-200">{group.items[0].sku}</span>}

                                </div>
                                {(group.items.length > 1 || (group.items.length === 1 && group.items[0].name !== group.key)) && (
                                  <div className={`mr-6 mt-1.5 space-y-1 border-r-2 pr-2 ${cc.subBorder}`}>
                                    {group.items.map((item, iIdx) => {
                                      const opt = item.name.match(/\((.+)\)$/)?.[1] || item.name;
                                      return (
                                        <div key={iIdx} className="flex items-center gap-1.5 text-[11px] text-gray-500">
                                          <span className={`font-extrabold min-w-[20px] text-center ${cc.subQty}`}>{item.qty}</span>
                                          <span>{opt}</span>
                                        </div>
                                      );
                                    })}
                                  </div>
                                )}
                                {group.items.length === 1 && group.items[0].notes && (
                                  <div className="text-red-500 font-medium mr-7 mt-0.5">✂️ {group.items[0].notes}</div>

                                  <div className="flex flex-wrap gap-1 mr-6 mt-1">
                                    {group.items[0].checks.map(c => (
                                      <span key={c} className={`text-[10px] px-1.5 py-0.5 rounded font-bold border ${cc.qtyBg} ${cc.qtyText} ${cc.qtyBorder}`}>✓ {c}</span>

                                  </div>
                                )}
                              </li>

                              <span className="font-black px-1.5 py-0.5 rounded border bg-gray-100 text-gray-500 border-gray-200 text-center shrink-0">📦</span>
                              <span className="text-gray-600 font-medium">{packingItem.notes}</span>
                            </li>
                          )}
                        </ul>

                      <div className="mb-3 bg-green-50 border border-green-200 rounded-lg px-3 py-2 flex flex-wrap gap-3 text-xs font-bold text-green-800">

                        {order.packaging.bags > 0 && <span>🛍️ {order.packaging.bags} שקיות</span>}
                        {order.packaging.fishBags > 0 && <span>🐟 {order.packaging.fishBags} שקיות דגים</span>}
                      </div>
                    )}

                  </div>
                )}
              </div>
              );
            };

            const renderKashrutGroups = (arr, dimmed = false, draggable = false) => {
              if (arr.length === 0) return (
                <div className="text-center text-gray-400 text-sm py-6 border-2 border-dashed border-gray-200 rounded-xl">אין הזמנות</div>
              );
              const groups = {};
              sortByKashrut(arr).forEach(o => {
                const k = o.kashrut || 'ללא כשרות';
                if (!groups[k]) groups[k] = [];
                groups[k].push(o);
              });
              return Object.entries(groups).map(([kashrut, list]) => (
                <div key={kashrut} className="mb-3">
                  <div className="text-[11px] font-black text-gray-500 uppercase tracking-widest mb-1.5 px-1 flex items-center gap-1">
                    <span className="w-2 h-2 rounded-full bg-purple-400 inline-block"></span> {kashrut} ({list.length})
                  </div>
                  <div className="space-y-2">
                    {list.map(o => renderOrderCard(o, dimmed, draggable))}
                  </div>
                </div>
              ));

              <div className={`flex items-center gap-2 mb-3 p-3 rounded-xl ${color}`}>
                <span className="text-lg">{icon}</span>
                <div>
                  <div className="font-extrabold text-sm">{title}</div>
                  <div className="text-xs opacity-70">{count} הזמנות</div>
                </div>
              </div>
