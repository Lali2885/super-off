      const doExcelExport = (date) => {
        const wb = window.XLSX.utils.book_new();
        if (exportSections.frozen) {
          const header = ['מוצר', ...selectedKashrut.flatMap(k => [`${k.name} - מגשים`, `${k.name} - קרטונים`])];
          const rows = frozenProductsList.map(p => {
            const row = [p.name];
            selectedKashrut.forEach(k => {
              const t = frozenStock[`${p.name}|${k.name}`] || 0;
              row.push(t || 0, Math.floor(t / TRAYS_PER_CARTON));
            });
            return row;
          });
          window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet([header, ...rows]), 'מלאי קפוא');
        }
        if (exportSections.fresh) {
          const header = ['מוצר', 'קטגוריה', ...selectedKashrut.map(k => `${k.name} (ק"ג)`)];
          const rows = freshItems.map(item => {
            const row = [item.name, item.category];
            selectedKashrut.forEach(k => row.push(stock[`${item.name}|${k.name}`] || 0));
            return row;
          });
          window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet([header, ...rows]), 'מלאי טרי');
        }
        window.XLSX.writeFile(wb, `מלאי סופר עוף ${date}.xlsx`);
      };

      const doPdfExport = (date) => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        let first = true;
        if (exportSections.frozen) {
          if (!first) doc.addPage(); first = false;
          doc.setFontSize(13);
          doc.text(`Super Oaf - Frozen Inventory | ${date}`, 14, 14);
          const head = [['Product', ...selectedKashrut.flatMap(k => [`${k.name} Trays`, `${k.name} Cartons`])]];
          const body = frozenProductsList.map(p => {
            const row = [p.name];
            selectedKashrut.forEach(k => { const t = frozenStock[`${p.name}|${k.name}`] || 0; row.push(t || '-', t ? Math.floor(t / TRAYS_PER_CARTON) : '-'); });
            return row;
          });
          doc.autoTable({ head, body, startY: 18, styles: { fontSize: 9, halign: 'center' }, headStyles: { fillColor: [30,30,30], textColor: 255 }, alternateRowStyles: { fillColor: [245,245,255] }, columnStyles: { 0: { halign: 'left', fontStyle: 'bold' } } });
        }
        if (exportSections.fresh) {
          if (!first) doc.addPage(); first = false;
          doc.setFontSize(13);
          doc.text(`Super Oaf - Fresh Inventory | ${date}`, 14, 14);
          const head = [['Product', 'Category', ...selectedKashrut.map(k => `${k.name} (kg)`)]];
          const body = freshItems.map(item => { const row = [item.name, item.category]; selectedKashrut.forEach(k => row.push(stock[`${item.name}|${k.name}`] || '-')); return row; });
          doc.autoTable({ head, body, startY: 18, styles: { fontSize: 9, halign: 'center' }, headStyles: { fillColor: [30,30,30], textColor: 255 }, alternateRowStyles: { fillColor: [240,255,245] }, columnStyles: { 0: { halign: 'left', fontStyle: 'bold' }, 1: { halign: 'left' } } });
        }
        doc.save(`מלאי סופר עוף ${date}.pdf`);
      };

      return (
        <div className="animate-in fade-in duration-300">
          <div className="mb-5 flex flex-wrap items-start justify-between gap-3">
            <div>
              <h1 className="text-3xl font-extrabold text-gray-900">מלאי וסחורה</h1>
              <p className="text-gray-500 mt-1">ניהול מלאי טרי וקפוא — קליטת בוקר ועדכון כמויות</p>
            </div>
            <button onClick={() => setExportModal(true)}
              className="flex items-center gap-2 px-4 py-2.5 bg-gray-800 hover:bg-gray-900 text-white font-bold text-sm rounded-xl shadow-sm transition-colors">
              <span>⬇️</span> ייצוא מלאי
            </button>
          </div>

          {/* טאבים */}
          <div className="flex gap-2 mb-6">
            <button
              onClick={() => setActiveTab('frozen')}
              className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all border-2 ${activeTab === 'frozen' ? 'bg-cyan-600 text-white border-cyan-600 shadow-md' : 'bg-white text-cyan-700 border-cyan-200 hover:bg-cyan-50'}`}>
              🧊 מלאי קפוא ({frozenItems.length} פריטים)
            </button>
            <button
              onClick={() => setActiveTab('fresh')}
              className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all border-2 ${activeTab === 'fresh' ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-blue-700 border-blue-200 hover:bg-blue-50'}`}>
              🥩 מלאי טרי ({freshItems.length} פריטים)
            </button>
          </div>

          {/* מודאל ייצוא */}
          {exportModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-md animate-in zoom-in-95 duration-200">
                <div className="p-4 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
                  <h3 className="font-bold text-lg text-gray-900 flex items-center gap-2">⬇️ ייצוא מלאי</h3>
                  <button onClick={() => setExportModal(false)} className="p-1 rounded-lg text-gray-400 hover:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
                </div>

                <div className="p-5 space-y-5">
                  {/* פורמט */}
                  <div>
                    <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">פורמט קובץ</div>
                    <div className="flex gap-3">
                      {[['excel','📊 Excel (.xlsx)','emerald'],['pdf','📄 PDF','red']].map(([val, label, color]) => (
                        <label key={val} className={`flex-1 cursor-pointer border-2 rounded-xl p-3 text-center font-bold text-sm transition-all ${exportFormat === val ? `border-${color}-500 bg-${color}-50 text-${color}-700` : 'border-gray-200 text-gray-500 hover:border-gray-300'}`}>
                          <input type="radio" className="hidden" value={val} checked={exportFormat === val} onChange={() => setExportFormat(val)} />
                          {label}
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* סוג מלאי */}
                  <div>
                    <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">סוג מלאי לייצוא</div>
                    <div className="flex gap-3">
                      {[['frozen','🧊 קפוא'],['fresh','🥩 טרי']].map(([key, label]) => (
                        <label key={key} className={`flex-1 cursor-pointer border-2 rounded-xl p-3 text-center font-bold text-sm transition-all flex items-center justify-center gap-2 ${exportSections[key] ? 'border-gray-800 bg-gray-800 text-white' : 'border-gray-200 text-gray-500 hover:border-gray-300'}`}>
                          <input type="checkbox" className="hidden" checked={exportSections[key]}
                            onChange={e => setExportSections(p => ({ ...p, [key]: e.target.checked }))} />
                          {label}
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* כשרויות */}
                  <div>
                    <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">כשרויות לכלול</div>
                    <div className="flex flex-wrap gap-2">
                      {kashrutList.map(k => (
                        <label key={k.id} className="cursor-pointer">
                          <input type="checkbox" className="hidden" checked={!!exportKashrut[k.name]}
                            onChange={e => setExportKashrut(p => ({ ...p, [k.name]: e.target.checked }))} />
                          <span className={`inline-block px-3 py-1.5 rounded-lg border-2 font-bold text-sm transition-all ${exportKashrut[k.name] ? 'text-white' : 'bg-white'}`}
                            style={exportKashrut[k.name]
                              ? { backgroundColor: k.color, borderColor: k.color }
                              : { borderColor: k.color + '60', color: k.color }}>
                            {k.name}
                          </span>
                        </label>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="p-4 border-t border-gray-100 flex gap-3">
                  <Button variant="outline" className="flex-1" onClick={() => setExportModal(false)}>ביטול</Button>
                  <button onClick={runExport}
                    disabled={!exportFormat || (!exportSections.frozen && !exportSections.fresh) || selectedKashrut.length === 0}
                    className="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl font-bold text-white bg-gray-800 hover:bg-gray-900 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                    {exportFormat === 'excel' ? '📊' : '📄'} הורד קובץ
                  </button>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'fresh' && (
            <FreshStockPanel stock={stock} setStock={setStock} kashrutList={kashrutList} />
          )}
          {activeTab === 'frozen' && (
            <FrozenStockPanel frozenStock={frozenStock} setFrozenStock={setFrozenStock} kashrutList={kashrutList} frozenProductsList={frozenProductsList} />
          )}
        </div>
      );
    };

    // --- Orders View ---
    const OrdersView = ({ kashrutList, butchersList, orders, setOrders, stock, neighborhoodData }) => {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingOrder, setEditingOrder] = useState(null);
      const [activePrintOrder, setActivePrintOrder] = useState(null);
      const [orderType, setOrderType] = useState('delivery');
      const [formItemsState, setFormItemsState] = useState({});
      const [packingOption, setPackingOption] = useState('');
      const [formErrorMessage, setFormErrorMessage] = useState('');

      // Client state fields
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [customerMobile, setCustomerMobile] = useState('');
      const [neighborhood, setNeighborhood] = useState('');
      const [street, setStreet] = useState('');
      const [entrance, setEntrance] = useState('');
      const [floor, setFloor] = useState('');
      const [apt, setApt] = useState('');
      const [deliveryDate, setDeliveryDate] = useState('');
      const [pickupTime, setPickupTime] = useState('');
      const [kashrut, setKashrut] = useState('');
      const [flags, setFlags] = useState({ mustCoordinate: false, notifyReady: false });
      const [chargeStatus, setChargeStatus] = useState('');
      const [assignedButcher, setAssignedButcher] = useState('');

      const [expandedCategories, setExpandedCategories] = useState({
        'עוף': true,
        'הודו': false,
        'בשר ואחרים': false,
        'דגים': false
      });

      const toggleCategory = (category) => {
        setExpandedCategories(prev => ({ ...prev, [category]: !prev[category] }));
      };

      const updateItemState = (id, field, value) => {
        setFormItemsState(prev => {
          const template = ORDER_FORM_TEMPLATE.find(t => t.id === id);
          const existing = prev[id] || { qty: '', option: '', notes: '', kashrut: '' };
          return {
            ...prev,
            [id]: { ...existing, [field]: value }
          };
        });
      };

      const openEditModal = (order) => {
        setEditingOrder(order);
        setOrderType(order.type);
        setCustomerName(order.customer);
        setCustomerPhone(order.phone);
        setCustomerMobile(order.mobile || '');
        setNeighborhood(order.neighborhood || '');
        setStreet(order.street || '');
        setEntrance(order.entrance || '');
        setFloor(order.floor || '');
        setApt(order.apt || '');
        if (order.type === 'delivery') {
          setDeliveryDate(order.timeString || '');
          setPickupTime('');
        } else {
          setPickupTime(order.timeString || '');
          setDeliveryDate('');
        }
        setKashrut(order.kashrut || '');
        setFlags({ mustCoordinate: order.flags?.mustCoordinate || false, notifyReady: order.flags?.notifyReady || false });
        setChargeStatus(order.flags?.chargeStatus || '');
        setAssignedButcher(order.assignedButcher || '');

        const rebuilt = {};
        let rebuildPacking = '';
        order.items.forEach(item => {
          if (item.qty === '-' && item.name === 'אריזת עופות') {
            rebuildPacking = item.notes || '';
            return;
          }
          const template = ORDER_FORM_TEMPLATE.find(t => t.name === (item.cleanName || item.name));
          if (template) {
            let option = '';
            if (item.name !== template.name) {
              const match = item.name.match(/\((.+)\)$/);
              if (match) option = match[1];
            }
            rebuilt[template.id] = { qty: item.qty.toString(), option, notes: item.notes || '', kashrut: item.kashrut || '' };
          }
        });
        setFormItemsState(rebuilt);
        setPackingOption(rebuildPacking);
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingOrder(null);
        setCustomerName(''); setCustomerPhone(''); setCustomerMobile('');
        setNeighborhood(''); setStreet(''); setEntrance(''); setFloor(''); setApt('');
        setDeliveryDate(''); setPickupTime(''); setKashrut('');
        setFlags({ mustCoordinate: false, notifyReady: false });
        setChargeStatus('');
        setAssignedButcher('');
        setFormItemsState({});
        setPackingOption('');
      };

      const handleAddOrder = (e) => {
        e.preventDefault();
        setFormErrorMessage('');

        if (!kashrut) {
          setFormErrorMessage('חובה לבחור כשרות כללית עבור ההזמנה (בראש הטופס)!');
          return;
        }

        const populatedItems = ORDER_FORM_TEMPLATE
          .filter(template => formItemsState[template.id] && formItemsState[template.id].qty > 0)
          .map(template => {
            const state = formItemsState[template.id];
            let finalName = template.name;
            if (state.option) finalName += ` (${state.option})`;
            return {
              name: finalName,
              cleanName: template.name, // To match against stock
              qty: parseFloat(state.qty),
              notes: state.notes,
              kashrut: state.kashrut || kashrut
            };
          });

        if (populatedItems.length === 0) {
          setFormErrorMessage('נא להזין כמות עבור לפחות מוצר אחד בטופס!');
          return;
        }

        if (packingOption) {
          populatedItems.push({ name: 'אריזת עופות', qty: '-', notes: packingOption, kashrut: '-' });
        }

        const newOrder = {
          id: Math.floor(1000 + Math.random() * 9000),
          createdAt: new Date().toLocaleDateString('he-IL'),
          customer: customerName, phone: customerPhone, mobile: customerMobile,
          type: orderType,
          fullAddress: orderType === 'delivery' ? `${street} ${entrance ? 'כניסה '+entrance : ''} ${floor ? 'קומה '+floor : ''} ${apt ? 'דירה '+apt : ''}`.trim() : '',
          street, entrance, floor, apt,
          neighborhood: orderType === 'delivery' ? neighborhood : '',
          timeString: orderType === 'delivery' ? deliveryDate : pickupTime,
          kashrut,
          assignedButcher,
          flags: { ...flags, chargeStatus },
          items: populatedItems,
          status: 'new'
        };

        if (editingOrder) {
          setOrders(orders.map(o => o.id === editingOrder.id ? { ...newOrder, id: editingOrder.id, status: editingOrder.status } : o));
        } else {
          setOrders([newOrder, ...orders]);
        }
        closeModal();
      };

      const triggerPhysicalPrint = () => {
        const printContent = document.getElementById('physical-print-slip-area').innerHTML;
        const printWindow = window.open('', '_blank', 'width=800,height=900');
        printWindow.document.write(`
          <html dir="rtl">
            <head>
              <title>בון הזמנה - סופר עוף</title>
              <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
              <style>
                @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap');
                body { 
                  font-family: 'Assistant', sans-serif; 
                  padding: 0; margin: 0; background: white; color: black;
                  -webkit-print-color-adjust: exact; print-color-adjust: exact;
                }
                @page { size: A5 portrait; margin: 5mm; }
                @media print {
                  html, body { width: 138mm; height: 200mm; overflow: hidden; }
                  header, footer { display: none !important; }
                }
              </style>
            </head>
            <body onload="window.print(); setTimeout(function() { window.close(); }, 500);">
              <div style="width: 138mm; margin: 0 auto; padding: 2px;">
                ${printContent}
              </div>
            </body>
          </html>
        `);
        printWindow.document.close();
      };

      const renderItemCategory = (categoryName) => {
        const itemsInCategory = ORDER_FORM_TEMPLATE.filter(i => i.category === categoryName);
        if (itemsInCategory.length === 0) return null;
        const isExpanded = expandedCategories[categoryName];

        return (
          <div className="mb-4 bg-white rounded-lg border border-purple-100 overflow-hidden shadow-sm transition-all duration-200">
            <button 
              type="button" 
              onClick={() => toggleCategory(categoryName)}
              className="w-full bg-purple-50 hover:bg-purple-100 text-purple-900 font-bold px-4 py-3 border-b border-purple-100 flex justify-between items-center transition-colors"
            >
              <span>{categoryName}</span>
              <Icons.ChevronDown className={`w-5 h-5 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}`} />
            </button>
            
            {isExpanded && (
              <div className="divide-y divide-gray-100 animate-in slide-in-from-top-2 duration-200">
                {itemsInCategory.map(item => {
                  const currentState = formItemsState[item.id] || { qty: '', option: '', notes: '', kashrut: '' };
                  return (
                    <div key={item.id} className="p-3 flex flex-col md:flex-row items-start md:items-center gap-3 hover:bg-gray-50">
                      <div className="w-full md:w-36 font-bold text-gray-800 shrink-0">
                        {item.name}
                      </div>
                      
                      <div className="flex flex-1 gap-2 w-full flex-wrap sm:flex-nowrap">
                        <input 
                          type="number" 
                          min="0"
                          step="0.5"
                          placeholder="כמות..."
                          value={currentState.qty ?? ''} 
                          onChange={(e) => updateItemState(item.id, 'qty', e.target.value)}
                          className="w-16 sm:w-20 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-400 outline-none text-center"
                        />
                        
                        {item.options.length > 0 && (
                          <select 
                            value={currentState.option ?? ''}
                            onChange={(e) => updateItemState(item.id, 'option', e.target.value)}
                            className="flex-1 min-w-[80px] p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-400 outline-none"
                          >
                            <option value="" disabled>בחר...</option>
                            {item.options.map(opt => (
                              <option key={opt} value={opt}>
                                {opt === '' ? 'ריק' : opt}
                              </option>
                            ))}
                          </select>
                        )}
                        
                        {/* כשרות ספציפית לשורה */}
                        <select
                          value={currentState.kashrut || kashrut || ''}
                          onChange={(e) => updateItemState(item.id, 'kashrut', e.target.value)}
                          className="flex-1 min-w-[90px] p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-400 outline-none"
                        >
                          <option value="" disabled>כשרות...</option>
                          {kashrutList.map(k => <option key={k.id} value={k.name}>{k.name}</option>)}
                        </select>
                        
                        <input 
                          type="text" 
                          placeholder="הערה"
                          value={currentState.notes ?? ''} 
                          onChange={(e) => updateItemState(item.id, 'notes', e.target.value)}
                          className="flex-1 min-w-[120px] p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-400 outline-none"
                        />
                      </div>
                    </div>
                  );
                })}
                
                {/* הוראות אריזה מיוחדות רק תחת קטגוריית "עוף" */}
                {categoryName === 'עוף' && (
                  <div className="p-3 bg-purple-50/50 flex flex-col sm:flex-row items-start sm:items-center gap-3 border-t border-purple-100">
                    <div className="w-full sm:w-40 font-bold text-purple-800 shrink-0 text-sm">
                      הוראות אריזה (עופות):
                    </div>
                    <div className="flex flex-wrap gap-3">
                      {['כל עוף במגש', 'לא כל עוף במגש', 'חלקים נפרדים'].map(opt => (
                        <label key={opt} className="flex items-center gap-1.5 text-sm text-gray-700 cursor-pointer">
                          <input 
                            type="radio" 
                            name="packing" 
                            value={opt} 
                            checked={packingOption === opt}
                            onChange={(e) => setPackingOption(e.target.value)}
                            className="accent-purple-600"
                          /> {opt}
                        </label>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      };

      const [draggingId, setDraggingId] = useState(null);
      const [isDragOver, setIsDragOver] = useState(false);
      const [packagingModal, setPackagingModal] = useState(null); // orderId
      const [packagingData, setPackagingData] = useState({ cartons: '', bags: '', fishBags: '' });

      const moveToPacking = (orderId) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: 'packing' } : o));
      };

      const requestComplete = (orderId) => {
        setPackagingModal(orderId);
        setPackagingData({ cartons: '', bags: '', fishBags: '' });
      };

      const confirmComplete = () => {
        setOrders(orders.map(o => o.id === packagingModal
          ? { ...o, status: 'completed', packaging: { ...packagingData } }
          : o
        ));
        setPackagingModal(null);
      };

      return (
        <div className="animate-in fade-in duration-300 relative">
          <div className="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h1 className="text-3xl font-extrabold text-gray-900">ניהול הזמנות</h1>
              <p className="text-gray-500 mt-1">ניהול הזמנות פתוחות בתור, הדפסת בונים וסימוני חיתוך</p>
            </div>
            <Button variant="purple" icon={Icons.Plus} className="px-6 py-3 text-base shadow-md font-bold" onClick={() => setIsModalOpen(true)}>
              הזמנה חדשה (טופס מלא)
            </Button>
          </div>

          {(() => {
            const newOrders      = orders.filter(o => o.status === 'new' && !o.assignedButcher);
            const assignedOrders = orders.filter(o => o.status === 'new' && o.assignedButcher);
            const packingOrders  = orders.filter(o => o.status === 'packing');

            const sortByKashrut = (arr) => [...arr].sort((a, b) => (a.kashrut || '').localeCompare(b.kashrut || '', 'he'));

            const renderOrderCard = (order, dimmed = false, draggable = false) => (
              <div key={order.id}
                draggable={draggable}
                onDragStart={draggable ? () => setDraggingId(order.id) : undefined}
                onDragEnd={draggable ? () => setDraggingId(null) : undefined}
                onClick={!dimmed ? () => openEditModal(order) : undefined}
                className={`bg-white p-4 rounded-xl shadow-sm border flex flex-col transition-all ${dimmed ? 'border-gray-100 opacity-70' : 'border-gray-200 cursor-pointer hover:shadow-md hover:border-purple-300 hover:bg-purple-50/20'} ${draggable ? 'active:cursor-grabbing active:opacity-60 active:scale-95' : ''} ${draggingId === order.id ? 'opacity-50' : ''}`}>
                {/* כותרת כרטיס */}
                <div className="flex justify-between items-start mb-2 border-b border-gray-100 pb-2">
                  <div className="flex-1 min-w-0">
                    <div className="font-extrabold text-base text-gray-900 truncate">#{order.id} | {order.customer}</div>
                    <div className="text-xs text-gray-500 mt-0.5">
                      <Icons.Phone className="w-3 h-3 inline ml-1 text-gray-400" />{order.phone}
                    </div>
                  </div>
                  <div className="flex flex-col items-end gap-1 shrink-0 mr-2">
                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1 ${order.type === 'delivery' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-700'}`}>
                      {order.type === 'delivery' ? <Icons.Truck className="w-3 h-3" /> : <Icons.Package className="w-3 h-3" />}
                      {order.type === 'delivery' ? 'משלוח' : 'איסוף'}
                    </span>
                    {order.timeString && <span className="text-[10px] text-gray-400">⏰ {order.timeString}</span>}
                    {order.createdAt && <span className="text-[10px] text-gray-400">📅 {order.createdAt}</span>}
                  </div>
                </div>

                {/* תגיות */}
                <div className="flex flex-wrap gap-1 mb-2">
                  <span className="text-[10px] bg-purple-50 text-purple-700 border border-purple-200 px-1.5 py-0.5 rounded font-bold">{order.kashrut}</span>
                  {order.assignedButcher && <span className="text-[10px] bg-orange-100 text-orange-800 border border-orange-200 px-1.5 py-0.5 rounded font-bold">🔪 {order.assignedButcher}</span>}
                  {order.neighborhood && <span className="text-[10px] bg-blue-50 text-blue-700 border border-blue-100 px-1.5 py-0.5 rounded font-bold"><Icons.MapPin className="w-2.5 h-2.5 inline" /> {order.neighborhood}</span>}
                  {order.flags?.mustCoordinate && <span className="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded font-bold">🚨 תאום</span>}
                  {order.flags?.notifyReady && <span className="text-[10px] bg-yellow-100 text-yellow-800 px-1.5 py-0.5 rounded font-bold">📞 להודיע</span>}
                  {order.flags?.chargeStatus === 'charge' && <span className="text-[10px] bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold">💳 לחייב</span>}
                  {order.flags?.chargeStatus === 'noCharge' && <span className="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded font-bold">🆓 לא לחייב</span>}
                </div>

                {/* פריטים */}
                <ul className="bg-gray-50 rounded-lg border border-gray-100 divide-y divide-gray-100 mb-3 flex-1">
                  {order.items.map((item, idx) => (
                    <li key={idx} className="px-2 py-1.5 flex items-start gap-2 text-xs">
                      <span className={`font-black px-1.5 py-0.5 rounded min-w-[28px] text-center border shrink-0 ${item.qty === '-' ? 'bg-gray-100 text-gray-500 border-gray-200' : 'bg-purple-100 text-purple-800 border-purple-200'}`}>{item.qty}</span>
                      <div className="flex-1 min-w-0">
                        <span className="font-bold text-gray-800">{item.name}</span>
                        {item.notes && <div className="text-red-500 font-medium">✂️ {item.notes}</div>}
                      </div>
                    </li>
                  ))}
                </ul>

                {/* תצוגת אריזה להזמנות שהסתיימו */}
                {dimmed && order.packaging && (order.packaging.cartons || order.packaging.bags || order.packaging.fishBags) && (
                  <div className="mt-2 bg-green-50 border border-green-200 rounded-lg px-3 py-2 flex flex-wrap gap-3 text-xs font-bold text-green-800">
                    {order.packaging.cartons > 0 && <span>📦 {order.packaging.cartons} קרטונים</span>}
                    {order.packaging.bags > 0 && <span>🛍️ {order.packaging.bags} שקיות</span>}
                    {order.packaging.fishBags > 0 && <span>🐟 {order.packaging.fishBags} שקיות דגים</span>}
                  </div>
                )}

                {/* כפתורים */}
                {!dimmed && (
                  <div className="flex gap-2 flex-wrap" onClick={e => e.stopPropagation()}>
                    <Button variant="secondary" icon={Icons.Printer} className="text-xs px-2 py-1.5 flex-1" onClick={() => setActivePrintOrder(order)}>בון</Button>
                    {order.status === 'packing'
                      ? <Button variant="success" icon={Icons.CheckCircle} className="text-xs px-2 py-1.5 flex-1 bg-green-500" onClick={() => requestComplete(order.id)}>סיום ✓</Button>
                      : <Button icon={Icons.Package} className="text-xs px-2 py-1.5 flex-1 bg-orange-500 hover:bg-orange-600 text-white border border-orange-600" onClick={() => moveToPacking(order.id)}>לאריזה 📦</Button>
                    }
                  </div>
                )}
              </div>
            );

            const renderKashrutGroups = (arr, dimmed = false, draggable = false) => {
              if (arr.length === 0) return (
                <div className="text-center text-gray-400 text-sm py-6 border-2 border-dashed border-gray-200 rounded-xl">אין הזמנות</div>
              );
              const groups = {};
              sortByKashrut(arr).forEach(o => {
                const k = o.kashrut || 'ללא כשרות';
                if (!groups[k]) groups[k] = [];
                groups[k].push(o);
              });
              return Object.entries(groups).map(([kashrut, list]) => (
                <div key={kashrut} className="mb-3">
                  <div className="text-[11px] font-black text-gray-500 uppercase tracking-widest mb-1.5 px-1 flex items-center gap-1">
                    <span className="w-2 h-2 rounded-full bg-purple-400 inline-block"></span> {kashrut} ({list.length})
                  </div>
                  <div className="space-y-2">
                    {list.map(o => renderOrderCard(o, dimmed, draggable))}
                  </div>
                </div>
              ));
            };

            const colHeader = (title, count, color, icon) => (
              <div className={`flex items-center gap-2 mb-3 p-3 rounded-xl ${color}`}>
                <span className="text-lg">{icon}</span>
                <div>
                  <div className="font-extrabold text-sm">{title}</div>
                  <div className="text-xs opacity-70">{count} הזמנות</div>
                </div>
              </div>
            );

            return (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-5 items-start">
                {/* עמודה 1 — הזמנות חדשות */}
                <div>
                  {colHeader('הזמנות חדשות', newOrders.length, 'bg-red-50 text-red-800 border border-red-200', '🆕')}
                  {renderKashrutGroups(newOrders)}
                </div>

                {/* עמודה 2 — בעבודה */}
                <div>
                  {colHeader('בעבודה', assignedOrders.length, 'bg-orange-50 text-orange-800 border border-orange-200', '🔪')}
                  {renderKashrutGroups(assignedOrders, false, true)}
                  {assignedOrders.length > 0 && (
                    <div className="mt-2 text-center text-xs text-orange-400 font-medium">לחץ "לאריזה 📦" כשהקצב סיים</div>
                  )}
                </div>

                {/* עמודה 3 — באריזה */}
                <div
                  onDragOver={e => { e.preventDefault(); setIsDragOver(true); }}
                  onDragLeave={() => setIsDragOver(false)}
                  onDrop={() => { if (draggingId) { moveToPacking(draggingId); setDraggingId(null); } setIsDragOver(false); }}
                  className={`rounded-xl transition-all ${isDragOver ? 'ring-4 ring-yellow-400 ring-offset-2 bg-yellow-50/50' : ''}`}
                >
                  {colHeader('באריזה', packingOrders.length, 'bg-yellow-50 text-yellow-800 border border-yellow-200', '📦')}
                  {isDragOver && (
                    <div className="mb-3 border-2 border-dashed border-yellow-400 rounded-xl p-4 text-center text-yellow-700 font-bold text-sm bg-yellow-50 animate-pulse">
                      שחרר כאן להעברה לאריזה 📦
                    </div>
                  )}
                  {renderKashrutGroups(packingOrders, false, false)}
                  {packingOrders.length > 0 && (
                    <div className="mt-2 text-center text-xs text-yellow-600 font-medium">לחץ "סיום ✓" לאחר האריזה</div>
                  )}
                </div>
              </div>
            );
          })()}

          {/* מודאל הזמנה חדשה */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white rounded-2xl shadow-xl border border-purple-100 w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden animate-in zoom-in-95 duration-200">
                <div className="p-4 bg-purple-50 border-b border-purple-100 flex items-center justify-between shrink-0">
                  <h3 className="font-bold text-lg flex items-center gap-2 text-purple-800"><Icons.ClipboardList className="w-5 h-5" /> {editingOrder ? `עריכת הזמנה #${editingOrder.id}` : 'טופס הזמנה מלא (כמו בנייר)'}</h3>
                  <button onClick={closeModal} className="p-1 rounded-lg text-gray-400 hover:bg-gray-200 hover:text-gray-700"><Icons.X className="w-5 h-5" /></button>
                </div>
                
                <form onSubmit={handleAddOrder} className="overflow-y-auto p-5 space-y-6 flex-1 custom-scrollbar bg-gray-50/30">
                  
                  {formErrorMessage && (
                    <div className="bg-red-50 border-r-4 border-red-500 p-3.5 rounded-lg text-red-800 text-sm font-bold flex justify-between items-center animate-bounce">
                      <span>⚠️ {formErrorMessage}</span>
                      <button type="button" onClick={() => setFormErrorMessage('')} className="text-red-600 hover:text-red-800 text-lg font-bold">✕</button>
                    </div>
                  )}

                  {/* סוג הזמנה */}
                  <div className="grid grid-cols-2 gap-3">
                    <label className={`cursor-pointer border rounded-lg p-2.5 text-center transition-all ${orderType === 'delivery' ? 'bg-purple-50 border-purple-500 text-purple-700 font-bold' : 'bg-white border-gray-200 text-gray-600'}`}>
                      <input type="radio" name="modalOrderType" value="delivery" className="hidden" checked={orderType === 'delivery'} onChange={() => setOrderType('delivery')} />
                      משלוח
                    </label>
                    <label className={`cursor-pointer border rounded-lg p-2.5 text-center transition-all ${orderType === 'pickup' ? 'bg-purple-50 border-purple-500 text-purple-700 font-bold' : 'bg-white border-gray-200 text-gray-600'}`}>
                      <input type="radio" name="modalOrderType" value="pickup" className="hidden" checked={orderType === 'pickup'} onChange={() => setOrderType('pickup')} />
                      איסוף בחנות
                    </label>
                  </div>

                  {/* פרטי לקוח */}
                  <div className="bg-white p-4 rounded-lg border border-gray-200 space-y-3 shadow-sm">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <input type="text" required value={customerName} onChange={e => setCustomerName(e.target.value)} placeholder="שם הלקוח *" className="w-full p-2.5 border border-gray-300 rounded-md text-sm outline-none font-bold" />
                      <div className="flex gap-2">
                        <input type="tel" required value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} placeholder="טלפון *" className="w-1/2 p-2.5 border border-gray-300 rounded-md text-sm outline-none font-bold" />
                        <input type="tel" value={customerMobile} onChange={e => setCustomerMobile(e.target.value)} placeholder="נייד" className="w-1/2 p-2.5 border border-gray-300 rounded-md text-sm outline-none" />
                      </div>
                    </div>

                    {orderType === 'delivery' ? (
                      <div className="space-y-2 pt-2 border-t border-gray-100">
                        <div className="flex gap-2">
                          <select required={orderType === 'delivery'} value={neighborhood}
                            onChange={e => { setNeighborhood(e.target.value); setStreet(''); }}
                            className="w-1/2 p-2.5 border border-gray-300 rounded-md text-sm bg-white">
                            <option value="">-- שכונה *</option>
                            {neighborhoodData.map(n => <option key={n.id} value={n.name}>{n.name}</option>)}
                          </select>
                          <select value={street} onChange={e => setStreet(e.target.value)}
                            className="w-1/2 p-2.5 border border-gray-300 rounded-md text-sm bg-white"
                            disabled={!neighborhood}>
                            <option value="">-- רחוב</option>
                            {(neighborhoodData.find(n => n.name === neighborhood)?.streets || []).map(s => (
                              <option key={s} value={s}>{s}</option>
                            ))}
                          </select>
                        </div>
                        <div className="flex gap-2">
                          <input type="text" value={entrance} onChange={e => setEntrance(e.target.value)} placeholder="כניסה" className="w-1/3 p-2.5 border border-gray-300 rounded-md text-sm text-center" />
                          <input type="text" value={floor} onChange={e => setFloor(e.target.value)} placeholder="קומה" className="w-1/3 p-2.5 border border-gray-300 rounded-md text-sm text-center" />
                          <input type="text" value={apt} onChange={e => setApt(e.target.value)} placeholder="דירה" className="w-1/3 p-2.5 border border-gray-300 rounded-md text-sm text-center" />
                        </div>
                        <div className="flex items-center gap-2 pt-1">
                          <span className="text-sm text-gray-500 font-bold whitespace-nowrap">תאריך משלוח:</span>
                          <input type="date" value={deliveryDate} onChange={e => setDeliveryDate(e.target.value)} className="flex-1 p-2.5 border border-gray-300 rounded-md text-sm" />
                        </div>
                      </div>
                    ) : (
                      <div className="flex items-center gap-2 pt-2 border-t border-gray-100">
                        <span className="text-sm text-gray-500 font-bold">שעת איסוף בחנות:</span>
                        <input type="time" value={pickupTime} onChange={e => setPickupTime(e.target.value)} className="w-40 p-2.5 border border-gray-300 rounded-md text-sm" />
                      </div>
                    )}
                  </div>

                  {/* כשרות וסימונים */}
                  <div className="bg-white p-4 rounded-lg border border-gray-200 grid grid-cols-2 gap-4 shadow-sm">
                    <div>
                      <label className="block text-xs font-bold text-gray-400 uppercase mb-2">כשרות כללית להזמנה</label>
                      <select value={kashrut} onChange={e => setKashrut(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-purple-50 focus:ring-2 focus:ring-purple-400 outline-none font-bold text-purple-900">
                        <option value="" disabled>-- בחר כשרות --</option>
                        {kashrutList.map(k => <option key={k.id} value={k.name}>{k.name}</option>)}
                      </select>
                    </div>
                    <div>
                       <label className="block text-xs font-bold text-gray-400 uppercase mb-2">שיוך לקצב</label>
                       <select value={assignedButcher} onChange={e => setAssignedButcher(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-orange-50 focus:ring-2 focus:ring-orange-400 outline-none font-bold text-orange-900 mb-3">
                         <option value="">-- ללא שיוך --</option>
                         {butchersList.map(b => <option key={b.id} value={b.name}>{b.name}</option>)}
                       </select>
                       <label className="block text-xs font-bold text-gray-400 uppercase mb-2">סימונים למוכר</label>
                       <div className="flex flex-col gap-2 text-sm text-gray-700">
                         <div className="flex gap-3">
                           <label className="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="chargeStatus" value="charge" checked={chargeStatus === 'charge'} onChange={e => setChargeStatus(e.target.value)} className="accent-purple-600" /> לחייב</label>
                           <label className="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="chargeStatus" value="noCharge" checked={chargeStatus === 'noCharge'} onChange={e => setChargeStatus(e.target.value)} className="accent-purple-600" /> לא לחייב</label>
                         </div>
                         <label className="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked={flags.mustCoordinate} onChange={e => setFlags({...flags, mustCoordinate: e.target.checked})} className="accent-purple-600" /> לתאם חובה</label>
                         <label className="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked={flags.notifyReady} onChange={e => setFlags({...flags, notifyReady: e.target.checked})} className="accent-purple-600" /> להודיע שמוכן</label>
                       </div>
                    </div>
                  </div>

                  {/* ----------------- טבלת המלאי המלאה ----------------- */}
                  <div className="pt-4 border-t border-gray-200">
                    <h3 className="font-extrabold text-lg text-gray-800 mb-4">רשימת מוצרים והוראות (הזן כמות במוצרים הרצויים)</h3>
                    
                    {renderItemCategory('עוף')}
                    {renderItemCategory('הודו')}
                    {renderItemCategory('בשר ואחרים')}
                    {renderItemCategory('דגים')}
                  </div>

                  <div className="pt-4 flex gap-3 sticky bottom-0 bg-gray-50/95 p-4 -mx-5 -mb-5 border-t border-gray-200 backdrop-blur-sm">
                    <Button type="button" variant="outline" className="flex-1" onClick={closeModal}>ביטול</Button>
                    <Button type="submit" variant="purple" icon={Icons.Send} className="flex-1 py-3 text-base shadow-lg font-bold">שגר הזמנה לקצביה</Button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* מודאל אריזה */}
          {packagingModal && (() => {
            const order = orders.find(o => o.id === packagingModal);
            return (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-in fade-in duration-200">
                <div className="bg-white rounded-2xl shadow-xl border border-green-100 w-full max-w-sm animate-in zoom-in-95 duration-200">
                  <div className="p-4 bg-green-50 border-b border-green-100 flex items-center justify-between">
                    <div>
                      <h3 className="font-bold text-green-900 flex items-center gap-2">
                        <Icons.Package className="w-5 h-5" /> פרטי אריזה למשלוח
                      </h3>
                      {order && <p className="text-xs text-green-700 mt-0.5">הזמנה #{order.id} — {order.customer}</p>}
                    </div>
                    <button onClick={() => setPackagingModal(null)} className="p-1 rounded-lg text-gray-400 hover:bg-gray-200">
                      <Icons.X className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="p-5 space-y-4">
                    <div className="grid grid-cols-3 gap-3">
                      <div className="text-center">
                        <div className="text-2xl mb-1">📦</div>
                        <label className="block text-xs font-bold text-gray-500 mb-1.5">קרטונים</label>
                        <input type="number" min="0" step="1" placeholder="0"
                          value={packagingData.cartons}
                          onChange={e => setPackagingData(p => ({ ...p, cartons: e.target.value }))}
                          className="w-full p-2 text-center text-lg font-black border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none" />
                      </div>
                      <div className="text-center">
                        <div className="text-2xl mb-1">🛍️</div>
                        <label className="block text-xs font-bold text-gray-500 mb-1.5">שקיות</label>
                        <input type="number" min="0" step="1" placeholder="0"
                          value={packagingData.bags}
                          onChange={e => setPackagingData(p => ({ ...p, bags: e.target.value }))}
                          className="w-full p-2 text-center text-lg font-black border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none" />
                      </div>
                      <div className="text-center">
                        <div className="text-2xl mb-1">🐟</div>
                        <label className="block text-xs font-bold text-gray-500 mb-1.5">שקיות דגים</label>
                        <input type="number" min="0" step="1" placeholder="0"
                          value={packagingData.fishBags}
                          onChange={e => setPackagingData(p => ({ ...p, fishBags: e.target.value }))}
                          className="w-full p-2 text-center text-lg font-black border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none" />
                      </div>
                    </div>
                  </div>

                  <div className="p-4 border-t border-gray-100 flex gap-3">
                    <Button variant="outline" className="flex-1" onClick={() => setPackagingModal(null)}>ביטול</Button>
                    <Button variant="success" icon={Icons.CheckCircle} className="flex-1 bg-green-600 py-2.5 font-bold" onClick={confirmComplete}>
                      אשר וסמן הושלם
                    </Button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* מודאל תצוגת בון A5 ריאליסטית לפני הדפסה */}
          {activePrintOrder && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white rounded-2xl shadow-2xl border border-gray-300 w-full max-w-xl max-h-[92vh] flex flex-col overflow-hidden">
                <div className="p-4 bg-gray-100 border-b border-gray-200 flex items-center justify-between shrink-0">
                  <h3 className="font-bold text-gray-800 flex items-center gap-2"><Icons.Printer className="w-5 h-5" /> תצוגת בון לפני הדפסה (A5)</h3>
                  <button onClick={() => setActivePrintOrder(null)} className="p-1 rounded-lg text-gray-400 hover:bg-gray-200 hover:text-gray-700"><Icons.X className="w-5 h-5" /></button>
                </div>

                {/* תצוגת נייר A5 ריאליסטית */}
                <div className="overflow-y-auto p-6 flex-1 bg-gray-300/50 flex justify-center items-center custom-scrollbar">
                  <div 
                    id="physical-print-slip-area" 
                    className="bg-white p-8 rounded-lg border-2 border-dashed border-gray-400 max-w-[148mm] w-full min-h-[210mm] shadow-2xl text-black relative animate-in zoom-in-95 duration-200"
                    style={{ fontFamily: 'Assistant, sans-serif' }}
                  >
                    <div className="text-center text-xs font-bold tracking-widest mb-1">בס"ד</div>
                    
                    <PoultryLogo className="h-20 object-contain mx-auto mb-2" />

                    <div className="grid grid-cols-3 gap-2 text-xs font-bold border-b border-black pb-2 mb-3">
                      <div className="flex items-center gap-1">
                        <span className="text-lg leading-none">{activePrintOrder.flags?.chargeStatus === 'noCharge' ? '☑' : '☐'}</span>
                        <span>לא לחייב</span>
                      </div>
                      <div className="flex items-center gap-1">
                        <span className="text-lg leading-none">{activePrintOrder.flags?.mustCoordinate ? '☑' : '☐'}</span>
                        <span>לתאם חובה</span>
                      </div>
                      <div className="flex items-center gap-1">
                        <span className="text-lg leading-none">{activePrintOrder.flags?.notifyReady ? '☑' : '☐'}</span>
                        <span>להודיע שמוכן</span>
                      </div>
                    </div>

                    <div className="border border-black p-2 rounded mb-3 text-xs space-y-1.5 bg-gray-50/50">
                      <div className="flex justify-between font-extrabold border-b border-gray-200 pb-1 mb-1">
                        <span>סוג: {activePrintOrder.type === 'delivery' ? '🚚 משלוח היום' : '🏪 איסוף בחנות'}</span>

                        {activePrintOrder.items.map((item, idx) => (

    // --- Deliveries View ---
    const DeliveriesView = ({ orders, setOrders, couriersList, kashrutList }) => {
      const [activeTab, setActiveTab] = useState('delivery');
      const [routeMode, setRouteMode] = useState(false);
      const [routeStops, setRouteStops] = useState([]); // [{orderId, address, customer}]
      const [origin, setOrigin] = useState(''); // נקודת מוצא

      const deliveryOrders = orders.filter(o => o.type === 'delivery' && o.status === 'completed');
      const pickupOrders   = orders.filter(o => o.type === 'pickup'   && o.status === 'completed');

      const buildAddress = (order) => {
        const parts = [order.street, order.neighborhood].filter(Boolean);
        if (order.floor) parts.push(`קומה ${order.floor}`);
        return parts.join(', ') + ', ישראל';
      };

      const toggleStop = (order) => {
        const exists = routeStops.find(s => s.orderId === order.id);
        if (exists) {
          setRouteStops(prev => prev.filter(s => s.orderId !== order.id));
        } else {
          setRouteStops(prev => [...prev, {
            orderId: order.id,
            customer: order.customer,
            address: buildAddress(order),
            neighborhood: order.neighborhood
          }]);
        }
      };

      const moveStop = (idx, dir) => {
        setRouteStops(prev => {
          const arr = [...prev];
          const target = idx + dir;
          if (target < 0 || target >= arr.length) return arr;
          [arr[idx], arr[target]] = [arr[target], arr[idx]];
          return arr;
        });
      };

      const openGoogleMaps = () => {
        const stops = origin ? [origin, ...routeStops.map(s => s.address)] : routeStops.map(s => s.address);
        if (stops.length < 1) return;
        const encoded = stops.map(s => encodeURIComponent(s)).join('/');
        const url = `https://www.google.com/maps/dir/${encoded}`;
        window.open(url, '_blank');
      };

      const markAsDone = (orderId) => {
        setOrders(orders.map(o => o.id === orderId ? { ...o, status: 'delivered' } : o));
      };

      const assignCourier = (orderId, courierId) => {
        setOrders(orders.map(o => o.id === orderId ? { ...o, courier: courierId } : o));
      };

      const renderCard = (order, isDelivery) => (
        <div key={order.id} className="bg-white rounded-xl border border-gray-200 shadow-sm flex flex-col hover:shadow-md transition-shadow overflow-hidden">
          {/* שם */}
          <div className="px-4 pt-4 pb-2">
            <div className="font-extrabold text-lg text-gray-900">{order.customer}</div>
            <div className="text-xs text-gray-400 flex items-center gap-2 mt-0.5">
              <span>#{order.id}</span>
              {order.phone && <span><Icons.Phone className="w-3 h-3 inline ml-0.5 text-gray-400" />{order.phone}</span>}
              {order.mobile && <span><Icons.Phone className="w-3 h-3 inline ml-0.5 text-gray-400" />{order.mobile}</span>}
            </div>
          </div>

          {/* כתובת — משלוח בלבד */}
          {isDelivery && (
            <div className="px-4 py-2 bg-blue-50/60 border-y border-blue-100 text-sm text-blue-900 font-medium">
              <Icons.MapPin className="w-3.5 h-3.5 inline ml-1 text-blue-500" />
              {order.neighborhood && <strong>{order.neighborhood} — </strong>}
              {order.street}{order.entrance ? ` כניסה ${order.entrance}` : ''}{order.floor ? ` קומה ${order.floor}` : ''}{order.apt ? ` דירה ${order.apt}` : ''}
            </div>
          )}

          {/* אריזה */}
          <div className="px-4 py-3 flex gap-3 flex-wrap">
            {order.packaging?.cartons > 0 && (
              <div className="flex flex-col items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 min-w-[64px]">
                <span className="text-xl">📦</span>
                <span className="font-black text-lg text-gray-900">{order.packaging.cartons}</span>
                <span className="text-[10px] text-gray-400 font-bold">קרטונים</span>
              </div>
            )}
            {order.packaging?.bags > 0 && (
              <div className="flex flex-col items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 min-w-[64px]">
                <span className="text-xl">🛍️</span>
                <span className="font-black text-lg text-gray-900">{order.packaging.bags}</span>
                <span className="text-[10px] text-gray-400 font-bold">שקיות</span>
              </div>
            )}
            {order.packaging?.fishBags > 0 && (
              <div className="flex flex-col items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 min-w-[64px]">
                <span className="text-xl">🐟</span>
                <span className="font-black text-lg text-gray-900">{order.packaging.fishBags}</span>
                <span className="text-[10px] text-gray-400 font-bold">שקיות דגים</span>
              </div>
            )}
            {!order.packaging?.cartons && !order.packaging?.bags && !order.packaging?.fishBags && (
              <span className="text-xs text-gray-400 italic">לא הוזנו פרטי אריזה</span>
            )}
          </div>

          {/* שיוך שליח + כפתור */}
          <div className="p-3 border-t border-gray-100 space-y-2 mt-auto">
            {isDelivery && (
              <select value={order.courier || ''} onChange={e => assignCourier(order.id, e.target.value)}
                className="w-full p-2 border border-gray-200 rounded-lg text-sm font-bold bg-gray-50 outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- שיוך לשליח --</option>
                {couriersList.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            )}
            <Button variant="success" icon={Icons.CheckCircle}
              className="w-full bg-green-600 hover:bg-green-700 py-2.5 font-bold justify-center"
              onClick={() => markAsDone(order.id)}>
              {isDelivery ? 'נמסר ללקוח ✓' : 'נאסף בחנות ✓'}
            </Button>
          </div>
        </div>
      );

      const activeOrders = activeTab === 'delivery' ? deliveryOrders : pickupOrders;
      const isDelivery = activeTab === 'delivery';

      return (
        <div className="animate-in fade-in duration-300">
          <div className="mb-5 flex flex-wrap items-start justify-between gap-3">
            <div>
              <h1 className="text-3xl font-extrabold text-gray-900">מערך משלוחים והפצה</h1>
              <p className="text-gray-500 mt-1">הזמנות מוכנות הממתינות למסירה או לאיסוף</p>
            </div>
            {activeTab === 'delivery' && deliveryOrders.length > 0 && (
              <button onClick={() => { setRouteMode(!routeMode); setRouteStops([]); }}
                className={`flex items-center gap-2 px-4 py-2.5 font-bold text-sm rounded-xl shadow-sm transition-colors border-2 ${routeMode ? 'bg-green-600 text-white border-green-600' : 'bg-white text-green-700 border-green-300 hover:bg-green-50'}`}>
                🗺️ {routeMode ? 'סגור בניית מסלול' : 'בנה מסלול משלוחים'}
              </button>
            )}
          </div>

          {/* בניית מסלול */}
          {routeMode && activeTab === 'delivery' && (
            <div className="mb-6 bg-white rounded-2xl border-2 border-green-200 shadow-sm overflow-hidden">
              <div className="p-4 bg-green-50 border-b border-green-100 flex items-center gap-3">
                <span className="text-2xl">🗺️</span>
                <div>
                  <h3 className="font-extrabold text-green-900">בניית מסלול משלוחים</h3>
                  <p className="text-xs text-green-700">בחר הזמנות, סדר את העצירות, ופתח בגוגל מפות</p>
                </div>
              </div>

              <div className="p-4 grid grid-cols-1 md:grid-cols-2 gap-5">
                {/* בחירת עצירות */}
                <div>
                  <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">בחר הזמנות למסלול</div>
                  <div className="space-y-2 max-h-64 overflow-y-auto custom-scrollbar">
                    {deliveryOrders.map(order => {
                      const selected = !!routeStops.find(s => s.orderId === order.id);
                      return (
                        <label key={order.id} className={`flex items-center gap-3 p-3 rounded-xl border-2 cursor-pointer transition-all ${selected ? 'border-green-400 bg-green-50' : 'border-gray-200 hover:border-gray-300'}`}>
                          <input type="checkbox" checked={selected} onChange={() => toggleStop(order)} className="accent-green-600 w-4 h-4" />
                          <div className="flex-1 min-w-0">
                            <div className="font-bold text-sm text-gray-900">{order.customer}</div>
                            <div className="text-xs text-gray-500 truncate">
                              <Icons.MapPin className="w-3 h-3 inline ml-0.5" />
                              {order.neighborhood}{order.street ? ` — ${order.street}` : ''}
                            </div>
                          </div>
                        </label>
                      );
                    })}
                  </div>
                </div>

                {/* סדר המסלול */}
                <div>
                  <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">סדר עצירות ({routeStops.length} נבחרו)</div>

                  {/* נקודת מוצא */}
                  <div className="mb-3">
                    <label className="block text-xs font-bold text-gray-500 mb-1">📍 נקודת מוצא (אופציונלי)</label>
                    <input type="text" value={origin} onChange={e => setOrigin(e.target.value)}
                      placeholder="למשל: סופר עוף, ירושלים"
                      className="w-full p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-green-400" />
                  </div>

                  {routeStops.length === 0 ? (
                    <div className="text-center py-8 text-gray-400 text-sm border-2 border-dashed border-gray-200 rounded-xl">בחר הזמנות מהרשימה</div>
                  ) : (
                    <div className="space-y-2 max-h-48 overflow-y-auto custom-scrollbar">
                      {routeStops.map((stop, idx) => (
                        <div key={stop.orderId} className="flex items-center gap-2 bg-gray-50 rounded-xl p-2.5 border border-gray-200">
                          <span className="w-6 h-6 rounded-full bg-green-600 text-white text-xs font-black flex items-center justify-center shrink-0">{idx + 1}</span>
                          <div className="flex-1 min-w-0">
                            <div className="font-bold text-sm text-gray-900 truncate">{stop.customer}</div>
                            <div className="text-[10px] text-gray-500 truncate">{stop.neighborhood}</div>
                          </div>
                          <div className="flex flex-col gap-0.5">
                            <button onClick={() => moveStop(idx, -1)} disabled={idx === 0}
                              className="text-gray-400 hover:text-gray-700 disabled:opacity-30 text-xs leading-none px-1">▲</button>
                            <button onClick={() => moveStop(idx, 1)} disabled={idx === routeStops.length - 1}
                              className="text-gray-400 hover:text-gray-700 disabled:opacity-30 text-xs leading-none px-1">▼</button>
                          </div>
                          <button onClick={() => toggleStop({ id: stop.orderId })} className="text-gray-300 hover:text-red-400 transition-colors">
                            <Icons.X className="w-4 h-4" />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}

                  <button
                    onClick={openGoogleMaps}
                    disabled={routeStops.length === 0}
                    className="mt-4 w-full py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all disabled:opacity-40 disabled:cursor-not-allowed bg-green-600 hover:bg-green-700 text-white shadow-md">
                    <span>🗺️</span> פתח מסלול בגוגל מפות ({routeStops.length} עצירות)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* טאבים */}
          <div className="flex gap-2 mb-6">
            <button onClick={() => setActiveTab('delivery')}
              className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all border-2 flex items-center justify-center gap-2 ${activeTab === 'delivery' ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-blue-700 border-blue-200 hover:bg-blue-50'}`}>
              🚚 משלוחים
              {deliveryOrders.length > 0 && <span className={`text-xs px-1.5 py-0.5 rounded-full font-black ${activeTab === 'delivery' ? 'bg-white/30' : 'bg-blue-100'}`}>{deliveryOrders.length}</span>}
            </button>
            <button onClick={() => setActiveTab('pickup')}
              className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all border-2 flex items-center justify-center gap-2 ${activeTab === 'pickup' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-indigo-700 border-indigo-200 hover:bg-indigo-50'}`}>
              🏪 איסוף בחנות
              {pickupOrders.length > 0 && <span className={`text-xs px-1.5 py-0.5 rounded-full font-black ${activeTab === 'pickup' ? 'bg-white/30' : 'bg-indigo-100'}`}>{pickupOrders.length}</span>}
            </button>
          </div>

          {activeOrders.length === 0 ? (
            <div className="flex flex-col items-center justify-center p-12 bg-white rounded-xl border border-dashed border-gray-300 text-gray-400">
              <span className="text-4xl mb-3 opacity-30">{isDelivery ? '🚚' : '🏪'}</span>
              <h2 className="text-xl font-bold text-gray-500">אין {isDelivery ? 'משלוחים' : 'איסופים'} ממתינים</h2>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              {activeOrders.map(order => renderCard(order, isDelivery))}
            </div>
          )}
        </div>
      );
    };

    // --- ListEditor Helpers ---
    const ListEditor = ({ title, items, setItems, placeholder, showColor = false }) => {
      const [newItemName, setNewItemName] = useState('');
      const [newItemColor, setNewItemColor] = useState('#6366f1');

      const handleAdd = (e) => {
        e.preventDefault();
        if (!newItemName.trim()) return;
        const newItem = { id: Date.now().toString(), name: newItemName };
        if (showColor) newItem.color = newItemColor;
        setItems([...items, newItem]);
        setNewItemName('');
        setNewItemColor('#6366f1');
      };

      const handleRemove = (id) => setItems(items.filter(p => p.id !== id));

      const handleColorChange = (id, color) => {
        setItems(items.map(item => item.id === id ? { ...item, color } : item));
      };

      return (
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <div className="p-4 border-b border-gray-200 bg-gray-50">
            <h3 className="font-bold text-lg text-gray-800">{title}</h3>
          </div>

          <div className="p-5 border-b border-gray-100 bg-white">
            <form onSubmit={handleAdd} className="flex gap-3 max-w-md items-center">
              {showColor && (
                <input type="color" value={newItemColor} onChange={e => setNewItemColor(e.target.value)}
                  className="w-10 h-10 rounded-lg border border-gray-300 cursor-pointer p-0.5" title="בחר צבע" />
              )}
              <input type="text" value={newItemName} onChange={e => setNewItemName(e.target.value)}
                placeholder={placeholder}
                className="flex-1 p-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
              <Button type="submit" variant="primary" icon={Icons.Plus}>הוסף</Button>
            </form>
          </div>

          <div className="overflow-x-auto max-h-60 custom-scrollbar">
            <table className="w-full text-right relative">
