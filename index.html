        const target = route || { id: Date.now(), name: `סבב ${routes.length + 1}`, time: '', courier: '', date: today };
        const base = route ? Math.max(0, ...route.stops.map(s => s.route.seq || 0)) + 1 : 0;
        const ids = [...selected];
        const meta = { id: target.id, name: target.name, time: target.time, courier: target.courier, date: target.date || today };
        setOrders(prev => prev.map(o => ids.includes(o.id) ? { ...o, route: { ...meta, seq: base + ids.indexOf(o.id) }, delivery: null } : o));
        setSelected([]);
      };
      const updateRoute = (rid, patch) => setOrders(prev => prev.map(o => o.route?.id === rid ? { ...o, route: { ...o.route, ...patch } } : o));
      const reorder = (route, newStops) => {
        const seqOf = new Map(newStops.map((s, i) => [s.id, i]));
        setOrders(prev => prev.map(o => seqOf.has(o.id) ? { ...o, route: { ...o.route, seq: seqOf.get(o.id) } } : o));
      };
      const moveStop = (route, idx, dir) => {
        const arr = [...route.stops]; const j = idx + dir;
        if (j < 0 || j >= arr.length) return;
        [arr[idx], arr[j]] = [arr[j], arr[idx]]; reorder(route, arr);
      };
      const sortByHood = (route) => reorder(route, [...route.stops].sort((a, b) =>
        (a.status === 'delivered') - (b.status === 'delivered') || hoodIdx(a.neighborhood) - hoodIdx(b.neighborhood) || (a.street || '').localeCompare(b.street || '', 'he')));
      const removeFromRoute = (o) => updateOrder(o.id, x => ({ ...x, route: null, delivery: null }));
      const openGoogleMaps = (route) => {
        const stops = route.stops.filter(isPending).slice(0, 10).map(navAddress); // גוגל מקבל עד ~10 עצירות
        if (!stops.length) return;
        const all = origin.trim() ? [origin.trim(), ...stops] : stops;
        window.open('https://www.google.com/maps/dir/' + all.map(encodeURIComponent).join('/'), '_blank');
      };
      const printRoute = (route) => {
        const rows = route.stops.map((o, i) => `<tr><td>${i + 1}</td><td><b>${escHtml(o.customer || '')}</b><br>${escHtml(o.phone || '')}${o.mobile ? ' · ' + escHtml(o.mobile) : ''}</td>
          <td><b>${escHtml(o.street || '')}</b>, ${escHtml(o.neighborhood || '')}${o.city && o.city !== 'ירושלים' ? ', ' + escHtml(o.city) : ''}<br>${escHtml([o.entrance && 'כניסה ' + o.entrance, o.floor && 'קומה ' + o.floor, o.apt && 'דירה ' + o.apt].filter(Boolean).join(' · '))}</td>
          <td>${[o.packaging?.cartons && o.packaging.cartons + ' קרטונים', o.packaging?.bags && o.packaging.bags + ' שקיות', o.packaging?.fishBags && o.packaging.fishBags + ' שק׳ דגים'].filter(Boolean).join('<br>')}</td>
          <td>${o.flags?.mustCoordinate ? 'לתאם!<br>' : ''}${o.collect?.type ? 'לגבות: ' + escHtml(o.collect.type) + (o.collect.amount ? ' ' + escHtml(String(o.collect.amount)) + ' ₪' : '') : ''}</td><td style="width:60px"></td></tr>`).join('');
        const w = window.open('', '_blank');
        if (!w) return;
        w.document.write(`<html dir="rtl"><head><title>${escHtml(route.name)}</title><style>body{font-family:Arial;padding:16px}table{width:100%;border-collapse:collapse;font-size:15px}td,th{border:1px solid #000;padding:6px;vertical-align:top;text-align:right}th{background:#eee}</style></head><body>
          <h2>${escHtml(route.name)}${route.time ? ' · ' + escHtml(route.time) : ''} · ${escHtml(courierName(route.courier))} · ${fmtDay(route.date)}</h2>
          <table><thead><tr><th>#</th><th>לקוח</th><th>כתובת</th><th>אריזה</th><th>הערות</th><th>חתימה</th></tr></thead><tbody>${rows}</tbody></table>
          <script>window.onload=()=>window.print()<\/script></body></html>`);
        w.document.close();
      };

      // --- פעולות שליח / חנות ---
      const markDelivered = (o, collected = '') => {
        updateOrder(o.id, x => ({ ...x, status: 'delivered', delivery: { ...(x.delivery || {}), status: 'done', collected, at: new Date().toISOString(), by: appUser?.username || '' } }));
        setModal(null);
      };
      const markFailed = (o, reason) => {
        updateOrder(o.id, x => ({ ...x, delivery: { ...(x.delivery || {}), status: 'failed', reason, at: new Date().toISOString(), by: appUser?.username || '' } }));
        setModal(null);
      };
      const sendOnWay = (o) => {
        window.open(waLink(o.mobile || o.phone, `שלום ${o.customer || ''}, השליח של סופר עוף בדרך אליכם.`), '_blank');
        updateOrder(o.id, x => ({ ...x, delivery: { ...(x.delivery || {}), onwayAt: hhmm() } }));
      };
      const sendReady = (o) => {
        const text = (waReadyTemplate || DEFAULT_WA_READY).replaceAll('{שם}', o.customer || '').replaceAll('{מספר}', String(o.id));
        window.open(waLink(o.mobile || o.phone, text), '_blank');
        updateOrder(o.id, x => ({ ...x, notifiedAt: `${fmtDay(today)} ${hhmm()}` }));
      };
      const markPicked = (o) => updateOrder(o.id, x => ({ ...x, status: 'delivered', delivery: { status: 'done', at: new Date().toISOString(), by: appUser?.username || '' } }));

      // --- החזרת הזמנה (קיים) ---
      const openReturnModal = (order) => {
        setReturnModal(order); setReturnStep('destination');
        setReturnPackaging({ cartons: order.packaging?.cartons ?? '', bags: order.packaging?.bags ?? '', fishBags: order.packaging?.fishBags ?? '' });
      };
      const confirmReturnToPacking = () => {
        setOrders(prev => prev.map(o => o.id === returnModal.id ? { ...o, status: 'packing', route: null, delivery: null, packaging: {
          cartons: Number(returnPackaging.cartons) || 0, bags: Number(returnPackaging.bags) || 0, fishBags: Number(returnPackaging.fishBags) || 0 } } : o));
        setReturnModal(null);
      };
      const confirmReturnToWork = (butcherName) => {
        setOrders(prev => prev.map(o => o.id === returnModal.id ? { ...o, status: 'new', assignedButcher: butcherName, packaging: undefined, route: null, delivery: null } : o));
        setReturnModal(null);
      };

      // --- רכיבי תצוגה (עיצוב דמו v3) ---
      const KChips = ({ o }) => (
        <>{kashrutsOf(o).map(k => <KChip key={k} k={k} />)}</>
      );
      const Tags = ({ o }) => (
        <div className="so-tags">
          <KChips o={o} />
          {o.city && o.city !== 'ירושלים' && <span className="so-tag city"><LineIcon name="pin" />{o.city} — סבב מיוחד</span>}
          {o.flags?.mustCoordinate && <span className="so-tag warn">לתאם</span>}
          {o.collect?.type && <span className="so-tag pay">לגבות: {o.collect.type}{o.collect.amount ? ` ${o.collect.amount} ₪` : ''}</span>}
          {o.timeString && o.timeString.slice(0, 10) !== today && <span className="so-tag">{fmtDay(o.timeString.slice(0, 10))}</span>}
          {o.delivery?.status === 'done' && <span className="so-tag ok"><LineIcon name="check" />נמסר{o.delivery.collected ? ` · ${o.delivery.collected}` : ''}</span>}
          {o.delivery?.status === 'failed' && <span className="so-tag bad">לא נמסר: {o.delivery.reason}</span>}
          {o.delivery?.onwayAt && o.status === 'completed' && o.delivery?.status !== 'failed' && <span className="so-tag warn">הודעת "בדרך" {o.delivery.onwayAt}</span>}
        </div>
      );
      const Pack = ({ o }) => {
        const p = o.packaging || {};
        const parts = [p.cartons > 0 && `${p.cartons} קרטונים`, p.bags > 0 && `${p.bags} שקיות`, p.fishBags > 0 && `${p.fishBags} שקיות דגים`].filter(Boolean);
        return <div className="so-pk">{parts.length ? parts.map(x => <span key={x}>{x}</span>) : 'לא הוזנו פרטי אריזה'}</div>;
      };
      const addrLine = (o) => [o.street, o.neighborhood, o.city && o.city !== 'ירושלים' ? o.city : ''].filter(Boolean).join(', ');
      const addrExtra = (o) => [o.entrance && `כניסה ${o.entrance}`, o.floor && `קומה ${o.floor}`, o.apt && `דירה ${o.apt}`].filter(Boolean).join(' · ');
      const stopClass = (o) => (o.delivery?.status === 'done' || o.status === 'delivered') ? 'done' : o.delivery?.status === 'failed' ? 'fail' : '';

      const tabs = courierOnly ? [] : [
        { id: 'delivery', label: 'משלוחים וסבבים', ico: 'truck', count: readyDeliveries.length },
        { id: 'pickup', label: 'איסוף בחנות', ico: 'box', count: pickupOrders.length },
        { id: 'mine', label: 'תצוגת שליח', ico: 'phone', count: null },
      ];

      // ===== מסך שליח =====
      const renderCourier = () => {
        const myRoutes = routes.filter(r => r.courier === viewCourier);
        const stops = myRoutes.flatMap(r => r.stops.map(o => ({ o, r })));
        const pending = stops.filter(s => isPending(s.o));
        const next = pending[0];
        const doneN = stops.length - pending.length;
        return (
          <div className="so-cview">
            {!courierOnly && (
              <div className="so-cbanner">
                <LineIcon name="phone" />כך השליח רואה בטלפון:
                <select value={viewCourier} onChange={e => setViewCourier(e.target.value)} aria-label="שליח">
                  {couriersList.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>
            )}
            <div className="so-chead">
              {!courierOnly && <h2>המסלול שלי</h2>}
              <div className="sub">{myRoutes.map(r => `${r.name}${r.time ? ' · ' + r.time : ''}`).join(' / ') || 'אין סבבים כרגע'} · {doneN} מתוך {stops.length} הושלמו</div>
              <div className="so-pbar"><i style={{ width: `${stops.length ? doneN / stops.length * 100 : 0}%` }} /></div>
            </div>
            {next ? (
              <section className="so-next">
                <div className="so-next-h"><span>העצירה הבאה · {stops.indexOf(next) + 1} מתוך {stops.length}</span><span>{next.r.name}</span></div>
                <div className="so-next-b">
                  <div className="nm">{next.o.customer} <small>#{next.o.id}</small></div>
                  <div className="big">{next.o.street || next.o.neighborhood}<div className="hood">{next.o.neighborhood}, {next.o.city || 'ירושלים'}</div></div>
                  {addrExtra(next.o) && <div className="note">{addrExtra(next.o)}</div>}
                  <Tags o={next.o} />
                  <Pack o={next.o} />
                  <div className="so-cbtns">
                    <a href={wazeLink(next.o)} target="_blank" rel="noopener" className="so-cbtn waze"><LineIcon name="nav" />נווט בוויז</a>
                    <a href={`tel:${next.o.mobile || next.o.phone}`} className="so-cbtn"><LineIcon name="phone" />התקשר</a>
                    <button onClick={() => sendOnWay(next.o)} className="so-cbtn wa"><LineIcon name="wa" />"אני בדרך"</button>
                  </div>
                  <div className="so-cdone">
                    <button onClick={() => next.o.collect?.type ? setModal({ type: 'collect', order: next.o }) : markDelivered(next.o)} className="so-bigbtn ok"><LineIcon name="check" />נמסר</button>
                    <button onClick={() => setModal({ type: 'fail', order: next.o })} className="so-bigbtn">לא נמסר</button>
                  </div>
                </div>
              </section>
            ) : (
              <div className="so-subcard so-empty">{stops.length ? 'כל העצירות הושלמו. כל הכבוד!' : 'אין לך סבבים כרגע'}</div>
            )}
            {stops.length > 0 && (
              <section className="so-subcard">
                <div className="so-listh">כל העצירות</div>
                <ol className="so-stops">
                  {stops.map((s, i) => (
                    <li key={s.o.id} className={`so-stop ${stopClass(s.o)}`}>
                      <span className="n">{i + 1}</span>
                      <div className="body"><b>{s.o.customer}</b><span className="addr">{addrLine(s.o)}</span><Tags o={s.o} /></div>
                    </li>
                  ))}
                </ol>
              </section>
            )}
          </div>
        );
      };

      // ===== ניהול סבבים =====
      const renderOffice = () => (
        <div className="so-dlayout">
          <section>
            <div className="so-dcol-h"><h2>ממתינים לשיבוץ</h2><span className="so-tag">{unassigned.length} משלוחים</span></div>
            {selected.length > 0 && (
              <div className="so-assignbar">
                <b>נבחרו {selected.length}</b>
                {routes.map(r => <button key={r.id} onClick={() => addToRoute(r)} className="so-btn">ל{r.name}</button>)}
                <button onClick={() => addToRoute(null)} className="so-btn primary"><LineIcon name="plus" />סבב חדש</button>
              </div>
            )}
            {unassigned.length === 0 && <div className="so-subcard so-empty">אין משלוחים ממתינים לשיבוץ</div>}
            {unassigned.map((o, i) => {
              const sel = selected.includes(o.id);
              const showHood = i === 0 || unassigned[i - 1].neighborhood !== o.neighborhood;
              return (
                <React.Fragment key={o.id}>
                  {showHood && <div className="so-hood-h"><LineIcon name="pin" />{o.neighborhood || 'ללא שכונה'}</div>}
                  <label className={`so-dcard ${sel ? 'sel' : ''}`}>
                    <input type="checkbox" checked={sel} onChange={() => setSelected(p => sel ? p.filter(x => x !== o.id) : [...p, o.id])} />
                    <div className="body">
                      <span className="nm">{o.customer} <small>#{o.id}</small></span>
                      <span className="addr">{addrLine(o)}{addrExtra(o) && <small> · {addrExtra(o)}</small>}</span>
                      <Tags o={o} />
                      <Pack o={o} />
                    </div>
                  </label>
                </React.Fragment>
              );
            })}
          </section>

          <section>
            <div className="so-dcol-h">
              <h2>סבבים היום</h2>
              <input value={origin} onChange={e => { setOrigin(e.target.value); try { localStorage.setItem('so-route-origin', e.target.value); } catch {} }} placeholder="נקודת יציאה (כתובת החנות)" className="so-origin" aria-label="נקודת יציאה" />
            </div>
            {routes.length === 0 && <div className="so-subcard so-empty">עוד אין סבבים — סמני משלוחים ולחצי "סבב חדש"</div>}
            {routes.map(r => {
              const finished = r.stops.filter(s => !isPending(s)).length;
              return (
                <article key={r.id} className="so-route">
                  <div className="so-route-h">
                    <input value={r.name} onChange={e => updateRoute(r.id, { name: e.target.value })} className="so-route-name" aria-label="שם הסבב" />
                    <input type="time" value={r.time || ''} onChange={e => updateRoute(r.id, { time: e.target.value })} aria-label="שעת יציאה" />
                    <select value={r.courier || ''} onChange={e => updateRoute(r.id, { courier: e.target.value })} className={r.courier ? '' : 'missing'} aria-label="שליח">
                      <option value="">— בחרי שליח —</option>
                      {couriersList.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                    <span className="prog">{finished}/{r.stops.length} הושלמו</span>
                  </div>
                  <ol className="so-stops">
                    {r.stops.map((o, idx) => {
                      const done = o.status === 'delivered';
                      return (
                        <li key={o.id} className={`so-stop ${stopClass(o)}`}>
                          <span className="n">{idx + 1}</span>
                          <div className="body">
                            <b>{o.customer} <small>#{o.id}</small></b>
                            <span className="addr">{addrLine(o)}</span>
                            <Tags o={o} />
                          </div>
                          {!done && (
                            <div className="so-stop-act">
                              <div className="arrows">
                                <button onClick={() => moveStop(r, idx, -1)} disabled={idx === 0} aria-label="הזז למעלה"><LineIcon name="up" /></button>
                                <button onClick={() => moveStop(r, idx, 1)} disabled={idx === r.stops.length - 1} aria-label="הזז למטה"><LineIcon name="down" /></button>
                              </div>
                              <button onClick={() => removeFromRoute(o)} className="so-iconbtn" aria-label="הוצא מהסבב" title="הוצא מהסבב"><LineIcon name="x" /></button>
                              <button onClick={() => openReturnModal(o)} className="so-iconbtn" aria-label="החזר הזמנה" title="החזר הזמנה"><LineIcon name="undo" /></button>
                            </div>
                          )}
                        </li>
                      );
                    })}
                  </ol>
                  <div className="so-route-f">
                    <button onClick={() => sortByHood(r)} className="so-btn"><LineIcon name="list" />סדר לפי שכונות</button>
                    <button onClick={() => openGoogleMaps(r)} className="so-btn"><LineIcon name="pin" />מסלול בגוגל מפות</button>
                    <button onClick={() => printRoute(r)} className="so-btn"><LineIcon name="print" />דף מסלול לשליח</button>
                    {r.stops.filter(isPending).length > 10 && <span className="so-hint">גוגל מפות מציג עד 10 עצירות — יוצגו 10 הראשונות</span>}
                  </div>
                </article>
              );
            })}
          </section>
        </div>
      );

      // ===== איסוף בחנות =====
      const renderPickup = () => (
        pickupOrders.length === 0 ? (
          <div className="so-subcard so-empty">אין הזמנות ממתינות לאיסוף</div>
        ) : (
          <div className="so-pcards">
            {pickupOrders.map(o => (
              <article key={o.id} className="so-pcard">
                <div className="so-ohead">
                  <div><b>{o.customer}</b><small>#{o.id} · {o.mobile || o.phone}</small></div>
                  {o.timeString && <span className="so-when">{fmtDay(o.timeString.slice(0, 10))}{o.timeString.includes('T') && o.timeString.split('T')[1] !== '00:00' ? ' ' + o.timeString.split('T')[1] : ''}</span>}
                </div>
                <div className="so-tags">
                  <KChips o={o} />
                  {o.flags?.notifyReady && <span className="so-tag warn">להודיע שמוכן</span>}
                  {o.notifiedAt && <span className="so-tag ok"><LineIcon name="check" />נשלחה הודעה · {o.notifiedAt}</span>}
                </div>
                <Pack o={o} />
                <div className="so-choice">
                  <button onClick={() => sendReady(o)} disabled={!normPhone(o.mobile || o.phone)}
                    className={`so-bigbtn wa ${o.flags?.notifyReady && !o.notifiedAt ? 'strong' : ''}`}>
                    <LineIcon name="wa" />{o.notifiedAt ? 'שלח שוב' : 'וואטסאפ: מוכן'}
                  </button>
                  <button onClick={() => markPicked(o)} className="so-bigbtn dark"><LineIcon name="check" />נאסף</button>
                </div>
                <button onClick={() => openReturnModal(o)} className="so-linkbtn"><LineIcon name="undo" />החזר הזמנה</button>
              </article>
            ))}
          </div>
        )
      );

      return (
        <div>
          {tabs.length > 0 && (
            <div className="so-coldhead">
              <div className="so-seg" role="tablist">
                {tabs.map(t => (
                  <button key={t.id} role="tab" aria-selected={activeTab === t.id} onClick={() => setActiveTab(t.id)}>
                    <LineIcon name={t.ico} />{t.label}{t.count ? <span className="cnt">{t.count}</span> : null}
                  </button>
                ))}
              </div>
            </div>
          )}

          {(courierOnly || activeTab === 'mine') && renderCourier()}
          {!courierOnly && activeTab === 'delivery' && renderOffice()}
          {!courierOnly && activeTab === 'pickup' && renderPickup()}

          {/* חלונות שליח */}
          {modal && (
            <div className="so-modal-bg" onClick={e => { if (e.target === e.currentTarget) setModal(null); }}>
              <div className="so-modal" role="dialog" aria-modal="true">
                {modal.type === 'collect' && (<>
                  <div className="so-modal-h"><h2>{modal.order.customer} — מה נגבה?</h2></div>
                  <div className="so-modal-b">
                    <div className="lead">לגבות: {modal.order.collect.type}{modal.order.collect.amount ? ` על סך ${modal.order.collect.amount} ₪` : ''}</div>
                    <div className="so-choice col">
                      <button onClick={() => markDelivered(modal.order, `נגבה ${modal.order.collect.type}`)} className="so-bigbtn ok">נגבה {modal.order.collect.type}</button>
                      <button onClick={() => markDelivered(modal.order, 'נגבה בתשלום אחר')} className="so-bigbtn">נגבה בתשלום אחר</button>
                      <button onClick={() => markDelivered(modal.order, 'לא נגבה')} className="so-bigbtn bad">נמסר — לא נגבה</button>
                    </div>
                  </div>
                </>)}
                {modal.type === 'fail' && (<>
                  <div className="so-modal-h"><h2>{modal.order.customer} — למה לא נמסר?</h2></div>
                  <div className="so-modal-b">
                    <div className="so-choice">
                      {['לא היה בבית', 'לא עונה לטלפון', 'כתובת שגויה', 'ביקש לדחות', 'אחר'].map(r => (
                        <button key={r} onClick={() => markFailed(modal.order, r)} className="so-bigbtn">{r}</button>
                      ))}
                    </div>
                    <div className="so-hint">ההזמנה נשארת בסבב מסומנת באדום, והמשרד יכול לשבץ אותה מחדש.</div>
                  </div>
                </>)}
                <div className="so-modal-f"><button onClick={() => setModal(null)} className="so-btn">ביטול</button></div>
              </div>
            </div>
          )}

          {/* מודאל החזרת הזמנה */}
          {returnModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl border border-orange-100 w-full max-w-sm">
                <div className="p-4 bg-orange-50 border-b border-orange-100 flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-orange-900">↩ החזרת הזמנה</h3>
                    <p className="text-xs text-orange-700 mt-0.5">#{returnModal.id} — {returnModal.customer}</p>
                  </div>
                  <button onClick={() => setReturnModal(null)} className="p-1 rounded-lg text-gray-400 hover:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
                </div>
                {returnStep === 'destination' && (
                  <div className="p-5 space-y-3">
                    <p className="text-sm font-bold text-gray-700 text-center mb-2">להיכן להחזיר את ההזמנה?</p>
                    <button onClick={() => setReturnStep('butcher')} className="w-full py-4 rounded-xl border-2 border-orange-200 bg-orange-50 hover:bg-orange-100 font-bold text-orange-900 text-base">🔪 החזר לעבודה (קצב)</button>
                    <button onClick={() => setReturnStep('packing')} className="w-full py-4 rounded-xl border-2 border-yellow-200 bg-yellow-50 hover:bg-yellow-100 font-bold text-yellow-900 text-base">📦 החזר לאריזה</button>
                  </div>
                )}
                {returnStep === 'butcher' && (
                  <div className="p-4 space-y-2">
                    <button type="button" onClick={() => setReturnStep('destination')} className="text-xs text-gray-400 hover:text-gray-600 mb-1">← חזור</button>
                    <p className="text-sm font-bold text-gray-700 mb-3">שייך לקצב:</p>
                    {butchersList.length === 0 && <p className="text-sm text-gray-400 text-center py-4">אין קצבים מוגדרים — הוסף בניהול רשימות</p>}
                    {butchersList.map(b => (
                      <button key={b.id} onClick={() => confirmReturnToWork(b.name)} className="w-full py-3 px-4 rounded-xl border-2 border-orange-200 bg-orange-50 hover:bg-orange-100 font-bold text-orange-900 text-base text-right">🔪 {b.name}</button>
                    ))}
                    <button onClick={() => confirmReturnToWork('')} className="w-full py-2.5 px-4 rounded-xl border-2 border-gray-200 bg-gray-50 hover:bg-gray-100 font-bold text-gray-600 text-sm">ללא שיוך לקצב</button>
                  </div>
                )}
                {returnStep === 'packing' && (
                  <div className="p-5 space-y-4">
                    <button type="button" onClick={() => setReturnStep('destination')} className="text-xs text-gray-400 hover:text-gray-600">← חזור</button>
                    <p className="text-sm font-bold text-gray-700">עדכן פרטי אריזה (אם השתנה):</p>
                    <div className="grid grid-cols-3 gap-3">
                      {[['cartons', 'קרטונים'], ['bags', 'שקיות'], ['fishBags', 'שקיות דגים']].map(([k, l]) => (
                        <div key={k} className="text-center">
                          <label className="block text-xs font-bold text-gray-500 mb-1.5">{l}</label>
                          <input type="number" min="0" step="1" placeholder="0" value={returnPackaging[k]}
                            onChange={e => setReturnPackaging(p => ({ ...p, [k]: e.target.value }))}
                            className="w-full p-2 text-center text-lg font-black border-2 border-gray-200 rounded-xl outline-none focus:border-yellow-400" />
                        </div>
                      ))}
                    </div>
                    <div className="flex gap-3 pt-1">
                      <button onClick={() => setReturnModal(null)} className="flex-1 py-2.5 rounded-xl border border-gray-200 text-gray-600 font-bold text-sm">ביטול</button>
                      <button onClick={confirmReturnToPacking} className="flex-1 py-2.5 rounded-xl bg-yellow-500 hover:bg-yellow-600 text-white font-bold text-sm">✅ אשר החזרה לאריזה</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ===[LISTS]===
    // --- ListEditor Helpers ---
    // חלון אישור לפני מחיקה ברשימות — מחיקה כאן נשמרת מיד בשרת ואין "בטל"
    const ConfirmDelete = ({ title, text, onCancel, onConfirm }) => (
      <div className="so-modal-bg" onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
        <div className="so-modal" role="alertdialog" aria-modal="true" aria-label={title}>
          <div className="so-modal-h"><h2>{title}</h2></div>
          <div className="so-modal-b"><div className="lead">{text}</div><div className="so-delwarn">אי אפשר לבטל את המחיקה אחרי האישור.</div></div>
          <div className="so-modal-f" style={{ gap: '.6rem' }}>
            <button className="so-btn" onClick={onCancel} autoFocus>ביטול</button>
            <button className="so-btn danger-solid" onClick={onConfirm}><LineIcon name="trash" />כן, למחוק</button>
          </div>
        </div>
      </div>
    );

    const ListEditor = ({ title, items, setItems, placeholder, showColor = false }) => {
      const [pendingDel, setPendingDel] = useState(null);
      const [newItemName, setNewItemName] = useState('');
      const [newItemColor, setNewItemColor] = useState('#6366f1');

      const handleAdd = (e) => {
        e.preventDefault();
        if (!newItemName.trim()) return;
        const newItem = { id: Date.now().toString(), name: newItemName };
        if (showColor) newItem.color = newItemColor;
        setItems([...items, newItem]);
        setNewItemName('');
        setNewItemColor('#6366f1');
      };

      const handleRemove = (id) => setItems(items.filter(p => p.id !== id));

      const handleColorChange = (id, color) => {
        setItems(items.map(item => item.id === id ? { ...item, color } : item));
      };

      return (
        <section className="so-subcard">
          <div className="so-lhead"><h3>{title}</h3><span className="so-tag">{items.length}</span></div>
          <form onSubmit={handleAdd} className="so-addrow">
            {showColor && (
              <input type="color" value={newItemColor} onChange={e => setNewItemColor(e.target.value)} className="so-color" title="בחר צבע" aria-label="צבע" />
            )}
            <input type="text" value={newItemName} onChange={e => setNewItemName(e.target.value)} placeholder={placeholder} className="so-input" />
            <button type="submit" className="so-btn primary"><LineIcon name="plus" />הוסף</button>
          </form>
          <ul className="so-litems">
            {items.map(item => (
              <li key={item.id}>
                {showColor && (
                  <input type="color" value={item.color || '#6366f1'} onChange={e => handleColorChange(item.id, e.target.value)} className="so-color sm" aria-label={`צבע — ${item.name}`} />
                )}
                <b>{item.name}</b>
                <button onClick={() => setPendingDel(item)} className="so-iconbtn danger" title="מחיקה" aria-label={`מחיקה — ${item.name}`}><LineIcon name="trash" /></button>
              </li>
            ))}
            {items.length === 0 && <li className="so-lempty">הרשימה ריקה</li>}
          </ul>
          {pendingDel && (
            <ConfirmDelete title={`מחיקה מ"${title}"`}
              text={showColor ? `למחוק את סוג הכשרות "${pendingDel.name}"? מוצרים שמשויכים לכשרות הזו לא יימחקו, אבל היא תיעלם מהבחירה.` : `למחוק את "${pendingDel.name}" מהרשימה?`}
              onCancel={() => setPendingDel(null)}
              onConfirm={() => { handleRemove(pendingDel.id); setPendingDel(null); }} />
          )}
        </section>
      );
    };

    // ===[CONTACTS]===
    // --- Contacts View ---
    const ContactsView = ({ contactsList, setContactsList }) => {
      const [editingContact, setEditingContact] = useState(null); // contact object being edited
      const [importStep, setImportStep] = useState('idle'); // idle | mapping | preview | done
      const [excelRows, setExcelRows] = useState([]);
      const [excelHeaders, setExcelHeaders] = useState([]);
      const [mapping, setMapping] = useState({ name: '', phone: '', mobile: '', address: '', neighborhood: '', notes: '' });
      const [previewContacts, setPreviewContacts] = useState([]);
      const [search, setSearch] = useState('');

      const FIELDS = [
        { key: 'name', label: 'שם לקוח *', required: true },
        { key: 'phone', label: 'טלפון', required: false },
        { key: 'mobile', label: 'נייד', required: false },
        { key: 'address', label: 'כתובת / רחוב', required: false },
        { key: 'neighborhood', label: 'שכונה / עיר', required: false },
        { key: 'notes', label: 'הערות', required: false },
      ];

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const wb = window.XLSX.read(evt.target.result, { type: 'binary' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1 });
          if (rows.length < 2) return;
          const headers = rows[0].map(h => String(h || ''));
          setExcelHeaders(headers);
          setExcelRows(rows.slice(1));

          // ניסיון זיהוי אוטומטי של עמודות
          const autoMap = { name: '', phone: '', mobile: '', address: '', neighborhood: '', notes: '' };
          headers.forEach(h => {
            const lower = h.toLowerCase();
            if (!autoMap.name && (lower.includes('שם') || lower.includes('name'))) autoMap.name = h;
            if (!autoMap.phone && (lower.includes('טלפון') || lower.includes('phone') || lower.includes('נייד'))) autoMap.phone = h;
            if (!autoMap.mobile && (lower.includes('נייד') || lower.includes('mobile') || lower.includes('סלולר'))) autoMap.mobile = h;
            if (!autoMap.address && (lower.includes('רחוב') || lower.includes('כתובת') || lower.includes('address'))) autoMap.address = h;
            if (!autoMap.neighborhood && (lower.includes('עיר') || lower.includes('שכונה') || lower.includes('city'))) autoMap.neighborhood = h;
            if (!autoMap.notes && (lower.includes('הערה') || lower.includes('note'))) autoMap.notes = h;
          });
          setMapping(autoMap);
          setImportStep('mapping');
        };
        reader.readAsBinaryString(file);
      };

      const buildPreview = () => {
        if (!mapping.name) return;
        const colIdx = (col) => col ? excelHeaders.indexOf(col) : -1;
        const preview = excelRows
          .map(row => ({
            id: Date.now().toString() + Math.random(),
            name: String(row[colIdx(mapping.name)] || '').trim(),
            phone: String(row[colIdx(mapping.phone)] || '').trim(),
            mobile: String(row[colIdx(mapping.mobile)] || '').trim(),
            address: String(row[colIdx(mapping.address)] || '').trim(),
            neighborhood: String(row[colIdx(mapping.neighborhood)] || '').trim(),
            notes: String(row[colIdx(mapping.notes)] || '').trim(),
          }))
          .filter(c => c.name);

        // סינון כפולים לפי שם + טלפון
        const existingKeys = new Set(contactsList.map(c => `${c.name}|${c.phone}`));
        const newContacts = preview.filter(c => !existingKeys.has(`${c.name}|${c.phone}`));
        setPreviewContacts(newContacts);
        setImportStep('preview');
      };

      const confirmImport = () => {
        setContactsList(prev => [...prev, ...previewContacts.map(c => ({ ...c, id: Date.now().toString() + Math.random() }))]);
        setImportStep('done');
        setExcelRows([]); setExcelHeaders([]);
      };

      const filteredContacts = contactsList.filter(c =>
        !search || c.name.includes(search) || c.phone.includes(search) || c.mobile.includes(search)
      );

      return (
        <div className="animate-in fade-in duration-300 space-y-6">
          <div className="flex flex-wrap items-start justify-between gap-3">
            <div>
              <h1 className="text-3xl font-extrabold text-gray-900">אנשי קשר</h1>
              <p className="text-gray-500 mt-1">ייבוא מאקסל ובחירה מהירה בפתיחת הזמנה</p>
            </div>
            <label className="flex items-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl cursor-pointer shadow-sm transition-colors">
              📥 ייבוא מאקסל
              <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFileUpload} onClick={e => e.target.value = ''} />
            </label>
          </div>

          {/* שלב מיפוי עמודות */}
          {importStep === 'mapping' && (
            <div className="bg-white rounded-2xl border-2 border-blue-200 shadow-sm overflow-hidden">
              <div className="p-4 bg-blue-50 border-b border-blue-100">
                <h3 className="font-bold text-blue-900">שלב 1 — מפה עמודות</h3>
                <p className="text-xs text-blue-700 mt-0.5">בחר איזו עמודה באקסל מתאימה לכל שדה. זוהו {excelHeaders.length} עמודות.</p>
              </div>
              <div className="p-5 grid grid-cols-1 md:grid-cols-2 gap-4">
                {FIELDS.map(f => (
                  <div key={f.key}>
                    <label className="block text-xs font-bold text-gray-500 mb-1">{f.label}</label>
                    <select value={mapping[f.key]} onChange={e => setMapping(m => ({ ...m, [f.key]: e.target.value }))}
                      className="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-blue-400">
                      <option value="">-- לא לייבא --</option>
                      {excelHeaders.map(h => <option key={h} value={h}>{h}</option>)}
                    </select>
                  </div>
                ))}
              </div>
              <div className="p-4 border-t border-gray-100 flex gap-3 justify-end">
                <button onClick={() => setImportStep('idle')} className="px-4 py-2 rounded-xl border border-gray-200 text-gray-500 font-bold text-sm hover:bg-gray-50">ביטול</button>
                <button onClick={buildPreview} disabled={!mapping.name}
                  className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm disabled:opacity-40">
                  המשך לתצוגה מקדימה ←
                </button>
              </div>
            </div>
          )}

          {/* שלב תצוגה מקדימה */}
          {importStep === 'preview' && (
            <div className="bg-white rounded-2xl border-2 border-green-200 shadow-sm overflow-hidden">
              <div className="p-4 bg-green-50 border-b border-green-100 flex items-center justify-between">
                <div>
                  <h3 className="font-bold text-green-900">שלב 2 — תצוגה מקדימה</h3>
                  <p className="text-xs text-green-700 mt-0.5">
                    {previewContacts.length > 0
                      ? `נמצאו ${previewContacts.length} אנשי קשר חדשים לייבוא`
                      : 'לא נמצאו אנשי קשר חדשים — כולם כבר קיימים במערכת'}
                  </p>
                </div>
                <button onClick={() => setImportStep('mapping')} className="text-xs text-green-700 underline">חזור למיפוי</button>
              </div>
              {previewContacts.length > 0 && (
                <div className="max-h-64 overflow-y-auto custom-scrollbar">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-gray-50 text-gray-500 border-b sticky top-0">
                      <tr>
                        <th className="p-2 font-bold">שם</th>
                        <th className="p-2 font-bold">טלפון</th>
                        <th className="p-2 font-bold">כתובת</th>
                        <th className="p-2 font-bold">שכונה</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100">
                      {previewContacts.map((c, i) => (
                        <tr key={i} className="hover:bg-gray-50">
                          <td className="p-2 font-bold text-gray-900">{c.name}</td>
                          <td className="p-2 text-gray-600">{c.phone || c.mobile}</td>
                          <td className="p-2 text-gray-600">{c.address}</td>
                          <td className="p-2 text-gray-600">{c.neighborhood}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
              <div className="p-4 border-t border-gray-100 flex gap-3 justify-end">
                <button onClick={() => setImportStep('idle')} className="px-4 py-2 rounded-xl border border-gray-200 text-gray-500 font-bold text-sm hover:bg-gray-50">ביטול</button>
                {previewContacts.length > 0 && (
                  <button onClick={confirmImport}
                    className="px-4 py-2 rounded-xl bg-green-600 hover:bg-green-700 text-white font-bold text-sm">
                    ✅ ייבא {previewContacts.length} אנשי קשר
                  </button>
                )}
              </div>
            </div>
          )}

          {importStep === 'done' && (
            <div className="bg-green-50 border border-green-200 rounded-xl p-4 text-green-800 font-bold text-center">
              ✅ הייבוא הושלם! — {contactsList.length} אנשי קשר במערכת
              <button onClick={() => setImportStep('idle')} className="mr-3 text-xs underline font-normal">סגור</button>
            </div>
          )}

          {editingContact && (
            <EditContactModal
              contact={editingContact}
              onSave={(updated) => {
                setContactsList(prev => prev.map(c => c.id === updated.id ? updated : c));
                setEditingContact(null);
              }}
              onClose={() => setEditingContact(null)}
            />
          )}

          {/* חיפוש ורשימה */}
          <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div className="p-3 border-b border-gray-100 flex items-center gap-3">
              <input type="text" placeholder="🔍 חיפוש לפי שם או טלפון..."
                value={search} onChange={e => setSearch(e.target.value)}
                className="flex-1 p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" />
              <span className="text-xs text-gray-400 font-bold shrink-0">{filteredContacts.length} איש קשר</span>
            </div>
            {filteredContacts.length === 0 ? (
              <div className="p-10 text-center text-gray-400">
                <div className="text-3xl mb-2">👥</div>
                <div className="font-bold text-gray-500">אין אנשי קשר עדיין</div>
                <div className="text-sm mt-1">ייבא מאקסל כדי להתחיל</div>
              </div>
            ) : (
              <div className="overflow-x-auto max-h-96 custom-scrollbar">
                <table className="w-full text-right text-sm">
                  <thead className="bg-gray-50 text-gray-500 text-xs border-b sticky top-0">
                    <tr>
                      <th className="p-3 font-bold">שם</th>
                      <th className="p-3 font-bold">טלפון</th>
                      <th className="p-3 font-bold">כתובת</th>
                      <th className="p-3 font-bold">שכונה</th>
                      <th className="p-3 w-20"></th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {filteredContacts.map(c => (
                      <tr key={c.id} className="hover:bg-gray-50">
                        <td className="p-3 font-bold text-gray-900">{c.name}</td>
                        <td className="p-3 text-gray-600">{c.phone}{c.mobile && c.mobile !== c.phone ? ` / ${c.mobile}` : ''}</td>
                        <td className="p-3 text-gray-600">{c.address}</td>
                        <td className="p-3 text-gray-600">{c.neighborhood}</td>
                        <td className="p-3">
                          <div className="flex gap-2">
                            <button onClick={() => setEditingContact({ ...c })}
                              className="text-gray-400 hover:text-blue-500 transition-colors">
                              <Icons.Edit className="w-4 h-4" />
                            </button>
                            <button onClick={() => setContactsList(prev => prev.filter(x => x.id !== c.id))}
                              className="text-gray-300 hover:text-red-500 transition-colors">
                              <Icons.Trash2 className="w-4 h-4" />
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- Edit Contact Modal ---
    const EditContactModal = ({ contact, onSave, onClose }) => {
      const [form, setForm] = useState({ ...contact });
      const set = (field, val) => setForm(f => ({ ...f, [field]: val }));

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-in fade-in duration-200">
          <div className="bg-white rounded-2xl shadow-xl border border-blue-100 w-full max-w-md animate-in zoom-in-95 duration-200">
            <div className="p-4 bg-blue-50 border-b border-blue-100 flex items-center justify-between">
              <h3 className="font-bold text-blue-900 flex items-center gap-2"><Icons.Edit className="w-5 h-5" /> עריכת איש קשר</h3>
              <button onClick={onClose} className="p-1 rounded-lg text-gray-400 hover:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
            </div>
            <div className="p-5 space-y-3">
              {[
                { key: 'name',         label: 'שם לקוח *', type: 'text' },
                { key: 'phone',        label: 'טלפון',      type: 'tel' },
                { key: 'mobile',       label: 'נייד',       type: 'tel' },
                { key: 'address',      label: 'כתובת / רחוב', type: 'text' },
                { key: 'neighborhood', label: 'שכונה / עיר',  type: 'text' },
                { key: 'notes',        label: 'הערות',      type: 'text' },
              ].map(f => (
                <div key={f.key}>
                  <label className="block text-xs font-bold text-gray-500 mb-1">{f.label}</label>
                  <input type={f.type} value={form[f.key] || ''} onChange={e => set(f.key, e.target.value)}
                    className="w-full p-2.5 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" />
                </div>
              ))}
            </div>
            <div className="p-4 border-t border-gray-100 flex gap-3">
              <Button variant="outline" className="flex-1" onClick={onClose}>ביטול</Button>
              <Button variant="primary" icon={Icons.Save} className="flex-1" onClick={() => onSave(form)}>שמור שינויים</Button>
            </div>
          </div>
        </div>
      );
    };

    const NeighborhoodEditor = ({ neighborhoodData, setNeighborhoodData }) => {
      const [selectedId, setSelectedId]   = useState('');
      const [newNeighborhood, setNewNeighborhood] = useState('');
      const [newStreet, setNewStreet]     = useState('');
      const [pendingDel, setPendingDel]   = useState(null); // { kind: 'hood', n } | { kind: 'street', street }

      const selectedN = neighborhoodData.find(n => n.id === selectedId);

      const addNeighborhood = (e) => {
        e.preventDefault();
        if (!newNeighborhood.trim()) return;
        setNeighborhoodData(prev => [...prev, { id: Date.now().toString(), name: newNeighborhood.trim(), streets: [] }]);
        setNewNeighborhood('');
      };

      const removeNeighborhood = (id) => {
        setNeighborhoodData(prev => prev.filter(n => n.id !== id));
        if (selectedId === id) setSelectedId('');
      };

      const addStreet = (e) => {
        e.preventDefault();
        if (!newStreet.trim() || !selectedId) return;
        setNeighborhoodData(prev => prev.map(n => n.id === selectedId ? { ...n, streets: [...n.streets, newStreet.trim()] } : n));
        setNewStreet('');
      };

      const removeStreet = (street) => {
        setNeighborhoodData(prev => prev.map(n => n.id === selectedId ? { ...n, streets: n.streets.filter(s => s !== street) } : n));
      };

      return (
        <section className="so-subcard">
          <div className="so-lhead"><h3>שכונות ורחובות (ירושלים)</h3><span className="so-tag">{neighborhoodData.length} שכונות</span></div>
          <div className="so-hoodgrid">
            {/* עמודת שכונות */}
            <div className="so-hoodcol">
              <form onSubmit={addNeighborhood} className="so-addrow flat">
                <input type="text" value={newNeighborhood} onChange={e => setNewNeighborhood(e.target.value)} placeholder="הוסף שכונה חדשה..." className="so-input" />
                <button type="submit" className="so-btn primary"><LineIcon name="plus" />הוסף</button>
              </form>
              <div className="so-hoodlist">
                {neighborhoodData.map(n => (
                  <div key={n.id} onClick={() => setSelectedId(n.id)} className={`so-hooditem ${selectedId === n.id ? 'sel' : ''}`}>
                    <LineIcon name="pin" />
                    <span className="nm">{n.name} <small>({n.streets.length} רחובות)</small></span>
                    <button onClick={e => { e.stopPropagation(); setPendingDel({ kind: 'hood', n }); }} className="so-iconbtn danger sm" title="מחיקת שכונה" aria-label={`מחיקת שכונה — ${n.name}`}><LineIcon name="trash" /></button>
                  </div>
                ))}
              </div>
            </div>

            {/* עמודת רחובות */}
            <div className="so-hoodcol">
              {!selectedN ? (
                <div className="so-lempty big"><LineIcon name="pin" />לחצי על שכונה כדי לנהל את הרחובות שלה</div>
              ) : (
                <>
                  <div className="so-hoodtitle"><LineIcon name="pin" />רחובות — {selectedN.name}</div>
                  <form onSubmit={addStreet} className="so-addrow flat">
                    <input type="text" value={newStreet} onChange={e => setNewStreet(e.target.value)} placeholder="הוסף רחוב..." className="so-input" />
                    <button type="submit" className="so-btn primary"><LineIcon name="plus" />הוסף</button>
                  </form>
                  <div className="so-hoodlist">
                    {selectedN.streets.map(street => (
                      <div key={street} className="so-hooditem">
                        <span className="nm">{street}</span>
                        <button onClick={() => setPendingDel({ kind: 'street', street })} className="so-iconbtn danger sm" title="מחיקת רחוב" aria-label={`מחיקת רחוב — ${street}`}><LineIcon name="trash" /></button>
                      </div>
                    ))}
                    {selectedN.streets.length === 0 && <div className="so-lempty">אין רחובות — הוסיפי למעלה</div>}
                  </div>
                </>
              )}
            </div>
          </div>
          {pendingDel && (
            <ConfirmDelete
              title={pendingDel.kind === 'hood' ? 'מחיקת שכונה' : 'מחיקת רחוב'}
              text={pendingDel.kind === 'hood'
                ? `למחוק את השכונה "${pendingDel.n.name}"${pendingDel.n.streets.length ? ` יחד עם ${pendingDel.n.streets.length} הרחובות שלה` : ''}?`
                : `למחוק את הרחוב "${pendingDel.street}" מהשכונה "${selectedN?.name || ''}"?`}
              onCancel={() => setPendingDel(null)}
              onConfirm={() => { if (pendingDel.kind === 'hood') removeNeighborhood(pendingDel.n.id); else removeStreet(pendingDel.street); setPendingDel(null); }} />
          )}
        </section>
      );
    };

    const ProductListEditor = ({ items, setItems, kashrutList }) => {
      const [openFilter, setOpenFilter] = useState(null);
      const [searchName, setSearchName] = useState('');
      const [activeCats, setActiveCats] = useState(new Set());
      const [activeKashrut, setActiveKashrut] = useState(new Set());
      const [activeStorage, setActiveStorage] = useState(new Set());
      const [sortBy, setSortBy] = useState('');
      const [sortDir, setSortDir] = useState('asc');
      const [showAddModal, setShowAddModal] = useState(false);
      const [newProduct, setNewProduct] = useState({ name: '', category: 'עוף', sku: '', storageTypes: ['frozen'], kashrut: '' });
      const [collapsedCats, setCollapsedCats] = useState(() => Object.fromEntries(PRODUCT_CATEGORIES.map(c => [c, true])));
      const [newCatName, setNewCatName] = useState('');
      const [showNewCatInput, setShowNewCatInput] = useState(false);
      const [pendingCats, setPendingCats] = useState([]);
      const [pendingDel, setPendingDel] = useState(null); // שם המוצר למחיקה
      const tableRef = useRef(null);

      useEffect(() => {
        if (!openFilter) return;
        const handler = (e) => { if (tableRef.current && !tableRef.current.contains(e.target)) setOpenFilter(null); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [openFilter]);

      const [editingName, setEditingName] = useState({ id: null, value: '' });

      const commitRename = (originalName) => {
        const trimmed = editingName.value.trim();
        if (trimmed && trimmed !== originalName) updateByName(originalName, 'name', trimmed);
        setEditingName({ id: null, value: '' });
      };

      const openAddModal = () => {
        const cat = activeCats.size === 1 ? [...activeCats][0] : 'עוף';
        setNewProduct({ name: '', category: cat, sku: '', storageTypes: ['frozen'], kashrut: cat === 'דגים' ? 'כללי' : '' });
        setShowAddModal(true);
      };

      const confirmAddProduct = () => {
        if (!newProduct.name.trim()) return;
        if (!newProduct.kashrut) return;
        if (!newProduct.storageTypes.length) return;
        const newId = `p_${Date.now()}`;
        const existingCombos = new Set(items.map(p => `${p.name}|${p.kashrut}`));
        if (existingCombos.has(`${newProduct.name.trim()}|${newProduct.kashrut}`)) { setShowAddModal(false); return; }
        const newItem = { id: `${newId}_0`, name: newProduct.name.trim(), sku: newProduct.sku, storageTypes: newProduct.storageTypes, kashrut: newProduct.kashrut, category: newProduct.category };
        setItems(prev => [...prev, newItem]);
        setShowAddModal(false);
      };

      const toggleNewStorage = (key) => setNewProduct(p => {
        const has = p.storageTypes.includes(key);
        return { ...p, storageTypes: has ? p.storageTypes.filter(k => k !== key) : [...p.storageTypes, key] };
      });
      const updateProduct = (id, field, value) => setItems(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
      const updateByName  = (name, field, value) => setItems(prev => prev.map(p => p.name === name ? { ...p, [field]: value } : p));
      const removeGroup   = (name) => setItems(prev => prev.filter(p => p.name !== name));
      const toggleStorage = (id, key) => setItems(prev => prev.map(p => {
        if (p.id !== id) return p;
        const has = (p.storageTypes || []).includes(key);
        return { ...p, storageTypes: has ? p.storageTypes.filter(k => k !== key) : [...(p.storageTypes || []), key] };
      }));
      const toggleSet = (setter, value) => setter(prev => { const n = new Set(prev); n.has(value) ? n.delete(value) : n.add(value); return n; });
      const setSort   = (field, dir)  => { setSortBy(field); setSortDir(dir); setOpenFilter(null); };
      const clearSort = ()            => { setSortBy('');    setOpenFilter(null); };

      const orderedKashrutList = [
        ...kashrutList.filter(k => k.name === 'קהילות'),
        ...kashrutList.filter(k => k.name === 'לנדא'),
        ...kashrutList.filter(k => k.name !== 'קהילות' && k.name !== 'לנדא'),
      ];

      const skuCounts = {};
      items.forEach(p => { if (p.sku) skuCounts[p.sku] = (skuCounts[p.sku] || 0) + 1; });
      const duplicateSkus = new Set(Object.keys(skuCounts).filter(sku => skuCounts[sku] > 1));

      const enriched = items.map(p => ({ ...p, _cat: p.category || getProductCategory(p.name) }));
      const customCats = [...new Set(enriched.map(p => p._cat).filter(c => c && !PRODUCT_CATEGORIES.includes(c)))];
      const allCategories = [...PRODUCT_CATEGORIES, ...customCats, ...pendingCats.filter(c => !PRODUCT_CATEGORIES.includes(c) && !customCats.includes(c))];
      let filtered = enriched;
      if (searchName)         filtered = filtered.filter(p => p.name.includes(searchName));
      if (activeCats.size)    filtered = filtered.filter(p => activeCats.has(p._cat));
      if (activeKashrut.size) filtered = filtered.filter(p => activeKashrut.has(p.kashrut));
      if (activeStorage.size) filtered = filtered.filter(p => (p.storageTypes || []).some(s => activeStorage.has(s)));
      if (sortBy) filtered = [...filtered].sort((a, b) => {
        const va = sortBy === 'name' ? (a.name || '') : (a.sku || '');
        const vb = sortBy === 'name' ? (b.name || '') : (b.sku || '');
        return sortDir === 'asc' ? va.localeCompare(vb, 'he') : vb.localeCompare(va, 'he');
      });

      const visibleCats = allCategories.filter(c => filtered.some(p => p._cat === c));
      const isActive = {
        name:     !!searchName || sortBy === 'name',
        category: activeCats.size > 0,
        sku:      sortBy === 'sku',
        kashrut:  activeKashrut.size > 0,
        storage:  activeStorage.size > 0,
      };

      // helper renderers (functions, not components, to avoid remount issues)
      const sortRow = (field, dir, label) => (
        <button onClick={() => setSort(field, dir)}
          className={`w-full text-right px-2 py-1.5 rounded-lg hover:bg-gray-50 text-sm flex items-center gap-2 ${sortBy === field && sortDir === dir ? 'text-blue-600 font-bold' : 'text-gray-700'}`}>
          {dir === 'asc' ? '↑' : '↓'} {label}
        </button>
      );
      const checkRow = (label, checked, onChange) => (
        <label className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-gray-50 cursor-pointer text-sm text-gray-700">
          <input type="checkbox" checked={checked} onChange={onChange} className="rounded accent-blue-500" />
          {label}
        </label>
      );
      const clearBtn = (onClick, label = 'נקה סינון') => (
        <button onClick={onClick} className="w-full text-right px-2 py-1.5 text-xs text-red-500 hover:bg-red-50 rounded-lg border-t border-gray-100 mt-1 pt-2">
          ✕ {label}
        </button>
      );

      const colHeader = (field, label) => {
        const active = isActive[field];
        const isOpen = openFilter === field;
        return (
          <th className="text-right px-4 py-2.5 text-xs relative">
            <button onClick={() => setOpenFilter(isOpen ? null : field)}
              className={`flex items-center gap-1 font-bold transition-colors whitespace-nowrap ${active ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>
              {label}
              <span className={`text-[9px] ml-0.5 ${active ? 'text-blue-400' : 'text-gray-300'}`}>{active ? '▼' : '▾'}</span>
            </button>
            {isOpen && (
              <div className="absolute top-full right-0 z-50 mt-1 bg-white border border-gray-200 rounded-xl shadow-xl min-w-[190px] p-1.5 text-right"
                onClick={e => e.stopPropagation()}>
                {field === 'name' && <>
                  <input autoFocus type="text" placeholder="חיפוש שם מוצר..." value={searchName}
                    onChange={e => setSearchName(e.target.value)}
                    className="w-full p-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400 mb-1" />
                  <div className="border-t border-gray-100 pt-1">
                    {sortRow('name', 'asc',  'מיון א → ת')}
                    {sortRow('name', 'desc', 'מיון ת → א')}
                    {sortBy === 'name' && clearBtn(clearSort, 'נקה מיון')}
                    {searchName       && clearBtn(() => { setSearchName(''); }, 'נקה חיפוש')}
                  </div>
                </>}
                {field === 'category' && <>
                  {allCategories.map(cat => checkRow(`${CAT_EMOJI[cat] || '⭐'} ${cat}`, activeCats.has(cat), () => { toggleSet(setActiveCats, cat); setOpenFilter(null); }))}
                  {activeCats.size > 0 && clearBtn(() => { setActiveCats(new Set()); setOpenFilter(null); })}
                </>}
                {field === 'sku' && <>
                  {sortRow('sku', 'asc',  'מיון עולה')}
                  {sortRow('sku', 'desc', 'מיון יורד')}
                  {sortBy === 'sku' && clearBtn(clearSort, 'נקה מיון')}
                </>}
                {field === 'kashrut' && <>
                  {orderedKashrutList.map(k => checkRow(k.name, activeKashrut.has(k.name), () => { toggleSet(setActiveKashrut, k.name); setOpenFilter(null); }))}
                  {activeKashrut.size > 0 && clearBtn(() => { setActiveKashrut(new Set()); setOpenFilter(null); })}
                </>}
                {field === 'storage' && <>
                  {checkRow('🧊 קפוא', activeStorage.has('frozen'), () => { toggleSet(setActiveStorage, 'frozen'); setOpenFilter(null); })}
                  {checkRow('🥩 טרי',   activeStorage.has('fresh'),  () => { toggleSet(setActiveStorage, 'fresh');  setOpenFilter(null); })}
                  {activeStorage.size > 0 && clearBtn(() => { setActiveStorage(new Set()); setOpenFilter(null); })}
                </>}
              </div>
            )}
          </th>
        );
      };

      return (
        <section className="so-subcard" ref={tableRef}>
          <div className="so-lhead">
            <h3>מוצרי מלאי</h3><span className="so-tag">{items.length} מוצרים</span>
            <button onClick={openAddModal} className="so-btn primary" style={{ marginInlineStart: 'auto' }}><LineIcon name="plus" />הוסף מוצר</button>
          </div>
          <div className="so-tools plain">
            <label className="so-search"><LineIcon name="search" />
              <input type="search" placeholder="חיפוש מוצר..." value={searchName} onChange={e => setSearchName(e.target.value)} aria-label="חיפוש מוצר" />
            </label>
            <div className="so-kfilter">
              {orderedKashrutList.map(k => (
                <button key={k.id || k.name} className="so-kf" aria-pressed={activeKashrut.has(k.name)} style={kVars(k.name)} onClick={() => toggleSet(setActiveKashrut, k.name)}>
                  <span className="so-kletter">{kStyle(k.name).l}</span>{k.name}
                </button>
              ))}
              <button className="so-kf" aria-pressed={activeKashrut.has('כללי')} style={kVars('כללי')} onClick={() => toggleSet(setActiveKashrut, 'כללי')}>
                <span className="so-kletter">{kStyle('כללי').l}</span>כללי (דגים)
              </button>
            </div>
            <div className="so-hint" style={{ flexBasis: '100%' }}>אפשר גם ללחוץ על כותרת עמודה לסינון ומיון. לחיצה על שם מוצר — עריכת השם.</div>
          </div>

          {duplicateSkus.size > 0 && (
            <div className="so-warnbar">
              <div>
                <p className="text-sm font-bold text-red-700">נמצאו מק"טים כפולים — יש לתקן לפני השמירה</p>
                <p className="text-xs text-red-500 mt-0.5">מק"טים: {[...duplicateSkus].join(', ')}</p>
              </div>
            </div>
          )}

          <div className="so-tbl-wrap">
            <table className="so-ptbl">
              <thead>
                <tr>
                  {colHeader('name',     'שם מוצר')}
                  {colHeader('category', 'קטגוריה')}
                  {colHeader('sku',      'מק"ט')}
                  {colHeader('kashrut',  'כשרות')}
                  {colHeader('storage',  'סוג מלאי')}
                  <th className="px-4 py-2.5 w-10"></th>
                </tr>
              </thead>
              <tbody>
                {visibleCats.length === 0 && (
                  <tr><td colSpan={6} className="p-8 text-center text-gray-400 text-sm">אין מוצרים התואמים לסינון הנבחר</td></tr>
                )}
                {visibleCats.map(cat => {
                  const catItems = filtered.filter(p => p._cat === cat).sort((a, b) => {
                    if (sortBy) return 0;
                    const sa = a.sku || '', sb = b.sku || '';
                    if (!sa && !sb) return 0;
                    if (!sa) return 1;
                    if (!sb) return -1;
                    return sa.localeCompare(sb, undefined, { numeric: true, sensitivity: 'base' });
                  });
                  if (!catItems.length) return null;
                  const s = CAT_STYLES[cat] || CAT_STYLES['עוף'];
                  const isCollapsed = collapsedCats[cat];
                  return (
                    <React.Fragment key={cat}>
                      <tr className="so-catrow clickable" onClick={() => setCollapsedCats(prev => ({ ...prev, [cat]: !prev[cat] }))}>
                        <td colSpan={6}>
                          <div className="flex items-center gap-2">
                            <LineIcon name={cat} />{cat}
                            <span className="so-catn">{catItems.length} פריטים</span>
                            <span className="so-chev" style={{ marginInlineStart: 'auto' }}>{isCollapsed ? 'פתיחה ▼' : 'סגירה ▲'}</span>
                          </div>
                        </td>
                      </tr>
                      {!isCollapsed && catItems.map(p => (
                        <tr key={p.id} className="so-prow">
                          <td className="px-4 py-2">
                            {editingName.id === p.id
                              ? <input autoFocus type="text" value={editingName.value}
                                  onChange={e => setEditingName(s => ({ ...s, value: e.target.value }))}
                                  onBlur={() => commitRename(p.name)}
                                  onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') setEditingName({ id: null, value: '' }); }}
                                  className="so-input sm" />
                              : <span onClick={() => setEditingName({ id: p.id, value: p.name })}
                                  className="so-pname-edit" title="לחיצה לעריכת השם">
                                  {p.name || <span className="text-gray-300 italic">ללא שם</span>}
                                </span>
                            }
                          </td>
                          <td className="px-4 py-2">
                            <select value={p._cat} onChange={e => updateByName(p.name, 'category', e.target.value)} className="so-select">
                              {allCategories.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                          </td>
                          <td className="px-4 py-2">
                            <div className="flex items-center gap-1">
                              <input value={p.sku || ''} onChange={e => updateProduct(p.id, 'sku', e.target.value)}
                                className={`so-input sm mono ${p.sku && duplicateSkus.has(p.sku) ? 'dup' : ''}`} style={{ width: '7.5rem' }} placeholder='מק"ט...' />
                              {p.sku && duplicateSkus.has(p.sku) && <span title="מק&quot;ט כפול" className="text-red-500 text-base leading-none">⚠️</span>}
                            </div>
                          </td>
                          <td className="px-4 py-2">
                            <select value={p.kashrut || ''} onChange={e => updateProduct(p.id, 'kashrut', e.target.value)}
                              className="so-select kash" style={kVars(p.kashrut)}>
                              <option value="כללי">כללי</option>
                              {kashrutList.map(k => <option key={k.id || k.name} value={k.name}>{k.name}</option>)}
                            </select>
                          </td>
                          <td className="px-4 py-2">
                            <div className="flex gap-1">
                              {STORAGE_TYPES.map(st => {
                                const active = (p.storageTypes || []).includes(st.key);
                                return (
                                  <button key={st.key} type="button" onClick={() => toggleStorage(p.id, st.key)}
                                    className={`so-stchip ${active ? 'on' : ''}`} aria-pressed={active}>
                                    {st.label}
                                  </button>
                                );
                              })}
                            </div>
                          </td>
                          <td className="px-4 py-2">
                            <button onClick={() => setPendingDel(p.name)} className="so-iconbtn danger sm" title="מחיקת מוצר" aria-label={`מחיקת מוצר — ${p.name}`}>
                              <LineIcon name="trash" />
                            </button>
                          </td>
                        </tr>
                      ))}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>

          {pendingDel && (() => {
            const variants = items.filter(x => x.name === pendingDel);
            const ks = [...new Set(variants.map(x => x.kashrut).filter(Boolean))];
            return (
              <ConfirmDelete title="מחיקת מוצר"
                text={`למחוק את "${pendingDel}" מרשימת המוצרים${ks.length > 1 ? ` — מכל הכשרויות (${ks.join(', ')})` : ks.length ? ` (${ks[0]})` : ''}?`}
                onCancel={() => setPendingDel(null)}
                onConfirm={() => { removeGroup(pendingDel); setPendingDel(null); }} />
            );
          })()}

          {/* מודל הוספת מוצר */}
          {showAddModal && (
            <div className="so-modal-bg" onClick={() => setShowAddModal(false)}>
              <div className="so-modal" style={{ padding: '1.2rem', display: 'flex', flexDirection: 'column', gap: '1rem' }} onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-gray-900">הוספת מוצר חדש</h3>
                  <button onClick={() => setShowAddModal(false)} className="text-gray-400 hover:text-gray-600 p-1 rounded-lg hover:bg-gray-100 transition-colors">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3">
                  {/* שם מוצר */}
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">שם מוצר *</label>
                    <input
                      autoFocus
                      type="text" value={newProduct.name}
                      onChange={e => setNewProduct(p => ({ ...p, name: e.target.value }))}
                      onKeyDown={e => e.key === 'Enter' && confirmAddProduct()}
                      placeholder="לדוגמה: כרעיים שלם..."
                      className="w-full p-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent"
                    />
                  </div>

                  {/* קטגוריה */}
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">קטגוריה</label>
                    <div className="flex gap-2 flex-wrap">
                      {allCategories.map(cat => (
                        <button key={cat} type="button" onClick={() => setNewProduct(p => ({ ...p, category: cat, kashrut: cat === 'דגים' ? 'כללי' : (p.kashrut === 'כללי' ? '' : p.kashrut) }))}
                          className={`text-sm px-3 py-2 rounded-xl border font-bold transition-all ${newProduct.category === cat ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 border-gray-300 hover:border-gray-500'}`}>
                          {CAT_EMOJI[cat] || '⭐'} {cat}
                        </button>
                      ))}
                      {showNewCatInput ? (
                        <div className="flex gap-1 items-center">
                          <input autoFocus type="text" value={newCatName}
                            onChange={e => setNewCatName(e.target.value)}
                            onKeyDown={e => {
                              if (e.key === 'Enter' && newCatName.trim()) { const t = newCatName.trim(); setPendingCats(p => p.includes(t) ? p : [...p, t]); setNewProduct(p => ({ ...p, category: t })); setShowNewCatInput(false); setNewCatName(''); }
                              if (e.key === 'Escape') { setShowNewCatInput(false); setNewCatName(''); }
                            }}
                            placeholder="שם קטגוריה..."
                            className="w-28 p-1.5 border border-blue-400 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-300" />
                          <button type="button" onClick={() => { if (newCatName.trim()) { const t = newCatName.trim(); setPendingCats(p => p.includes(t) ? p : [...p, t]); setNewProduct(p => ({ ...p, category: t })); setShowNewCatInput(false); setNewCatName(''); } }}
                            className="text-xs px-2 py-1.5 rounded-lg bg-blue-600 text-white font-bold hover:bg-blue-700">✓</button>
                          <button type="button" onClick={() => { setShowNewCatInput(false); setNewCatName(''); }}
                            className="text-xs px-2 py-1.5 rounded-lg border border-gray-300 text-gray-500 hover:bg-gray-50">✕</button>
                        </div>
                      ) : (
                        <button type="button" onClick={() => setShowNewCatInput(true)}
                          className="text-sm px-3 py-2 rounded-xl border border-dashed border-gray-400 text-gray-500 font-bold hover:border-gray-600 hover:text-gray-700 transition-all">
                          + קטגוריה חדשה
                        </button>
                      )}
                    </div>
                  </div>

                  {/* מק"ט */}
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">מק"ט (אופציונלי)</label>
                    <input
                      type="text" value={newProduct.sku}
                      onChange={e => setNewProduct(p => ({ ...p, sku: e.target.value }))}
                      placeholder='מספר מק"ט...'
                      className="w-full p-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-purple-400 font-mono"
                    />
                  </div>

                  {/* כשרות */}
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">כשרות *</label>
                    <div className="flex gap-2 flex-wrap">
                      <button type="button" onClick={() => setNewProduct(p => ({ ...p, kashrut: 'כללי' }))}
                        className={`text-sm px-3 py-2 rounded-xl border font-bold transition-all ${newProduct.kashrut === 'כללי' ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 border-gray-300 hover:border-gray-500'}`}>
                        כללי
                      </button>
                      {kashrutList.map(k => (
                        <button key={k.id || k.name} type="button" onClick={() => setNewProduct(p => ({ ...p, kashrut: k.name }))}
                          className={`text-sm px-3 py-2 rounded-xl border font-bold transition-all ${newProduct.kashrut === k.name ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 border-gray-300 hover:border-gray-500'}`}>
                          {k.name}
                        </button>
                      ))}
                    </div>
                    {!newProduct.kashrut && <p className="text-xs text-red-400 mt-1">יש לבחור כשרות</p>}
                  </div>

                  {/* סוג מלאי */}
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">סוג מלאי *</label>
                    <div className="flex gap-2">
                      {STORAGE_TYPES.map(st => {
                        const active = newProduct.storageTypes.includes(st.key);
                        return (
                          <button key={st.key} type="button" onClick={() => toggleNewStorage(st.key)}
                            className={`text-sm px-4 py-2 rounded-xl border font-bold transition-all ${active ? st.activeClass : 'bg-white text-gray-400 border-gray-300 hover:border-gray-500'}`}>
                            {st.label}
                          </button>
                        );
                      })}
                    </div>
                    {!newProduct.storageTypes.length && <p className="text-xs text-red-400 mt-1">יש לבחור סוג מלאי</p>}
                  </div>
                </div>

                <div className="flex gap-3 pt-1">
                  <button onClick={confirmAddProduct} disabled={!newProduct.name.trim() || !newProduct.kashrut || !newProduct.storageTypes.length}
                    className="so-bigbtn dark" style={{ flex: 1 }}>
                    הוסף לרשימה
                  </button>
                  <button onClick={() => setShowAddModal(false)}
