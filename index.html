    // גיבוי מלא — מוריד קובץ JSON עם כל הטבלאות. קריאה בלבד, לא משנה כלום בשרת
    const BACKUP_TABLES = ['orders', 'fresh_stock', 'frozen_stock', 'settings', 'inventory_log', 'frozen_stock_log',
      'beit_shemesh_shipments', 'beit_shemesh_withdrawals', 'gavash_shipments', 'gavash_withdrawals', 'app_users'];
    const BackupCard = () => {
      const [status, setStatus] = useState('');
      const [busy, setBusy] = useState(false);
      const runBackup = async () => {
        setBusy(true); setStatus('מוריד נתונים מהשרת...');
        const backup = { createdAt: new Date().toISOString(), tables: {} };
        const counts = [];
        for (const t of BACKUP_TABLES) {
          // סיסמאות לא נכנסות לקובץ הגיבוי
          const cols = t === 'app_users' ? 'id,username,is_admin,active,permissions,created_at' : '*';
          const { data, error } = await fetchAll(() => db.from(t).select(cols).order('id'));
          if (error) { setStatus(`הגיבוי נכשל בטבלה ${t}: ${error.message}. לא נוצר קובץ — נסו שוב.`); setBusy(false); return; }
          backup.tables[t] = data;
          counts.push(`${t}: ${data.length}`);
        }
        const blob = new Blob([JSON.stringify(backup, null, 1)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `super-off-backup-${new Date().toLocaleDateString('sv-SE')}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        setStatus(`✓ הגיבוי ירד בהצלחה (${counts.join(' · ')})`);
        setBusy(false);
      };
      return (
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mt-4">
          <div className="px-5 py-4 bg-gray-50 border-b border-gray-200">
            <h2 className="font-extrabold text-gray-800">גיבוי מלא</h2>
            <p className="text-sm text-gray-500 mt-0.5">מוריד למחשב קובץ עם כל הנתונים: הזמנות, מלאי, יומנים, קירורים, רשימות והגדרות. מומלץ פעם בשבוע ולפני כל שינוי גדול.</p>
          </div>
          <div className="p-5 space-y-3">
            <button onClick={runBackup} disabled={busy}
              className="px-5 py-2.5 bg-gray-900 text-white font-bold rounded-xl hover:bg-black transition-colors text-sm disabled:opacity-50">
              {busy ? 'מגבה...' : '⬇ הורדת גיבוי מלא'}
            </button>
            {status && <p className="text-sm text-gray-700">{status}</p>}
          </div>
        </div>
      );
    };

    // ===[BEIT-SHEMESH]===
    // ===[COLD STOCK — עיצוב חדש]===
    // טבלת מצב מלאי בקירור חיצוני (לירוי / גב"ש) — תצוגה בלבד; החישוב (נכנס/נמשך) מגיע מהמסך עצמו
    const ColdStockTable = ({ items = [], shortName = '', kashrutList = [], actions = null, note = null, renderBalance = null, showAll = false }) => {
      const [kf, setKf] = useState('הכל');
      const [q, setQ] = useState('');
      const [showZero, setShowZero] = useState(false);
      const bal = (it) => (Number(it.totalIn) || 0) - (Number(it.totalOut) || 0);
      const kOf = (it) => it.kashrut || '-';
      const present = [...new Set(items.map(kOf))];
      const kNames = [...kashrutList.map(k => k.name).filter(n => present.includes(n)), ...present.filter(n => !kashrutList.some(k => k.name === n))];
      const sumBal = (arr) => arr.reduce((s, it) => s + bal(it), 0);
      const qq = q.trim();
      const rows = items.filter(it => (showAll || showZero || bal(it) !== 0)
        && (kf === 'הכל' || kOf(it) === kf)
        && (!qq || qq.split(/\s+/).every(t => (it.name || '').includes(t) || (it.sku || '').includes(t))));
      const kLabel = (k) => k === '-' ? 'ללא כשרות' : (kStyle(k).label || k);
      return (
        <div className="flex flex-col gap-4">
          <div className="so-stats">
            <div className="so-stat"><span><LineIcon name="snow" />סה״כ ב{shortName}</span><b>{sumBal(items)}</b><small>קרטונים</small></div>
            {kNames.filter(k => k !== '-').map(k => (
              <div key={k} className="so-stat k" style={kVars(k)}>
                <span><span className="so-kletter sm">{kStyle(k).l}</span>{kLabel(k)}</span>
                <b>{sumBal(items.filter(it => kOf(it) === k))}</b><small>קרטונים</small>
              </div>
            ))}
            <div className="so-stat"><span><LineIcon name="box" />מוצרים עם יתרה</span><b>{items.filter(it => bal(it) > 0).length}</b><small>מתוך {items.length}</small></div>
          </div>

          <div className="so-coldtools">
            <div className="so-kfilter">
              <button className="so-kf" aria-pressed={kf === 'הכל'} onClick={() => setKf('הכל')}>כל הכשרויות</button>
              {kNames.map(k => (
                <button key={k} className="so-kf" aria-pressed={kf === k} style={kVars(k)} onClick={() => setKf(k)}>
                  <span className="so-kletter">{kStyle(k).l}</span>{kLabel(k)}
                </button>
              ))}
            </div>
            <label className="so-search"><LineIcon name="search" />
              <input type="search" placeholder="חיפוש מוצר או מק״ט" value={q} onChange={e => setQ(e.target.value)} aria-label="חיפוש מוצר" />
            </label>
            {!showAll && (
              <label className="so-showzero"><input type="checkbox" checked={showZero} onChange={e => setShowZero(e.target.checked)} />הצג גם מוצרים שנגמרו</label>
            )}
            {actions}
          </div>
          {note && <div className="so-coldnote">{note}</div>}

          {(kf === 'הכל' ? kNames : [kf]).map(k => {
            const kr = rows.filter(it => kOf(it) === k);
            if (!kr.length) return null;
            return (
              <section key={k} className="so-kgroup" style={kVars(k)}>
                <div className="so-kgroup-h">
                  <span className="so-kletter">{kStyle(k).l}</span><h3>{kLabel(k)}</h3>
                  <span className="tot"><b>{sumBal(kr)}</b> קרטונים · {kr.length} מוצרים</span>
                </div>
                <div className="so-tbl-wrap">
                  <table className="so-tbl so-tbl-cold">
                    <thead><tr><th>מוצר</th><th>נכנס</th><th>נמשך</th><th>יתרה</th></tr></thead>
                    <tbody>
                      {kr.map((it, i) => {
                        const b = bal(it);
                        return (
                          <tr key={(it.sku || it.name) + '|' + (it.dateType || '') + '|' + i} className={b < 0 ? 'low' : b === 0 ? 'out' : ''}>
                            <td className="c-name">
                              <b className="so-cname">{it.name}</b>{it.dateType && <span className="so-mark">{it.dateType}</span>}
                              <small className="so-csku">מק״ט {it.sku || '—'}</small>
                            </td>
                            <td className="c-cold" data-label="נכנס"><span className="so-num">{it.totalIn}</span></td>
                            <td className="c-cold" data-label="נמשך"><span className="so-num">{it.totalOut}</span></td>
                            <td className="c-total">
                              {renderBalance ? renderBalance(it, b) : (
                                <><span className={`so-bal ${b === 0 ? 'zero' : b < 0 ? 'neg' : ''}`}>{b}</span>{b < 0 && <span className="so-lowtag">חריגה</span>}</>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </section>
            );
          })}
          {rows.length === 0 && (
            <div className="so-subcard so-empty">{items.length === 0 ? 'אין נתוני מלאי עדיין' : showZero ? 'לא נמצאו מוצרים' : `אין כרגע מלאי ב${shortName} שמתאים לסינון. אפשר לסמן "הצג גם מוצרים שנגמרו".`}</div>
          )}
        </div>
      );
    };

    const BeitShemeshView = ({ frozenProductsList = [], companyVat = '', scrollToTop = () => {}, kashrutList = [] }) => {
      const today = localToday();
      const getKashrutColor = (name) => (kashrutList || []).find(k => k.name === name)?.color || '#6366f1';
      const [bsTab, setBsTab] = useState('inventory');
      const [invTab, setInvTab] = useState('products');
      const [shipments, setShipments] = useState([]);
      const [withdrawals, setWithdrawals] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);

      // Exit form state
      const [showExitForm, setShowExitForm] = useState(false);
      const [editingShipmentId, setEditingShipmentId] = useState(null);
      const [exitDate, setExitDate] = useState(today);
      const [exitPallets, setExitPallets] = useState([{ id: Date.now(), number: '', products: [] }]);
      const [exitProductForm, setExitProductForm] = useState({ sku: '', name: '', kashrut: '', cartons: '', expiryDate: '', dateType: '', weight: '' });
      const [editingExitProduct, setEditingExitProduct] = useState(null);
      const exitSkuRef = useRef(null);
      const exitCartonsRef = useRef(null);
      const [showExitNameDropdown, setShowExitNameDropdown] = useState(false);
      const [reportDate, setReportDate] = useState(today);
      const [showAllExits, setShowAllExits] = useState(true);

      // Withdrawal form state
      const [showWdForm, setShowWdForm] = useState(false);
      const [wdDate, setWdDate] = useState(today);
      const [wdPallets, setWdPallets] = useState([{ id: Date.now(), palletRef: '', products: [] }]);
      const [wdReportDate, setWdReportDate] = useState(today);
      const [showAllWithdrawals, setShowAllWithdrawals] = useState(false);
      const [wdSelections, setWdSelections] = useState({});
      const [wdConfirmed, setWdConfirmed] = useState(new Set());
      const [editingWithdrawalId, setEditingWithdrawalId] = useState(null);

      const loadData = useCallback(async (silent = false) => {
        if (!silent) setLoading(true);
        const [exRes, wdRes] = await Promise.all([
          fetchAll(() => db.from('beit_shemesh_shipments').select('*').order('date', { ascending: false }).order('id')),
          fetchAll(() => db.from('beit_shemesh_withdrawals').select('*').order('date', { ascending: false }).order('id'))
        ]);
        if (!exRes.error && exRes.data) setShipments(exRes.data);
        if (!wdRes.error && wdRes.data) setWithdrawals(wdRes.data);
        setLoading(false);
      }, []);

      useEffect(() => {
        loadData();
        let lastFocus = 0;
        const onFocus = () => { if (Date.now() - lastFocus > 30000) { lastFocus = Date.now(); loadData(true); } };
        window.addEventListener('focus', onFocus);
        return () => window.removeEventListener('focus', onFocus);
      }, []);

      const skuLookup = (sku, setForm) => {
        setForm(p => ({ ...p, sku, name: '', kashrut: '' }));
        if (sku.length >= 1) {
          const found = frozenProductsList.find(p => p.sku && p.sku.toString() === sku.toString());
          if (found) setForm(p => ({ ...p, sku, name: found.name, kashrut: found.kashrut || '' }));
        }
      };

      // ── Exit functions ──
      const addExitPallet = () => setExitPallets(prev => [...prev, { id: Date.now(), number: '', products: [] }]);
      const removeExitPallet = (id) => setExitPallets(prev => prev.filter(p => p.id !== id));
      const updateExitPalletNum = (id, number) => setExitPallets(prev => prev.map(p => p.id === id ? { ...p, number } : p));

      const addProductToExitPallet = (palletId) => {
        if (!exitProductForm.name || !exitProductForm.cartons) return;
        if (editingExitProduct) {
          setExitPallets(prev => prev.map(p => p.id === editingExitProduct.palletId
            ? { ...p, products: p.products.map(pr => pr.id === editingExitProduct.productId ? { ...exitProductForm, id: pr.id } : pr) }
            : p));
          setEditingExitProduct(null);
        } else {
          const pallet = exitPallets.find(p => p.id === palletId);
          const total = pallet.products.reduce((s,p) => s + Number(p.cartons||0), 0);
          if (total + Number(exitProductForm.cartons) > 50) { alert('לא ניתן להוסיף - משטח מוגבל ל-50 קרטון (כרגע: ' + total + ' קרטונים)'); return; }
          setExitPallets(prev => prev.map(p => p.id === palletId ? { ...p, products: [...p.products, { ...exitProductForm, id: Date.now() }] } : p));
        }
        setExitProductForm({ sku: '', name: '', kashrut: '', cartons: '', expiryDate: '', dateType: '', weight: '' });
        setShowExitNameDropdown(false);
        setTimeout(() => exitSkuRef.current?.focus(), 30);
      };

      const startEditExitProduct = (palletId, product) => {
        setEditingExitProduct({ palletId, productId: product.id });
        setExitProductForm({ sku: product.sku||'', name: product.name||'', kashrut: product.kashrut||'', cartons: product.cartons||'', expiryDate: product.expiryDate||'', dateType: product.dateType||'', weight: product.weight||'' });
        setShowExitNameDropdown(false);
        setTimeout(() => exitSkuRef.current?.focus(), 30);
      };

      const removeExitProduct = (palletId, productId) => {
        setExitPallets(prev => prev.map(p => p.id === palletId ? { ...p, products: p.products.filter(pr => pr.id !== productId) } : p));
      };

      const resetExitForm = () => {
        setShowExitForm(false); setEditingShipmentId(null);
        setExitDate(today); setExitPallets([{ id: Date.now(), number: '', products: [] }]);
      };

      const startEditShipment = (shipment) => {
        setEditingShipmentId(shipment.id);
        setExitDate(shipment.date);
        setExitPallets(shipment.pallets && shipment.pallets.length ? shipment.pallets : [{ id: Date.now(), number: '', products: [] }]);
        setShowExitForm(true);
        setTimeout(() => scrollToTop(), 50);
      };

      const saveExit = async () => {
        if (!exitDate) { alert('נא למלא תאריך'); return; }
        setSaving(true);
        const payload = { date: exitDate, pallet_count: exitPallets.length, pallets: exitPallets };
        if (editingShipmentId) {
          const { data, error } = await db.from('beit_shemesh_shipments').update(payload).eq('id', editingShipmentId).select();
          if (error) { alert('שגיאה בשמירה: ' + error.message); setSaving(false); return; }
          if (data) setShipments(prev => prev.map(s => s.id === editingShipmentId ? data[0] : s));
        } else {
          const newItem = { id: Date.now(), ...payload };
          const { data, error } = await db.from('beit_shemesh_shipments').insert([newItem]).select();
          if (error) { alert('שגיאה בשמירה: ' + error.message); setSaving(false); return; }
          if (data) setShipments(prev => [data[0], ...prev].sort((a,b) => b.date.localeCompare(a.date)));
        }
        resetExitForm(); setSaving(false);
      };

      const deleteExit = async (id) => {
        if (!window.confirm('למחוק יציאה זו?')) return;
        const { error } = await db.from('beit_shemesh_shipments').delete().eq('id', id);
        if (!error) setShipments(prev => prev.filter(s => s.id !== id)); else reportSaveError('מחיקה', error);
      };

      // ── Withdrawal functions ──
      const addWdPallet = () => setWdPallets(prev => [...prev, { id: Date.now(), palletRef: '', products: [] }]);
      const removeWdPallet = (id) => setWdPallets(prev => prev.filter(p => p.id !== id));
      const getWdPalletProducts = (palletRef) => {
        const allProds = [];
        shipments.forEach(s => s.pallets.filter(p => p.number === palletRef).forEach(p => p.products.forEach(pr => allProds.push({ ...pr }))));
        return allProds.map(pr => {
          const withdrawn = withdrawals
            .flatMap(w => (w.pallets||[]).filter(wp => wp.palletRef === palletRef).flatMap(wp => wp.products))
            .filter(wp => ((wp.sku && wp.sku === pr.sku) || (!wp.sku && wp.name === pr.name)) && (wp.dateType||'') === (pr.dateType||''))
            .reduce((s, wp) => s + Number(wp.cartons||0), 0);
          return { ...pr, available: Math.max(0, Number(pr.cartons||0) - withdrawn) };
        });
      };

      const updateWdPalletRef = (id, ref) => {
        setWdPallets(prev => prev.map(p => p.id === id ? { ...p, palletRef: ref, products: [] } : p));
        if (ref) {
          const prods = getWdPalletProducts(ref);
          const sel = {};
          prods.forEach(pr => { const k = (pr.sku || pr.name) + '|' + (pr.dateType||''); sel[k] = { checked: false, qty: pr.available }; });
          setWdSelections(prev => ({ ...prev, [id]: sel }));
        }
      };

      const applyWdSelection = (palletId) => {
        const pallet = wdPallets.find(p => p.id === palletId);
        if (!pallet) return;
        const prods = getWdPalletProducts(pallet.palletRef);
        const sel = wdSelections[palletId] || {};
        const selected = prods.filter(pr => {
          const k = (pr.sku || pr.name) + '|' + (pr.dateType||'');
          const s = sel[k];
          return s ? (s.checked && Number(s.qty) > 0) : pr.available > 0;
        }).map((pr, i) => {
          const k = (pr.sku || pr.name) + '|' + (pr.dateType||'');
          const s = sel[k];
          return { ...pr, cartons: s ? Number(s.qty) : pr.available, id: Date.now() + i };
        });
        setWdPallets(prev => prev.map(p => p.id === palletId ? { ...p, products: selected } : p));
        setWdConfirmed(prev => new Set([...prev, palletId]));
      };

      const removeWdProduct = (palletId, productId) => setWdPallets(prev => prev.map(p => p.id === palletId ? { ...p, products: p.products.filter(pr => pr.id !== productId) } : p));

      const startEditWithdrawal = (w) => {
        setEditingWithdrawalId(w.id);
        setWdDate(w.date);

        let rowIdx = 0;
        const rows = sorted.map((item) => {
          const balance = item.totalIn - item.totalOut;
          const k = item.kashrut || '-';
          let sep = '';
          if (k !== lastKashrut) {
            sep = `<tr><td colspan="7" style="padding:4px 6px;border:none;background:#555;color:#fff;font-weight:bold;font-size:11px;">${k}</td></tr>`;
            rowIdx = 0;
          }
          lastKashrut = k;
          const bg = rowIdx++ % 2 === 0 ? '#ffffff' : '#f5f5f5';
          return sep + `<tr style="background:${bg};">
            <td style="padding:3px 5px;border:1px solid #bbb;">${item.name}</td>
            <td style="padding:3px 5px;border:1px solid #bbb;text-align:center;">${item.sku || ''}</td>
            <td style="padding:3px 5px;border:1px solid #bbb;text-align:center;">${k}</td>

            <td style="padding:3px 5px;border:1px solid #bbb;text-align:center;">${item.totalOut}</td>
            <td style="padding:3px 5px;border:1px solid #bbb;text-align:center;font-weight:bold;">${balance}</td>
          </tr>`;
        }).join('');
        const html = `<div style="font-family:Arial,sans-serif;direction:rtl;padding:12px;width:700px;font-size:11px;">
          <div style="margin-bottom:6px;font-weight:bold;font-size:12px;">מצב מלאי — קירור לירוי — ${date}</div>

            <thead><tr style="background:#444;color:#fff;">
              <th style="padding:4px 5px;border:1px solid #555;text-align:right;">מוצר</th>
              <th style="padding:4px 5px;border:1px solid #555;text-align:center;">מקט</th>
              <th style="padding:4px 5px;border:1px solid #555;text-align:center;">כשרות</th>
              <th style="padding:4px 5px;border:1px solid #555;text-align:center;">סימון</th>
              <th style="padding:4px 5px;border:1px solid #555;text-align:center;">נכנס</th>
              <th style="padding:4px 5px;border:1px solid #555;text-align:center;">נמשך</th>
              <th style="padding:4px 5px;border:1px solid #555;text-align:center;">יתרה</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
        const container = document.createElement('div');
        container.style.cssText = 'position:fixed;top:-9999px;right:-9999px;';
        container.innerHTML = html;
        document.body.appendChild(container);
        const canvas = await window.html2canvas(container, { scale: 2, useCORS: true });
        document.body.removeChild(container);
        const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const pageHpx = Math.round((pageH / pageW) * canvas.width);
        let y = 0;
        let first = true;
        while (y < canvas.height) {
          if (!first) doc.addPage();
          first = false;
          const sliceH = Math.min(pageHpx, canvas.height - y);
          const slice = document.createElement('canvas');
          slice.width = canvas.width;
          slice.height = sliceH;
          slice.getContext('2d').drawImage(canvas, 0, y, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
          doc.addImage(slice.toDataURL('image/png'), 'PNG', 0, 0, pageW, (sliceH / canvas.width) * pageW);
          y += pageHpx;
        }
        if (first) doc.text('אין נתוני מלאי', 105, 40, { align: 'center' });
        doc.save(`מצב-מלאי-קירור-לירוי-${date.replace(/\//g, '-')}.pdf`);

                                  <tbody>{pallet.productsIn.map((pr, j) => {

    const GavashView = ({ frozenProductsList = [], companyVat = '', scrollToTop = () => {}, kashrutList = [], appUser = null }) => {
      const today = localToday();
      const getKashrutColor = (name) => (kashrutList || []).find(k => k.name === name)?.color || '#6366f1';
      const [bsTab, setBsTab] = useState('inventory');
      const [shipments, setShipments] = useState([]);
      const [withdrawals, setWithdrawals] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);

      // Exit form state
      const [showExitForm, setShowExitForm] = useState(false);
      const [editingShipmentId, setEditingShipmentId] = useState(null);
      const [exitDate, setExitDate] = useState(today);
      const [exitDocNumber, setExitDocNumber] = useState('');
      const [exitProducts, setExitProducts] = useState([]);
      const [exitProductForm, setExitProductForm] = useState({ sku: '', name: '', kashrut: '', cartons: '', expiryDate: '', dateType: '', weight: '' });
      const [editingExitProduct, setEditingExitProduct] = useState(null);
      const exitSkuRef = useRef(null);
      const exitCartonsRef = useRef(null);
      const [showExitNameDropdown, setShowExitNameDropdown] = useState(false);
      const [reportDate, setReportDate] = useState(today);
      const [showAllExits, setShowAllExits] = useState(true);

      // Withdrawal form state
      const [showWdForm, setShowWdForm] = useState(false);
      const [wdDate, setWdDate] = useState(today);
      const [wdProducts, setWdProducts] = useState([]);
      const [wdForm, setWdForm] = useState({ sku: '', name: '', kashrut: '', cartons: '' });
      const [wdReportDate, setWdReportDate] = useState(today);
      const [showAllWithdrawals, setShowAllWithdrawals] = useState(false);
      const [gvEditMode, setGvEditMode] = useState(false);
      const [gvEditValues, setGvEditValues] = useState({});
      const [gvEditSaving, setGvEditSaving] = useState(false);

      const loadData = useCallback(async (silent = false) => {
        if (!silent) setLoading(true);
        const [exRes, wdRes] = await Promise.all([
          fetchAll(() => db.from('gavash_shipments').select('*').order('date', { ascending: false }).order('id')),
          fetchAll(() => db.from('gavash_withdrawals').select('*').order('date', { ascending: false }).order('id'))
        ]);
        if (!exRes.error && exRes.data) setShipments(exRes.data);
        if (!wdRes.error && wdRes.data) setWithdrawals(wdRes.data);
        setLoading(false);
      }, []);

      const enterGvEdit = () => {
        const vals = {};
        inventoryMap.forEach(item => {
          const key = (item.sku || item.name) + '|' + (item.kashrut || '') + '|' + (item.dateType || '');
          vals[key] = item.totalIn - item.totalOut;
        });
        setGvEditValues(vals);
        setGvEditMode(true);
      };

      const cancelGvEdit = () => { setGvEditMode(false); setGvEditValues({}); };

      const saveGvEdits = async () => {
        setGvEditSaving(true);
        const today = localToday();
        const wdProds = [], shProds = [];
        inventoryMap.forEach(item => {
          const key = (item.sku || item.name) + '|' + (item.kashrut || '') + '|' + (item.dateType || '');
          const newVal = gvEditValues[key];
          if (newVal === undefined) return;
          const delta = (item.totalIn - item.totalOut) - Number(newVal);
          if (delta === 0) return;
          const prod = { name: item.name, kashrut: item.kashrut, cartons: Math.abs(delta) };
          if (item.sku) prod.sku = item.sku;
          if (item.dateType) prod.dateType = item.dateType;
          if (delta > 0) wdProds.push(prod); else shProds.push(prod);
        });
        if (wdProds.length) {
          const { error } = await db.from('gavash_withdrawals').insert([{ id: Date.now(), date: today, products: wdProds }]);
          if (error) { alert('שגיאה: ' + error.message); setGvEditSaving(false); return; }
        }
        if (shProds.length) {
          const { error } = await db.from('gavash_shipments').insert([{ id: Date.now(), date: today, pallets: [{ id: Date.now()+1, number: 'תיקון ידני', products: shProds }] }]);
          if (error) { alert('שגיאה: ' + error.message); setGvEditSaving(false); return; }
        }
        await loadData(true);
        setGvEditSaving(false);
        setGvEditMode(false);
        setGvEditValues({});
      };

      useEffect(() => {
        loadData();
        let lastFocus = 0;
        const onFocus = () => { if (Date.now() - lastFocus > 30000) { lastFocus = Date.now(); loadData(true); } };
        window.addEventListener('focus', onFocus);
        return () => window.removeEventListener('focus', onFocus);
      }, []);

      const skuLookup = (sku, setForm) => {
        setForm(p => ({ ...p, sku, name: '', kashrut: '' }));
        if (sku.length >= 1) {
          const found = frozenProductsList.find(p => p.sku && p.sku.toString() === sku.toString());
          if (found) setForm(p => ({ ...p, sku, name: found.name, kashrut: found.kashrut || '' }));
        }
      };

      // ── Exit functions ──
      const addProductToExit = () => {
        if (!exitProductForm.name || !exitProductForm.cartons) return;
        if (editingExitProduct) {
          setExitProducts(prev => prev.map(pr => pr.id === editingExitProduct ? { ...exitProductForm, id: pr.id } : pr));
          setEditingExitProduct(null);
        } else {
          setExitProducts(prev => [...prev, { ...exitProductForm, id: Date.now() }]);
        }
        setExitProductForm({ sku: '', name: '', kashrut: '', cartons: '', expiryDate: '', dateType: '', weight: '' });
        setShowExitNameDropdown(false);
        setTimeout(() => exitSkuRef.current?.focus(), 30);
      };

      const startEditExitProduct = (product) => {
        setEditingExitProduct(product.id);
        setExitProductForm({ sku: product.sku||'', name: product.name||'', kashrut: product.kashrut||'', cartons: product.cartons||'', expiryDate: product.expiryDate||'', dateType: product.dateType||'', weight: product.weight||'' });
        setShowExitNameDropdown(false);
        setTimeout(() => exitSkuRef.current?.focus(), 30);
      };

      // ── Report data ──
      const reportShipments = showAllExits ? shipments : shipments.filter(s => s.date === reportDate);

      const totalCartons = allProducts.reduce((sum, p) => sum + Number(p.cartons || 0), 0);
      const totalWeight = allProducts.reduce((sum, p) => sum + Number(p.weight || 0), 0);

      const wdReportItems = showAllWithdrawals ? withdrawals : withdrawals.filter(w => w.date === wdReportDate);
      const wdTotalCartons = wdReportItems.flatMap(w => w.products).filter(p => !p.reset).reduce((sum,p) => sum + Number(p.cartons||0), 0);

      // ── Inventory calc ──
      // איפוס מלאי = משיכה שמוצריה מסומנים reset. המלאי מחושב רק מתנועות שאחרי האיפוס האחרון.
      const isResetWd = (w) => (w.products || []).some(p => p.reset);
      const lastReset = useMemo(() => withdrawals.filter(isResetWd).sort((a,b) => b.id - a.id)[0] || null, [withdrawals]);
      const inventoryMap = useMemo(() => {
        const map = {};
        const afterReset = r => !lastReset || r.id > lastReset.id;
        shipments.filter(afterReset).forEach(s => s.pallets.forEach(p => p.products.forEach(pr => {
          const key = (pr.sku || pr.name) + '|' + (pr.kashrut || '') + '|' + (pr.dateType || '');
          if (!map[key]) map[key] = { sku: pr.sku||'', name: pr.name||'', kashrut: pr.kashrut||'', dateType: pr.dateType||'', totalIn: 0, totalOut: 0 };
          map[key].totalIn += Number(pr.cartons||0);
        })));
        withdrawals.filter(afterReset).forEach(w => w.products.forEach(pr => {
          const key = (pr.sku || pr.name) + '|' + (pr.kashrut || '') + '|' + (pr.dateType || '');
          if (!map[key]) map[key] = { sku: pr.sku||'', name: pr.name||'', kashrut: pr.kashrut||'', dateType: pr.dateType||'', totalIn: 0, totalOut: 0 };
          map[key].totalOut += Number(pr.cartons||0);
        }));
        return Object.values(map).sort((a,b) => (b.totalIn-b.totalOut) - (a.totalIn-a.totalOut));
      }, [shipments, withdrawals, lastReset]);

      const [gvResetting, setGvResetting] = useState(false);

        if (!appUser?.is_admin) { alert('איפוס מלאי — למנהל בלבד'); return; }

    // ===[STATS]===

    const StatsView = ({ orders, frozenStock, frozenProductsList, kashrutList, inventoryLog, setInventoryLog }) => {
      const [checkDate, setCheckDate] = useState(localToday());
      const [checkNote, setCheckNote] = useState('');
      const [viewArchive, setViewArchive] = useState(null);
      const [bsBalance, setBsBalance] = useState({});
      const [gvBalance, setGvBalance] = useState({});
      const [bsShipments, setBsShipments] = useState([]);
      const [bsWithdrawals, setBsWithdrawals] = useState([]);
      const [gvShipments, setGvShipments] = useState([]);
      const [gvWithdrawals, setGvWithdrawals] = useState([]);
      const [storageReportTab, setStorageReportTab] = useState('monthly');
      const [storeLog, setStoreLog] = useState([]);
      const [showAllMonths, setShowAllMonths] = useState(false);

      useEffect(() => {
        Promise.all([
          fetchAll(() => db.from('beit_shemesh_shipments').select('*').order('id')),
          fetchAll(() => db.from('beit_shemesh_withdrawals').select('*').order('id'))
        ]).then(([shRes, wdRes]) => {
          if (shRes.error || wdRes.error) { reportSaveError('טעינת יתרות קירור', shRes.error || wdRes.error); return; } // לא מציגים 0 כשהטעינה נכשלה
          const map = {};
          (shRes.data || []).forEach(s => (s.pallets || []).forEach(p => (p.products || []).forEach(pr => {
            const key = (pr.name || '') + '|' + (pr.kashrut || '');
            map[key] = (map[key] || 0) + Number(pr.cartons || 0);
          })));
          (wdRes.data || []).forEach(w => {
            const prods = (w.pallets && w.pallets.length) ? w.pallets.flatMap(p => p.products || []) : (w.products || []);
            prods.forEach(pr => {
              const key = (pr.name || '') + '|' + (pr.kashrut || '');
              map[key] = (map[key] || 0) - Number(pr.cartons || 0);
            });
          });
          Object.keys(map).forEach(k => { if (map[k] < 0) map[k] = 0; });
          setBsBalance(map);
          setBsShipments(shRes.data || []);
          setBsWithdrawals(wdRes.data || []);
        });
      }, []);

      useEffect(() => {
        Promise.all([
          fetchAll(() => db.from('gavash_shipments').select('*').order('id')),
          fetchAll(() => db.from('gavash_withdrawals').select('*').order('id'))
        ]).then(([shRes, wdRes]) => {
          if (shRes.error || wdRes.error) { reportSaveError('טעינת יתרות קירור', shRes.error || wdRes.error); return; } // לא מציגים 0 כשהטעינה נכשלה
          const map = {};
          (shRes.data || []).forEach(s => (s.pallets || []).forEach(p => (p.products || []).forEach(pr => {
            const key = (pr.name || '') + '|' + (pr.kashrut || '');
            map[key] = (map[key] || 0) + Number(pr.cartons || 0);
          })));
          (wdRes.data || []).forEach(w => (w.products || []).forEach(pr => {
            const key = (pr.name || '') + '|' + (pr.kashrut || '');
            map[key] = (map[key] || 0) - Number(pr.cartons || 0);
          }));
          Object.keys(map).forEach(k => { if (map[k] < 0) map[k] = 0; });
          setGvBalance(map);
          setGvShipments(shRes.data || []);
          setGvWithdrawals(wdRes.data || []);
        });
      }, []);

      // === חישובי ניתוח קירורים ===
      const _HEB_M = ['','ינו','פב','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצ'];
      const _addM = (map, date, field, c) => { const m=(date||'').slice(0,7); if(!m) return; if(!map[m]) map[m]={In:0,Out:0}; map[m][field]+=Number(c||0); };
      const _wdProds = (w) => (w.pallets && w.pallets.length) ? w.pallets.flatMap(p=>p.products||[]) : (w.products||[]);
      const _storeM={};
      storeLog.forEach(r=>{ const d=r.data||{}; const m=(d.date||'').slice(0,7); if(!m) return; if(!_storeM[m]) _storeM[m]={In:0,Out:0}; if((d.action||'').includes('כניסה')) _storeM[m].In+=Number(d.cartons||0); else if((d.action||'').includes('משיכה')) _storeM[m].Out+=Number(d.cartons||0); });
      const storeMonthlyAll = Object.entries(_storeM).sort(([a],[b])=>a.localeCompare(b));
      const _bsM={}, _gvM={};
      bsShipments.forEach(s=>(s.pallets||[]).forEach(p=>(p.products||[]).forEach(pr=>_addM(_bsM,s.date,'In',pr.cartons))));
      bsWithdrawals.forEach(w=>_wdProds(w).forEach(pr=>_addM(_bsM,w.date,'Out',pr.cartons)));
      gvShipments.forEach(s=>(s.pallets||[]).forEach(p=>(p.products||[]).forEach(pr=>_addM(_gvM,s.date,'In',pr.cartons))));
      gvWithdrawals.forEach(w=>_wdProds(w).filter(pr=>!pr.reset).forEach(pr=>_addM(_gvM,w.date,'Out',pr.cartons)));
      const bsMonthlyAll = Object.entries(_bsM).sort(([a],[b])=>a.localeCompare(b));
      const gvMonthlyAll = Object.entries(_gvM).sort(([a],[b])=>a.localeCompare(b));
      const _bsTopMap={}, _gvTopMap={};
      bsWithdrawals.forEach(w=>_wdProds(w).forEach(pr=>{ const k=(pr.name||'')+'|'+(pr.kashrut||'')+'|'+(pr.sku||''); _bsTopMap[k]=(_bsTopMap[k]||0)+Number(pr.cartons||0); }));
      gvWithdrawals.forEach(w=>_wdProds(w).filter(pr=>!pr.reset).forEach(pr=>{ const k=(pr.name||'')+'|'+(pr.kashrut||'')+'|'+(pr.sku||''); _gvTopMap[k]=(_gvTopMap[k]||0)+Number(pr.cartons||0); }));
      const bsTop = Object.entries(_bsTopMap).sort(([,a],[,b])=>b-a).slice(0,10);
      const gvTop = Object.entries(_gvTopMap).sort(([,a],[,b])=>b-a).slice(0,10);
      const maxBsTop = Math.max(1, bsTop[0]?.[1]||1);
      const maxGvTop = Math.max(1, gvTop[0]?.[1]||1);
      const storeTopAll = (frozenProductsList||[]).filter(p=>p.storageTypes?.includes('frozen')).map(p=>({ key:`${p.name}|${p.kashrut}|${p.sku||''}`, name:p.name, kashrut:p.kashrut, sku:p.sku||'', total:frozenStock[`${p.name}|${p.kashrut}`]||0 })).filter(p=>p.total>0).sort((a,b)=>b.total-a.total);
      // === סוף חישובי ניתוח קירורים ===

      useEffect(() => {
        fetchAll(() => db.from('frozen_stock_log').select('*').order('created_at', { ascending: false }).order('id')).then(({ data }) => setStoreLog(data || []));
      }, []);

      const exportStorageReport = () => {
        const wb = window.XLSX.utils.book_new();
        if (storageReportTab === 'monthly') {
          const allMonths = [...new Set([...storeMonthlyAll.map(([m])=>m),...bsMonthlyAll.map(([m])=>m),...gvMonthlyAll.map(([m])=>m)])].sort();
          const sMap=Object.fromEntries(storeMonthlyAll), bMap=Object.fromEntries(bsMonthlyAll), gMap=Object.fromEntries(gvMonthlyAll);
          const rows = [['חודש','חנות כניסה (קרט׳)','חנות יציאה (קרט׳)','לירוי כניסה (קרט׳)','לירוי יציאה (קרט׳)','גב"ש כניסה (קרט׳)','גב"ש יציאה (קרט׳)']];
          allMonths.forEach(m=>{ const [y,mo]=m.split('-'); const s=sMap[m]||{In:0,Out:0}, bs=bMap[m]||{In:0,Out:0}, gv=gMap[m]||{In:0,Out:0}; rows.push([`${_HEB_M[Number(mo)]} ${y}`,s.In,s.Out,bs.In,bs.Out,gv.In,gv.Out]); });
          window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(rows), 'נפח חודשי');
          window.XLSX.writeFile(wb, 'נפח_חודשי.xlsx');
        } else if (storageReportTab === 'top') {
          const bsMap=Object.fromEntries(bsTop), gvMap=Object.fromEntries(gvTop);
          const rows = [['מוצר','כשרות','מק"ט','חנות (מגשים)','לירוי (קרט׳)','גב"ש (קרט׳)']];
          storeTopAll.forEach(p=>{ const k=`${p.name}|${p.kashrut}|${p.sku}`; rows.push([p.name,p.kashrut,p.sku,p.total,bsMap[k]||0,gvMap[k]||0]); });
          window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(rows), 'טופ מוצרים');
          window.XLSX.writeFile(wb, 'טופ_מוצרים.xlsx');
        }
      };

      const allKashrutForSnap = [
        ...kashrutList,
        { name: 'כללי', color: '#3b82f6' }
      ];

      const saveInventoryCheck = () => {
        const frozenSummary = allKashrutForSnap.map(k => {
          const trays = (frozenProductsList || [])
            .filter(p => (p.kashrut || '') === k.name && p.storageTypes?.includes('frozen'))
            .reduce((sum, p) => sum + (frozenStock[`${p.name}|${k.name}`] || 0), 0);
          return { name: k.name, color: k.color, trays, cartons: Math.floor(trays / TRAYS_PER_CARTON) };
        }).filter(k => k.trays > 0);

        const snapshot = {
          id: Date.now(),
          date: checkDate,
          note: checkNote,
          savedAt: new Date().toLocaleString('he-IL'),
          frozenStock: { ...frozenStock },
          bsBalance: { ...bsBalance },
          gvBalance: { ...gvBalance },
          frozenSummary
        };
        setInventoryLog(prev => [snapshot, ...prev]);
        // שומרים רק את הבדיקה החדשה — לא את כל היומן (שמירת הכל החזירה לשרת בדיקות שנמחקו ממכשיר אחר)
        db.from('inventory_log').insert({ id: snapshot.id, data: snapshot }).then(checkSave('בדיקת מלאי'));
        setCheckNote('');

      return (
        <div className="animate-in fade-in duration-300 space-y-8">
          <div>
            <h1 className="text-3xl font-extrabold text-gray-900">דוחות ובקרה</h1>
          </div>

          {/* בדיקת מלאי */}
          <div className="bg-white rounded-xl border border-blue-100 shadow-sm overflow-hidden">
            <div className="p-4 bg-blue-50 border-b border-blue-100 flex items-center gap-3">
              <span className="text-xl">📋</span>
              <div>
                <h2 className="font-extrabold text-blue-900">עדכון בדיקת מלאי</h2>
                <p className="text-xs text-blue-600">שמירת סנאפשוט של מלאי סחורה עם תאריך — יישמר בארכיון</p>
              </div>
            </div>
            <div className="p-5 flex flex-wrap gap-4 items-end">
              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1">תאריך בדיקה</label>
                <input type="date" value={checkDate} onChange={e => setCheckDate(e.target.value)}

              <div className="flex-1 min-w-[200px]">
                <label className="block text-xs font-bold text-gray-500 mb-1">הערה (אופציונלי)</label>

              </div>
              <Button variant="primary" icon={Icons.Save} onClick={saveInventoryCheck}>
