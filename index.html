              </Button>
            </div>
            {inventoryLog.length > 0 && (
              <div className="px-5 pb-2 text-xs text-gray-400">
                בדיקה אחרונה: <strong className="text-gray-600">{inventoryLog[0].date}</strong> — נשמרה ב-{inventoryLog[0].savedAt}
                {inventoryLog[0].note && <span> | {inventoryLog[0].note}</span>}
              </div>
            )}
          </div>


          {/* ניתוח קירורים */}
          {(bsShipments.length > 0 || gvShipments.length > 0) && (
            <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
              <div className="p-4 border-b border-gray-100 flex items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <span className="text-xl">🏭</span>
                  <div>
                    <h2 className="font-extrabold text-gray-800">ניתוח קירורים — לירוי וגב"ש</h2>
                    <p className="text-xs text-gray-400 mt-0.5">נתונים מתוך תעודות הכניסה והמשיכה</p>
                  </div>
                </div>
                <button onClick={exportStorageReport}
                  className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold text-green-700 bg-green-50 border border-green-200 rounded-lg hover:bg-green-100 transition-colors">
                  📥 ייצוא לאקסל
                </button>
              </div>

              <div className="flex border-b border-gray-100">
                {[{id:'monthly',label:'📅 נפח חודשי'},{id:'top',label:'🏆 טופ מוצרים'}].map(t=>(
                  <button key={t.id} onClick={()=>setStorageReportTab(t.id)}
                    className={`px-5 py-3 text-sm font-bold transition-colors border-b-2 ${storageReportTab===t.id?'border-blue-500 text-blue-700 bg-blue-50/50':'border-transparent text-gray-500 hover:text-gray-700'}`}>
                    {t.label}
                  </button>
                ))}
              </div>

              <div className="p-5">
                {storageReportTab==='monthly' && (() => {
                    const slice = (arr) => showAllMonths ? arr : arr.slice(-3);
                    const storeM=slice(storeMonthlyAll), bsM=slice(bsMonthlyAll), gvM=slice(gvMonthlyAll);
                    const maxSt=Math.max(1,...storeMonthlyAll.flatMap(([,v])=>[v.In,v.Out]));
                    const maxBs=Math.max(1,...bsMonthlyAll.flatMap(([,v])=>[v.In,v.Out]));
                    const maxGv=Math.max(1,...gvMonthlyAll.flatMap(([,v])=>[v.In,v.Out]));
                    const totalMonths = Math.max(storeMonthlyAll.length, bsMonthlyAll.length, gvMonthlyAll.length);
                    return (<>
                  <div className="flex items-center justify-between mb-2">
                    <p className="text-xs text-gray-400">{showAllMonths ? `כל ההיסטוריה (${totalMonths} חודשים)` : '3 חודשים אחרונים'}</p>
                    {totalMonths > 3 && <button onClick={()=>setShowAllMonths(p=>!p)} className="text-xs text-blue-600 hover:underline font-bold">{showAllMonths ? '← חזור ל-3 חודשים' : 'הצג כל ההיסטוריה →'}</button>}
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {[{label:'🏪 מלאי חנות',data:storeM,max:maxSt},{label:'❄️ קירור לירוי',data:bsM,max:maxBs},{label:'❄️ קירור גב"ש',data:gvM,max:maxGv}].map(({label,data,max})=>(
                      <div key={label}>
                        <h3 className="font-bold text-gray-700 mb-3 text-sm border-b border-gray-100 pb-2">{label}</h3>
                        {data.length===0
                          ? <div className="text-gray-400 text-sm text-center py-4">אין נתונים</div>
                          : <div className="space-y-3">
                              {data.map(([month,v])=>{
                                const [y,m]=month.split('-');
                                return (
                                  <div key={month}>
                                    <div className="text-xs font-bold text-gray-500 mb-1">{_HEB_M[Number(m)]} {y}</div>
                                    <div className="space-y-1">
                                      <div className="flex items-center gap-2">
                                        <span className="text-[10px] text-green-600 w-20 shrink-0">↓ כניסה {v.In} קרט׳</span>
                                        <div className="flex-1 bg-gray-100 rounded-full h-3"><div className="bg-green-400 h-3 rounded-full" style={{width:`${(v.In/max)*100}%`}}/></div>
                                      </div>
                                      <div className="flex items-center gap-2">
                                        <span className="text-[10px] text-orange-500 w-20 shrink-0">↑ יציאה {v.Out} קרט׳</span>
                                        <div className="flex-1 bg-gray-100 rounded-full h-3"><div className="bg-orange-400 h-3 rounded-full" style={{width:`${(v.Out/max)*100}%`}}/></div>
                                      </div>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                        }
                      </div>
                    ))}
                    <div className="md:col-span-3 flex gap-5 pt-1 text-xs text-gray-400 border-t border-gray-100">
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-green-400 inline-block"/>כניסה לקירור</span>
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-orange-400 inline-block"/>יציאה מקירור</span>
                    </div>
                  </div>
                  </>); })()}

                {storageReportTab==='top' && (() => {
                  const storeTop = storeTopAll.slice(0,10);
                  const maxStore = Math.max(1, storeTop[0]?.total||1);
                  const cols = [
                    {label:'🏪 מלאי חנות', data:storeTop.map(p=>({...p, label:`${p.total} מגשים (${Math.floor(p.total/TRAYS_PER_CARTON)} קרט׳)`})), max:maxStore, color:'bg-green-500', unit:''},
                    {label:'❄️ קירור לירוי', data:bsTop.map(([k,t])=>{ const [n,ks,sk]=k.split('|'); return {key:k,name:n,kashrut:ks,sku:sk||'',total:t}; }), max:maxBsTop, color:'bg-blue-500', unit:'קרט׳'},
                    {label:'❄️ קירור גב"ש',  data:gvTop.map(([k,t])=>{ const [n,ks,sk]=k.split('|'); return {key:k,name:n,kashrut:ks,sku:sk||'',total:t}; }), max:maxGvTop, color:'bg-blue-500', unit:'קרט׳'},
                  ];
                  return (
                    <div>
                      <p className="text-xs text-gray-400 mb-4">10 המוצרים המובילים — חנות לפי מגשים, קירורים לפי קרטונים מצטברים</p>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                        {cols.map(({label,data,max,color,unit})=>(
                          <div key={label}>
                            <h3 className="font-bold text-gray-700 mb-3 text-sm border-b border-gray-100 pb-2">{label}</h3>
                            {!data.length ? <div className="text-gray-400 text-sm text-center py-4">אין נתונים</div>
                              : <div className="space-y-2">
                                  {data.map((p,i)=>(
                                    <div key={p.key} className="flex items-center gap-1.5">
                                      <span className="text-xs font-extrabold text-gray-300 w-4 shrink-0 text-center">{i+1}</span>
                                      <div className="w-20 shrink-0">
                                        <div className="text-xs font-medium text-gray-800 truncate" title={p.name}>{p.name}</div>
                                        <div className="text-[10px] text-gray-400 truncate">{p.kashrut}{p.sku?` · ${p.sku}`:''}</div>
                                      </div>
                                      <div className="flex-1 bg-gray-100 rounded-full h-5">
                                        <div className={`${color} h-5 rounded-full flex items-center justify-end px-1.5 min-w-[2rem]`} style={{width:`${(p.total/max)*100}%`}}>
                                          <span className="text-[9px] text-white font-bold whitespace-nowrap">{p.label||`${p.total} ${unit}`}</span>
                                        </div>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                            }
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })()}
              </div>
            </div>
          )}

          {/* ארכיון בדיקות מלאי */}
          {inventoryLog.length > 0 && (
            <div>
              <h2 className="text-lg font-extrabold text-gray-700 mb-3 flex items-center gap-2">🗄️ ארכיון בדיקות מלאי ({inventoryLog.length})</h2>
              <div className="space-y-3">
                {inventoryLog.map(entry => (
                  <div key={entry.id} className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div className="p-4 flex items-center justify-between">
                      <div>
                        <div className="font-extrabold text-gray-900">📅 בדיקת מלאי — {entry.date}</div>
                        <div className="text-xs text-gray-400 mt-0.5">נשמר ב-{entry.savedAt} | {entry.ordersCount} הזמנות במערכת</div>
                        {entry.note && <div className="text-xs text-blue-600 mt-0.5 font-medium">📝 {entry.note}</div>}
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => setViewArchive(viewArchive?.id === entry.id ? null : entry)}
                          className="text-xs font-bold text-blue-600 hover:text-blue-800 border border-blue-200 px-3 py-1.5 rounded-lg hover:bg-blue-50 transition-colors">
                          {viewArchive?.id === entry.id ? 'סגור' : 'הצג פירוט'}
                        </button>
                        <button
                          onClick={() => {
                            if (viewArchive?.id === entry.id) setViewArchive(null);
                            setInventoryLog(prev => prev.filter(e => e.id !== entry.id));
                            db.from('inventory_log').delete().eq('id', entry.id).then(checkSave('מחיקת בדיקת מלאי'));
                          }}
                          className="text-xs font-bold text-red-500 hover:text-red-700 border border-red-200 px-3 py-1.5 rounded-lg hover:bg-red-50 transition-colors">
                          מחק
                        </button>
                      </div>
                    </div>

                    {viewArchive?.id === entry.id && (
                      <div className="border-t border-gray-100 p-4 bg-gray-50/50 space-y-4">
                        {/* סיכום לפי קטגוריה */}
                        {(() => {
                          const snap = entry.frozenStock || {};
                          const catTotals = {};
                          Object.entries(snap).forEach(([key, trays]) => {
                            if (!trays) return;
                            const [name, kashrut] = key.split('|');
                            const prod = (frozenProductsList || []).find(p => p.name === name && (p.kashrut || '') === kashrut);
                            const cat = prod?.category || getProductCategory(name);
                            if (!catTotals[cat]) catTotals[cat] = 0;
                            catTotals[cat] += trays;
                          });
                          const cats = [...PRODUCT_CATEGORIES, ...Object.keys(catTotals).filter(c => !PRODUCT_CATEGORIES.includes(c))].filter(c => catTotals[c]);
                          if (!cats.length) return <div className="text-sm text-gray-400">אין מלאי בסנאפשוט זה</div>;
                          return (
                            <div className="flex flex-wrap gap-3">
                              {cats.map(cat => {
                                const cs = CAT_STYLES[cat] || {};
                                const trays = catTotals[cat];
                                const cartons = Math.floor(trays / TRAYS_PER_CARTON);
                                const remainder = trays % TRAYS_PER_CARTON;
                                return (
                                  <div key={cat} className={`bg-white rounded-xl border-2 px-4 py-3 text-center min-w-[110px] ${cs.border || 'border-gray-200'}`}>
                                    <div className={`text-sm font-extrabold mb-1 ${cs.text || 'text-gray-700'}`}>{CAT_EMOJI[cat]} {cat}</div>
                                    <div className="font-black text-gray-900 text-lg">{cartons}{remainder > 0 ? <span className="text-sm font-bold text-gray-400">+{remainder}</span> : ''} קרטונים</div>
                                    <div className="text-xs text-gray-400 mt-0.5">{trays} מגשים</div>
                                  </div>
                                );
                              })}
                            </div>
                          );
                        })()}
                        {/* פירוט מוצרים לפי כשרות וקטגוריה — ישירות ממפתחות הסנאפשוט */}
                        {(() => {
                          const snap = entry.frozenStock || {};
                          const snapBs = entry.bsBalance || {};
                          const snapGv = entry.gvBalance || {};
                          // איחוד מפתחות מ-frozenStock, bsBalance ו-gvBalance
                          const allKeys = new Set([
                            ...Object.keys(snap).filter(k => (snap[k] || 0) > 0),
                            ...Object.keys(snapBs).filter(k => (snapBs[k] || 0) > 0),
                            ...Object.keys(snapGv).filter(k => (snapGv[k] || 0) > 0)
                          ]);
                          const items = Array.from(allKeys).map(key => {
                              const [name, kashrut] = key.split('|');
                              const trays = snap[key] || 0;
                              const prod = (frozenProductsList || []).find(p => p.name === name && (p.kashrut || '') === kashrut);
                              return { name, kashrut, sku: prod?.sku || '', category: prod?.category || getProductCategory(name), trays };
                            });
                          if (!items.length) return null;
                          // קבץ לפי כשרות
                          const byKashrut = {};
                          items.forEach(item => {
                            if (!byKashrut[item.kashrut]) byKashrut[item.kashrut] = [];
                            byKashrut[item.kashrut].push(item);
                          });
                          const kashrutOrder = [...kashrutList.map(k => k.name), 'כללי'];
                          return kashrutOrder.filter(kName => byKashrut[kName]).map(kName => {
                            const kObj = kashrutList.find(k => k.name === kName) || { name: 'כללי', color: '#3b82f6' };
                            const grouped = {};
                            byKashrut[kName].forEach(item => {
                              if (!grouped[item.category]) grouped[item.category] = [];
                              grouped[item.category].push(item);
                            });
                            const cats = getCats(grouped);
                            return (
                              <div key={kName} className="rounded-xl overflow-hidden border-2" style={{ borderColor: (kObj.color || '#888') + '60' }}>
                                <div className="px-4 py-2 text-white text-sm font-bold" style={{ backgroundColor: kObj.color || '#888' }}>{kName}</div>
                                {cats.map(cat => {
                                  const cs = CAT_STYLES[cat] || {};
                                  return (
                                    <div key={cat}>
                                      <div className={`px-3 py-1.5 text-xs font-extrabold flex items-center gap-1 border-b border-gray-100 ${cs.header || 'bg-gray-50'} ${cs.text || 'text-gray-600'}`}>
                                        <span>{CAT_EMOJI[cat]}</span><span>{cat}</span>
                                      </div>
                                      <table className="w-full text-right text-xs">
                                        <thead>
                                          <tr className="bg-gray-100 text-gray-500">
                                            <th className="p-2 text-right font-bold">מוצר</th>
                                            <th className="p-2 text-center font-bold">🧊 קירור סופר עוף</th>
                                            <th className="p-2 text-center font-bold">🏭 קירור לירוי</th>
                                            <th className="p-2 text-center font-bold">🏭 קירור גב"ש</th>
                                          </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100 bg-white">
                                          {grouped[cat].map((item, idx) => {
                                            const cartons = Math.floor(item.trays / TRAYS_PER_CARTON);
                                            const remainder = item.trays % TRAYS_PER_CARTON;
                                            const key = `${item.name}|${item.kashrut}`;
                                            const bsCar = snapBs[key] || 0;
                                            const totalCar = cartons + bsCar;
                                            const gvCar = snapGv[key] || 0;
                                            const totalCarGv = cartons + gvCar;
                                            return (
                                              <tr key={item.name} style={{ backgroundColor: idx % 2 === 0 ? '#ffffff' : '#f9fafb' }}>
                                                <td className="p-2 font-bold text-gray-900">
                                                  {item.name}
                                                  {item.sku && <span className="block text-gray-400 font-normal">{item.sku}</span>}
                                                </td>
                                                <td className="p-2 text-center text-blue-700 font-black">{cartons}{remainder > 0 ? <span className="text-gray-400 font-normal">+{remainder}</span> : ''} <span className="text-gray-400 font-normal text-[10px]">קרט'</span></td>
                                                <td className="p-2 text-center font-black text-emerald-700">{totalCar} <span className="text-gray-400 font-normal text-[10px]">קרט'</span></td>
                                                <td className="p-2 text-center font-black text-teal-700">{totalCarGv} <span className="text-gray-400 font-normal text-[10px]">קרט'</span></td>
                                              </tr>
                                            );
                                          })}
                                        </tbody>
                                      </table>
                                    </div>
                                  );
                                })}
                              </div>
                            );
                          });
                        })()}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ===[AUTH]===
    // --- User Management Helpers ---
    const hashPassword = async (pw) => {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    };
    // אימייל פנימי ל-Supabase Auth — תואם ל-public.so_email בשרת (db/01_auth_prepare.sql)
    const soEmail = async (username) => (await hashPassword(username)).slice(0, 32) + '@superoff.local';

    const ALL_PAGES = [
      { id: 'inventory',    label: 'מלאי סחורה כללי' },
      { id: 'beit-shemesh', label: 'קירור לירוי' },
      { id: 'gavash',       label: 'קירור גב"ש' },
      { id: 'orders',       label: 'ניהול הזמנות' },
      { id: 'deliveries',   label: 'מערך משלוחים' },
      { id: 'contacts',     label: 'אנשי קשר' },
      { id: 'lists',        label: 'ניהול רשימות' },
      { id: 'archive',      label: 'ארכיון הזמנות' },
      { id: 'stats',        label: 'דוחות ובקרה' },
      { id: 'dashboard',    label: 'לוח בקרה' },
      { id: 'settings',     label: 'הגדרות' },
    ];

    const PAGE_FEATURES = {
      'inventory': [
        { id: 'inventory.entry',      label: 'כניסה למלאי' },
        { id: 'inventory.withdrawal', label: 'משיכה ממלאי' },
        { id: 'inventory.export',     label: 'ייצוא מלאי' },
        { id: 'inventory.log',        label: 'יומן פעולות' },
        { id: 'inventory.reset',      label: 'איפוס מלאי' },
      ],
    };

    // --- Users Management View ---
    const UsersManagementView = ({ couriersList = [] }) => {
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [editingUser, setEditingUser] = useState(null);
      const [form, setForm] = useState({ username: '', password: '', is_admin: false, permissions: { pages: [], canEdit: [], hiddenFeatures: [] } });
      const [saving, setSaving] = useState(false);
      const [formError, setFormError] = useState('');

      const loadUsers = async () => {
        const { data } = await db.from('app_users').select('id,username,is_admin,active,permissions,created_at').order('created_at');
        setUsers(data || []);
        setLoading(false);
      };
      useEffect(() => { loadUsers(); }, []);

      const openAdd = () => {
        setEditingUser(null);
        setForm({ username: '', password: '', is_admin: false, permissions: { pages: [], canEdit: [], hiddenFeatures: [] } });
        setFormError('');
        setShowModal(true);
      };
      const openEdit = (user) => {
        setEditingUser(user);
        setForm({
          username: user.username, password: '', is_admin: user.is_admin,
          permissions: {
            pages: user.permissions?.pages || [],
            canEdit: user.permissions?.canEdit || [],
            hiddenFeatures: user.permissions?.hiddenFeatures || [],
            courierId: user.permissions?.courierId || '',
          }
        });
        setFormError('');
        setShowModal(true);
      };

      const togglePage = (pageId) => {
        setForm(f => {
          const pages = f.permissions.pages.includes(pageId)
            ? f.permissions.pages.filter(p => p !== pageId)
            : [...f.permissions.pages, pageId];
          const canEdit = f.permissions.canEdit.filter(p => pages.includes(p));
          const hiddenFeatures = pages.includes(pageId)
            ? (f.permissions.hiddenFeatures || [])
            : (f.permissions.hiddenFeatures || []).filter(fid => !fid.startsWith(pageId + '.'));
          return { ...f, permissions: { ...f.permissions, pages, canEdit, hiddenFeatures } };
        });
      };
      const toggleEdit = (pageId) => {
        setForm(f => {
          if (!f.permissions.pages.includes(pageId)) return f;
          const canEdit = f.permissions.canEdit.includes(pageId)
            ? f.permissions.canEdit.filter(p => p !== pageId)
            : [...f.permissions.canEdit, pageId];
          return { ...f, permissions: { ...f.permissions, canEdit } };
        });
      };
      const toggleFeature = (featureId) => {
        setForm(f => {
          const hf = f.permissions.hiddenFeatures || [];
          const hiddenFeatures = hf.includes(featureId)
            ? hf.filter(id => id !== featureId)
            : [...hf, featureId];
          return { ...f, permissions: { ...f.permissions, hiddenFeatures } };
        });
      };
      const selectAllPages = () => {
        setForm(f => ({ ...f, permissions: { ...f.permissions, pages: ALL_PAGES.map(p => p.id), canEdit: ALL_PAGES.map(p => p.id), hiddenFeatures: f.permissions.hiddenFeatures || [] } }));
      };
      const clearAllPages = () => {
        setForm(f => ({ ...f, permissions: { ...f.permissions, pages: [], canEdit: [], hiddenFeatures: [] } }));
      };

      const handleSave = async () => {
        setSaving(true); setFormError('');
        try {
          if (!editingUser && !form.password) { setFormError('סיסמה נדרשת'); setSaving(false); return; }
          if (!form.username.trim()) { setFormError('שם משתמש נדרש'); setSaving(false); return; }
          // דרך פונקציה בשרת (מנהל בלבד) — מעדכנת גם את חשבון הכניסה המאובטח
          const { error: err } = await db.rpc('admin_save_user', {
            p_id: editingUser ? editingUser.id : null,
            p_username: form.username,
            p_password_hash: form.password ? await hashPassword(form.password) : null,
            p_is_admin: form.is_admin,
            p_permissions: form.permissions
          });
          if (err) throw err;
          await loadUsers();
          setShowModal(false);
        } catch (e) {
          setFormError(e.message || 'שגיאה בשמירה');
        }
        setSaving(false);
      };

      const toggleActive = async (user) => {
        const { error: err } = await db.rpc('admin_set_active', { p_id: user.id, p_active: !user.active });
        if (err) alert('שגיאה: ' + err.message);
        await loadUsers();
      };

      if (loading) return <div className="text-center p-12 text-gray-400">טוען משתמשים...</div>;

      return (
        <div dir="rtl">
          <div className="flex items-center justify-between mb-6">
            <h2 className="text-2xl font-extrabold text-gray-800">ניהול משתמשים</h2>
            <button onClick={openAdd} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-xl font-bold text-sm hover:bg-blue-700">
              <Icons.Plus className="w-4 h-4" /> הוסף משתמש
            </button>
          </div>
          <div className="bg-white rounded-2xl border border-gray-200 overflow-hidden">
            <table className="w-full text-sm">
              <thead>
                <tr className="bg-gray-50 border-b border-gray-200">
                  <th className="p-3 text-right font-bold text-gray-600">שם משתמש</th>
                  <th className="p-3 text-center font-bold text-gray-600">תפקיד</th>
                  <th className="p-3 text-center font-bold text-gray-600">עמודים</th>
                  <th className="p-3 text-center font-bold text-gray-600">סטטוס</th>
                  <th className="p-3 text-center font-bold text-gray-600">פעולות</th>
                </tr>
              </thead>
              <tbody>
                {users.map(user => (
                  <tr key={user.id} className={`border-b border-gray-100 ${!user.active ? 'opacity-50' : ''}`}>
                    <td className="p-3 font-bold text-gray-800">{user.username}</td>
                    <td className="p-3 text-center">
                      {user.is_admin
                        ? <span className="px-2 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-bold">מנהל</span>
                        : <span className="px-2 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-bold">משתמש</span>}
                    </td>
                    <td className="p-3 text-center text-gray-500 text-xs">
                      {user.is_admin ? 'הכל' : `${(user.permissions?.pages || []).length} / ${ALL_PAGES.length}`}
                    </td>
                    <td className="p-3 text-center">
                      {user.active
                        ? <span className="text-green-600 font-bold text-xs">פעיל</span>
                        : <span className="text-gray-400 font-bold text-xs">מושבת</span>}
                    </td>
                    <td className="p-3 text-center">
                      <div className="flex items-center justify-center gap-2">
                        <button onClick={() => openEdit(user)} className="px-3 py-1 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold hover:bg-blue-100">עריכה</button>
                        <button onClick={() => toggleActive(user)}
                          className={`px-3 py-1 rounded-lg text-xs font-bold ${user.active ? 'bg-red-50 text-red-600 hover:bg-red-100' : 'bg-green-50 text-green-600 hover:bg-green-100'}`}>
                          {user.active ? 'השבת' : 'הפעל'}
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {showModal && (
            <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" dir="rtl">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
                <div className="p-5 border-b border-gray-100 flex items-center justify-between">
                  <h3 className="text-lg font-extrabold">{editingUser ? 'עריכת משתמש' : 'הוספת משתמש'}</h3>
                  <button onClick={() => setShowModal(false)} className="text-gray-400 hover:text-gray-600"><Icons.X className="w-5 h-5" /></button>
                </div>
                <div className="p-5 space-y-4">
                  {formError && <div className="p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">{formError}</div>}
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">שם משתמש</label>
                    <input type="text" value={form.username} onChange={e => setForm(f => ({ ...f, username: e.target.value }))}
                      className="w-full p-3 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-400" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">
                      {editingUser ? 'סיסמה חדשה (השאר ריק לאי-שינוי)' : 'סיסמה'}
                    </label>
                    <input type="password" value={form.password} onChange={e => setForm(f => ({ ...f, password: e.target.value }))}
                      className="w-full p-3 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-400 text-left" dir="ltr" />
                  </div>
                  <div className="flex items-center gap-3">
                    <input type="checkbox" id="isAdminCb" checked={form.is_admin} onChange={e => setForm(f => ({ ...f, is_admin: e.target.checked }))} className="w-4 h-4 accent-purple-600" />
                    <label htmlFor="isAdminCb" className="font-bold text-sm text-gray-700">מנהל — גישה לכל העמודים</label>
                  </div>
                  {!form.is_admin && (
                    <div className="flex flex-wrap items-center gap-2 p-3 bg-blue-50 border border-blue-100 rounded-xl">
                      <label htmlFor="courierSel" className="font-bold text-sm text-gray-700">שליח:</label>
                      <select id="courierSel" value={form.permissions.courierId || ''} onChange={e => { const v = e.target.value; setForm(f => ({ ...f, permissions: { ...f.permissions, courierId: v, pages: v && !f.permissions.pages.includes('deliveries') ? [...f.permissions.pages, 'deliveries'] : f.permissions.pages } })); }} className="flex-1 p-2 border border-gray-300 rounded-lg text-sm bg-white">
                        <option value="">— לא שליח —</option>
                        {couriersList.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                      <p className="w-full text-xs text-gray-500">משתמש שמקושר לשליח רואה במערך משלוחים רק את "המסלול שלי" — הסבבים שלו.</p>
                    </div>
                  )}
                  {!form.is_admin && (
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-bold text-gray-500">הרשאות עמודים</span>
                        <div className="flex gap-2">
                          <button onClick={selectAllPages} className="text-xs text-blue-600 hover:underline">בחר הכל</button>
                          <span className="text-gray-300">|</span>
                          <button onClick={clearAllPages} className="text-xs text-gray-500 hover:underline">נקה הכל</button>
                        </div>
                      </div>
                      <div className="border border-gray-200 rounded-xl overflow-hidden">
                        <table className="w-full text-sm">
                          <thead>
                            <tr className="bg-gray-50">
                              <th className="p-2 text-right text-xs font-bold text-gray-500">עמוד</th>
                              <th className="p-2 text-center text-xs font-bold text-gray-500">צפייה</th>
                              <th className="p-2 text-center text-xs font-bold text-gray-500">עריכה</th>
                            </tr>
                          </thead>
                          <tbody>
                            {ALL_PAGES.map(page => (
                              <React.Fragment key={page.id}>
                                <tr className="border-t border-gray-100">
                                  <td className="p-2 text-gray-700 font-medium">{page.label}</td>
                                  <td className="p-2 text-center">
                                    <input type="checkbox" checked={form.permissions.pages.includes(page.id)} onChange={() => togglePage(page.id)} className="w-4 h-4 accent-blue-600" />
                                  </td>
                                  <td className="p-2 text-center">
                                    <input type="checkbox" checked={form.permissions.canEdit.includes(page.id)} onChange={() => toggleEdit(page.id)}
                                      disabled={!form.permissions.pages.includes(page.id)} className="w-4 h-4 accent-green-600 disabled:opacity-30" />
                                  </td>
                                </tr>
                                {PAGE_FEATURES[page.id] && form.permissions.pages.includes(page.id) && PAGE_FEATURES[page.id].map(feat => (
                                  <tr key={feat.id} className="bg-gray-50/70 border-t border-gray-100/50">
                                    <td className="p-1.5 pr-6 text-gray-400 text-xs">↳ {feat.label}</td>
                                    <td className="p-1.5 text-center" colSpan={2}>
                                      <input type="checkbox"
                                        checked={!(form.permissions.hiddenFeatures || []).includes(feat.id)}
                                        onChange={() => toggleFeature(feat.id)}
                                        className="w-3.5 h-3.5 accent-blue-500" />
                                    </td>
                                  </tr>
                                ))}
                              </React.Fragment>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </div>
                <div className="p-5 border-t border-gray-100 flex gap-3">
                  <button onClick={handleSave} disabled={saving}
                    className="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl disabled:opacity-50">
                    {saving ? 'שומר...' : 'שמור'}
                  </button>
                  <button onClick={() => setShowModal(false)} className="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl">
                    ביטול
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- Login Screen ---
    const LoginScreen = ({ onLogin }) => {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const isFirstSetup = false; // משתמשים חדשים נוצרים רק ע"י מנהל (ניהול משתמשים)

      // כניסה דרך Supabase Auth — הסיסמה נבדקת בשרת, ורק משתמש מחובר יכול לגשת לנתונים
      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true); setError('');
        try {
          const hash = await hashPassword(password);
          const { data: auth, error: authErr } = await db.auth.signInWithPassword({ email: await soEmail(username), password: hash });
          if (authErr) { setError(/invalid/i.test(authErr.message) ? 'שם משתמש או סיסמה שגויים' : 'שגיאה: ' + authErr.message); setLoading(false); return; }
          const { data, error: err } = await db.from('app_users').select('id,username,is_admin,active,permissions').eq('id', auth.user.id).maybeSingle();
          if (err || !data || !data.active) {
            await db.auth.signOut();
            setError(err ? 'שגיאה: ' + err.message : 'המשתמש אינו פעיל');
            setLoading(false); return;
          }
          const user = { id: data.id, username: data.username, is_admin: data.is_admin, permissions: data.permissions };
          localStorage.setItem('appUser', JSON.stringify(user));
          onLogin(user);
        } catch (ex) { setError('שגיאה: ' + (ex?.message || ex)); setLoading(false); }
      };

      return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4" dir="rtl">
          <div className="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-sm overflow-hidden">
            <div className="bg-red-600 p-6 text-center">
              <div className="text-white text-4xl font-black tracking-widest">סופר עוף</div>
              <div className="text-red-200 text-sm mt-1">מערכת ניהול קצביה</div>
            </div>
            <div className="p-6">
              <h2 className="font-bold text-lg text-gray-800 mb-5 text-center">{isFirstSetup ? 'הגדרת מנהל ראשוני' : 'כניסה למערכת'}</h2>
              {isFirstSetup && <div className="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg text-blue-700 text-sm text-center">כניסה ראשונה — צור שם משתמש וסיסמה</div>}
              {error && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm font-bold text-center">{error}</div>}
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1">שם משתמש</label>
                  <input type="text" required value={username} onChange={e => setUsername(e.target.value)}
                    placeholder="שם משתמש"
                    className="w-full p-3 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-400" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1">סיסמה</label>
                  <input type="password" required value={password} onChange={e => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full p-3 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-400 text-left" dir="ltr" />
                </div>
                <button type="submit" disabled={loading}
                  className="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                  {loading ? '...אנא המתן' : (isFirstSetup ? 'צור מנהל וכנס' : 'כניסה')}
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    // ===[APP]===
    // --- Main App Component ---
    function App() {
      const [activeTab, setActiveTab] = useState(() => {
        const stored = localStorage.getItem('activeTab') || 'orders';
        try {
          const u = JSON.parse(localStorage.getItem('appUser'));
          if (!u || u.is_admin) return stored;
          const allowed = u.permissions?.pages || [];
          return allowed.includes(stored) ? stored : (allowed[0] || 'orders');
        } catch { return stored; }
      });
      const navigateTo = useCallback((tabId) => { setActiveTab(tabId); localStorage.setItem('activeTab', tabId); }, []);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [fontSize, setFontSize] = useState(readFontSize);
      const [isOnline, setIsOnline] = useState(() => navigator.onLine);
      useEffect(() => {
        const on = () => setIsOnline(true), off = () => setIsOnline(false);
        window.addEventListener('online', on); window.addEventListener('offline', off);
        return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
      }, []);
      const [appUser, setAppUser] = useState(() => { try { return JSON.parse(localStorage.getItem('appUser')); } catch { return null; } });

      useEffect(() => {
        if (!appUser || appUser.is_admin) return;
        const allowed = appUser.permissions?.pages || [];
        if (allowed.length > 0 && !allowed.includes(activeTab)) {
          navigateTo(allowed[0]);
        }
      }, [appUser]);
      const [appLoading, setAppLoading] = useState(false);
      const dataLoadedRef = useRef(false);
      const remoteOrdersRef = useRef(null);  // המערך האחרון שהגיע מהשרת — לא שומרים אותו חזרה
      const syncedOrdersRef = useRef([]);    // מצב ההזמנות בשמירה הקודמת — להשוואה
      const initialLoadDoneRef = useRef(false);
      const mainScrollRef = useRef(null);
      const scrollToTop = useCallback(() => { if (mainScrollRef.current) mainScrollRef.current.scrollTo({ top: 0, behavior: 'smooth' }); }, []);

      // 1. מלאי טרי — מפתח: 'מוצר|כשרות'
      const [stock, setStock] = useState({});
      const [frozenProductsList, setFrozenProductsList] = useState(() => [
        ...FROZEN_PRODUCTS.flatMap((name, i) =>
          FROZEN_KASHRUT.map((kashrut, j) => ({ id: `${i + 1}_${j + 1}`, name, sku: '', storageTypes: ['frozen'], kashrut }))
        ),
        ...NEW_PRODUCTS_TEMPLATE.flatMap((p, i) =>
          p.category === 'דגים'
            ? [{ id: `new_${i + 1}_1`, name: p.name, sku: '', storageTypes: p.storageTypes, kashrut: 'כללי', category: 'דגים' }]
            : FROZEN_KASHRUT.map((kashrut, j) => ({ id: `new_${i + 1}_${j + 1}`, name: p.name, sku: '', storageTypes: p.storageTypes, kashrut }))
        ),
      ]);
      const [frozenStock, setFrozenStock] = useState(initFrozenStock);

      // 2. הזמנות לקוחות
      // נטענות מהשרת — בלי הזמנת דוגמה (שעלולה להישמר בטעות)
      const [orders, setOrders] = useState([]);

      // 3. רשימות מערכת קבועות
      const [couriersList, setCouriersList] = useState([
        { id: '1', name: 'אבי (קטנוע)' }, { id: '2', name: 'יוסי (רכב)' }
      ]);

      const [kashrutList, setKashrutList] = useState([
        { id: '3', name: 'קהילות', color: '#ea580c' },
        { id: '1', name: 'לנדא',    color: '#9333ea' },
        { id: '2', name: 'בד"ץ',   color: '#059669' },
        { id: '4', name: 'רובין',   color: '#e11d48' }
      ]);

      const [neighborhoodData, setNeighborhoodData] = useState(INITIAL_NEIGHBORHOODS);
      const [contactsList, setContactsList] = useState([]);
      const [orderFormSkuMap, setOrderFormSkuMap] = useState({});
      const [logoImage, setLogoImage] = useState('');
      const [companyVat, setCompanyVat] = useState('');
      const [waReadyTemplate, setWaReadyTemplate] = useState(''); // נוסח הודעת וואטסאפ "ההזמנה מוכנה" (ריק = ברירת מחדל)

      const [butchersList, setButchersList] = useState([
        { id: '1', name: 'משה' },
        { id: '2', name: 'דוד' },
        { id: '3', name: 'יעקב' }
      ]);

      // 4. חישוב דינמי אמיתי של חוסרים
      // נחשב את סך הדרישות בהזמנות שממתינות להכנה (סטטוס new) ונשווה למלאי הקיים
      const shortages = useMemo(() => {
        const requiredMap = {};
        
        // נסכום את הפריטים בהזמנות פתוחות
        orders
          .filter(o => o.status === 'new')
          .forEach(order => {
            order.items.forEach(item => {
              // נדלג על הערות אריזה
              if (item.qty === '-') return;
              const name = item.cleanName || item.name;
              requiredMap[name] = (requiredMap[name] || 0) + item.qty;
            });
          });

        const diff = {};
        Object.entries(requiredMap).forEach(([name, reqQty]) => {
          const availQty = stock[name] || 0;
          if (reqQty > availQty) {
            diff[name] = {
              required: reqQty,
              available: availQty,
              shortage: reqQty - availQty
            };
          }
        });

        return diff;
      }, [orders, stock]);

      const [inventoryLog, setInventoryLog] = useState([]);

      // --- בטיחות נתונים: מה שהגיע מהשרת לאחרונה, לכל ישות (כ-JSON) ---
      // ערך שזהה למה שהשרת שלח — לא נשמר חזרה. מחליף את טיימר ה-300ms, שגרם לפעולות ללכת לאיבוד או להד ישן שדורס
      const remoteRef = useRef({});
      // השוואה לפי תוכן בלבד — סדר השדות באובייקט לא משנה
      const stableJson = (v) => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x)) ? Object.keys(x).sort().reduce((o, key) => (o[key] = x[key], o), {}) : x);
      const fromRemote = (key, value) => {
        remoteRef.current[key] = stableJson(value);
        if (key === 'frozenStock') frozenConfirmedRef.current = { ...(value || {}) };
        return value;
      };
      const ordersFetchSeqRef = useRef(0);
      const [dataReady, setDataReady] = useState(false);
      const [loadError, setLoadError] = useState(null);
      const [loadAttempt, setLoadAttempt] = useState(0);
      const [saveErrors, setSaveErrors] = useState([]);

      useEffect(() => {
        const onErr = (e) => setSaveErrors(prev => [...prev.filter(x => x.label !== e.detail.label), { ...e.detail, at: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) }]);
        window.addEventListener('so-save-error', onErr);
        return () => window.removeEventListener('so-save-error', onErr);
      }, []);

      const applySettingsRow = (id, data, isInitial) => {
        if (id === 'kashrutList') setKashrutList(fromRemote(id, data));
        if (id === 'butchersList') setButchersList(fromRemote(id, data));
        if (id === 'couriersList') setCouriersList(fromRemote(id, data));
        if (id === 'neighborhoodData') setNeighborhoodData(fromRemote(id, data));
        if (id === 'contactsList') setContactsList(fromRemote(id, data));
        if (id === 'orderFormSkuMap') setOrderFormSkuMap(fromRemote(id, data));
        if (id === 'appSettings') {
          fromRemote(id, { logoImage: data?.logoImage || '', companyVat: data?.companyVat || '', waReadyTemplate: data?.waReadyTemplate || '' });
          setLogoImage(data?.logoImage || '');
          setCompanyVat(data?.companyVat || '');
          setWaReadyTemplate(data?.waReadyTemplate || '');
        }
        if (id === 'frozenProductsList') {
          if (!isInitial) { setFrozenProductsList(fromRemote(id, data)); return; }
          const raw = data.map(p => ({ sku: '', storageTypes: ['frozen'], ...p }));
          const needsMigration = raw.every(p => !p.kashrut);
          let loaded = needsMigration
            ? raw.flatMap((p, i) => FROZEN_KASHRUT.map((k, j) => ({ ...p, id: `${p.id}_${j + 1}`, kashrut: k })))
            : raw;
          // מיגרציה לדגים: מחיקת כפולות לפי כשרות, שמירה כ-'כללי'
          const fishNames = new Set(NEW_PRODUCTS_TEMPLATE.filter(p => p.category === 'דגים').map(p => p.name));
          const seenFish = new Set();
          loaded = loaded.filter(p => {
            if (!fishNames.has(p.name)) return true;
            if (seenFish.has(p.name)) return false;
            seenFish.add(p.name);
            p.kashrut = 'כללי';
            p.category = 'דגים';
            return true;
          });
          fromRemote(id, data); // אם המיגרציה שינתה משהו — הערך שונה מהשרת ולכן יישמר פעם אחת
          setFrozenProductsList(loaded);
        }
      };

      // --- Supabase: טעינת נתונים ---
      // אם משהו בטעינה נכשל — לא פותחים את המערכת ולא שומרים כלום (אחרת נתוני ברירת המחדל היו דורסים את השרת)
      useEffect(() => {
        if (!appUser || initialLoadDoneRef.current) return;
        initialLoadDoneRef.current = true;
        const load = async () => {
          setAppLoading(true);
          setLoadError(null);
          try {
            // חייבים חיבור מאובטח פעיל; בלעדיו (למשל כניסה מגרסה ישנה) — חוזרים למסך הכניסה
            const { data: { session } } = await db.auth.getSession();
            if (!session) { localStorage.removeItem('appUser'); initialLoadDoneRef.current = false; setAppUser(null); return; }
            // פרטי המשתמש מהשרת בכל טעינה: משתמש שהושבת יוצא, הרשאות שעודכנו נכנסות לתוקף
            const me = await db.from('app_users').select('id,username,is_admin,active,permissions').eq('id', session.user.id).maybeSingle();
            if (me.error) throw me.error;
            if (!me.data || !me.data.active) { await db.auth.signOut(); localStorage.removeItem('appUser'); initialLoadDoneRef.current = false; setAppUser(null); return; }
            const fresh = { id: me.data.id, username: me.data.username, is_admin: me.data.is_admin, permissions: me.data.permissions };
            if (JSON.stringify(fresh) !== JSON.stringify(appUser)) { localStorage.setItem('appUser', JSON.stringify(fresh)); setAppUser(fresh); }

            const results = await Promise.all([
              fetchAll(() => db.from('orders').select('data').order('created_at', { ascending: false }).order('id')),
              db.from('fresh_stock').select('data').eq('id', 'main').maybeSingle(),
              db.from('frozen_stock').select('data').eq('id', 'main').maybeSingle(),
              db.from('settings').select('*'),
              fetchAll(() => db.from('inventory_log').select('data').order('created_at', { ascending: false }).order('id'))
            ]);
            const failed = results.find(r => r.error);
            if (failed) throw failed.error;
            const [ordersRes, freshRes, frozenRes, settingsRes, logRes] = results;

            const o = (ordersRes.data || []).map(r => r.data);
            remoteOrdersRef.current = o;
            setOrders(o);
            if (freshRes.data) setStock(fromRemote('stock', freshRes.data.data));
            // אין עדיין שורת מלאי בשרת — מתחילים ממלאי ריק (ולא מברירת המחדל), כדי שהשינוי הראשון יישמר נכון
            setFrozenStock(fromRemote('frozenStock', frozenRes.data ? frozenRes.data.data : {}));
            (settingsRes.data || []).forEach(row => applySettingsRow(row.id, row.data, true));
            setInventoryLog((logRes.data || []).map(r => r.data));

            dataLoadedRef.current = true;
            setDataReady(true);
          } catch (err) {
            console.error('[load-error]', err);
            setLoadError(err?.message || String(err));
            initialLoadDoneRef.current = false; // מאפשר "נסה שוב"
          } finally {
            setAppLoading(false);
          }
        };
        load();
      }, [appUser, loadAttempt]);

      // --- Supabase: שמירה ---
      // שומרים רק את מה שהמכשיר הזה שינה — כדי לא לדרוס/למחוק הזמנות שמכשיר אחר יצר או עדכן
      useEffect(() => {
        const prev = syncedOrdersRef.current;
        syncedOrdersRef.current = orders;
        if (!dataLoadedRef.current || orders === remoteOrdersRef.current) return;
        const prevById = new Map(prev.map(o => [o.id, o]));
        orders.forEach(o => { if (prevById.get(o.id) !== o) db.from('orders').upsert({ id: o.id, data: o }).then(checkSave(`הזמנה #${o.id}`)); });
        const ids = new Set(orders.map(o => o.id));
        prev.forEach(o => { if (!ids.has(o.id)) db.from('orders').delete().eq('id', o.id).then(checkSave(`מחיקת הזמנה #${o.id}`)); });
      }, [orders]);

      const saveIfChanged = (key, value, label, doSave) => {
        if (!dataLoadedRef.current) return;
        const json = stableJson(value);
        if (remoteRef.current[key] === json) return;
        remoteRef.current[key] = json;
        doSave().then(res => {
          if (res?.error) { remoteRef.current[key] = undefined; reportSaveError(label, res.error); }
        });
      };
      const saveSetting = (key, value, label) => saveIfChanged(key, value, label, () => db.from('settings').upsert({ id: key, data: value }));

      useEffect(() => { saveIfChanged('stock', stock, 'מלאי טרי', () => db.from('fresh_stock').upsert({ id: 'main', data: stock, updated_at: new Date().toISOString() })); }, [stock]);
      // מלאי קפוא: שומרים את השינוי (כמה נוסף/ירד בכל מוצר) ולא את כל המסמך.
      // לפני כל כתיבה קוראים את המצב העדכני מהשרת ומחילים עליו את השינוי — כך שני מכשירים שעובדים במקביל
      // מצטרפים זה לזה במקום לדרוס. שמירות רצות בתור, אחת אחרי השנייה
      // frozenConfirmedRef = המצב שכל השינויים שלו כבר נשלחו לשרת (או הגיע מהשרת). שינוי חדש = ההפרש ממנו.
      // שמירה שנכשלה מחזירה את ההפרש שלה ל"ממתין", כך שהשמירה הבאה תכלול אותו — בלי כפילות ובלי אובדן
      const frozenSaveChainRef = useRef(Promise.resolve());
      const frozenConfirmedRef = useRef(null);
      const frozenPendingRef = useRef(0);
      useEffect(() => {
        if (!dataLoadedRef.current || !frozenConfirmedRef.current) return;
        const base = frozenConfirmedRef.current;
        const target = frozenStock;
        if (stableJson(target) === stableJson(base)) return;
        const deltas = {};
        Object.keys(target).forEach(k => {
          const d = (Number(target[k]) || 0) - (Number(base[k]) || 0);
          if (d !== 0 || !(k in base)) deltas[k] = d;
        });
        const removed = Object.keys(base).filter(k => !(k in target)).map(k => [k, base[k]]);
        frozenConfirmedRef.current = { ...target };
        frozenPendingRef.current++;
        const revert = (err) => {
          // ההפרש לא הגיע לשרת — מחזירים אותו לממתין
          const c = { ...frozenConfirmedRef.current };
          Object.entries(deltas).forEach(([k, d]) => { c[k] = (Number(c[k]) || 0) - d; if (d === 0 && !(k in base)) delete c[k]; });
          removed.forEach(([k, v]) => { c[k] = v; });
          frozenConfirmedRef.current = c;
          reportSaveError('מלאי', err);
        };
        frozenSaveChainRef.current = frozenSaveChainRef.current.then(async () => {
          const { data, error } = await db.from('frozen_stock').select('data').eq('id', 'main').maybeSingle();
          if (error) return revert(error);
          const server = { ...(data?.data || {}) };
          Object.entries(deltas).forEach(([k, d]) => { server[k] = (Number(server[k]) || 0) + d; });
          removed.forEach(([k]) => { delete server[k]; });
          const w = await db.from('frozen_stock').upsert({ id: 'main', data: server, updated_at: new Date().toISOString() });
          if (w.error) return revert(w.error);
          // אחרי השמירה האחרונה בתור — אם מכשיר אחר שינה בינתיים, מציגים את התוצאה המשולבת
          if (frozenPendingRef.current === 1 && stableJson(server) !== stableJson(frozenConfirmedRef.current)) {
            frozenConfirmedRef.current = { ...server };
            setFrozenStock(server);
          }
        }).catch(revert).finally(() => { frozenPendingRef.current--; });
      }, [frozenStock]);
      useEffect(() => { saveSetting('kashrutList', kashrutList, 'רשימת כשרויות'); }, [kashrutList]);
      useEffect(() => { saveSetting('butchersList', butchersList, 'רשימת קצבים'); }, [butchersList]);
      useEffect(() => { saveSetting('couriersList', couriersList, 'רשימת שליחים'); }, [couriersList]);
      useEffect(() => { saveSetting('frozenProductsList', frozenProductsList, 'רשימת מוצרים'); }, [frozenProductsList]);
      useEffect(() => { saveSetting('neighborhoodData', neighborhoodData, 'שכונות'); }, [neighborhoodData]);
      useEffect(() => { saveSetting('contactsList', contactsList, 'אנשי קשר'); }, [contactsList]);
      useEffect(() => { saveSetting('orderFormSkuMap', orderFormSkuMap, 'מק"טים בטופס הזמנה'); }, [orderFormSkuMap]);
      useEffect(() => { saveSetting('appSettings', { logoImage, companyVat, waReadyTemplate }, 'הגדרות'); }, [logoImage, companyVat, waReadyTemplate]);
      // inventory_log: בדיקה חדשה נשמרת ישירות ב-StatsView (insert), מחיקה — delete. אין שמירה גורפת של כל היומן

      // --- רענון הזמנות מהשרת (עדכון חי / חזרה לאפליקציה) ---
      const refetchOrders = async () => {
        const seq = ++ordersFetchSeqRef.current;
        const res = await fetchAll(() => db.from('orders').select('data').order('created_at', { ascending: false }).order('id'));
        if (res.error || !res.data || seq !== ordersFetchSeqRef.current) return; // תשובה ישנה שהגיעה מאוחר — מתעלמים
        const o = res.data.map(r => r.data);
        remoteOrdersRef.current = o;
        setOrders(o);
      };

      // --- Supabase Realtime ---
      useEffect(() => {
        if (!appUser || !dataReady) return;

        const channel = db.channel('realtime-sync')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'frozen_stock', filter: 'id=eq.main' }, (payload) => {
            if (payload.new?.data) setFrozenStock(fromRemote('frozenStock', payload.new.data));
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'fresh_stock', filter: 'id=eq.main' }, (payload) => {
            if (payload.new?.data) setStock(fromRemote('stock', payload.new.data));
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => { refetchOrders(); })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, (payload) => {
            if (!payload.new?.id || payload.new?.data === undefined) return;
            applySettingsRow(payload.new.id, payload.new.data, false);
          })
          .subscribe();

        // טלפון שחזר מרקע — החיבור החי אולי נותק בינתיים; מושכים מצב עדכני לפני שהמשתמש ממשיך לעבוד
        const onVisible = async () => {
          if (document.visibilityState !== 'visible') return;
          const [fz, fr] = await Promise.all([
            db.from('frozen_stock').select('data').eq('id', 'main').maybeSingle(),
            db.from('fresh_stock').select('data').eq('id', 'main').maybeSingle()
          ]);
          if (!fz.error && fz.data) setFrozenStock(fromRemote('frozenStock', fz.data.data));
          if (!fr.error && fr.data) setStock(fromRemote('stock', fr.data.data));
          refetchOrders();
        };
        document.addEventListener('visibilitychange', onVisible);

        return () => { db.removeChannel(channel); document.removeEventListener('visibilitychange', onVisible); };
      }, [appUser, dataReady]);

      const handleSignOut = () => {
        db.auth.signOut();
        localStorage.removeItem('appUser');
        setAppUser(null);
        dataLoadedRef.current = false;
        initialLoadDoneRef.current = false;
        setDataReady(false);
      };

      const countStatus = (st) => { const n = orders.filter(o => o.status === st).length; return n > 0 ? n.toString() : null; };
      const menuItems = [
        { id: 'orders', group: 'תפעול', label: 'ניהול הזמנות', short: 'הזמנות', ico: 'cart', badge: orders.filter(o => o.status === 'new').length.toString() },
        { id: 'deliveries', group: 'תפעול', label: (!appUser?.is_admin && appUser?.permissions?.courierId) ? 'המסלול שלי' : 'מערך משלוחים', short: 'משלוחים', ico: 'truck', badge: countStatus('completed'), dim: true },
        { id: 'archive', group: 'תפעול', label: 'ארכיון הזמנות', short: 'ארכיון', ico: 'archive', badge: countStatus('delivered'), dim: true },
        { id: 'inventory', group: 'מלאי וקירור', label: 'מלאי סחורה - כללי', short: 'מלאי', ico: 'box' },
        { id: 'beit-shemesh', group: 'מלאי וקירור', label: 'קירור לירוי', short: 'לירוי', ico: 'snow' },
        { id: 'gavash', group: 'מלאי וקירור', label: 'קירור גב"ש', short: 'גב"ש', ico: 'snow' },
        { id: 'contacts', group: 'ניהול', label: 'אנשי קשר', short: 'אנשי קשר', ico: 'users' },
        { id: 'lists', group: 'ניהול', label: 'ניהול רשימות', short: 'רשימות', ico: 'list' },
        { id: 'stats', group: 'ניהול', label: 'דוחות ובקרה', short: 'דוחות', ico: 'chart' },
        { id: 'settings', group: 'ניהול', label: 'הגדרות', short: 'הגדרות', ico: 'gear' },
        ...(appUser?.is_admin ? [{ id: 'users', group: 'ניהול', label: 'ניהול משתמשים', short: 'משתמשים', ico: 'shield' }] : []),
      ];
      const visibleMenuItems = appUser?.is_admin
        ? menuItems
        : menuItems.filter(item => (appUser?.permissions?.pages || []).includes(item.id));
      const menuGroups = ['תפעול', 'מלאי וקירור', 'ניהול']
        .map(g => [g, visibleMenuItems.filter(i => i.group === g)])
        .filter(([, items]) => items.length);
      const currentItem = menuItems.find(i => i.id === activeTab);
      // ניווט תחתון בנייד: 3 המסכים הראשונים שמותרים למשתמש + "עוד"
      const bottomItems = ['orders', 'inventory', 'deliveries', 'beit-shemesh', 'gavash', 'archive']
        .map(id => visibleMenuItems.find(i => i.id === id)).filter(Boolean).slice(0, 3);

      const renderContent = () => {
        switch (activeTab) {
          case 'inventory':
            return <InventoryView stock={stock} setStock={setStock} frozenStock={frozenStock} setFrozenStock={setFrozenStock} kashrutList={kashrutList} frozenProductsList={frozenProductsList} appUser={appUser} />;
          case 'orders':
            return <OrdersView kashrutList={kashrutList} butchersList={butchersList} orders={orders} setOrders={setOrders} stock={stock} neighborhoodData={neighborhoodData} contactsList={contactsList} frozenProductsList={frozenProductsList} orderFormSkuMap={orderFormSkuMap} setOrderFormSkuMap={setOrderFormSkuMap} logoImage={logoImage} />;
          case 'shortages': 
            return <ShortagesView shortages={shortages} />;
          case 'deliveries':
            return <DeliveriesView orders={orders} setOrders={setOrders} couriersList={couriersList} kashrutList={kashrutList} butchersList={butchersList} neighborhoodData={neighborhoodData} appUser={appUser} waReadyTemplate={waReadyTemplate} />;
          case 'contacts':
            return <ContactsView contactsList={contactsList} setContactsList={setContactsList} />;
          case 'lists':
            return <ListsManagementView productsList={[]} setProductsList={()=>{}} couriersList={couriersList} setCouriersList={setCouriersList} kashrutList={kashrutList} setKashrutList={setKashrutList} butchersList={butchersList} setButchersList={setButchersList} frozenProductsList={frozenProductsList} setFrozenProductsList={setFrozenProductsList} neighborhoodData={neighborhoodData} setNeighborhoodData={setNeighborhoodData} orderFormSkuMap={orderFormSkuMap} setOrderFormSkuMap={setOrderFormSkuMap} />;
          case 'archive':
            return <ArchiveView orders={orders} setOrders={setOrders} kashrutList={kashrutList} />;
          case 'stats':
            return <StatsView orders={orders} frozenStock={frozenStock} frozenProductsList={frozenProductsList} kashrutList={kashrutList} inventoryLog={inventoryLog} setInventoryLog={setInventoryLog} />;
          case 'beit-shemesh':
            return <BeitShemeshView frozenProductsList={frozenProductsList} companyVat={companyVat} scrollToTop={scrollToTop} kashrutList={kashrutList} />;
          case 'gavash':
            return <GavashView frozenProductsList={frozenProductsList} companyVat={companyVat} scrollToTop={scrollToTop} kashrutList={kashrutList} appUser={appUser} />;
          case 'settings':
            return <SettingsView logoImage={logoImage} setLogoImage={setLogoImage} companyVat={companyVat} setCompanyVat={setCompanyVat} waReadyTemplate={waReadyTemplate} setWaReadyTemplate={setWaReadyTemplate} />;
          case 'users':
            return <UsersManagementView couriersList={couriersList} />;
          default:
            return <OrdersView kashrutList={kashrutList} butchersList={butchersList} orders={orders} setOrders={setOrders} stock={stock} neighborhoodData={neighborhoodData} contactsList={contactsList} frozenProductsList={frozenProductsList} orderFormSkuMap={orderFormSkuMap} setOrderFormSkuMap={setOrderFormSkuMap} logoImage={logoImage} />;
        }
      };

      if (!appUser) return <LoginScreen onLogin={user => { setAppUser(user); }} />;

      if (loadError && !appLoading) return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 max-w-md w-full text-center space-y-4">
            <div className="text-4xl font-black text-red-600">סופר עוף</div>
            <div className="text-xl font-extrabold text-gray-900">לא הצלחנו לטעון את הנתונים מהשרת</div>
            <div className="text-gray-600">כדי שלא יידרסו נתונים, המערכת לא נפתחת בלי טעינה מלאה. בדקו את החיבור לאינטרנט ונסו שוב.</div>
            <button onClick={() => setLoadAttempt(n => n + 1)} className="w-full py-3 rounded-xl bg-red-600 text-white font-bold text-lg hover:bg-red-700">נסה שוב</button>
            <div className="text-xs text-gray-500 break-words" dir="ltr">{loadError}</div>
          </div>
        </div>
      );

      if (appLoading || !dataReady) return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center">
          <div className="text-center">
            <div className="text-4xl font-black text-red-600 mb-3">סופר עוף</div>
            <div className="text-gray-500 text-sm animate-pulse">טוען נתונים מהשרת...</div>
          </div>
        </div>
      );

      return (
        <div className="so-app">
          {saveErrors.length > 0 && (
            <div role="alert" className="fixed top-0 inset-x-0 z-[100] bg-red-600 text-white px-4 py-3 shadow-lg flex flex-wrap items-center gap-3">
              <span className="font-extrabold">⚠ תקלה מול השרת — ייתכן שפעולה לא נשמרה:</span>
              <span className="flex-1 min-w-[200px]">{saveErrors.map(e => `${e.label} (${e.at})`).join(' · ')} — בדקו את החיבור לאינטרנט. מומלץ לרענן את הדף ולבדוק שהנתונים נכונים לפני שממשיכים.</span>
              <button onClick={() => window.location.reload()} className="px-4 py-2 rounded-lg bg-white text-red-700 font-bold">רענון</button>
              <button onClick={() => setSaveErrors([])} className="px-4 py-2 rounded-lg border border-white/60 font-bold">סגור</button>
            </div>
          )}
          {/* סיידבר כהה (מחשב) */}
          <nav className="so-side" aria-label="ניווט ראשי">
            <div className="so-logo"><div className="so-logo-mark">ס</div><div><b>סופר עוף</b><span>ניהול קצביה</span></div></div>
            {menuGroups.map(([g, items]) => (
              <div key={g} className="so-nav-group">
                <div className="so-nav-title">{g}</div>
                {items.map(item => (
                  <button key={item.id} className="so-nav-btn" aria-current={activeTab === item.id ? 'page' : undefined}
                    onClick={() => navigateTo(item.id)}>
                    <LineIcon name={item.ico} /><span>{item.label}</span>
                    {item.badge && <span className={`so-badge ${item.dim ? 'dim' : ''}`}>{item.badge}</span>}
                  </button>
                ))}
              </div>
            ))}
            <div className="so-side-user">
              <div className="so-avatar">{(appUser?.username || '?').charAt(0)}</div>
              <div className="min-w-0">
                <div className="truncate" style={{ fontWeight: 800, color: '#fff' }}>{appUser?.username}</div>
                <div style={{ color: 'var(--side-muted)' }}>{appUser?.is_admin ? 'מנהל' : 'משתמש'} · מחובר</div>
              </div>
              <button className="so-signout" onClick={handleSignOut} title="יציאה" aria-label="יציאה"><LineIcon name="logout" /></button>
            </div>
          </nav>

          {/* תוכן */}
          <main className="so-main">
            <div ref={mainScrollRef} className="so-scroll custom-scrollbar">
              <div className="so-inner">
                <header className="so-topbar">
                  <div className="so-grow">
                    <div className="sub">{currentItem?.group || ''}</div>
                    <h1>{currentItem?.label || ''}</h1>
                  </div>
                  <div className="so-fontbox" role="group" aria-label="גודל טקסט"><span>גודל טקסט</span>
                    {FONT_SIZES.map(([v, l, size]) => (
                      <button key={v} aria-pressed={fontSize === v} style={{ fontSize: size }} onClick={() => { setFontSize(v); applyFontSize(v); }}>{l}</button>
                    ))}
                  </div>
                  <div className={`so-sync ${(!isOnline || saveErrors.length) ? 'bad' : ''}`}>
                    <i></i>{!isOnline ? 'אין חיבור' : saveErrors.length ? 'תקלת שמירה' : 'מסונכרן'}
                  </div>
                </header>
                <div>{renderContent()}</div>
              </div>
            </div>
          </main>

          {/* ניווט תחתון (נייד) */}
          <nav className="so-bottomnav" aria-label="ניווט תחתון">
            {bottomItems.map(item => (
              <button key={item.id} aria-current={activeTab === item.id && !isMobileMenuOpen ? 'page' : undefined}
                onClick={() => { navigateTo(item.id); setIsMobileMenuOpen(false); }}>
                <LineIcon name={item.ico} />{item.short}
                {item.badge && <span className={`so-badge ${item.dim ? 'dim' : ''}`}>{item.badge}</span>}
              </button>
            ))}
            <button aria-current={isMobileMenuOpen || !bottomItems.some(i => i.id === activeTab) ? 'page' : undefined}
              onClick={() => setIsMobileMenuOpen(o => !o)}>
              <LineIcon name="more" />עוד
            </button>
          </nav>

          {isMobileMenuOpen && (
            <div className="so-sheet-bg" onClick={() => setIsMobileMenuOpen(false)}>
              <div className="so-sheet" onClick={e => e.stopPropagation()}>
                {menuGroups.map(([g, items]) => (
                  <div key={g} className="so-sheet-card">
                    <div className="so-sheet-title">{g}</div>
                    {items.map(item => (
                      <button key={item.id} className="so-morebtn" aria-current={activeTab === item.id ? 'page' : undefined}
                        onClick={() => { navigateTo(item.id); setIsMobileMenuOpen(false); }}>
                        <LineIcon name={item.ico} />{item.label}
                        {item.badge && <span className={`so-badge ${item.dim ? 'dim' : ''}`}>{item.badge}</span>}
                      </button>
                    ))}
                  </div>
                ))}
                <div className="so-sheet-card">
                  <div className="so-sheet-title">{appUser?.username}{appUser?.is_admin ? ' · מנהל' : ''}</div>
                  <button className="so-morebtn" style={{ color: '#991B1B' }} onClick={handleSignOut}><LineIcon name="logout" />יציאה</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
