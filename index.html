<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>

    }

  <script>
    tailwind.config = {

          fontFamily: {

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Heebo:wght@400;700;800;900&family=David+Libre:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Assistant', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    /* מובייל — כפתורים נוחים לגעת */
    @media (max-width: 768px) {
      button, select, input[type="number"], input[type="text"], input[type="tel"], input[type="date"], input[type="time"], input[type="email"], input[type="password"] {
        min-height: 44px;
        font-size: 16px !important; /* מונע zoom ב-iOS */
      }
      table { font-size: 13px; }
    }
    
    /* Custom scrollbar for better UI */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #c084fc;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #a855f7;
    }

    /* Print styles strictly tailored for A5 paper */
    @page {
      size: A5 portrait;
      margin: 5mm;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #physical-print-slip-area, #physical-print-slip-area * {
        visibility: visible;
      }
      #physical-print-slip-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 138mm; /* A5 width minus margins */
        height: 200mm;
        background: white !important;
        color: black !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      header, footer, nav, button {
        display: none !important;
      }
    }
    /* שדות כמות במלאי: הקלדה בלבד, בלי חיצי הגדלה/הקטנה */
    input[data-stock-col]::-webkit-outer-spin-button,
    input[data-stock-col]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[data-stock-col] { -moz-appearance: textfield; appearance: textfield; }

    /* ===== עיצוב חדש (לפי דמו v3) — מעטפת ===== */
    :root {
      --fs: 18px;
      --ground: #F3F1ED; --surface: #FFFFFF; --ink: #17171A; --muted: #4A4642; --line: #E2DED8; --line-soft: #EEEBE6;
      --side: #1B1A1E; --side-2: #2A282E; --side-ink: #E9E6E2; --side-muted: #B3ADA6;
      --brand: #B91C1C;
      --in: #166534; --in-bg: #DCFCE7; --out: #9F1239; --out-bg: #FFE4E6; --low: #9F1239; --low-bg: #FFF1F2;
    }
    html { font-size: var(--fs); }
    body { font-family: 'Heebo', 'Assistant', Arial, sans-serif; background: var(--ground); color: var(--ink); font-variant-numeric: tabular-nums; }
    :focus-visible { outline: 3px solid #2563EB; outline-offset: 2px; }
    .so-ico { width: 1.25em; height: 1.25em; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .so-app { display: flex; height: 100vh; background: var(--ground); color: var(--ink); overflow: hidden; }
    .so-side { width: 15.5rem; flex-shrink: 0; background: var(--side); color: var(--side-ink); padding: 1.2rem .8rem; display: flex; flex-direction: column; gap: 1.2rem; height: 100vh; overflow-y: auto; }
    .so-logo { display: flex; align-items: center; gap: .7rem; padding: 0 .4rem; }
    .so-logo-mark { width: 2.5rem; height: 2.5rem; border-radius: .7rem; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 1.35rem; }
    .so-logo b { display: block; font-size: 1.2rem; font-weight: 900; color: #fff; }
    .so-logo span { font-size: .8rem; color: var(--side-muted); }
    .so-nav-group { display: flex; flex-direction: column; gap: .15rem; }
    .so-nav-title { font-size: .75rem; font-weight: 700; color: var(--side-muted); padding: 0 .7rem .3rem; letter-spacing: .03em; }
    .so-nav-btn { display: flex; align-items: center; gap: .7rem; width: 100%; min-height: 2.75rem; padding: .5rem .7rem; border: 0; border-radius: .6rem; background: transparent; color: var(--side-ink); font-size: .95rem; font-weight: 600; text-align: right; }
    .so-nav-btn:hover { background: #24222A; }
    .so-nav-btn[aria-current="page"] { background: var(--side-2); color: #fff; font-weight: 800; }
    .so-nav-btn .so-ico { color: var(--side-muted); }
    .so-nav-btn[aria-current="page"] .so-ico { color: #FCA5A5; }
    .so-badge { margin-inline-start: auto; min-width: 1.6rem; height: 1.4rem; padding: 0 .45rem; border-radius: .7rem; background: var(--brand); color: #fff; font-size: .75rem; font-weight: 800; display: grid; place-items: center; }
    .so-badge.dim { background: #3A373F; }
    .so-side-user { margin-top: auto; display: flex; align-items: center; gap: .6rem; padding: .7rem; border-radius: .8rem; background: #232127; font-size: .85rem; }
    .so-avatar { width: 2.2rem; height: 2.2rem; border-radius: 50%; background: #44403C; color: #fff; display: grid; place-items: center; font-weight: 800; flex-shrink: 0; }
    .so-signout { margin-inline-start: auto; border: 1px solid #44403C; border-radius: .55rem; background: transparent; color: var(--side-ink); padding: .35rem .55rem; display: grid; place-items: center; }
    .so-signout:hover { background: #3A1A1A; color: #FCA5A5; }
    .so-main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .so-scroll { flex: 1; overflow-y: auto; padding: 1.4rem 1.8rem 3rem; }
    .so-inner { max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.1rem; }
    .so-topbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .8rem; }
    .so-topbar h1 { margin: 0; font-size: 2rem; font-weight: 900; letter-spacing: -.01em; white-space: nowrap; line-height: 1.2; }
    .so-topbar .sub { font-size: .9rem; color: var(--muted); font-weight: 600; }
    .so-grow { flex: 1 1 16rem; min-width: 0; }
    .so-fontbox { display: flex; align-items: center; gap: .25rem; background: var(--surface); border: 1px solid var(--line); border-radius: .8rem; padding: .25rem; }
    .so-fontbox span { font-size: .8rem; color: var(--muted); padding: 0 .4rem; font-weight: 700; }
    .so-fontbox button { min-width: 2.6rem; height: 2.4rem; border: 0; border-radius: .55rem; background: transparent; font-weight: 800; }
    .so-fontbox button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    .so-sync { display: flex; align-items: center; gap: .45rem; padding: .45rem .8rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .8rem; font-weight: 700; color: var(--muted); }
    .so-sync i { width: .55rem; height: .55rem; border-radius: 50%; background: #15803D; }
    .so-sync.bad { color: #991B1B; border-color: #FECACA; background: #FEF2F2; }
    .so-sync.bad i { background: #DC2626; }
    .so-bottomnav { display: none; }
    .so-sheet-bg { position: fixed; inset: 0; background: rgba(20,18,16,.45); z-index: 60; display: flex; align-items: flex-end; }
    .so-sheet { background: var(--ground); width: 100%; max-height: 85vh; overflow-y: auto; border-radius: 1.2rem 1.2rem 0 0; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: .7rem; }
    .so-sheet-card { background: #fff; border: 1px solid var(--line); border-radius: 1rem; padding: .6rem; }
    .so-sheet-title { font-weight: 800; color: var(--muted); font-size: .85rem; padding: .3rem .5rem; }
    .so-morebtn { display: flex; align-items: center; gap: .8rem; width: 100%; min-height: 3.4rem; padding: 0 .8rem; border: 0; border-radius: .7rem; background: transparent; font-size: 1.1rem; font-weight: 700; text-align: right; color: var(--ink); }
    .so-morebtn:hover, .so-morebtn[aria-current="page"] { background: #F4F2EE; }
    .so-morebtn[aria-current="page"] { color: var(--brand); }
    /* כשרות: צבע + אות */
    .so-kletter { width: 2.1rem; height: 2.1rem; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 900; font-size: 1.05rem; background: var(--k); color: #fff; flex-shrink: 0; }
    .so-kchip { display: inline-flex; align-items: center; gap: .35rem; padding: .15rem .65rem .15rem .25rem; border-radius: 999px; background: var(--k); color: #fff; font-weight: 800; font-size: .85rem; white-space: nowrap; }
    .so-kchip .so-kletter { width: 1.45rem; height: 1.45rem; font-size: .75rem; background: #fff; color: var(--k); }
    @media (max-width: 860px) {
      .so-side { display: none; }
      .so-scroll { padding: 1rem 1rem 6.5rem; }
      .so-topbar h1 { font-size: 1.6rem; }
      .so-fontbox span { display: none; }
      .so-bottomnav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; bottom: 0; right: 0; left: 0; background: #fff; border-top: 1px solid var(--line); z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
      .so-bottomnav button { position: relative; border: 0; background: transparent; min-height: 4rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; font-size: .75rem; font-weight: 700; color: var(--muted); }
      .so-bottomnav button[aria-current="page"] { color: var(--brand); }
      .so-bottomnav .so-badge { position: absolute; top: .35rem; left: calc(50% - 1.9rem); margin: 0; }
    }
    @media print { .so-side, .so-bottomnav, .so-topbar { display: none !important; } }

    /* ===== מסך מלאי ===== */
    .so-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
    .so-btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 2.75rem; padding: 0 1rem; border-radius: .7rem; border: 1px solid #CFCAC3; background: var(--surface); color: var(--ink); font-weight: 700; font-size: .95rem; }
    .so-btn:hover { background: #F7F5F2; }
    .so-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .so-btn.danger { color: #991B1B; border-color: #FECACA; }
    .so-btn.danger:hover { background: #FEF2F2; }
    .so-btn:disabled { opacity: .45; cursor: not-allowed; }
    .so-btn.danger-solid { background: #B91C1C; border-color: #B91C1C; color: #fff; }
    .so-btn.danger-solid:hover { background: #991B1B; }
    .so-modal-f .so-btn { flex: 1; }
    .so-delwarn { font-size: .9rem; font-weight: 700; color: #991B1B; }
    .so-ktabs { display: flex; flex-wrap: wrap; gap: .6rem; }
    .so-ktab { display: flex; align-items: center; gap: .7rem; min-height: 3.6rem; padding: .4rem 1.1rem .4rem 1.3rem; border-radius: .9rem; border: 3px solid var(--k); background: var(--surface); color: var(--k-ink); font-weight: 800; font-size: 1.15rem; text-align: right; line-height: 1.2; }
    .so-ktab[aria-selected="true"] { background: var(--k); color: #fff; box-shadow: 0 .3rem .9rem -0.3rem var(--k); }
    .so-ktab[aria-selected="true"] .so-kletter { background: #fff; color: var(--k); }
    .so-ktab small { font-size: .8rem; font-weight: 700; opacity: .85; }
    .so-kframe { border: 3px solid var(--k); border-radius: 1.05rem; background: var(--surface); overflow: hidden; }
    .so-kband { display: flex; align-items: center; gap: .8rem; padding: .8rem 1.2rem; background: var(--k); color: #fff; }
    .so-kband h2 { margin: 0; font-size: 1.3rem; font-weight: 900; }
    .so-kband .so-kletter { background: #fff; color: var(--k); width: 2.4rem; height: 2.4rem; font-size: 1.2rem; }
    .so-kband .tot { margin-inline-start: auto; font-size: .95rem; font-weight: 700; }
    .so-kband .tot b { font-size: 1.5rem; font-weight: 900; }
    .so-tools { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; padding: .9rem 1.2rem; background: var(--k-tint); border-bottom: 1px solid var(--line); }
    .so-search { display: flex; align-items: center; gap: .5rem; height: 2.9rem; padding: 0 .9rem; border-radius: .7rem; background: #fff; border: 1px solid #CFCAC3; flex: 1 1 14rem; color: var(--muted); }
    .so-search input { border: 0; outline: none; background: transparent; flex: 1; min-width: 0; font-size: 1rem; color: var(--ink); min-height: 0 !important; }
    .so-cats { display: flex; flex-wrap: wrap; gap: .4rem; }
    .so-cat { display: inline-flex; align-items: center; gap: .4rem; height: 2.6rem; padding: 0 .85rem; border-radius: 999px; border: 1px solid #CFCAC3; background: #fff; font-weight: 700; font-size: .9rem; color: var(--ink); }
    .so-cat .n { color: var(--muted); font-weight: 600; font-size: .8rem; }
    .so-cat[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .so-cat[aria-pressed="true"] .n { color: #D6D3D1; }
    .so-tbl-wrap { overflow-x: auto; }
    .so-tbl { width: 100%; min-width: 52rem; border-collapse: collapse; font-size: 1rem; }
    .so-tbl th { text-align: right; font-size: .8rem; font-weight: 800; color: var(--muted); padding: .7rem .8rem; border-bottom: 2px solid var(--line); white-space: nowrap; }
    .so-tbl td { padding: .55rem .8rem; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
    .so-tbl tr.low td { background: var(--low-bg); }
    .so-tbl tr.out .so-total { color: #A8A29E; }
    .so-pname { display: flex; align-items: center; gap: .6rem; }
    .so-pname .so-ico { color: var(--muted); width: 1.4em; height: 1.4em; }
    .so-pname b { font-size: 1.05rem; font-weight: 700; display: block; }
    .so-pname small { font-size: .75rem; color: var(--muted); }
    .so-total { font-size: 1.6rem; font-weight: 900; }
    .so-tbl tr.low .so-total { color: var(--low); }
    .so-lowtag, .so-outtag { display: inline-block; margin-inline-start: .4rem; font-size: .7rem; font-weight: 800; border-radius: 999px; padding: .05rem .5rem; vertical-align: middle; }
    .so-lowtag { color: var(--low); background: #FFE4E6; }
    .so-outtag { color: #57534E; background: #EEEBE6; }
    .so-num { font-size: 1.05rem; font-weight: 600; }
    .so-num.zero { color: #A8A29E; }
    .so-quick { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
    .so-qpair { display: flex; align-items: center; gap: .3rem; }
    .so-qpair input { width: 4.6rem; height: 2.6rem; border: 1px solid #CFCAC3; border-radius: .6rem; text-align: center; font-size: 1.05rem; font-weight: 700; background: #fff; }
    .so-qin, .so-qout { height: 2.6rem; padding: 0 .75rem; border: 0; border-radius: .6rem; font-weight: 800; font-size: .9rem; white-space: nowrap; }
    .so-qin { background: var(--in-bg); color: var(--in); }
    .so-qout { background: var(--out-bg); color: var(--out); }
    .so-qin:disabled, .so-qout:disabled { opacity: .45; cursor: default; }
    .so-catrow td { background: #FAF9F7; font-weight: 800; color: var(--muted); font-size: .85rem; padding: .5rem .8rem; }
    .so-catrow .so-ico { vertical-align: -0.25em; margin-inline-end: .35rem; }
    .so-empty { padding: 3rem 1.5rem !important; text-align: center; color: var(--muted); }
    .so-subcard { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; }
    .so-subcard-h { display: flex; align-items: center; gap: .6rem; padding: .75rem 1rem; background: #F7F5F2; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; }
    .so-subcard-title { display: inline-flex; align-items: center; gap: .45rem; font-weight: 900; font-size: 1.05rem; }

    /* ===== מסך הזמנות ===== */
    .so-btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .so-btn.primary:hover { background: #991B1B; }
    .so-ostats { flex: 1 1 20rem; display: flex; flex-wrap: wrap; align-items: center; gap: .35rem 1rem; font-size: .9rem; font-weight: 600; color: var(--muted); }
    .so-ostats span { display: inline-flex; align-items: center; gap: .3rem; }
    .so-ostats b { color: var(--ink); font-size: 1.15rem; font-weight: 900; }
    .so-ostats .sep { width: 1px; height: 1.2rem; background: var(--line); }
    .so-kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .9rem; align-items: start; }
    .so-col { background: #E8E5E0; border-radius: 1.1rem; padding: .7rem; display: flex; flex-direction: column; gap: .6rem; min-width: 0; transition: box-shadow .15s; }
    .so-col.dragover { box-shadow: 0 0 0 4px #FACC15; background: #FEF9C3; }
    .so-col-h { display: flex; align-items: center; gap: .55rem; padding: .3rem .4rem; }
    .so-col-h i { width: .7rem; height: .7rem; border-radius: 50%; }
    .so-col-h h2 { margin: 0; font-size: 1.15rem; font-weight: 900; }
    .so-col-h b { margin-inline-start: auto; font-size: 1.1rem; }
    .so-colempty { text-align: center; color: var(--muted); font-size: .9rem; padding: 1.5rem .5rem; border: 2px dashed #CFCAC3; border-radius: .9rem; }
    .so-colhint { text-align: center; font-size: .78rem; color: var(--muted); font-weight: 600; }
    .so-dropzone { border: 2px dashed #CA8A04; border-radius: .9rem; padding: 1rem; text-align: center; font-weight: 800; color: #854D0E; background: #FEF9C3; }
    .so-ocard { background: #fff; border-radius: .9rem; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); display: flex; }
    .so-ocard.dimmed { opacity: .7; }
    .so-ocard.draggable { cursor: grab; }
    .so-ocard.dragging { opacity: .5; }
    .so-ostripe { width: .55rem; flex-shrink: 0; }
    .so-obody { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .so-oclick { padding: .8rem .9rem .55rem; display: flex; flex-direction: column; gap: .5rem; }
    .so-oclick.clickable { cursor: pointer; }
    .so-oclick.clickable:hover { background: #FCFBFA; }
    .so-ohead { display: flex; flex-wrap: wrap; align-items: flex-start; gap: .5rem; }
    .so-ohead > div { flex: 1 1 9rem; min-width: 0; }
    .so-ohead b { font-size: 1.1rem; font-weight: 800; display: block; overflow-wrap: anywhere; }
    .so-ohead small { font-size: .8rem; color: var(--muted); }
    .so-when { margin-inline-start: auto; white-space: nowrap; font-size: .85rem; font-weight: 800; background: #F1EFEB; padding: .2rem .6rem; border-radius: 999px; }
    .so-tags { display: flex; flex-wrap: wrap; gap: .35rem; }

        clearTimeout(timerRef.current);

      };

      const setEFromCartons = (key, val) => setEntryTrays(prev => ({ ...prev, [key]: Math.max(0, (parseInt(val) || 0) * TRAYS_PER_CARTON) }));
      const setWFromTrays = (key, val) => setWithdrawTrays(prev => ({ ...prev, [key]: Math.max(0, parseInt(val) || 0) }));
      const setWFromCartons = (key, val) => setWithdrawTrays(prev => ({ ...prev, [key]: Math.max(0, (parseInt(val) || 0) * TRAYS_PER_CARTON) }));

      const logAction = (action, key, trays) => {
        const [product, kashrut] = key.split('|');
        const entry = {
          action,
          user: appUser?.username || '—',
          product,
          kashrut,
          trays,
          cartons: Math.floor(trays / TRAYS_PER_CARTON),
          date: localToday(),
          timestamp: new Date().toISOString()
        };
        db.from('frozen_stock_log').insert([{ data: entry }]).then(checkSave('יומן מלאי'));
      };

      const applyEntry = (key) => {
        const delta = entryTrays[key] || 0;
        if (!delta) return;
        setFrozenStock(prev => ({ ...prev, [key]: (prev[key] || 0) + delta }));
        setEntryTrays(prev => ({ ...prev, [key]: 0 }));
        logAction('כניסה', key, delta);
      };
      const applyWithdraw = (key) => {
        const delta = withdrawTrays[key] || 0;
        if (!delta) return;
        const current = frozenStock[key] || 0;
        if (delta > current) {
          alert(`אי אפשר למשוך ${Math.floor(delta/TRAYS_PER_CARTON)} קרטונים — במלאי יש רק ${Math.floor(current/TRAYS_PER_CARTON)} קרטונים`);
          return false;
        }
        setFrozenStock(prev => ({ ...prev, [key]: (prev[key] || 0) - delta }));
        setWithdrawTrays(prev => ({ ...prev, [key]: 0 }));
        logAction('משיכה', key, delta);
      };

      const fishProducts = frozenProductsList.filter(p => p.kashrut === 'כללי' && p.storageTypes?.includes('frozen'));
      const activeProducts = frozenProductsList.filter(p => (p.kashrut || '') === activeKashrut && p.kashrut !== 'כללי' && p.storageTypes?.includes('frozen'));
      const kashrutTrays = activeProducts.reduce((sum, p) => sum + (frozenStock[`${p.name}|${activeKashrut}`] || 0), 0);
      const kashrutCartons = Math.floor(kashrutTrays / TRAYS_PER_CARTON);
      const kashrutRemainder = kashrutTrays % TRAYS_PER_CARTON;
      const activeKashrutObj = kashrutList.find(k => k.name === activeKashrut) || {};
      const activeColor = activeKashrutObj.color || '#6366f1';

      // ===== תצוגה חדשה (דמו v3) — אותן פעולות כניסה/משיכה בדיוק =====
      const stickerSection = (() => {
            const stickerKeys = new Set([
              ...Object.keys(frozenStock).filter(k => k.startsWith('STICKER|')),
              ...Object.keys(bsBalance).filter(k => k.startsWith('STICKER|')),
              ...Object.keys(gvBalance).filter(k => k.startsWith('STICKER|')),
            ]);
            const stickerProds = [...stickerKeys]
              .map(k => { const [, name, kashrut, mark] = k.split('|'); return { name, kashrut: kashrut || '', mark, key: k }; })
              .filter(p => p.kashrut === activeKashrut);

            const [stickerSearch, setStickerSearch] = React.useState('');
            const [stickerDropOpen, setStickerDropOpen] = React.useState(false);
            const frozenOnlyList = frozenProductsList.filter(p => p.storageTypes?.includes('frozen'));
            const filteredStickerProds = frozenOnlyList.filter(p => {
              if (!stickerSearch) return true;
              const terms = stickerSearch.trim().split(/\s+/);
              return terms.every(t => p.name.includes(t) || (p.kashrut||'').includes(t));
            });

            const openStickerModal = () => {
              setStickerProd(''); setStickerSearch(''); setStickerDropOpen(false);
              setStickerMark(''); setStickerMarkErr(false); setStickerModal(true);
            };
            const saveStickerProd = () => {
              if (!stickerProd) { setStickerMarkErr(false); return; }
              if (!stickerMark) { setStickerMarkErr(true); return; }
              const prod = frozenOnlyList.find(p => p.name === stickerProd);
              if (!prod) return;
              const key = `STICKER|${prod.name}|${prod.kashrut || ''}|${stickerMark}`;
              if (!Object.prototype.hasOwnProperty.call(frozenStock, key)) {
                setFrozenStock(prev => ({ ...prev, [key]: 0 }));
              }
              setStickerModal(false);
            };
            const applyStickerEntry = (key) => {
              const delta = stickerEntry[key] || 0;
              if (!delta) return;
              setFrozenStock(prev => ({ ...prev, [key]: (prev[key] || 0) + delta }));
              setStickerEntry(prev => ({ ...prev, [key]: 0 }));
              const [, name, kashrut, mark] = key.split('|');
              db.from('frozen_stock_log').insert([{ data: { action: 'כניסה-מדבקה', product: name, kashrut, mark, cartons: delta, date: localToday(), timestamp: new Date().toISOString(), user: appUser?.username || '—' } }]).then(checkSave('יומן מלאי'));
            };
            const applyStickerWithdraw = (key) => {
              const delta = stickerWithdraw[key] || 0;
              if (!delta) return;
              const current = frozenStock[key] || 0;
              if (delta > current) {
                alert(`אי אפשר למשוך ${delta} קרטונים — במלאי יש רק ${current} קרטונים`);
                return false;
              }
              setFrozenStock(prev => ({ ...prev, [key]: (prev[key] || 0) - delta }));
              setStickerWithdraw(prev => ({ ...prev, [key]: 0 }));
              const [, name, kashrut, mark] = key.split('|');
              db.from('frozen_stock_log').insert([{ data: { action: 'משיכה-מדבקה', product: name, kashrut, mark, cartons: delta, date: localToday(), timestamp: new Date().toISOString(), user: appUser?.username || '—' } }]).then(checkSave('יומן מלאי'));
            };

            return (
              <div className="so-subcard">
                <div onClick={() => setCollapsedCats(prev => ({ ...prev, 'STICKER': !prev['STICKER'] }))}
                  className="so-subcard-h">
                  <span className="so-subcard-title"><LineIcon name="tag" />מ.ל / מ.ל.ה</span>
                  <button onClick={e => { e.stopPropagation(); openStickerModal(); }}
                    className="text-xs font-bold px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shrink-0">
                    + הוסף מוצר
                  </button>
                  <span className="mr-auto text-xs font-bold px-2 py-0.5 rounded-full border bg-indigo-100 text-indigo-600 border-indigo-200">{stickerProds.length} פריטים</span>
                  <Icons.ChevronDown className={`w-4 h-4 text-indigo-400 transition-transform duration-200 ${collapsedCats['STICKER'] ? '-rotate-90' : ''}`} />
                </div>
                {!collapsedCats['STICKER'] && (
                  stickerProds.length === 0 ? (
                    <div className="text-center text-gray-400 py-6 text-sm">לחצי "+ הוסף מוצר" כדי להתחיל</div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-right text-sm min-w-max border-collapse">
                        <thead>
                          <tr style={{ borderBottom: '2px solid #6b7280' }}>
                            <th className="p-2.5 font-bold text-right bg-gray-50">מוצר</th>
                            <th className="p-2.5 font-bold text-center bg-gray-50 text-indigo-700">סימון</th>
                            <th className="p-2.5 font-bold text-center bg-green-100 text-green-800" style={{ borderRight: '2px solid #22c55e' }}>כניסה (קרטונים)</th>
                            <th className="p-2.5 font-bold text-center bg-red-100 text-red-800" style={{ borderRight: '2px solid #ef4444' }}>משיכה (קרטונים)</th>
                            <th className="p-2.5 font-black text-base text-center bg-blue-100 text-blue-800" style={{ borderRight: '2px solid #3b82f6' }}>קירור סופר עוף (קרטונים)</th>
                            <th className="p-2.5 font-bold text-center bg-indigo-100 text-indigo-800">קירור לירוי (קרטונים)</th>
                            <th className="p-2.5 font-bold text-center bg-teal-100 text-teal-800">קירור גב"ש (קרטונים)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100">
                          {stickerProds.map((p, idx) => {
                            const cartons = frozenStock[p.key] || 0;
                            const eC = stickerEntry[p.key] || 0;
                            const wC = stickerWithdraw[p.key] || 0;
                            return (
                              <tr key={p.key} style={{ backgroundColor: idx % 2 === 0 ? '#ffffff' : '#f5f3ff' }}>
                                <td className="p-2.5 font-bold text-gray-900 text-sm">{p.name}</td>
                                <td className="p-2.5 text-center">
                                  <span className="text-xs font-bold px-2 py-0.5 rounded border-2 border-indigo-300 bg-indigo-50 text-indigo-700">{p.mark}</span>
                                </td>
                                <td className="p-1 text-center bg-green-50/30 border-r-2 border-green-400">
                                  <input type="number" min="0" value={eC||''} placeholder="0"
                                    onChange={e => setStickerEntry(prev => ({ ...prev, [p.key]: Math.max(0, parseInt(e.target.value)||0) }))}
                                    data-stock-col="entry" onKeyDown={e => stockCellKeyDown(e, 'entry', () => applyStickerEntry(p.key))}
                                    className="w-16 p-1.5 text-center text-base font-bold border border-green-200 text-green-700 rounded-lg bg-white focus:ring-1 focus:ring-green-400 outline-none" />
                                </td>
                                <td className="p-1 text-center bg-red-50/30 border-r-2 border-red-400">
                                  <input type="number" min="0" value={wC||''} placeholder="0"
                                    onChange={e => setStickerWithdraw(prev => ({ ...prev, [p.key]: Math.max(0, parseInt(e.target.value)||0) }))}
                                    data-stock-col="withdraw" onKeyDown={e => stockCellKeyDown(e, 'withdraw', () => applyStickerWithdraw(p.key))}
                                    className="w-16 p-1.5 text-center text-base font-bold border border-red-200 text-red-700 rounded-lg bg-white focus:ring-1 focus:ring-red-400 outline-none" />
                                </td>
                                <td className="p-2.5 text-center bg-blue-50/60 border-r-2 border-blue-400">
                                  <span className="font-black text-blue-700 text-2xl">{cartons}</span>
                                </td>
                                <td className="p-2.5 text-center bg-indigo-50/40">
                                  <span className="font-black text-indigo-700 text-lg">{bsBalance[p.key] || 0}</span>
                                </td>
                                <td className="p-2.5 text-center bg-teal-50/40">
                                  <span className="font-black text-teal-700 text-lg">{gvBalance[p.key] || 0}</span>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )
                )}

                {/* מודאל הוסף מוצר */}
                {stickerModal && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm border border-gray-200">
                      <div className="p-4 border-b border-gray-100 flex items-center justify-between">
                        <h3 className="font-bold text-lg">הוסף מוצר — מ.ל / מ.ל.ה</h3>
                        <button onClick={() => setStickerModal(false)} className="p-1 rounded-lg text-gray-400 hover:bg-gray-100">✕</button>
                      </div>
                      <div className="p-5 space-y-4">
                        <div className="relative">
                          <label className="block text-xs font-bold text-gray-500 mb-1.5">מוצר</label>
                          <input
                            type="text"
                            value={stickerSearch}
                            onChange={e => { setStickerSearch(e.target.value); setStickerProd(''); setStickerDropOpen(true); setStickerMark(''); setStickerMarkErr(false); }}
                            onBlur={() => setTimeout(() => setStickerDropOpen(false), 150)}
                            placeholder="חפש מוצר..."
                            className={`w-full border-2 rounded-xl px-3 py-2.5 text-sm font-semibold outline-none ${stickerProd ? 'border-indigo-400 bg-indigo-50 text-indigo-700' : 'border-gray-200 focus:border-indigo-400'}`}
                            autoFocus
                          />
                          {stickerDropOpen && stickerSearch && filteredStickerProds.length > 0 && (
                            <div className="absolute z-10 w-full bg-white border-2 border-indigo-200 rounded-xl shadow-lg mt-1 max-h-48 overflow-y-auto">
                              {filteredStickerProds.map(p => (
                                <div key={p.name + p.kashrut}
                                  onMouseDown={e => { e.preventDefault(); setStickerProd(p.name); setStickerSearch(p.name); setStickerDropOpen(false); setStickerMark(''); setStickerMarkErr(false); }}
                                  className="px-3 py-2 text-sm font-semibold cursor-pointer hover:bg-indigo-50 flex items-center justify-between">
                                  <span>{p.name}</span>
                                  {p.kashrut && <span className="text-xs font-bold px-2 py-0.5 rounded-full border" style={{ color: (kashrutList.find(k=>k.name===p.kashrut)||{}).color||'#888', borderColor: ((kashrutList.find(k=>k.name===p.kashrut)||{}).color||'#888')+'60', background: ((kashrutList.find(k=>k.name===p.kashrut)||{}).color||'#888')+'15' }}>{p.kashrut}</span>}
                                </div>
                              ))}
                            </div>
                          )}
                          {stickerDropOpen && stickerSearch && filteredStickerProds.length === 0 && (
                            <div className="absolute z-10 w-full bg-white border-2 border-gray-200 rounded-xl shadow-lg mt-1 px-3 py-2 text-sm text-gray-400">לא נמצאו תוצאות</div>
                          )}
                          {!stickerDropOpen && !stickerProd && <p className="text-xs text-gray-400 mt-1 px-1">הקלידי שם מוצר לחיפוש</p>}
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-gray-500 mb-1.5">סימון מדבקה <span className="text-red-500">* חובה</span></label>
                          <div className="flex gap-3">
                            {['מ.ל', 'מ.ל.ה'].map(m => {
                              const selProdObj = frozenOnlyList.find(p => p.name === stickerProd);
                              const key = `STICKER|${stickerProd}|${selProdObj?.kashrut || ''}|${m}`;
                              const alreadyExists = Object.prototype.hasOwnProperty.call(frozenStock, key);
                              return (
                                <button key={m}
                                  disabled={alreadyExists}
                                  onClick={() => { if (!alreadyExists) { setStickerMark(m); setStickerMarkErr(false); } }}
                                  className={`flex-1 py-3 rounded-xl font-extrabold text-lg border-2 transition-all relative
                                    ${alreadyExists ? 'border-gray-200 bg-gray-50 text-gray-300 cursor-not-allowed' :
                                      stickerMark === m ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-gray-200 text-gray-400 hover:border-gray-300'}`}>
                                  {m}
                                  {alreadyExists && <span className="block text-xs font-bold text-gray-400">קיים ✓</span>}
                                </button>
                              );
                            })}
                          </div>
                          {stickerMarkErr && <p className="text-red-500 text-xs font-bold mt-1">יש לבחור סימון מדבקה</p>}
                          {['מ.ל', 'מ.ל.ה'].every(m => {
                            const selProdObj = frozenOnlyList.find(p => p.name === stickerProd);
                            return Object.prototype.hasOwnProperty.call(frozenStock, `STICKER|${stickerProd}|${selProdObj?.kashrut || ''}|${m}`);
                          }) && <p className="text-amber-600 text-xs font-bold mt-1">שני הסימונים כבר קיימים עבור מוצר זה</p>}
                        </div>
                      </div>
                      <div className="p-4 border-t border-gray-100 flex gap-3">
                        <button onClick={() => setStickerModal(false)} className="flex-1 py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 font-bold text-sm hover:bg-gray-50">ביטול</button>
                        <button onClick={saveStickerProd}
                          disabled={['מ.ל', 'מ.ל.ה'].every(m => { const selProdObj = frozenOnlyList.find(p => p.name === stickerProd); return Object.prototype.hasOwnProperty.call(frozenStock, `STICKER|${stickerProd}|${selProdObj?.kashrut || ''}|${m}`); })}
                          className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold text-sm">הוסף</button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })();

      const LOW_CARTONS = 3; // סימון "נמוך" לתצוגה בלבד
      const isFishTab = activeKashrut === 'כללי';
      const kTabs = [...kashrutList.map(k => k.name).filter(n => n !== 'כללי'), ...(fishProducts.length ? ['כללי'] : [])];
      const productsOf = (k) => k === 'כללי' ? fishProducts : frozenProductsList.filter(p => (p.kashrut || '') === k && p.storageTypes?.includes('frozen'));
      const balanceOf = (p, k) => {
        const key = `${p.name}|${k}`;
        const main = Math.floor((frozenStock[key] || 0) / TRAYS_PER_CARTON);
        const gv = gvBalance[key] || 0, bs = bsBalance[key] || 0;
        return { key, main, gv, bs, total: main + gv + bs };
      };
      const totalOf = (k) => productsOf(k).reduce((sum, p) => sum + balanceOf(p, k).total, 0);
      const catOf = (p) => p.category || getProductCategory(p.name);
      const bySku = (a, b) => {
        const sa = a.sku || '', sb = b.sku || '';
        if (!sa && !sb) return 0; if (!sa) return 1; if (!sb) return -1;
        return sa.localeCompare(sb, undefined, { numeric: true, sensitivity: 'base' });
      };
      const inK = productsOf(activeKashrut);
      const q = invSearch.trim();
      const shown = inK.filter(p => (invCat === 'הכל' || catOf(p) === invCat) && (!q || q.split(/\s+/).every(t => p.name.includes(t) || (p.sku || '').includes(t))));
      const catGroups = {};
      inK.forEach(p => { (catGroups[catOf(p)] = catGroups[catOf(p)] || []).push(p); });
      const catsHere = getCats(catGroups);
      const shownGroups = {};
      shown.forEach(p => { (shownGroups[catOf(p)] = shownGroups[catOf(p)] || []).push(p); });
      const ks = kStyle(activeKashrut);
      const kLabel = (k) => kStyle(k).label || k;
      const hasQuick = showEntry || showWithdrawal;

      return (
        <div className="flex flex-col gap-4">
          <div className="so-ktabs" role="tablist" aria-label="בחירת כשרות">
            {kTabs.map(name => (
              <button key={name} className="so-ktab" role="tab" aria-selected={name === activeKashrut} style={kVars(name)}
                onClick={() => { setActiveKashrut(name); setInvCat('הכל'); }}>
                <span className="so-kletter">{kStyle(name).l}</span>
                <span>{kLabel(name)}<br /><small>{totalOf(name)} קרטונים</small></span>
              </button>
            ))}
          </div>

          <section className="so-kframe" style={kVars(activeKashrut)}>
            <div className="so-kband">
              <span className="so-kletter">{ks.l}</span>
              <h2>מלאי {kLabel(activeKashrut)}</h2>
              <span className="tot">סה״כ <b>{totalOf(activeKashrut)}</b> קרטונים</span>
            </div>
            <div className="so-tools">
              <label className="so-search"><LineIcon name="search" />
                <input type="search" placeholder="חיפוש מוצר או מק״ט" value={invSearch} onChange={e => setInvSearch(e.target.value)} aria-label="חיפוש מוצר" />
              </label>
              {catsHere.length > 1 && (
                <div className="so-cats">
                  <button className="so-cat" aria-pressed={invCat === 'הכל'} onClick={() => setInvCat('הכל')}>הכל <span className="n">{inK.length}</span></button>
                  {catsHere.map(c => (
                    <button key={c} className="so-cat" aria-pressed={invCat === c} onClick={() => setInvCat(c)}>
                      <LineIcon name={c} />{c} <span className="n">{catGroups[c].length}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <div className="so-tbl-wrap">
              <table className="so-tbl">
                <thead><tr>
                  <th>מוצר</th><th>סה״כ כולל</th><th>קירור סופר עוף</th><th>קירור גב״ש</th><th>קירור לירוי</th>
                  {hasQuick && <th>עדכון מהיר (קרטונים)</th>}
                </tr></thead>
                <tbody>
                  {getCats(shownGroups).map(cat => (
                    <React.Fragment key={cat}>
                      <tr className="so-catrow"><td colSpan={hasQuick ? 6 : 5}><LineIcon name={cat} />{cat} · {shownGroups[cat].length} מוצרים</td></tr>
                      {[...shownGroups[cat]].sort(bySku).map(p => {
                        const b = balanceOf(p, activeKashrut);
                        const low = b.total > 0 && b.total < LOW_CARTONS, out = b.total === 0;
                        const eC = Math.floor(getETrays(b.key) / TRAYS_PER_CARTON);
                        const wC = Math.floor(getWTrays(b.key) / TRAYS_PER_CARTON);
                        return (
                          <tr key={b.key} className={low ? 'low' : out ? 'out' : ''}>
                            <td className="c-name"><div className="so-pname"><LineIcon name={cat} /><div><b>{p.name}</b><small>{p.sku ? 'מק״ט ' + p.sku : 'ללא מק״ט'}</small></div></div></td>
                            <td className="c-total"><span className="so-total">{b.total}</span>{low ? <span className="so-lowtag">נמוך</span> : out ? <span className="so-outtag">אזל</span> : null}</td>
                            <td className="c-cold" data-label="סופר עוף"><span className={`so-num ${b.main ? '' : 'zero'}`}>{b.main}</span></td>
                            <td className="c-cold" data-label="גב״ש"><span className={`so-num ${b.gv ? '' : 'zero'}`}>{b.gv}</span></td>
                            <td className="c-cold" data-label="לירוי"><span className={`so-num ${b.bs ? '' : 'zero'}`}>{b.bs}</span></td>
                            {hasQuick && (
                              <td className="c-quick"><div className="so-quick">
                                {showEntry && (
                                  <div className="so-qpair">
                                    <input type="number" min="0" step="1" inputMode="numeric" value={eC || ''} placeholder="כמות"
                                      aria-label={`כניסה — ${p.name}`}
                                      onChange={e => setEFromCartons(b.key, e.target.value)}
                                      data-stock-col="entry" onKeyDown={e => stockCellKeyDown(e, 'entry', () => applyEntry(b.key))} />
                                    <button className="so-qin" onClick={() => applyEntry(b.key)} disabled={!eC}>+ כניסה</button>
                                  </div>
                                )}
                                {showWithdrawal && (
                                  <div className="so-qpair">
                                    <input type="number" min="0" step="1" inputMode="numeric" value={wC || ''} placeholder="כמות"
                                      aria-label={`משיכה — ${p.name}`}
                                      onChange={e => setWFromCartons(b.key, e.target.value)}
                                      data-stock-col="withdraw" onKeyDown={e => stockCellKeyDown(e, 'withdraw', () => applyWithdraw(b.key))} />
                                    <button className="so-qout" onClick={() => applyWithdraw(b.key)} disabled={!wC}>− משיכה</button>
                                  </div>
                                )}

          const bodyRows = [];
          for (let ri = 0; ri < totalRows; ri++) {
            const bg = ri % 2 === 0 ? '#fff' : '#f9fafb';
            const cells = blocks.map((b, bi) => {
              const p = b.items[ri] || null;
              const sep = bi < n - 1 ? 'border-left:2px solid #94a3b8;' : '';
              if (!p) return `<td colspan="3" style="background:${ri%2===0?'#f8fafc':'#f1f5f9'};height:${ROW_H-3}px;${sep}"></td>`;
              const nm = p.isSticker ? `${p.name} (${p.mark})` : p.name;
              return `<td style="padding:4px 5px;font-size:${fs}px;">${nm}</td><td style="padding:4px 3px;text-align:center;font-size:${fs-1}px;color:#555;">${p.sku}</td><td style="padding:3px;border:1px solid #bbb;background:#fefce8;height:${ROW_H-5}px;${sep}"></td>`;
            }).join('');
            bodyRows.push(`<tr style="background:${bg};border-bottom:1px solid #e5e7eb;">${cells}</tr>`);
          }
          return `${thead}<tbody>${bodyRows.join('')}</tbody>`;
        };

        const wrapPage = (headerHtml, tableInner) =>
          `<div style="font-family:Arial,sans-serif;direction:rtl;padding:12px 14px;width:${W}px;">
            ${headerHtml}
            <table style="width:100%;border-collapse:collapse;">${tableInner}</table>
          </div>`;

        const renderToDoc = async (html, doc, pageIdx) => {
          const el = document.createElement('div');
          el.style.cssText = 'position:fixed;top:-9999px;right:-9999px;';
          el.innerHTML = html;
          document.body.appendChild(el);
          const canvas = await window.html2canvas(el, { scale: 2, useCORS: true });
          document.body.removeChild(el);
          if (pageIdx > 0) doc.addPage();
          const imgData = canvas.toDataURL('image/png');
          const pw = doc.internal.pageSize.getWidth();
          doc.addImage(imgData, 'PNG', 0, 0, pw, (canvas.height * pw) / canvas.width);
        };

        const makeHeader = (title, color = '#000') =>
          `<div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid ${color};padding-bottom:6px;margin-bottom:8px;">
            <div style="font-size:14px;font-weight:bold;color:${color};">📋 ספירת מלאי — ${title}</div>
            <div style="font-size:10px;">תאריך: <strong>${date}</strong> &nbsp;&nbsp; נספר ע"י: _________________</div>
          </div>`;

          await renderToDoc(wrapPage(makeHeader(pageDef.title), buildTable(padded, refN)), doc, docPageIdx++);

          ];
          await renderToDoc(wrapPage(makeHeader('דגים', '#0ea5e9'), buildTable(fishBlocks2, refN)), doc, docPageIdx++);
        }

        doc.save(`ספירת-מלאי-${date}.pdf`);

    const OrdersView = ({ kashrutList, butchersList, orders, setOrders, stock, neighborhoodData, contactsList, frozenProductsList, orderFormSkuMap, setOrderFormSkuMap, logoImage }) => {
      const getSku = (itemId, k) => (orderFormSkuMap || {})[itemId]?.[k] || '';
      const getKashrutColor = (name) => (kashrutList || []).find(k => k.name === name)?.color || '#6366f1';
      // מזהה טרי/קפוא/דג לפי הגדרת המוצר ברשימה (אם חד-משמעית), ורק אם המוצר תומך בשני הסוגים נופלים חזרה לסוג שנשמר על הפריט עצמו
      const resolveItemStorage = (item) => {
        const name = item.cleanName || item.name;
        const p = (frozenProductsList || []).find(fp => fp.name === name);
        const category = p?.category || getProductCategory(name);
        if (category === 'דגים') return 'fish';
        if (p?.storageTypes?.length === 1) return p.storageTypes[0] === 'frozen' ? 'frozen' : 'fresh';
        return item.storageType === 'frozen' ? 'frozen' : 'fresh';
      };
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingOrder, setEditingOrder] = useState(null);
      const [deleteConfirmOrder, setDeleteConfirmOrder] = useState(null);

      const printAllBons = (rawOrder) => {
        // כל טקסט מהמשתמש (שם, כתובת, הערות) עובר escape לפני שנכנס ל-HTML של חלון ההדפסה.
        // סוג האחסון נקבע לפני ה-escape, כי הוא מזוהה לפי שם המוצר המקורי
        const order = escDeep({ ...rawOrder, items: (rawOrder.items || []).map(i => ({ ...i, _st: resolveItemStorage(i) })) });
        const allRegular = (order.items || []).filter(i => i.qty !== '-');
        const packingItem = (order.items || []).find(i => i.qty === '-');
        const buildGroups = (items) => {
          const seen = new Set(); const groups = [];
          items.forEach(item => {
            const key = item.cleanName || item.name;
            if (!seen.has(key)) {
              seen.add(key);
              const grp = items.filter(i => (i.cleanName || i.name) === key);
              groups.push({ key, items: grp, total: grp.reduce((s, i) => s + (parseFloat(i.qty) || 0), 0) });
            }
          });
          return groups;
        };
        const freshGroups  = buildGroups(allRegular.filter(i => i._st === 'fresh'));
        const frozenGroups = buildGroups(allRegular.filter(i => i._st === 'frozen'));
        const fishGroups   = buildGroups(allRegular.filter(i => i._st === 'fish'));
        if (freshGroups.length === 0 && frozenGroups.length === 0 && fishGroups.length === 0) return;

        const logoHtml = logoImage ? `<img src="${logoImage}" style="width:64px;height:64px;object-fit:contain;" />` : '';

        const customerLine = [
          order.customer,
          order.phone,
          order.mobile,
          order.neighborhood
        ].filter(Boolean).join('  |  ');

        const [tDate, tTime] = (order.timeString || '').split('T');
        const whenText = tDate ? [tDate.split('-').reverse().join('/'), tTime && tTime !== '00:00' ? tTime : ''].filter(Boolean).join(' ') : '';
        const addressText = order.type === 'delivery' ? [order.fullAddress, order.neighborhood, order.city && order.city !== 'ירושלים' ? order.city : ''].filter(Boolean).join(', ') : '';
        const flagsText = [
          order.flags?.mustCoordinate && '🚨 לתאם',
          order.flags?.notifyReady && '📞 להודיע שמוכן',
          order.flags?.chargeStatus === 'charge' && '💳 לחייב',
          order.flags?.chargeStatus === 'noCharge' && '🆓 לא לחייב',
          order.collect?.type && `💰 לגבות: ${order.collect.type}${order.collect.amount ? ' ' + order.collect.amount + ' ₪' : ''}`,
        ].filter(Boolean);

        const headerHtml = `
          <div style="border:1px solid black;border-radius:4px;padding:6px 8px;margin-bottom:8px;background:#f9f9f9;font-size:14px;">
            <div style="display:flex;justify-content:space-between;font-weight:800;">
              <span>${order.type === 'delivery' ? '🚚 משלוח' : '🏪 איסוף'}${whenText ? ` — ${whenText}` : ''}</span>
              <span>הזמנה #${order.id}</span>
            </div>
          </div>
          <div style="border-bottom:2px solid black;padding-bottom:6px;margin-bottom:8px;">

          fullAddress: orderType === 'delivery' ? `${street} ${entrance ? 'כניסה '+entrance : ''} ${floor ? 'קומה '+floor : ''} ${apt ? 'דירה '+apt : ''}`.trim() : '',
          street, entrance, floor, apt,
          neighborhood: orderType === 'delivery' ? neighborhood : '',
          timeString: orderType === 'delivery' ? deliveryDate : pickupTime,
          kashrut: allItems.find(i => i.kashrut)?.kashrut || '',
          assignedButcher,
          flags: { ...flags, chargeStatus },
          city: orderType === 'delivery' ? (city.trim() || 'ירושלים') : '',
          collect: collectType ? { type: collectType, amount: collectAmount } : null,
          items: allItems,
          orderNotes,
          status: 'new'
        };

        if (editingOrder) {
          // שומרים שדות שהטופס לא מנהל (createdAt, packaging וכו')
          // ממזגים על המצב העדכני (o) ולא על העותק מרגע פתיחת הטופס — כדי לא להחזיר סטטוס/שליח/אריזה ישנים
          setOrders(prev => prev.map(o => o.id === editingOrder.id ? { ...o, ...newOrder, items: [...allItems, ...(o.items || []).filter(i => i.qty === '-')], id: o.id, status: o.status, createdAt: o.createdAt || newOrder.createdAt } : o));
        } else {
          // insert ולא upsert: אם מכשיר אחר תפס את המספר באותו רגע — מקבלים שגיאת כפילות ועוברים למספר הבא
          try {
            for (let attempt = 0; attempt < 10; attempt++) {
              const { error } = await db.from('orders').insert({ id: newOrder.id, data: newOrder });
              if (error && error.code !== '23505') { reportSaveError('הזמנה חדשה', error); break; }
              if (!error) break;
              newOrder.id++;
            }
          } catch (err) { reportSaveError('הזמנה חדשה', err); }
          // ייתכן שעדכון חי מהשרת כבר הביא את ההזמנה
          setOrders(prev => prev.some(o => o.id === newOrder.id) ? prev : [newOrder, ...prev]);
        }
        submittingRef.current = false;
        closeModal();
      };

      const [draggingId, setDraggingId] = useState(null);
      const [isDragOver, setIsDragOver] = useState(false);
      const [packagingModal, setPackagingModal] = useState(null); // orderId
      const [packagingData, setPackagingData] = useState({ cartons: '', bags: '', fishBags: '' });

      const [butcherModal, setButcherModal] = useState(null); // orderId

      const assignButcher = (orderId, butcherName) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, assignedButcher: butcherName } : o));
        collapseOrder(orderId);
        setButcherModal(null);
      };

      const moveToPacking = (orderId) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: 'packing' } : o));
        collapseOrder(orderId);
      };

      const requestComplete = (orderId) => {
        setPackagingModal(orderId);
        setPackagingData({ cartons: '', bags: '', fishBags: '' });
      };

      const confirmComplete = () => {
        setOrders(orders.map(o => o.id === packagingModal
          ? { ...o, status: 'completed', packaging: { ...packagingData } }
          : o
        ));
        collapseOrder(packagingModal);
        setPackagingModal(null);
      };

      return (
        <div className="animate-in fade-in duration-300 relative">
          <div className="so-actions mb-4">
            {(() => {
              const nNew = orders.filter(o => o.status === 'new' && !o.assignedButcher).length;
              const nWork = orders.filter(o => o.status === 'new' && o.assignedButcher).length;
              const nPack = orders.filter(o => o.status === 'packing').length;
              const nDone = orders.filter(o => o.status === 'completed').length;
              const nDel = orders.filter(o => o.type === 'delivery' && ['new', 'packing', 'completed'].includes(o.status)).length;
              const nPick = orders.filter(o => o.type === 'pickup' && ['new', 'packing', 'completed'].includes(o.status)).length;
              const byButcher = butchersList.map(b => [b.name, orders.filter(o => o.assignedButcher === b.name && o.status !== 'delivered').length]).filter(([, n]) => n > 0);
              return (
                <div className="so-ostats">
                  <span><b>{nNew}</b> חדשות</span>
                  <span><b>{nWork}</b> בעבודה</span>
                  <span><b>{nPack}</b> באריזה</span>
                  <span><b>{nDone}</b> מוכנות</span>
                  <span className="sep"></span>
                  <span><LineIcon name="truck" /><b>{nDel}</b> משלוחים</span>
                  <span><LineIcon name="box" /><b>{nPick}</b> איסוף</span>
                  {byButcher.length > 0 && <span className="sep"></span>}
                  {byButcher.map(([n, c]) => <span key={n}>{n}: <b>{c}</b></span>)}
                </div>
              );
            })()}
            <button className="so-btn primary" onClick={() => setIsModalOpen(true)}><LineIcon name="plus" />הזמנה חדשה</button>
          </div>

          {(() => {
            const newOrders      = orders.filter(o => o.status === 'new' && !o.assignedButcher);
            const assignedOrders = orders.filter(o => o.status === 'new' && o.assignedButcher);
            const packingOrders  = orders.filter(o => o.status === 'packing');

            // הזמנה עם כמה כשרויות מקובצת תחת "מעורב" ולא לפי הפריט הראשון
            const kashrutGroupKey = (o) => {
              const ks = [...new Set((o.items || []).map(i => i.kashrut).filter(Boolean))];
              if (ks.length > 1) return `מעורב: ${ks.join(' + ')}`;
              return ks[0] || o.kashrut || 'ללא כשרות';
            };
            const sortByKashrut = (arr) => [...arr].sort((a, b) => kashrutGroupKey(a).localeCompare(kashrutGroupKey(b), 'he'));

            const renderOrderCard = (order, dimmed = false, draggable = false) => {
              const isExpanded = dimmed || expandedOrders.has(order.id);
              const regularItems = (order.items || []).filter(i => i.qty !== '-');
              const packingItem = (order.items || []).find(i => i.qty === '-');
              const cats = new Set(regularItems.map(i => {
                const name = i.cleanName || i.name;
                const p = (frozenProductsList || []).find(fp => fp.name === name);
                return p?.category || getProductCategory(name) || ORDER_FORM_TEMPLATE.find(t => t.name === name)?.category;
              }).filter(Boolean));
              const hasFish = regularItems.some(i => resolveItemStorage(i) === 'fish');
              const hasFrozen = regularItems.some(i => resolveItemStorage(i) === 'frozen');
              const hasFresh = regularItems.some(i => resolveItemStorage(i) === 'fresh');
              // כשרויות ההזמנה — לפס הצבע ולתגיות
              const orderKs = [...new Set(regularItems.map(i => i.kashrut).filter(Boolean))];
              if (!orderKs.length && order.kashrut) orderKs.push(order.kashrut);
              const isMixed = orderKs.length > 1;
              const stripeStyle = isMixed
                ? { background: `repeating-linear-gradient(180deg, ${orderKs.map((k, i) => `${kStyle(k).c} ${i * 0.7}rem ${(i + 1) * 0.7}rem`).join(', ')})` }
                : { background: kStyle(orderKs[0]).c };
              // שורת סיכום פריטים (כמו בדמו): "10 עוף שלם · 5 עוף מפורק"
              const summaryMap = new Map();
              regularItems.forEach(i => { const k = i.cleanName || i.name; summaryMap.set(k, (summaryMap.get(k) || 0) + (parseFloat(i.qty) || 0)); });
              const itemsSummary = [...summaryMap.entries()].map(([n, q]) => q ? `${q} ${n}` : n).join(' · ');
              return (
              <article key={order.id}
                draggable={draggable}
                onDragStart={draggable ? () => setDraggingId(order.id) : undefined}
                onDragEnd={draggable ? () => setDraggingId(null) : undefined}
                className={`so-ocard ${dimmed ? 'dimmed' : ''} ${draggable ? 'draggable' : ''} ${draggingId === order.id ? 'dragging' : ''}`}>
                <div className="so-ostripe" style={stripeStyle}></div>
                <div className="so-obody">

                {/* כותרת — תמיד גלויה, לחיצה פותחת/סוגרת */}
                <div onClick={!dimmed ? () => toggleOrderExpand(order.id) : undefined}
                  className={`so-oclick ${!dimmed ? 'clickable' : ''}`}>
                  <div className="so-ohead">
                    <div>
                      <b>{order.customer}</b>
                      <small>#{order.id}{order.phone ? ` · ${order.phone}` : ''}</small>
                    </div>
                    {(order.timeString || order.createdAt) && (
                      <span className="so-when" title={order.createdAt ? `נוצרה: ${order.createdAt}` : undefined}>{order.timeString || order.createdAt}</span>
                    )}
                  </div>

                  <div className="so-tags">
                    {orderKs.map(k => <KChip key={k} k={k} />)}
                    <span className="so-tag"><LineIcon name={order.type === 'delivery' ? 'truck' : 'box'} />{order.type === 'delivery' ? 'משלוח' : 'איסוף'}{order.neighborhood ? ` · ${order.neighborhood}` : ''}</span>
                    {order.assignedButcher && <span className="so-tag butcher">קצב: {order.assignedButcher}</span>}
                    {order.flags?.mustCoordinate && <span className="so-tag warn">לתאם</span>}
                    {order.flags?.notifyReady && <span className="so-tag warn">להודיע שמוכן</span>}
                    {order.flags?.chargeStatus === 'charge' && <span className="so-tag pay">לחייב</span>}
                    {order.flags?.chargeStatus === 'noCharge' && <span className="so-tag ok">לא לחייב</span>}
                  </div>

                  {order.orderNotes && (
                    <div className="so-onote">{order.orderNotes}</div>
                  )}

                  {!isExpanded && itemsSummary && <div className="so-oitems">{itemsSummary}</div>}

                  <div className="so-ocats">
                    {PRODUCT_CATEGORIES.filter(c => cats.has(c)).map(c => (
                      <span key={c} className="so-ocat"><LineIcon name={c} />{c}</span>
                    ))}
                    {!dimmed && <span className="so-chev">{isExpanded ? 'סגור פירוט ▲' : 'פירוט ▼'}</span>}
                  </div>
                </div>

                {/* כפתורי פעולה — תמיד גלויים */}
                {!dimmed && (
                  <div className="so-oact" onClick={e => e.stopPropagation()}>
                    <button className="so-iconbtn" title="הדפסת בונים" aria-label="הדפסת בונים" onClick={(e) => { e.stopPropagation(); printAllBons(order); }}><LineIcon name="print" /></button>
                    <button className="so-iconbtn" title="עריכה" aria-label="עריכה" onClick={() => openEditModal(order)}><LineIcon name="edit" /></button>
                    <button className="so-iconbtn danger" title="מחיקה" aria-label="מחיקה" onClick={() => deleteOrder(order)}><LineIcon name="trash" /></button>
                    {order.status === 'packing' && (
                      <button className="so-iconbtn" title="החזרה לעבודה" aria-label="החזרה לעבודה" onClick={() => { setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: 'new' } : o)); collapseOrder(order.id); }}><LineIcon name="undo" /></button>
                    )}
                    {order.status === 'new' && order.assignedButcher && (
                      <button className="so-iconbtn" title="ביטול שיוך קצב" aria-label="ביטול שיוך קצב" onClick={() => { setOrders(prev => prev.map(o => o.id === order.id ? { ...o, assignedButcher: '' } : o)); collapseOrder(order.id); }}><LineIcon name="undo" /></button>
                    )}
                    {order.status === 'new' && !order.assignedButcher && (
                      <button className="so-obtn" onClick={() => setButcherModal(order.id)}>לעבודה ←</button>
                    )}
                    {order.status === 'new' && order.assignedButcher && (
                      <button className="so-obtn" onClick={() => moveToPacking(order.id)}>לאריזה ←</button>
                    )}
                    {order.status === 'packing' && (
                      <button className="so-obtn ok" onClick={() => requestComplete(order.id)}><LineIcon name="check" />מוכן</button>
                    )}
                  </div>
                )}

                {/* פירוט — נפתח בלחיצה */}
                {isExpanded && (
                  <div className="so-odetail">
                    {(() => {
                      const seen = new Set(); const groups = [];
                      regularItems.forEach(item => {
                        const key = item.cleanName || item.name;
                        if (!seen.has(key)) {
                          seen.add(key);
                          const grp = regularItems.filter(i => (i.cleanName || i.name) === key);
                          groups.push({ key, items: grp, total: grp.reduce((s, i) => s + (parseFloat(i.qty) || 0), 0) });
                        }
                      });
                      return (
                        <ul className="bg-gray-50 rounded-lg border border-gray-100 divide-y divide-gray-100 mb-3">
                          {groups.map((group, gIdx) => {
                            const tmpl = ORDER_FORM_TEMPLATE.find(t => t.name === group.key);
                            const itemCat = (frozenProductsList || []).find(p => p.name === group.key)?.category || getProductCategory(group.key) || tmpl?.category;
                            const cc = getCatColors(itemCat);
                            const kc = group.items[0].kashrut ? getKashrutColor(group.items[0].kashrut) : null;
                            return (
                              <li key={gIdx} className="px-2 py-2 text-xs">
                                <div className="flex items-center gap-2 flex-wrap">
                                  <span className={`font-black px-1.5 py-0.5 rounded min-w-[28px] text-center border shrink-0 ${cc.qtyBg} ${cc.qtyText} ${cc.qtyBorder}`}>
                                    {group.items.length > 1 ? group.total : group.items[0].qty}
                                  </span>
                                  <span className="font-bold text-gray-800">{group.key}</span>
                                  {kc && <span className="text-[10px] px-1.5 py-0.5 rounded font-bold border" style={{ borderColor: kc+'80', backgroundColor: kc+'15', color: kc }}>{group.items[0].kashrut}</span>}
                                  {group.items[0].sku && <span className="text-[10px] px-1.5 py-0.5 rounded font-bold bg-gray-100 text-gray-500 border border-gray-200">{group.items[0].sku}</span>}
                                  {resolveItemStorage(group.items[0]) === 'frozen' ? <span className="text-[10px]">🧊</span> : resolveItemStorage(group.items[0]) === 'fish' ? <span className="text-[10px]">🐟</span> : <span className="text-[10px]">🥩</span>}
                                </div>
                                {(group.items.length > 1 || (group.items.length === 1 && group.items[0].name !== group.key)) && (
                                  <div className={`mr-6 mt-1.5 space-y-1 border-r-2 pr-2 ${cc.subBorder}`}>
                                    {group.items.map((item, iIdx) => {
                                      const opt = item.name.match(/\((.+)\)$/)?.[1] || item.name;
                                      return (
                                        <div key={iIdx} className="flex items-center gap-1.5 text-[11px] text-gray-500">
                                          <span className={`font-extrabold min-w-[20px] text-center ${cc.subQty}`}>{item.qty}</span>
                                          <span>{opt}</span>
                                        </div>
                                      );
                                    })}
                                  </div>
                                )}
                                {group.items.some(i => i.notes) && (
                                  <div className="text-red-500 font-medium mr-7 mt-0.5">✂️ {[...new Set(group.items.map(i => i.notes).filter(Boolean))].join(' | ')}</div>
                                )}
                                {group.items[0]?.checks?.length > 0 && (
                                  <div className="flex flex-wrap gap-1 mr-6 mt-1">
                                    {group.items[0].checks.map(c => (
                                      <span key={c} className={`text-[10px] px-1.5 py-0.5 rounded font-bold border ${cc.qtyBg} ${cc.qtyText} ${cc.qtyBorder}`}>✓ {c}</span>
                                    ))}
                                  </div>
                                )}
                              </li>
                            );
                          })}
                          {packingItem && (
                            <li className="px-2 py-1.5 flex items-center gap-2 text-xs">
                              <span className="font-black px-1.5 py-0.5 rounded border bg-gray-100 text-gray-500 border-gray-200 text-center shrink-0">📦</span>
                              <span className="text-gray-600 font-medium">{packingItem.notes}</span>
                            </li>
                          )}
                        </ul>
                      );
                    })()}

                    {dimmed && order.packaging && (order.packaging.cartons || order.packaging.bags || order.packaging.fishBags) && (
                      <div className="mb-3 bg-green-50 border border-green-200 rounded-lg px-3 py-2 flex flex-wrap gap-3 text-xs font-bold text-green-800">
                        {order.packaging.cartons > 0 && <span>📦 {order.packaging.cartons} קרטונים</span>}
                        {order.packaging.bags > 0 && <span>🛍️ {order.packaging.bags} שקיות</span>}
                        {order.packaging.fishBags > 0 && <span>🐟 {order.packaging.fishBags} שקיות דגים</span>}
                      </div>
                    )}

                  </div>
                )}
                </div>
              </article>
              );
            };

            const renderKashrutGroups = (arr, dimmed = false, draggable = false) => {
              if (arr.length === 0) return (
                <div className="so-colempty">אין הזמנות</div>
              );
              return sortByKashrut(arr).map(o => renderOrderCard(o, dimmed, draggable));
            };

            const colHeader = (title, count, color) => (
              <div className="so-col-h"><i style={{ background: color }}></i><h2>{title}</h2><b>{count}</b></div>
            );

            return (
              <div className="so-kanban">
                {/* עמודה 1 — הזמנות חדשות */}
                <section className="so-col">
                  {colHeader('חדשות', newOrders.length, '#B91C1C')}
                  {renderKashrutGroups(newOrders)}
                </section>

                {/* עמודה 2 — בעבודה */}
                <section className="so-col">
                  {colHeader('בעבודה', assignedOrders.length, '#C2410C')}
                  {renderKashrutGroups(assignedOrders, false, true)}
                  {assignedOrders.length > 0 && (
                    <div className="so-colhint">כשהקצב סיים — "לאריזה", או גרירה לעמודת האריזה</div>
                  )}
                </section>

                {/* עמודה 3 — באריזה */}
                <section
                  onDragOver={e => { e.preventDefault(); setIsDragOver(true); }}
                  onDragLeave={() => setIsDragOver(false)}
                  onDrop={() => { if (draggingId) { moveToPacking(draggingId); setDraggingId(null); } setIsDragOver(false); }}
                  className={`so-col ${isDragOver ? 'dragover' : ''}`}
                >
                  {colHeader('באריזה', packingOrders.length, '#A16207')}
                  {isDragOver && (
                    <div className="so-dropzone">שחררי כאן להעברה לאריזה</div>
                  )}
                  {renderKashrutGroups(packingOrders, false, false)}
                  {packingOrders.length > 0 && (
                    <div className="so-colhint">אחרי האריזה — "מוכן"</div>
                  )}
                </section>
              </div>
            );
          })()}

          {/* מודאל הזמנה חדשה */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white rounded-2xl shadow-xl border border-purple-100 w-full max-w-3xl max-h-[98vh] flex flex-col overflow-hidden animate-in zoom-in-95 duration-200">
                <div className="p-4 bg-purple-50 border-b border-purple-100 flex items-center justify-between shrink-0">
                  <h3 className="font-bold text-lg flex items-center gap-2 text-purple-800"><Icons.ClipboardList className="w-5 h-5" /> {editingOrder ? `עריכת הזמנה #${editingOrder.id}` : 'טופס הזמנה מלא (כמו בנייר)'}</h3>
                  <button onClick={closeModal} className="p-1 rounded-lg text-gray-400 hover:bg-gray-200 hover:text-gray-700"><Icons.X className="w-5 h-5" /></button>
                </div>
                
                <form onSubmit={handleAddOrder}
                  onKeyDown={e => {
                    // מעבר בין שדות: אנטר / חץ שמאלה = קדימה, חץ ימינה = אחורה
                    if (e.defaultPrevented) return; // שדה שטיפל במקש בעצמו
                    const t = e.target;
                    if (t.tagName !== 'INPUT' && t.tagName !== 'SELECT') return;
                    const dir = (e.key === 'Enter' || e.key === 'ArrowLeft') ? 1 : e.key === 'ArrowRight' ? -1 : 0;
                    if (!dir) return;
                    // בשדה טקסט החץ מזיז קודם את הסמן — עוברים שדה רק כשהסמן כבר בקצה
                    if (e.key !== 'Enter' && t.tagName === 'INPUT' && ['text', 'tel', 'search'].includes(t.type)) {
                      const len = t.value.length;
                      if (dir === 1 && !(t.selectionStart === len && t.selectionEnd === len)) return;
                      if (dir === -1 && !(t.selectionStart === 0 && t.selectionEnd === 0)) return;
                    }
                    e.preventDefault();
                    const focusable = Array.from(e.currentTarget.querySelectorAll('input:not([type=hidden]), select, textarea')).filter(el => !el.disabled && el.offsetParent !== null);
                    const idx = focusable.indexOf(t);
                    const next = idx === -1 ? null : focusable[idx + dir];
                    if (next) next.focus();
                  }}
                  ref={modalFormRef}
                  className="overflow-y-auto p-5 space-y-6 flex-1 custom-scrollbar bg-gray-50/30">
                  
                  {formErrorMessage && (
                    <div className="bg-red-50 border-r-4 border-red-500 p-3.5 rounded-lg text-red-800 text-sm font-bold flex justify-between items-center animate-bounce">
                      <span>⚠️ {formErrorMessage}</span>
                      <button type="button" onClick={() => setFormErrorMessage('')} className="text-red-600 hover:text-red-800 text-lg font-bold">✕</button>
                    </div>
                  )}

                  {/* סוג הזמנה */}
                  <div className="grid grid-cols-2 gap-3">
                    <label className={`cursor-pointer border rounded-lg p-2.5 text-center transition-all ${orderType === 'delivery' ? 'bg-purple-50 border-purple-500 text-purple-700 font-bold' : 'bg-white border-gray-200 text-gray-600'}`}>
                      <input type="radio" name="modalOrderType" value="delivery" className="hidden" checked={orderType === 'delivery'} onChange={() => setOrderType('delivery')} />
                      משלוח
                    </label>
                    <label className={`cursor-pointer border rounded-lg p-2.5 text-center transition-all ${orderType === 'pickup' ? 'bg-purple-50 border-purple-500 text-purple-700 font-bold' : 'bg-white border-gray-200 text-gray-600'}`}>
                      <input type="radio" name="modalOrderType" value="pickup" className="hidden" checked={orderType === 'pickup'} onChange={() => setOrderType('pickup')} />
                      איסוף בחנות
                    </label>
                  </div>

                  {/* פרטי לקוח */}
                  <div className="bg-white p-4 rounded-lg border border-gray-200 space-y-3 shadow-sm">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div className="relative">
                        <input
                          type="text"
                          required
                          value={customerName}
                          onChange={e => {
                            const val = e.target.value;
                            setCustomerName(val);
                            if (val.trim().length >= 1 && contactsList.length > 0) {
                              setCustomerSuggestions(contactsList.filter(c => c.name.includes(val.trim())).slice(0, 6));
                            } else {
                              setCustomerSuggestions([]);
                            }
                          }}
                          onBlur={() => setTimeout(() => setCustomerSuggestions([]), 150)}

    // ===[DELIVERIES]===
    // נתוני סבב נשמרים על כל הזמנה: order.route = { id, name, time, courier, date, seq }
    // מצב מסירה: order.delivery = { status: 'done' | 'failed', reason, collected, at, by, onwayAt }
    const DEFAULT_WA_READY = 'שלום {שם}, ההזמנה שלך (#{מספר}) מוכנה לאיסוף בסופר עוף.\nמחכים לך!';
    const normPhone = (p) => { const d = String(p || '').replace(/\D/g, ''); if (d.startsWith('972')) return d; if (d.startsWith('0')) return '972' + d.slice(1); return d; };
    const waLink = (phone, text) => `https://wa.me/${normPhone(phone)}?text=${encodeURIComponent(text)}`;
    const navAddress = (o) => [o.street || o.neighborhood, (o.city || 'ירושלים')].filter(Boolean).join(', ');
    const wazeLink = (o) => `https://waze.com/ul?q=${encodeURIComponent(navAddress(o))}&navigate=yes`;
    const hhmm = () => new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });

    const DeliveriesView = ({ orders, setOrders, couriersList, kashrutList, butchersList, neighborhoodData = [], appUser, waReadyTemplate }) => {
      const today = localToday();
      const isAdmin = !!appUser?.is_admin;
      const myCourierId = appUser?.permissions?.courierId || '';
      const courierOnly = !isAdmin && !!myCourierId; // שליח רואה רק את המסלול שלו
      const [activeTab, setActiveTab] = useState(courierOnly ? 'mine' : 'delivery');
      const [viewCourier, setViewCourier] = useState(myCourierId || couriersList[0]?.id || '');
      const [selected, setSelected] = useState([]);
      const [modal, setModal] = useState(null); // { type: 'collect' | 'fail', order }
      const [origin, setOrigin] = useState(() => { try { return localStorage.getItem('so-route-origin') || ''; } catch { return ''; } });
      const [returnModal, setReturnModal] = useState(null);
      const [returnStep, setReturnStep] = useState('destination');
      const [returnPackaging, setReturnPackaging] = useState({ cartons: '', bags: '', fishBags: '' });

      const updateOrder = (id, fn) => setOrders(prev => prev.map(o => o.id === id ? fn(o) : o));
      const kColor = (name) => (kashrutList || []).find(k => k.name === name)?.color || '#6b7280';
      const kashrutsOf = (o) => [...new Set((o.items || []).map(i => i.kashrut).filter(Boolean))];
      const courierName = (id) => couriersList.find(c => c.id === id)?.name || 'ללא שליח';
      const hoodIdx = (name) => { const i = (neighborhoodData || []).findIndex(n => n.name === name); return i < 0 ? 999 : i; };
      const fmtDay = (d) => d ? d.slice(8, 10) + '/' + d.slice(5, 7) : '';

      const readyDeliveries = orders.filter(o => o.type === 'delivery' && o.status === 'completed');
      const pickupOrders = orders.filter(o => o.type === 'pickup' && o.status === 'completed');
      const unassigned = readyDeliveries.filter(o => !o.route)
        .sort((a, b) => hoodIdx(a.neighborhood) - hoodIdx(b.neighborhood) || (a.street || '').localeCompare(b.street || '', 'he'));

      // סבבים: הזמנות שממתינות למסירה + מה שנמסר היום באותו סבב
      const routes = useMemo(() => {
        const m = new Map();
        orders.forEach(o => {
          if (o.type !== 'delivery' || !o.route) return;
          if (!(o.status === 'completed' || (o.status === 'delivered' && o.route.date === today))) return;
          const r = m.get(o.route.id) || { ...o.route, stops: [] };
          r.stops.push(o); m.set(o.route.id, r);
        });
        return [...m.values()]
          .map(r => ({ ...r, stops: r.stops.sort((a, b) => (a.route.seq || 0) - (b.route.seq || 0)) }))
          .sort((a, b) => (a.time || '99').localeCompare(b.time || '99') || a.id - b.id);
      }, [orders, today]);

      const isPending = (o) => o.status === 'completed' && o.delivery?.status !== 'failed';

      // --- ניהול סבבים ---
      const addToRoute = (route) => {
