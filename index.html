    let _cityListCache = null;
    const loadCityList = async () => {
      if (_cityListCache) return _cityListCache;
      const res = await fetch('https://data.gov.il/api/3/action/datastore_search?resource_id=5c78e9fa-c2e2-4771-93ff-7f400a12f7ba&limit=3000&fields=%D7%A9%D7%9D_%D7%99%D7%A9%D7%95%D7%91');
      const data = await res.json();
      _cityListCache = [...new Set((data.result?.records || []).map(r => r['שם_ישוב']).filter(Boolean))].sort();
      return _cityListCache;
    };

    let _streetCache = {};
    const loadStreetList = async (city) => {
      if (_streetCache[city]) return _streetCache[city];
      const res = await fetch(`https://data.gov.il/api/3/action/datastore_search?resource_id=a7296d1a-f8c9-4b70-96c2-6ebb4352f8e3&q=${encodeURIComponent(city)}&limit=5000`);
      const data = await res.json();
      // מסנן לפי שם ישוב מדויק (עם trim לרווחים מיותרים) ומחלץ רחובות
      const streets = [...new Set(
        (data.result?.records || [])
          .filter(r => r['שם_ישוב']?.trim() === city)
          .map(r => r['שם_רחוב']?.trim())
          .filter(Boolean)
      )].sort();
      _streetCache[city] = streets;
      return streets;
    };

    const AddressAutocomplete = ({ value, onChange, placeholder, getSuggestions, className = '', disabled = false }) => {
      const [suggestions, setSuggestions] = useState([]);
      const [isOpen, setIsOpen] = useState(false);
      const [loading, setLoading] = useState(false);
      const timerRef = useRef(null);

      const handleInput = (val) => {
        onChange(val);
        if (val.length < 2) { setSuggestions([]); setIsOpen(false); return; }
        clearTimeout(timerRef.current);
        timerRef.current = setTimeout(async () => {
          setLoading(true);
          try {
            const results = await getSuggestions(val);
            setSuggestions(results);
            setIsOpen(results.length > 0);
          } catch { } finally { setLoading(false); }
        }, 200);
      };

      return (
        <div className="relative">
          <input type="text" value={value} disabled={disabled}
            onChange={e => handleInput(e.target.value)}
            onBlur={() => setTimeout(() => setIsOpen(false), 200)}
            placeholder={placeholder}
            className={`${className} ${disabled ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : ''}`}
          />
          {loading && <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs animate-pulse">טוען...</span>}

            <div className="absolute z-[100] w-full bg-white border border-blue-200 rounded-xl shadow-xl max-h-52 overflow-y-auto mt-1 custom-scrollbar">
              {suggestions.map(s => (
                <button key={s} type="button"

                  className="w-full text-right px-3 py-2.5 text-sm hover:bg-blue-50 hover:text-blue-800 font-medium border-b border-gray-100 last:border-0 transition-colors">
                  {s}
                </button>

            </div>
          )}
        </div>

            || _fp.find(fp => fp.name === name && fp.sku)?.sku
            || '';
      };

      const activeKashrutObj = kashrutList.find(k => k.name === activeKashrut) || {};
      const activeColor = activeKashrutObj.color || '#6366f1';

      const kashrutTotal = freshItems.reduce((sum, item) => sum + (stock[`${item.name}|${activeKashrut}`] || 0), 0);

      return (
        <div className="flex flex-col gap-4">
          {/* טאבי כשרות */}
          <div className="flex gap-2 flex-wrap">
            {kashrutList.map(k => {
              const isActive = k.name === activeKashrut;
              const color = k.color || '#6366f1';
              return (
                <button key={k.id} onClick={() => setActiveKashrut(k.name)}
                  style={isActive ? { backgroundColor: color, borderColor: color, color: 'white' } : { borderColor: color, color }}
                  className={`flex-1 min-w-[80px] py-2.5 rounded-xl font-bold text-sm transition-all border-2 bg-white ${isActive ? 'shadow-md' : 'hover:opacity-80'}`}>
                  {k.name}
                </button>
              );
            })}
          </div>

          {/* סיכום */}
          <div className="rounded-xl overflow-hidden border" style={{ borderColor: activeColor + '40' }}>
            <div className="py-1.5 px-3 text-center text-white text-xs font-bold" style={{ backgroundColor: activeColor }}>
              {activeKashrut} — סה"כ מלאי
            </div>
            <div className="p-3 text-center" style={{ backgroundColor: activeColor + '15' }}>
              <div className="text-2xl font-black" style={{ color: activeColor }}>{kashrutTotal.toFixed(1)} ק"ג</div>
            </div>
          </div>

          {/* טבלה לפי קטגוריות */}
          {(() => {
            const grouped = {};
            freshItems.forEach(item => {
              const cat = item.category || 'אחר';
              if (!grouped[cat]) grouped[cat] = [];
              grouped[cat].push(item);
            });
            const cats = PRODUCT_CATEGORIES.filter(c => grouped[c]?.length);
            return cats.map(cat => {
              const cs = CAT_STYLES[cat] || {};
              return (
                <div key={cat} className={`rounded-xl overflow-hidden border ${cs.header || 'border-gray-200'}`}>
                  <div className={`px-4 py-2.5 flex items-center gap-2 font-extrabold text-sm ${cs.header || 'bg-gray-50 border-gray-200'} ${cs.text || 'text-gray-700'} border-b`}>
                    <span>{CAT_EMOJI[cat]}</span>
                    <span>{cat}</span>
                    <span className={`mr-auto text-xs font-bold px-2 py-0.5 rounded-full border ${cs.badge || 'bg-gray-100 text-gray-500 border-gray-200'}`}>{grouped[cat].length} מוצרים</span>
                  </div>
                  <div className="bg-white">
                    <table className="w-full text-right text-sm">
                      <thead className="text-xs text-gray-500 bg-gray-50 border-b border-gray-100">
                        <tr>
                          <th className="p-3 font-bold text-right">מוצר</th>
                          <th className="p-3 font-bold text-center">כמות (ק"ג)</th>
                          <th className="p-3 font-bold text-center">מצב</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {grouped[cat].map((item, idx) => {
                          const qty = stock[`${item.name}|${activeKashrut}`] || 0;
                          const isLow = qty < 10;
                          return (
                            <tr key={item.name} style={{ backgroundColor: idx % 2 === 0 ? '#ffffff' : '#f9fafb' }}>
                              <td className="p-2.5 font-bold text-gray-900">
                                {item.name}
                                {getFreshSku(item.name) && <span className="block text-xs text-gray-400 font-normal">{getFreshSku(item.name)}</span>}
                              </td>
                              <td className="p-1.5 text-center">
                                <input type="number" min="0" step="0.5"
                                  value={qty || ''}
                                  placeholder="0"
                                  onChange={e => updateQty(item.name, activeKashrut, e.target.value)}
                                  style={{ borderColor: activeColor + '60' }}
                                  className="w-20 p-1.5 text-center text-sm font-bold border rounded-lg bg-white focus:ring-2 outline-none"
                                />
                              </td>
                              <td className="p-2.5 text-center">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${isLow ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-700 border border-green-100'}`}>
                                  {isLow ? 'נמוך' : 'תקין'}
                                </span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              );
            });
          })()}
        </div>
      );
    };

    // --- Frozen Stock Panel ---
    const FrozenStockPanel = ({ frozenStock, setFrozenStock, kashrutList, frozenProductsList }) => {
      const [activeKashrut, setActiveKashrut] = useState(kashrutList[0]?.name || '');

      const updateTrays = (product, kashrut, value) => {
        const num = parseInt(value) || 0;
        setFrozenStock(prev => ({ ...prev, [`${product}|${kashrut}`]: Math.max(0, num) }));
      };

      const updateCartons = (product, kashrut, value) => {
        const num = parseInt(value) || 0;
        setFrozenStock(prev => ({ ...prev, [`${product}|${kashrut}`]: Math.max(0, num * TRAYS_PER_CARTON) }));
      };

      const fishProducts = frozenProductsList.filter(p => p.kashrut === 'כללי' && p.storageTypes?.includes('frozen'));
      const activeProducts = frozenProductsList.filter(p => (p.kashrut || '') === activeKashrut && p.kashrut !== 'כללי' && p.storageTypes?.includes('frozen'));
      const kashrutTrays = activeProducts.reduce((sum, p) => sum + (frozenStock[`${p.name}|${activeKashrut}`] || 0), 0);
      const kashrutCartons = Math.floor(kashrutTrays / TRAYS_PER_CARTON);
      const kashrutRemainder = kashrutTrays % TRAYS_PER_CARTON;

      const activeKashrutObj = kashrutList.find(k => k.name === activeKashrut) || {};
      const activeColor = activeKashrutObj.color || '#6366f1';

      return (
        <div className="flex flex-col gap-4">
          {/* טאבי כשרות */}
          <div className="flex gap-2 flex-wrap">
            {kashrutList.map((k) => {
              const isActive = k.name === activeKashrut;
              const color = k.color || '#6366f1';
              return (
                <button key={k.id}
                  onClick={() => setActiveKashrut(k.name)}
                  style={isActive ? { backgroundColor: color, borderColor: color, color: 'white' } : { borderColor: color, color: color }}
                  className={`flex-1 min-w-[80px] py-2.5 rounded-xl font-bold text-sm transition-all border-2 bg-white ${isActive ? 'shadow-md' : 'hover:opacity-80'}`}>
                  {k.name}
                </button>
              );
            })}
          </div>

          {/* סיכום כשרות פעילה */}
          <div className="grid grid-cols-2 gap-3">
            <div className="rounded-xl overflow-hidden border" style={{ borderColor: activeColor + '40' }}>
              <div className="py-1.5 px-3 text-center text-white text-xs font-bold" style={{ backgroundColor: activeColor }}>
                {activeKashrut} — מגשים
              </div>
              <div className="p-3 text-center" style={{ backgroundColor: activeColor + '15' }}>
                <div className="text-2xl font-black" style={{ color: activeColor }}>{kashrutTrays}</div>
              </div>
            </div>
            <div className="rounded-xl overflow-hidden border" style={{ borderColor: activeColor + '40' }}>
              <div className="py-1.5 px-3 text-center text-white text-xs font-bold" style={{ backgroundColor: activeColor }}>
                {activeKashrut} — קרטונים
              </div>
              <div className="p-3 text-center" style={{ backgroundColor: activeColor + '15' }}>
                <div className="text-2xl font-black" style={{ color: activeColor }}>{kashrutCartons}</div>
                {kashrutRemainder > 0 && <div className="text-xs text-gray-400">+{kashrutRemainder} מגשים</div>}
              </div>
            </div>
          </div>

          {/* טבלת מוצרים קפואים לפי קטגוריות */}
          {(() => {
            const grouped = {};
            activeProducts.forEach(p => {
              const cat = p.category || getProductCategory(p.name);
              if (!grouped[cat]) grouped[cat] = [];
              grouped[cat].push(p);
            });
            const cats = PRODUCT_CATEGORIES.filter(c => grouped[c]?.length);
            return cats.map(cat => {
              const cs = CAT_STYLES[cat] || {};
              return (
                <div key={cat} className={`rounded-xl overflow-hidden border ${cs.header || 'border-gray-200'}`}>
                  <div className={`px-4 py-2.5 flex items-center gap-2 font-extrabold text-sm ${cs.header || 'bg-gray-50 border-gray-200'} ${cs.text || 'text-gray-700'} border-b`}>
                    <span>{CAT_EMOJI[cat]}</span>
                    <span>{cat}</span>
                    <span className={`mr-auto text-xs font-bold px-2 py-0.5 rounded-full border ${cs.badge || 'bg-gray-100 text-gray-500 border-gray-200'}`}>{grouped[cat].length} מוצרים</span>
                  </div>
                  <div className="bg-white">
                    <table className="w-full text-right text-sm">
                      <thead className="text-xs text-gray-500 bg-gray-50 border-b border-gray-100">
                        <tr>
                          <th className="p-3 font-bold text-right">מוצר</th>
                          <th className="p-3 font-bold text-center">מגשים</th>
                          <th className="p-3 font-bold text-center">קרטונים</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {grouped[cat].map((p, idx) => {
                          const trays = frozenStock[`${p.name}|${activeKashrut}`] || 0;
                          const cartons = Math.floor(trays / TRAYS_PER_CARTON);
                          const remainder = trays % TRAYS_PER_CARTON;
                          return (
                            <tr key={p.name} style={{ backgroundColor: idx % 2 === 0 ? '#ffffff' : '#f9fafb' }}>
                              <td className="p-2.5 font-bold text-gray-900">
                                {p.name}
                                {p.sku && <span className="block text-xs text-gray-400 font-normal">{p.sku}</span>}
                              </td>
                              <td className="p-1.5 text-center">
                                <input type="number" min="0" step="1"
                                  value={trays || ''}
                                  placeholder="0"
                                  onChange={e => updateTrays(p.name, activeKashrut, e.target.value)}
                                  style={{ borderColor: activeColor + '60' }}
                                  className="w-20 p-1.5 text-center text-sm font-bold border rounded-lg bg-white focus:ring-2 outline-none"
                                />
                              </td>
                              <td className="p-1.5 text-center">
                                <div className="flex flex-col items-center gap-0.5">
                                  <input type="number" min="0" step="1"
                                    value={cartons || ''}
                                    placeholder="0"
                                    onChange={e => updateCartons(p.name, activeKashrut, e.target.value)}
                                    style={{ borderColor: activeColor + '60', color: activeColor }}
                                    className="w-20 p-1.5 text-center text-sm font-black border rounded-lg bg-white focus:ring-2 outline-none"
                                  />
                                  {remainder > 0 && <div className="text-[10px] text-gray-400">+{remainder} מגשים</div>}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              );
            });
          })()}
          <p className="text-xs text-gray-400 text-center">* קרטון = {TRAYS_PER_CARTON} מגשים</p>

          {/* סקשן דגים — ללא חלוקה לכשרות */}
          {fishProducts.length > 0 && (
            <div className="bg-white rounded-xl shadow-sm border border-blue-200 overflow-hidden mt-2">
              <div className="py-2 px-4 bg-blue-50 border-b border-blue-200 flex items-center gap-2">
                <span className="text-blue-600 font-extrabold text-sm">🐟 דגים — כללי</span>
              </div>
              <div className="overflow-x-auto max-h-[360px] overflow-y-auto custom-scrollbar">
                <table className="w-full text-right text-sm">
                  <thead className="sticky top-0 z-10 bg-blue-400 text-white text-xs">
                    <tr>
                      <th className="p-3 font-bold text-right">מוצר</th>
                      <th className="p-3 font-bold text-center">מגשים</th>
                      <th className="p-3 font-bold text-center">קרטונים</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {fishProducts.map((p, idx) => {
                      const trays = frozenStock[`${p.name}|כללי`] || 0;
                      const cartons = Math.floor(trays / TRAYS_PER_CARTON);
                      const remainder = trays % TRAYS_PER_CARTON;
                      const rowBg = idx % 2 === 0 ? '#ffffff' : '#eff6ff';
                      return (
                        <tr key={p.name} style={{ backgroundColor: rowBg }}>
                          <td className="p-2.5 font-bold text-gray-900">
                            {p.name}
                            {p.sku && <span className="block text-xs text-gray-400 font-normal">{p.sku}</span>}
                          </td>
                          <td className="p-1.5 text-center">
                            <input
                              type="number" min="0" step="1"
                              value={trays || ''}
                              placeholder="0"
                              onChange={e => { const num = parseInt(e.target.value) || 0; setFrozenStock(prev => ({ ...prev, [`${p.name}|כללי`]: Math.max(0, num) })); }}
                              className="w-20 p-1.5 text-center text-sm font-bold border border-blue-200 rounded-lg bg-white focus:ring-2 outline-none"
                            />
                          </td>
                          <td className="p-1.5 text-center">
                            <div className="flex flex-col items-center gap-0.5">
                              <input
                                type="number" min="0" step="1"
                                value={cartons || ''}
                                placeholder="0"
                                onChange={e => { const num = parseInt(e.target.value) || 0; setFrozenStock(prev => ({ ...prev, [`${p.name}|כללי`]: Math.max(0, num * TRAYS_PER_CARTON) })); }}
                                className="w-20 p-1.5 text-center text-sm font-black border border-blue-200 text-blue-600 rounded-lg bg-white focus:ring-2 outline-none"
                              />
                              {remainder > 0 && <div className="text-[10px] text-gray-400">+{remainder} מגשים</div>}
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    };

    const InventoryView = ({ stock, setStock, frozenStock, setFrozenStock, kashrutList, frozenProductsList }) => {
      const [activeTab, setActiveTab] = useState('frozen');
      const [exportModal, setExportModal] = useState(false);
      const [exportFormat, setExportFormat] = useState('');
      const [exportSections, setExportSections] = useState({ frozen: false, fresh: false });
      const [exportKashrut, setExportKashrut] = useState(() => {
        const obj = {};
        kashrutList.forEach(k => { obj[k.name] = false; });
        return obj;
      });

      const seenFresh = new Set();
      const freshItems = (frozenProductsList || [])
        .filter(p => p.storageTypes?.includes('fresh'))
        .filter(p => { if (seenFresh.has(p.name)) return false; seenFresh.add(p.name); return true; });
      const frozenItems = frozenProductsList || [];

      const selectedKashrut = kashrutList.filter(k => exportKashrut[k.name]);

      const runExport = () => {
        const date = new Date().toLocaleDateString('he-IL').replace(/\//g, '-');
        if (exportFormat === 'excel') doExcelExport(date);
        else doPdfExport(date);
        setExportModal(false);
      };

      const doExcelExport = (date) => {
        const wb = window.XLSX.utils.book_new();
        if (exportSections.frozen) {
          const nonFishProducts = frozenProductsList.filter(p => p.kashrut !== 'כללי');
          const fishExportProducts = frozenProductsList.filter(p => p.kashrut === 'כללי');
          const header = ['מוצר', ...selectedKashrut.flatMap(k => [`${k.name} - מגשים`, `${k.name} - קרטונים`])];
          const rows = nonFishProducts.map(p => {
            const row = [p.name];
            selectedKashrut.forEach(k => {
              const t = frozenStock[`${p.name}|${k.name}`] || 0;
              row.push(t || 0, Math.floor(t / TRAYS_PER_CARTON));
            });
            return row;
          });
          if (fishExportProducts.length) {
            const emptyKashrut = selectedKashrut.flatMap(() => ['', '']);
            rows.push(['🐟 דגים (כללי)', ...emptyKashrut]);
            fishExportProducts.forEach(p => {
              const t = frozenStock[`${p.name}|כללי`] || 0;
              const row = [p.name, t || 0, Math.floor(t / TRAYS_PER_CARTON)];
              selectedKashrut.slice(1).forEach(() => row.push('', ''));
              rows.push(row);
            });
          }
          window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet([header, ...rows]), 'מלאי קפוא');
        }
        if (exportSections.fresh) {
          const header = ['מוצר', 'קטגוריה', ...selectedKashrut.map(k => `${k.name} (ק"ג)`)];
          const rows = freshItems.map(item => {
            const row = [item.name, item.category];
            selectedKashrut.forEach(k => row.push(stock[`${item.name}|${k.name}`] || 0));
            return row;
          });
          window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet([header, ...rows]), 'מלאי טרי');
        }
        window.XLSX.writeFile(wb, `מלאי סופר עוף ${date}.xlsx`);
      };

      const doPdfExport = (date) => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        let first = true;
        if (exportSections.frozen) {
          if (!first) doc.addPage(); first = false;
          doc.setFontSize(13);
          doc.text(`Super Oaf - Frozen Inventory | ${date}`, 14, 14);
          const head = [['Product', ...selectedKashrut.flatMap(k => [`${k.name} Trays`, `${k.name} Cartons`])]];
          const body = frozenProductsList.map(p => {
            const row = [p.name];
            selectedKashrut.forEach(k => { const t = frozenStock[`${p.name}|${k.name}`] || 0; row.push(t || '-', t ? Math.floor(t / TRAYS_PER_CARTON) : '-'); });
            return row;
          });
          doc.autoTable({ head, body, startY: 18, styles: { fontSize: 9, halign: 'center' }, headStyles: { fillColor: [30,30,30], textColor: 255 }, alternateRowStyles: { fillColor: [245,245,255] }, columnStyles: { 0: { halign: 'left', fontStyle: 'bold' } } });
        }
        if (exportSections.fresh) {
          if (!first) doc.addPage(); first = false;
          doc.setFontSize(13);
          doc.text(`Super Oaf - Fresh Inventory | ${date}`, 14, 14);
          const head = [['Product', 'Category', ...selectedKashrut.map(k => `${k.name} (kg)`)]];
          const body = freshItems.map(item => { const row = [item.name, item.category]; selectedKashrut.forEach(k => row.push(stock[`${item.name}|${k.name}`] || '-')); return row; });
          doc.autoTable({ head, body, startY: 18, styles: { fontSize: 9, halign: 'center' }, headStyles: { fillColor: [30,30,30], textColor: 255 }, alternateRowStyles: { fillColor: [240,255,245] }, columnStyles: { 0: { halign: 'left', fontStyle: 'bold' }, 1: { halign: 'left' } } });
        }
        doc.save(`מלאי סופר עוף ${date}.pdf`);
      };

      return (
        <div className="animate-in fade-in duration-300">
          <div className="mb-5 flex flex-wrap items-start justify-between gap-3">
            <div>
              <h1 className="text-3xl font-extrabold text-gray-900">מלאי סחורה - כללי</h1>
              <p className="text-gray-500 mt-1">ניהול מלאי טרי וקפוא — קליטת בוקר ועדכון כמויות</p>
            </div>
            <button onClick={() => setExportModal(true)}
              className="flex items-center gap-2 px-4 py-2.5 bg-gray-800 hover:bg-gray-900 text-white font-bold text-sm rounded-xl shadow-sm transition-colors">
              <span>⬇️</span> ייצוא מלאי
            </button>
          </div>

          {/* טאבים */}
          <div className="flex gap-2 mb-6">
            <button
              onClick={() => setActiveTab('frozen')}
              className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all border-2 ${activeTab === 'frozen' ? 'bg-cyan-600 text-white border-cyan-600 shadow-md' : 'bg-white text-cyan-700 border-cyan-200 hover:bg-cyan-50'}`}>
              🧊 מלאי קפוא ({new Set(frozenItems.filter(p => p.storageTypes?.includes('frozen')).map(p => p.name)).size} פריטים)
            </button>
            <button
              onClick={() => setActiveTab('fresh')}
              className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all border-2 ${activeTab === 'fresh' ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-blue-700 border-blue-200 hover:bg-blue-50'}`}>
              🥩 מלאי טרי ({freshItems.length} פריטים)
            </button>
          </div>

          {/* מודאל ייצוא */}
          {exportModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-md animate-in zoom-in-95 duration-200">
                <div className="p-4 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
                  <h3 className="font-bold text-lg text-gray-900 flex items-center gap-2">⬇️ ייצוא מלאי</h3>
                  <button onClick={() => setExportModal(false)} className="p-1 rounded-lg text-gray-400 hover:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
                </div>

                <div className="p-5 space-y-5">
                  {/* פורמט */}
                  <div>
                    <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">פורמט קובץ</div>
                    <div className="flex gap-3">
                      {[['excel','📊 Excel (.xlsx)','emerald'],['pdf','📄 PDF','red']].map(([val, label, color]) => (
                        <label key={val} className={`flex-1 cursor-pointer border-2 rounded-xl p-3 text-center font-bold text-sm transition-all ${exportFormat === val ? `border-${color}-500 bg-${color}-50 text-${color}-700` : 'border-gray-200 text-gray-500 hover:border-gray-300'}`}>
                          <input type="radio" className="hidden" value={val} checked={exportFormat === val} onChange={() => setExportFormat(val)} />
                          {label}
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* סוג מלאי */}
                  <div>
                    <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">סוג מלאי לייצוא</div>
                    <div className="flex gap-3">
                      {[['frozen','🧊 קפוא'],['fresh','🥩 טרי']].map(([key, label]) => (
                        <label key={key} className={`flex-1 cursor-pointer border-2 rounded-xl p-3 text-center font-bold text-sm transition-all flex items-center justify-center gap-2 ${exportSections[key] ? 'border-gray-800 bg-gray-800 text-white' : 'border-gray-200 text-gray-500 hover:border-gray-300'}`}>
                          <input type="checkbox" className="hidden" checked={exportSections[key]}
                            onChange={e => setExportSections(p => ({ ...p, [key]: e.target.checked }))} />
                          {label}
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* כשרויות */}
                  <div>
                    <div className="text-xs font-extrabold text-gray-500 uppercase mb-2">כשרויות לכלול</div>
                    <div className="flex flex-wrap gap-2">
                      {kashrutList.map(k => (
                        <label key={k.id} className="cursor-pointer">
                          <input type="checkbox" className="hidden" checked={!!exportKashrut[k.name]}
                            onChange={e => setExportKashrut(p => ({ ...p, [k.name]: e.target.checked }))} />
                          <span className={`inline-block px-3 py-1.5 rounded-lg border-2 font-bold text-sm transition-all ${exportKashrut[k.name] ? 'text-white' : 'bg-white'}`}
                            style={exportKashrut[k.name]
                              ? { backgroundColor: k.color, borderColor: k.color }
                              : { borderColor: k.color + '60', color: k.color }}>
                            {k.name}
                          </span>
                        </label>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="p-4 border-t border-gray-100 flex gap-3">
                  <Button variant="outline" className="flex-1" onClick={() => setExportModal(false)}>ביטול</Button>
                  <button onClick={runExport}
                    disabled={!exportFormat || (!exportSections.frozen && !exportSections.fresh) || selectedKashrut.length === 0}
                    className="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl font-bold text-white bg-gray-800 hover:bg-gray-900 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                    {exportFormat === 'excel' ? '📊' : '📄'} הורד קובץ
                  </button>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'fresh' && (
            <FreshStockPanel stock={stock} setStock={setStock} kashrutList={kashrutList} frozenProductsList={frozenProductsList} />
          )}
          {activeTab === 'frozen' && (
            <FrozenStockPanel frozenStock={frozenStock} setFrozenStock={setFrozenStock} kashrutList={kashrutList} frozenProductsList={frozenProductsList} />
          )}
        </div>
      );
    };

    // --- Orders View ---
    const OrdersView = ({ kashrutList, butchersList, orders, setOrders, stock, neighborhoodData, contactsList, frozenProductsList, orderFormSkuMap, setOrderFormSkuMap, logoImage }) => {
      const getSku = (itemId, k) => (orderFormSkuMap || {})[itemId]?.[k] || '';
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingOrder, setEditingOrder] = useState(null);
      const [activePrintOrder, setActivePrintOrder] = useState(null);
      const [deleteConfirmOrder, setDeleteConfirmOrder] = useState(null);
      const [printMode, setPrintMode] = useState('general'); // 'general' | 'fish'
      const openPrint = (order, mode) => { setPrintMode(mode); setActivePrintOrder(order); };
      const bonHeaderRef = useRef(null);
      const bonTableRef  = useRef(null);
      const [tableScale, setTableScale] = useState(1);
      const bonMeasuredRef = useRef(false);
      useEffect(() => {
        setTableScale(1);
        bonMeasuredRef.current = false;
      }, [activePrintOrder?.id, printMode]);
      useEffect(() => {
        if (!activePrintOrder || bonMeasuredRef.current) return;
        const id = setTimeout(() => {
          if (!bonHeaderRef.current || !bonTableRef.current) return;
          bonMeasuredRef.current = true;
          const A5_CONTENT_H = Math.round(200 * 3.7795); // 200mm at 96dpi ≈ 756px
          const BON_PADDING   = 40;                       // p-5 top+bottom
          const headerH  = bonHeaderRef.current.offsetHeight;
          const naturalH = bonTableRef.current.scrollHeight;
          const available = A5_CONTENT_H - BON_PADDING - headerH;
          setTableScale(Math.min(1, available / naturalH));
        }, 80);
        return () => clearTimeout(id);
      }, [activePrintOrder, printMode]);
      const [orderType, setOrderType] = useState('delivery');
      const [formItemsState, setFormItemsState] = useState({});
      const [packingOption, setPackingOption] = useState('');
      const [categorySearch, setCategorySearch] = useState({});
      const [formErrorMessage, setFormErrorMessage] = useState('');

      // Client state fields
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [customerMobile, setCustomerMobile] = useState('');
      const [neighborhood, setNeighborhood] = useState('');
      const [subNeighborhood, setSubNeighborhood] = useState('');
      const [street, setStreet] = useState('');
      const [entrance, setEntrance] = useState('');
      const [floor, setFloor] = useState('');
      const [apt, setApt] = useState('');
      const [deliveryDate, setDeliveryDate] = useState('');
      const [pickupTime, setPickupTime] = useState('');
      const [kashrut, setKashrut] = useState('');
      const [flags, setFlags] = useState({ mustCoordinate: false, notifyReady: false });
      const [chargeStatus, setChargeStatus] = useState('');
      const [assignedButcher, setAssignedButcher] = useState('');

      const [expandedCategories, setExpandedCategories] = useState({
        'מפורק': false,
        'עוף': false,
        'הודו': false,
        'בשר': false,
        'דגים': false
      });

      const [openDropdown, setOpenDropdown] = useState(null);
      const [expandedOrders, setExpandedOrders] = useState(new Set());
      const toggleOrderExpand = (id) => setExpandedOrders(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const collapseOrder = (id) => setExpandedOrders(prev => { const n = new Set(prev); n.delete(id); return n; });

      const toggleCategory = (category) => {
        setExpandedCategories(prev => ({ ...prev, [category]: !prev[category] }));
      };

      // פריטים ללא אופציות — עדכון שורה רגילה
      const updateItemState = (id, field, value, rowIndex = 0) => {
        setFormItemsState(prev => {
          const rows = Array.isArray(prev[id]) ? prev[id] : [{ qty: '', notes: '', kashrut: '' }];
          return { ...prev, [id]: rows.map((row, i) => i === rowIndex ? { ...row, [field]: value } : row) };
        });
      };

      // פריטים עם אופציות — קריאה ועדכון state
      const getOptState = (id) => {
        const s = formItemsState[id];
        return (s && !Array.isArray(s)) ? s : { totalQty: '', rows: [], checks: [], kashrut: '', notes: '' };
      };

      const updateOptState = (id, update) => {
        setFormItemsState(prev => {
          const s = (prev[id] && !Array.isArray(prev[id])) ? prev[id] : { totalQty: '', rows: [], checks: [], kashrut: '', notes: '' };
          return { ...prev, [id]: { ...s, ...update } };
        });
      };

      const deleteOrder = (order) => setDeleteConfirmOrder(order);
      const confirmDelete = () => {
        setOrders(prev => prev.filter(o => o.id !== deleteConfirmOrder.id));
        setDeleteConfirmOrder(null);
      };

      const openEditModal = (order) => {
        setEditingOrder(order);
        setOrderType(order.type);
        setCustomerName(order.customer);
        setCustomerPhone(order.phone);
        setCustomerMobile(order.mobile || '');
        setNeighborhood(order.neighborhood || '');
        setStreet(order.street || '');
        setEntrance(order.entrance || '');
        setFloor(order.floor || '');
        setApt(order.apt || '');
        if (order.type === 'delivery') {
          setDeliveryDate(order.timeString || '');
          setPickupTime('');
        } else {
          setPickupTime(order.timeString || '');
          setDeliveryDate('');
        }
        setKashrut(order.kashrut || '');
        setFlags({ mustCoordinate: order.flags?.mustCoordinate || false, notifyReady: order.flags?.notifyReady || false });
        setChargeStatus(order.flags?.chargeStatus || '');
        setAssignedButcher(order.assignedButcher || '');

        const rebuilt = {};
        let rebuildPacking = '';
        order.items.forEach(item => {
          if (item.qty === '-' && item.name === 'אריזת עופות') {
            rebuildPacking = item.notes || '';
            return;
          }
          const template = ORDER_FORM_TEMPLATE.find(t => t.name === (item.cleanName || item.name));
          if (template) {
            let option = '';
            if (item.name !== template.name) {
              const match = item.name.match(/\((.+)\)$/);
              if (match) option = match[1];
            }
            const newRow = { qty: item.qty.toString(), option, notes: item.notes || '', kashrut: item.kashrut || '' };
            if (!rebuilt[template.id]) {
              rebuilt[template.id] = [newRow];
            } else {
              rebuilt[template.id].push(newRow);
            }
          } else {
            // פריט דינמי — לא בטמפלייט, נגזר מ-frozenProductsList
            const name = item.cleanName || item.name;
            rebuilt[`dyn_${name}`] = [{ qty: item.qty.toString(), notes: item.notes || '' }];
          }
        });
        // המרת פריטים עם אופציות לפורמט החדש
        ORDER_FORM_TEMPLATE.filter(t => t.options.length > 0).forEach(template => {
          const arr = rebuilt[template.id];
          if (!arr) return;
          const rows = arr.map(r => ({ option: r.option, qty: r.qty })).filter(r => r.option);
          const totalQty = arr.reduce((sum, r) => sum + (parseFloat(r.qty) || 0), 0).toString();
          rebuilt[template.id] = { totalQty, rows, checks: arr[0]?.checks || [], kashrut: arr[0]?.kashrut || '', notes: arr[0]?.notes || '' };
        });
        setFormItemsState(rebuilt);
        setPackingOption(rebuildPacking);
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingOrder(null);
        setCustomerName(''); setCustomerPhone(''); setCustomerMobile('');
        setNeighborhood(''); setSubNeighborhood(''); setStreet(''); setEntrance(''); setFloor(''); setApt('');
        setDeliveryDate(''); setPickupTime(''); setKashrut('');
        setFlags({ mustCoordinate: false, notifyReady: false });
        setChargeStatus('');
        setAssignedButcher('');
        setFormItemsState({});
        setPackingOption('');
      };

      const handleAddOrder = (e) => {
        e.preventDefault();
        setFormErrorMessage('');

        if (!kashrut) {
          setFormErrorMessage('חובה לבחור כשרות כללית עבור ההזמנה (בראש הטופס)!');
          return;
        }

        const populatedItems = ORDER_FORM_TEMPLATE
          .flatMap(template => {
            if (template.options.length > 0) {
              // פריטים עם אופציות — פורמט חדש
              const s = formItemsState[template.id];
              if (!s || Array.isArray(s)) return [];
              const rows = s.rows || [];
              if (template.inline) {
                // inline: כל אופציה עם כמות עצמאית; fallback לכמות כללית
                const checks = s.checks || [];
                const withQty = rows.filter(r => parseFloat(r.qty) > 0)
                  .map(r => ({ name: `${template.name} (${r.option})`, cleanName: template.name, qty: parseFloat(r.qty), notes: s.notes || '', checks, kashrut: kashrut }));
                if (withQty.length > 0) return withQty;
                const totalQty = parseFloat(s.totalQty) || 0;
                if (totalQty > 0) return [{ name: template.name, cleanName: template.name, qty: totalQty, notes: s.notes || '', checks, kashrut: kashrut }];
                if (checks.length > 0) return [{ name: template.name, cleanName: template.name, qty: 0, notes: s.notes || '', checks, kashrut: kashrut }];
                return [];
              }
              const totalQty = parseFloat(s.totalQty) || 0;
              if (totalQty <= 0) return [];
              if (rows.length === 0) {
                return [{ name: template.name, cleanName: template.name, qty: totalQty, notes: s.notes || '', kashrut: s.kashrut || kashrut }];
              } else if (rows.length === 1) {
                return [{ name: `${template.name} (${rows[0].option})`, cleanName: template.name, qty: totalQty, notes: s.notes || '', kashrut: s.kashrut || kashrut }];
              } else {
                const withQty = rows.filter(r => parseFloat(r.qty) > 0)
                  .map(r => ({ name: `${template.name} (${r.option})`, cleanName: template.name, qty: parseFloat(r.qty), notes: s.notes || '', kashrut: s.kashrut || kashrut }));
                return withQty.length > 0 ? withQty
                  : [{ name: `${template.name} (${rows.map(r => r.option).join(', ')})`, cleanName: template.name, qty: totalQty, notes: s.notes || '', kashrut: s.kashrut || kashrut }];
              }
            } else {
              // פריטים ללא אופציות — פורמט מערך רגיל
              const rows = formItemsState[template.id];
              if (!rows || !Array.isArray(rows)) return [];
              return rows.filter(r => parseFloat(r.qty) > 0).map(r => ({
                name: template.name, cleanName: template.name, qty: parseFloat(r.qty), notes: r.notes, kashrut: r.kashrut || kashrut
              }));
            }
          });

        // פריטים דינמיים — נגזרים ישירות מ-frozenProductsList
        const dynItems = Object.entries(formItemsState)
          .filter(([key]) => key.startsWith('dyn_'))
          .flatMap(([key, rows]) => {
            const name = key.slice(4);
            if (!Array.isArray(rows)) return [];
            return rows.filter(r => parseFloat(r.qty) > 0).map(r => ({
              name, cleanName: name, qty: parseFloat(r.qty), notes: r.notes || '', kashrut
            }));
          });

        const allItems = [...populatedItems, ...dynItems];

        if (allItems.length === 0) {
          setFormErrorMessage('נא להזין כמות עבור לפחות מוצר אחד בטופס!');
          return;
        }

        const newOrder = {
          id: Math.floor(1000 + Math.random() * 9000),
          createdAt: new Date().toLocaleDateString('he-IL'),
          customer: customerName, phone: customerPhone, mobile: customerMobile,
          type: orderType,
          fullAddress: orderType === 'delivery' ? `${street} ${entrance ? 'כניסה '+entrance : ''} ${floor ? 'קומה '+floor : ''} ${apt ? 'דירה '+apt : ''}`.trim() : '',
          street, entrance, floor, apt,
          neighborhood: orderType === 'delivery' ? neighborhood : '',
          subNeighborhood: orderType === 'delivery' ? subNeighborhood : '',
          timeString: orderType === 'delivery' ? deliveryDate : pickupTime,
          kashrut,
          assignedButcher,
          flags: { ...flags, chargeStatus },
          items: allItems,
          status: 'new'
        };

        if (editingOrder) {
          setOrders(orders.map(o => o.id === editingOrder.id ? { ...newOrder, id: editingOrder.id, status: editingOrder.status } : o));
        } else {
          setOrders([newOrder, ...orders]);
        }
        closeModal();
      };

      const triggerPhysicalPrint = (areaId = 'physical-print-slip-area-general') => {
        const printContent = document.getElementById(areaId).innerHTML;
        const printWindow = window.open('', '_blank', 'width=800,height=900');
        printWindow.document.write(`
          <html dir="rtl">
            <head>
              <title>בון הזמנה - סופר עוף</title>
              <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
              <style>
                @import url('https://fonts.googleapis.com/css2?family=David+Libre:wght@400;700&display=swap');
                body {
                  font-family: 'David Libre', 'David', serif;
                  padding: 0; margin: 0; background: white; color: black;
                  -webkit-print-color-adjust: exact; print-color-adjust: exact;
                }
                @page { size: A5 portrait; margin: 5mm; }
                @media print {
                  html, body { width: 138mm; height: 200mm; overflow: hidden; }
                  header, footer { display: none !important; }
                }
              </style>
            </head>
            <body onload="window.print(); setTimeout(function() { window.close(); }, 500);">
              <div style="width: 138mm; margin: 0 auto; padding: 2px;">
                ${printContent}
              </div>
            </body>
          </html>
        `);
        printWindow.document.close();
      };

      const renderItemCategory = (categoryName, overrideTitle, overrideToggleKey) => {
        const toggleKey = overrideToggleKey || categoryName;
        const itemsInCategory = ORDER_FORM_TEMPLATE.filter(i => i.category === categoryName);
        if (itemsInCategory.length === 0) return null;
        const isExpanded = expandedCategories[toggleKey];

        const cc = getCatColors(categoryName);
        const simpleItems = itemsInCategory.filter(i => i.options.length === 0);
        const isSearchable = simpleItems.length > 8;
        const query = (categorySearch[categoryName] || '').trim();
        return (
          <div className={`mb-4 bg-white rounded-lg border overflow-hidden shadow-sm transition-all duration-200 ${cc.outer}`}>
            <button
              type="button"
              onClick={() => toggleCategory(toggleKey)}
              className={`w-full font-bold px-4 py-3 border-b flex justify-between items-center transition-colors ${cc.headerBg} ${cc.headerHover} ${cc.headerText} ${cc.headerBorder}`}
            >
              <span>{overrideTitle || categoryName}</span>
              <Icons.ChevronDown className={`w-5 h-5 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}`} />
            </button>

            {isExpanded && (
              <div className={`divide-y animate-in slide-in-from-top-2 duration-200 ${cc.divider}`}>
                {itemsInCategory.filter(i => !isSearchable || i.options.length > 0).map(item => {
                  if (item.inline && (item.options.length > 0 || item.checkboxOptions?.length > 0)) {
                    // אופציות inline — כמות כללית + רשת קוביות, 2 בשורה
                    const s = getOptState(item.id);
                    return (
                      <div key={item.id} className="p-3 flex items-start gap-3 hover:bg-gray-50">
                        <div className="w-28 md:w-36 font-bold text-gray-800 shrink-0 pt-1 text-sm">
                          {item.name}
                          {(() => {
                            const _fl = frozenProductsList || [];
                            const sk = getSku(item.id, kashrut)
                              || _fl.find(fp => fp.name === item.name && fp.kashrut === kashrut)?.sku
                              || _fl.find(fp => fp.name === item.name && fp.sku)?.sku || '';
                            return sk ? <span className="block text-[10px] text-gray-400 font-normal">{sk}</span> : null;
                          })()}
                        </div>
                        <div className="flex-1 flex flex-col gap-2">
                          {/* כמות — כשאין אופציות, או כשיש showTotalQty */}
                          {(item.options.length === 0 || item.showTotalQty) && (
                            <div className="flex items-center gap-2">
                              <span className="text-xs font-medium text-gray-500 shrink-0">כמות:</span>
                              <input type="number" min="0" step="0.5" placeholder="0"
                                value={s.totalQty}
                                onChange={e => updateOptState(item.id, { totalQty: e.target.value })}
                                className={`w-20 p-1.5 text-sm border border-gray-300 rounded-lg focus:ring-2 ${cc.ring} outline-none text-center font-bold`}
                              />
                            </div>
                          )}
                          {/* רשת קוביות אופציות */}
                          {item.options.length > 0 && (
                          <div className="grid grid-cols-2 gap-1.5">
                            {item.options.map(opt => {
                              const row = s.rows.find(r => r.option === opt);
                              const qty = row?.qty || '';
                              const isActive = parseFloat(qty) > 0;
                              return (
                                <div key={opt}
                                  onClick={e => { if (e.target.tagName !== 'INPUT') e.currentTarget.querySelector('input').focus(); }}
                                  className={`flex items-center justify-between gap-2 px-2.5 py-2 rounded-xl border-2 cursor-pointer transition-all
                                    ${isActive ? cc.cardActive : `bg-white border-gray-200 ${cc.cardHover}`}`}>
                                  <span className={`text-xs font-bold leading-tight flex-1 ${isActive ? cc.cardActiveText : 'text-gray-600'}`}>
                                    {opt}
                                    {getSku(`${item.id}|${opt}`, kashrut) && <span className="block text-[10px] font-normal opacity-70">{getSku(`${item.id}|${opt}`, kashrut)}</span>}
                                  </span>
                                  <input type="number" min="0" step="0.5" placeholder="כמות"
                                    value={qty}
                                    onChange={e => {
                                      const newVal = e.target.value;
                                      const cur = getOptState(item.id);
                                      const exists = cur.rows.some(r => r.option === opt);
                                      if (exists) {
                                        updateOptState(item.id, { rows: cur.rows.map(r => r.option === opt ? { ...r, qty: newVal } : r) });
                                      } else if (newVal !== '') {
                                        updateOptState(item.id, { rows: [...cur.rows, { option: opt, qty: newVal }] });
                                      }
                                    }}
                                    className={`w-16 p-1 text-xs border rounded-lg text-center font-bold outline-none focus:ring-2 ${cc.ring} transition-colors
                                      ${isActive ? `${cc.inputActive} bg-white` : 'border-gray-200 bg-gray-50 text-gray-700'}`}
                                  />
                                </div>
                              );
                            })}
                          </div>
                          )}
                          {/* checkbox options — ללא כמות, שורה אחת */}
                          {item.checkboxOptions && item.checkboxOptions.length > 0 && (
                            <div className="flex flex-wrap gap-1 border-t border-dashed border-gray-200 pt-1.5">
                              {item.checkboxOptions.map(opt => {
                                const isChecked = (s.checks || []).includes(opt);
                                return (
                                  <div key={opt}
                                    onClick={() => {
                                      const cur = getOptState(item.id);
                                      const checks = cur.checks || [];
                                      updateOptState(item.id, { checks: isChecked ? checks.filter(c => c !== opt) : [...checks, opt] });
                                    }}
                                    className={`flex items-center gap-1 px-2 py-1 rounded-lg border cursor-pointer transition-all select-none
                                      ${isChecked ? `${cc.cardActive} border` : `bg-white border-gray-200 ${cc.cardHover}`}`}>
                                    <span className={`text-[11px] font-black shrink-0 ${isChecked ? cc.cardActiveText : 'text-gray-300'}`}>{isChecked ? '✓' : '○'}</span>
                                    <span className={`text-[11px] font-bold ${isChecked ? cc.cardActiveText : 'text-gray-600'}`}>{opt}</span>
                                  </div>
                                );
                              })}
                            </div>
                          )}
                          <input type="text" placeholder="הערה"
                            value={s.notes}
                            onChange={e => updateOptState(item.id, { notes: e.target.value })}
                            className={`p-2 text-sm border border-gray-300 rounded-lg focus:ring-2 ${cc.ring} outline-none w-full`}
                          />
                        </div>
                      </div>
                    );
                  }

                  if (item.options.length > 0) {
                    // פריטים עם אופציות — multi-select dropdown + כמות לכל אופציה
                    const s = getOptState(item.id);
                    const selectedOptions = s.rows.map(r => r.option);
                    const isDropOpen = openDropdown === item.id;
                    return (
                      <div key={item.id} className="p-3 flex items-start gap-3 hover:bg-gray-50">
                        <div className="w-28 md:w-36 font-bold text-gray-800 shrink-0 pt-2 text-sm">
                          {item.name}
                          {getSku(item.id, kashrut) && <span className="block text-[10px] text-gray-400 font-normal">{getSku(item.id, kashrut)}</span>}
                        </div>
                        <div className="flex-1 flex flex-col gap-2">
                          {/* שורה 1: כמות כוללת + dropdown אופציות */}
                          <div className="flex gap-2 items-center flex-wrap">
                            <input
                              type="number" min="0" step="0.5" placeholder="כמות..."
                              value={s.totalQty}
                              onChange={e => updateOptState(item.id, { totalQty: e.target.value })}
                              className="w-16 sm:w-20 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-400 outline-none text-center"
                            />
                            <div className="relative flex-1 min-w-[160px]">
                              <button type="button"
                                onClick={() => setOpenDropdown(isDropOpen ? null : item.id)}
                                className="w-full flex items-center justify-between p-2 text-sm border border-gray-300 rounded bg-white hover:border-purple-300 transition-colors focus:ring-2 focus:ring-purple-400 outline-none">
                                <span className={selectedOptions.length === 0 ? 'text-gray-400' : 'text-purple-800 font-bold'}>
                                  {selectedOptions.length === 0 ? 'בחר הוראות...' : selectedOptions.length === 1 ? selectedOptions[0] : `✓ ${selectedOptions.length} הוראות נבחרו`}
                                </span>
                                <Icons.ChevronDown className={`w-4 h-4 text-gray-400 transition-transform shrink-0 mr-1 ${isDropOpen ? 'rotate-180' : ''}`} />
                              </button>
                              {isDropOpen && (
                                <div className="absolute z-30 w-full mt-1 bg-white border border-purple-200 rounded-xl shadow-xl max-h-56 overflow-y-auto custom-scrollbar">
                                  {item.options.map(opt => {
                                    const isChecked = selectedOptions.includes(opt);
                                    return (
                                      <label key={opt} className={`flex items-center gap-2.5 px-3 py-2.5 cursor-pointer border-b border-gray-50 last:border-0 transition-colors ${isChecked ? 'bg-purple-50 hover:bg-purple-100' : 'hover:bg-gray-50'}`}>
                                        <input type="checkbox" checked={isChecked}
                                          onChange={() => {
                                            const cur = getOptState(item.id);
                                            const exists = cur.rows.some(r => r.option === opt);
                                            updateOptState(item.id, {
                                              rows: exists
                                                ? cur.rows.filter(r => r.option !== opt)
                                                : [...cur.rows, { option: opt, qty: '' }]
                                            });
                                          }}
                                          className="accent-purple-600 w-4 h-4 shrink-0" />
                                        <span className={`text-sm ${isChecked ? 'font-bold text-purple-800' : 'text-gray-700'}`}>{opt}</span>
                                      </label>
                                    );
                                  })}
                                </div>
                              )}
                            </div>
                          </div>

                          {/* שורה 2: כמות פר-אופציה (רק כשנבחרו 2 אופציות ומעלה) */}
                          {s.rows.length > 1 && (
                            <div className="flex flex-wrap gap-2 pr-1">
                              {s.rows.map((row, idx) => (
                                <div key={row.option} className="flex items-center gap-1.5 bg-purple-50/70 rounded-lg px-2.5 py-1.5 border border-purple-200">
                                  <input
                                    type="number" min="0" step="0.5" placeholder="כמות"
                                    value={row.qty}
                                    onChange={e => {
                                      const cur = getOptState(item.id);
                                      updateOptState(item.id, { rows: cur.rows.map((r, i) => i === idx ? { ...r, qty: e.target.value } : r) });
                                    }}
                                    className="w-14 p-1 text-sm border border-purple-200 rounded text-center bg-white font-bold focus:ring-2 focus:ring-purple-400 outline-none"
                                  />
                                  <span className="text-xs font-bold text-purple-700 whitespace-nowrap">{row.option}</span>
                                </div>
                              ))}
                            </div>
                          )}

                          {/* שורה 3: הערה בלבד */}
                          <input
                            type="text" placeholder="הערה"
                            value={s.notes}
                            onChange={e => updateOptState(item.id, { notes: e.target.value })}
                            className="p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-400 outline-none w-full"
                          />
                        </div>
                      </div>
                    );
                  }

                  // פריטים ללא אופציות — שורה פשוטה
                  const rows = Array.isArray(formItemsState[item.id])
                    ? formItemsState[item.id]
                    : [{ qty: '', notes: '', kashrut: '' }];
                  return (
                    <div key={item.id} className="p-3 flex items-start gap-3 hover:bg-gray-50">
                      <div className="w-28 md:w-36 font-bold text-gray-800 shrink-0 pt-2 text-sm">
                        {item.name}
                        {getSku(item.id, kashrut) && <span className="block text-[10px] text-gray-400 font-normal">{getSku(item.id, kashrut)}</span>}
                      </div>
                      <div className="flex-1 flex gap-2 flex-wrap sm:flex-nowrap">
                        <input
                          type="number" min="0" step="0.5" placeholder="כמות..."
                          value={rows[0]?.qty ?? ''}
                          onChange={e => updateItemState(item.id, 'qty', e.target.value, 0)}
                          className="w-16 sm:w-20 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-400 outline-none text-center"
                        />
                        <input
                          type="text" placeholder="הערה"
                          value={rows[0]?.notes ?? ''}
                          onChange={e => updateItemState(item.id, 'notes', e.target.value, 0)}
                          className="flex-1 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-400 outline-none"
                        />
                      </div>
                    </div>
                  );
                })}

                {isSearchable && (() => {
                  const selectedSimple = simpleItems.filter(item => {
                    const rows = formItemsState[item.id];
                    return Array.isArray(rows) && parseFloat(rows[0]?.qty) > 0;
                  });
                  const unselected = simpleItems.filter(item => {
                    const rows = formItemsState[item.id];
                    return !(Array.isArray(rows) && parseFloat(rows[0]?.qty) > 0);
                  });
                  const dropKey = `list_${categoryName}`;
                  const isListOpen = openDropdown === dropKey;
                  const filteredUnselected = query ? unselected.filter(i => i.name.includes(query)) : unselected;
                  return (
                    <div className="p-3 space-y-2">
                      {/* פריטים שנבחרו — עם שדה כמות */}
                      {selectedSimple.map(item => {
                        const rows = Array.isArray(formItemsState[item.id]) ? formItemsState[item.id] : [{ qty: '' }];
                        return (
                          <div key={item.id} className={`flex items-center gap-1.5 px-2 py-1.5 rounded-lg border ${cc.qtyBg} ${cc.qtyBorder}`}>
                            <span className={`flex-1 text-sm font-bold ${cc.qtyText}`}>
                              {item.name}
                              {getSku(item.id, kashrut) && <span className="block text-[10px] text-gray-400 font-normal">{getSku(item.id, kashrut)}</span>}
                            </span>
                            {['קהילות', 'לנדא'].map(k => {
                              const isActive = rows[0]?.kashrut === k;
                              return (
                                <div key={k}
                                  onClick={() => updateItemState(item.id, 'kashrut', isActive ? '' : k, 0)}
                                  className={`flex items-center gap-1 px-2 py-1 rounded-lg border cursor-pointer transition-all select-none shrink-0
                                    ${isActive ? `${cc.cardActive} border` : `bg-white border-gray-200 ${cc.cardHover}`}`}>
                                  <span className={`text-[11px] font-black shrink-0 ${isActive ? cc.cardActiveText : 'text-gray-300'}`}>{isActive ? '✓' : '○'}</span>
                                  <span className={`text-[11px] font-bold ${isActive ? cc.cardActiveText : 'text-gray-600'}`}>{k}</span>
                                </div>
                              );
                            })}
                            <input type="number" min="0" step="0.5"
                              value={rows[0]?.qty || ''}
                              onChange={e => updateItemState(item.id, 'qty', e.target.value, 0)}
                              className={`w-14 p-1 text-xs border rounded-lg text-center font-bold outline-none focus:ring-2 ${cc.ring} border-transparent bg-white shrink-0`}
                            />
                            <button type="button" onClick={() => updateItemState(item.id, 'qty', '', 0)}
                              className="w-5 h-5 flex items-center justify-center rounded-full text-xs font-bold text-gray-500 hover:bg-gray-200 transition-all shrink-0">×</button>
                          </div>
                        );
                      })}

                      {/* כפתור פתיחת רשימה */}
                      <div className="relative">
                        <button type="button"
                          onClick={() => { setOpenDropdown(isListOpen ? null : dropKey); setCategorySearch(prev => ({...prev, [categoryName]: ''})); }}
                          className={`w-full flex items-center justify-center gap-2 p-2.5 text-sm border-2 border-dashed rounded-xl font-bold transition-all
                            ${isListOpen ? `${cc.qtyBg} ${cc.qtyBorder} ${cc.qtyText}` : 'border-gray-200 text-gray-400 hover:border-gray-300 hover:text-gray-600'}`}>
                          <span className="text-lg leading-none">+</span>
                          <span>הוסף מוצר</span>
                        </button>

                        {isListOpen && (
                          <>
                            <div className="fixed inset-0 z-40 bg-black/30" onClick={() => { setOpenDropdown(null); setCategorySearch(prev => ({...prev, [categoryName]: ''})); }} />
                            <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-white rounded-2xl shadow-2xl overflow-hidden flex w-auto max-w-xs" style={{maxHeight:'55vh'}}>
                              {/* חיפוש + כותרת — משמאל */}
                              <div className="w-28 shrink-0 border-l border-gray-100 bg-gray-50 flex flex-col">
                                <div className="flex items-center justify-between p-2 border-b border-gray-100">
                                  <span className={`text-xs font-bold ${cc.qtyText}`}>{categoryName}</span>
                                  <button type="button" onClick={() => { setOpenDropdown(null); setCategorySearch(prev => ({...prev, [categoryName]: ''})); }}
                                    className="w-5 h-5 flex items-center justify-center rounded-full bg-gray-200 text-gray-500 hover:bg-gray-300 font-bold text-xs">×</button>
                                </div>
                                <div className="p-2">
                                  <input type="text" placeholder="חיפוש..."
                                    autoFocus
                                    value={categorySearch[categoryName] || ''}
                                    onChange={e => setCategorySearch(prev => ({...prev, [categoryName]: e.target.value}))}
                                    className={`w-full p-1.5 text-xs border border-gray-200 rounded-lg focus:ring-2 ${cc.ring} outline-none bg-white`}
                                  />
                                </div>
                              </div>
                              {/* רשימת תוצאות — מימין */}
                              <div className="flex-1 overflow-y-auto">
                                {filteredUnselected.length === 0
                                  ? <div className="text-center text-xs text-gray-400 py-6">לא נמצאו תוצאות</div>
                                  : filteredUnselected.map(item => (
                                      <button key={item.id} type="button"
                                        onClick={() => {
                                          updateItemState(item.id, 'qty', '1', 0);
                                          setOpenDropdown(null);
                                          setCategorySearch(prev => ({...prev, [categoryName]: ''}));
                                        }}
                                        className="w-full text-right px-3 py-2.5 text-sm text-gray-900 hover:bg-gray-50 active:bg-gray-100 border-b border-gray-100 last:border-0 font-bold transition-colors whitespace-nowrap">
                                        {item.name}
                                      </button>
                                    ))
                                }
                              </div>
                            </div>
                          </>
                        )}
                      </div>
                    </div>
                  );
                })()}

              </div>
            )}
          </div>
        );
      };

      // רינדור קטגוריה דינמי — נגזר ישירות מ-frozenProductsList
      const renderCategoryDynamic = (categoryName) => {
        const templateNames = new Set(ORDER_FORM_TEMPLATE.map(t => t.name));
        const seen = new Set();
        const products = (frozenProductsList || [])
          .filter(p => (p.category || getProductCategory(p.name)) === categoryName)
          .filter(p => !templateNames.has(p.name))
          .filter(p => { if (seen.has(p.name)) return false; seen.add(p.name); return true; })
          .sort((a, b) => getDynProductPriority(a.name, categoryName) - getDynProductPriority(b.name, categoryName));
        if (!products.length) return null;
        const cc = getCatColors(categoryName);
        const isExpanded = expandedCategories[categoryName];
        return (
          <div className={`mb-4 bg-white rounded-lg border overflow-hidden shadow-sm transition-all duration-200 ${cc.outer}`}>
            <button type="button"
              onClick={() => toggleCategory(categoryName)}
              className={`w-full font-bold px-4 py-3 border-b flex justify-between items-center transition-colors ${cc.headerBg} ${cc.headerHover} ${cc.headerText} ${cc.headerBorder}`}>
              <span>{CAT_EMOJI[categoryName]} {categoryName}</span>
              <Icons.ChevronDown className={`w-5 h-5 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}`} />
            </button>
            {isExpanded && (
              <div className={`divide-y animate-in slide-in-from-top-2 duration-200 ${cc.divider}`}>
                {products.map(p => {
                  const key = `dyn_${p.name}`;
                  const rows = Array.isArray(formItemsState[key]) ? formItemsState[key] : [{ qty: '', notes: '' }];
                  const val = rows[0];
                  const _fpList = frozenProductsList || [];
                  const sku = _fpList.find(fp => fp.name === p.name && fp.kashrut === kashrut)?.sku
                           || _fpList.find(fp => fp.name === p.name && fp.kashrut === 'כללי')?.sku
                           || _fpList.find(fp => fp.name === p.name && fp.sku)?.sku
                           || getSku(p.name, kashrut)
                           || '';
                  return (
                    <div key={p.name} className="p-3 flex items-start gap-3 hover:bg-gray-50">
                      <div className="w-28 md:w-36 font-bold text-gray-800 shrink-0 pt-2 text-sm">
                        {p.name}
                        {sku && <span className="block text-[10px] text-gray-400 font-normal">{sku}</span>}
                      </div>
                      <div className="flex-1 flex gap-2 flex-wrap sm:flex-nowrap">
                        <input type="number" min="0" step="0.5" placeholder="כמות..."
                          value={val.qty}
                          onChange={e => setFormItemsState(prev => {
                            const cur = (Array.isArray(prev[key]) ? prev[key] : [{ qty: '', notes: '' }])[0];
                            return { ...prev, [key]: [{ ...cur, qty: e.target.value }] };
                          })}
                          className="w-16 sm:w-20 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-400 outline-none text-center"
                        />
                        <input type="text" placeholder="הערה"
                          value={val.notes}
                          onChange={e => setFormItemsState(prev => {
                            const cur = (Array.isArray(prev[key]) ? prev[key] : [{ qty: '', notes: '' }])[0];
                            return { ...prev, [key]: [{ ...cur, notes: e.target.value }] };
                          })}
                          className="flex-1 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-400 outline-none"
                        />
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      };

      const [draggingId, setDraggingId] = useState(null);
      const [isDragOver, setIsDragOver] = useState(false);
      const [packagingModal, setPackagingModal] = useState(null); // orderId
      const [packagingData, setPackagingData] = useState({ cartons: '', bags: '', fishBags: '' });

      const [butcherModal, setButcherModal] = useState(null); // orderId

      const assignButcher = (orderId, butcherName) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, assignedButcher: butcherName } : o));
        collapseOrder(orderId);
        setButcherModal(null);
      };

      const moveToPacking = (orderId) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: 'packing' } : o));
        collapseOrder(orderId);
      };

      const requestComplete = (orderId) => {
        setPackagingModal(orderId);
        setPackagingData({ cartons: '', bags: '', fishBags: '' });
      };

      const confirmComplete = () => {
        setOrders(orders.map(o => o.id === packagingModal
          ? { ...o, status: 'completed', packaging: { ...packagingData } }
          : o
        ));
        collapseOrder(packagingModal);
        setPackagingModal(null);
      };

      return (
        <div className="animate-in fade-in duration-300 relative">
          <div className="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h1 className="text-3xl font-extrabold text-gray-900">ניהול הזמנות</h1>
              <p className="text-gray-500 mt-1">ניהול הזמנות פתוחות בתור, הדפסת בונים וסימוני חיתוך</p>
            </div>
            <Button variant="purple" icon={Icons.Plus} className="px-6 py-3 text-base shadow-md font-bold" onClick={() => setIsModalOpen(true)}>
              הזמנה חדשה (טופס מלא)
            </Button>
          </div>

          {(() => {
            const newOrders      = orders.filter(o => o.status === 'new' && !o.assignedButcher);
            const assignedOrders = orders.filter(o => o.status === 'new' && o.assignedButcher);
            const packingOrders  = orders.filter(o => o.status === 'packing');

            const sortByKashrut = (arr) => [...arr].sort((a, b) => (a.kashrut || '').localeCompare(b.kashrut || '', 'he'));

            const renderOrderCard = (order, dimmed = false, draggable = false) => {
              const isExpanded = dimmed || expandedOrders.has(order.id);
              const regularItems = order.items.filter(i => i.qty !== '-');
              const packingItem = order.items.find(i => i.qty === '-');
              const cats = new Set(regularItems.map(i => {
                const name = i.cleanName || i.name;
                const p = (frozenProductsList || []).find(fp => fp.name === name);
                return p?.category || getProductCategory(name) || ORDER_FORM_TEMPLATE.find(t => t.name === name)?.category;
              }).filter(Boolean));
              return (
              <div key={order.id}
                draggable={draggable}
                onDragStart={draggable ? () => setDraggingId(order.id) : undefined}
                onDragEnd={draggable ? () => setDraggingId(null) : undefined}
                className={`bg-white rounded-xl shadow-sm border flex flex-col transition-all ${dimmed ? 'border-gray-100 opacity-70' : 'border-gray-200'} ${draggable ? 'active:cursor-grabbing active:opacity-60 active:scale-95' : ''} ${draggingId === order.id ? 'opacity-50' : ''}`}>

                {/* כותרת — תמיד גלויה, לחיצה פותחת/סוגרת */}
                <div onClick={!dimmed ? () => toggleOrderExpand(order.id) : undefined}
                  className={`p-4 rounded-xl ${!dimmed ? 'cursor-pointer hover:bg-gray-50/60' : ''}`}>
                  <div className="flex justify-between items-start mb-1.5">
                    <div className="flex-1 min-w-0">
                      <div className="font-extrabold text-base text-gray-900 truncate">#{order.id} | {order.customer}</div>
                      <div className="text-xs text-gray-500 mt-0.5">
                        <Icons.Phone className="w-3 h-3 inline ml-1 text-gray-400" />{order.phone}
                      </div>
                    </div>
                    <div className="flex flex-col items-end gap-1 shrink-0 mr-2">
                      <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1 ${order.type === 'delivery' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-700'}`}>
                        {order.type === 'delivery' ? <Icons.Truck className="w-3 h-3" /> : <Icons.Package className="w-3 h-3" />}
                        {order.type === 'delivery' ? 'משלוח' : 'איסוף'}
                      </span>
                      {order.timeString && <span className="text-[10px] text-gray-400">⏰ {order.timeString}</span>}
                      {order.createdAt && <span className="text-[10px] text-gray-400">📅 {order.createdAt}</span>}
                    </div>
                  </div>

                  <div className="flex flex-wrap gap-1 mb-2">
                    <span className="text-[10px] bg-purple-50 text-purple-700 border border-purple-200 px-1.5 py-0.5 rounded font-bold">{order.kashrut}</span>
                    {order.assignedButcher && <span className="text-[10px] bg-orange-100 text-orange-800 border border-orange-200 px-1.5 py-0.5 rounded font-bold">🔪 {order.assignedButcher}</span>}
                    {order.neighborhood && <span className="text-[10px] bg-blue-50 text-blue-700 border border-blue-100 px-1.5 py-0.5 rounded font-bold"><Icons.MapPin className="w-2.5 h-2.5 inline" /> {order.neighborhood}</span>}
                    {order.flags?.mustCoordinate && <span className="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded font-bold">🚨 תאום</span>}
                    {order.flags?.notifyReady && <span className="text-[10px] bg-yellow-100 text-yellow-800 px-1.5 py-0.5 rounded font-bold">📞 להודיע</span>}
                    {order.flags?.chargeStatus === 'charge' && <span className="text-[10px] bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold">💳 לחייב</span>}
                    {order.flags?.chargeStatus === 'noCharge' && <span className="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded font-bold">🆓 לא לחייב</span>}
                  </div>

                  {/* תגיות קטגוריה + חץ */}
                  <div className="flex items-center gap-1.5 flex-wrap">
                    {cats.has('עוף')  && <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-yellow-100 text-yellow-800 border border-yellow-300">🐔 עוף</span>}
